<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" class="diagram" viewBox="0 0 720 280" role="img" aria-label="Small enclosed shelter versus large open shelter: the same body heat warms the small one many degrees and the large one barely at all"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="180" y="24" text-anchor="middle" font-size="14" font-weight="700">Small, enclosed: UA ≈ 3–5 W/K</text><text x="540" y="24" text-anchor="middle" font-size="14" font-weight="700">Big, open-ended: UA ≈ 25–60 W/K</text><rect y="210" width="720" height="70" fill="var(--ground)" opacity="0.5"></rect><path d="M70,210 Q180,70 290,210 Z" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="4"></path><g><rect x="130" y="190" width="80" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="220" cy="197" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><text x="180" y="250" text-anchor="middle" font-size="12">60 W into the air ÷ 4 W/K</text><text x="180" y="268" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ok)">ΔT ≈ +15 °C</text><path d="M400,210 L540,60 L680,210" fill="none" stroke="var(--accent)" stroke-width="4"></path><g><rect x="500" y="190" width="80" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="590" cy="197" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><path d="M370,120 C470,110 600,130 710,120" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="7 5"></path><path d="M370,150 C470,140 600,160 710,150" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="7 5"></path><path d="M370,180 C470,170 600,190 710,180" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="7 5"></path><text x="540" y="250" text-anchor="middle" font-size="12">60 W ÷ 40 W/K (air blows through)</text><text x="540" y="268" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--bad)">ΔT ≈ +1.5 °C</text></svg>
