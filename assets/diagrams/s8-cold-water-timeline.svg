<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" class="diagram" viewBox="0 0 680 230" role="img" aria-label="Four stages of cold-water immersion: cold shock, swim failure, hypothermia, circum-rescue collapse"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><path d="M20,40 L160,40 L178,70 L160,100 L20,100 L38,70 Z" fill="var(--bad)" opacity="0.85"></path><text x="98" y="75" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Cold shock</text><foreignObject x="24" y="110" width="150" height="70"><div style="font-size:11px;color:var(--text);text-align:center">0–3 min: gasp, hyperventilation, heart rate and blood pressure surge</div></foreignObject></g><g><path d="M180,40 L320,40 L338,70 L320,100 L180,100 L198,70 Z" fill="var(--accent-2)" opacity="0.85"></path><text x="258" y="75" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Swim failure</text><foreignObject x="184" y="110" width="150" height="70"><div style="font-size:11px;color:var(--text);text-align:center">~10–30 min: arms and hands stop working</div></foreignObject></g><g><path d="M340,40 L480,40 L498,70 L480,100 L340,100 L358,70 Z" fill="var(--info)" opacity="0.85"></path><text x="418" y="75" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Hypothermia</text><foreignObject x="344" y="110" width="150" height="70"><div style="font-size:11px;color:var(--text);text-align:center">30 min+: core cools; unconscious around 30 °C</div></foreignObject></g><g><path d="M500,40 L640,40 L658,70 L640,100 L500,100 L518,70 Z" fill="var(--muted)" opacity="0.85"></path><text x="578" y="75" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Circum-rescue collapse</text><foreignObject x="504" y="110" width="150" height="70"><div style="font-size:11px;color:var(--text);text-align:center">during and after rescue: blood pressure falls, afterdrop</div></foreignObject></g><text x="340" y="24" text-anchor="middle" font-size="12" font-weight="700">Most cold-water deaths happen in the first two stages — before hypothermia</text><text x="340" y="210" text-anchor="middle" font-size="11" class="muted-fill">1-10-1 (Giesbrecht): ~1 min to control breathing · ~10 min of useful movement · up to ~1 h before unconsciousness</text></svg>
