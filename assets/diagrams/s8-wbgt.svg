<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" class="diagram" viewBox="0 0 680 270" role="img" aria-label="WBGT formula and US Army heat categories"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="340" y="26" text-anchor="middle" font-size="15" font-weight="700">WBGT = 0.7 × natural wet bulb + 0.2 × black globe + 0.1 × dry bulb</text><text x="340" y="46" text-anchor="middle" font-size="11" class="muted-fill">humidity (can sweat evaporate?) dominates · sun and radiant heat next · air temperature least</text><g><rect x="120" y="60" width="308" height="22" fill="var(--info)" opacity="0.85"></rect><text x="274" y="76" text-anchor="middle" font-size="11" style="fill:#fff">Wet bulb</text></g><g><rect x="428" y="60" width="88" height="22" fill="var(--accent-2)" opacity="0.85"></rect><text x="472" y="76" text-anchor="middle" font-size="11" style="fill:#fff">Globe (sun)</text></g><g><rect x="516" y="60" width="44" height="22" fill="var(--muted)" opacity="0.85"></rect><text x="538" y="76" text-anchor="middle" font-size="11" style="fill:#fff">Dry bulb</text></g><g><rect x="20" y="110" width="104" height="40" rx="6" fill="var(--ok)" opacity="0.85"></rect><text x="72" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">&lt; 25.6 °C</text><foreignObject x="20" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">normal precautions</div></foreignObject></g><g><rect x="128" y="110" width="104" height="40" rx="6" fill="var(--info)" opacity="0.85"></rect><text x="180" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">25.6–27.7</text><foreignObject x="128" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">Cat 1: watch the unacclimatised</div></foreignObject></g><g><rect x="236" y="110" width="104" height="40" rx="6" fill="var(--warn)" opacity="0.85"></rect><text x="288" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">27.8–29.4</text><foreignObject x="236" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">Cat 2: more rest, more shade</div></foreignObject></g><g><rect x="344" y="110" width="104" height="40" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="396" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">29.4–31.0</text><foreignObject x="344" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">Cat 3: limit hard work</div></foreignObject></g><g><rect x="452" y="110" width="104" height="40" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="504" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">31.1–32.1</text><foreignObject x="452" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">Cat 4: short work, long rest</div></foreignObject></g><g><rect x="560" y="110" width="104" height="40" rx="6" fill="var(--text)" opacity="0.85"></rect><text x="612" y="135" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:var(--bg)">≥ 32.2</text><foreignObject x="560" y="156" width="104" height="60"><div style="font-size:10.5px;text-align:center;color:var(--text)">Cat 5: stop non-essential exertion</div></foreignObject></g><text x="340" y="250" text-anchor="middle" font-size="10" class="muted-fill">Categories after US Army TB MED 507 (WBGT °C, rounded). Exact work/rest tables depend on workload, clothing and acclimatisation.</text></svg>
