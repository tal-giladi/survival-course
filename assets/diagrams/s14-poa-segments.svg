<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" class="diagram" viewBox="0 0 700 260" role="img" aria-label="A search area divided into segments A, B and C plus rest of world. Before: A 40 percent, B 30, C 20, rest of world 10. Segment A is searched with POD 80 percent, giving POS 32 percent. After the unsuccessful search, Bayes&#x27; rule gives A 12 percent, B 44, C 29, rest of world 15."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="30" y="26" font-size="13" font-weight="700">Before</text><g><rect x="30" y="40" width="170" height="90" rx="6" fill="var(--accent)" opacity="0.55" stroke="var(--line)"></rect><text x="40" y="62" font-size="12" font-weight="700">A trail</text><text x="40" y="80" font-size="11">POA 40% · POD 80%</text><text x="40" y="96" font-size="11" font-weight="700">POS = 32%</text></g><g><rect x="210" y="40" width="200" height="90" rx="6" fill="var(--accent)" opacity="0.45" stroke="var(--line)"></rect><text x="220" y="62" font-size="12" font-weight="700">B drainage</text><text x="220" y="80" font-size="11">POA 30%</text></g><g><rect x="30" y="140" width="380" height="70" rx="6" fill="var(--accent)" opacity="0.35" stroke="var(--line)"></rect><text x="40" y="162" font-size="12" font-weight="700">C forest</text><text x="40" y="180" font-size="11">POA 20%</text></g><text x="30" y="232" font-size="11">Rest of world (ROW) 10%</text><text x="440" y="26" font-size="13" font-weight="700">After A searched, not found</text><g><text x="440" y="60" font-size="12" font-weight="700">A trail</text><rect x="540" y="48" width="35.29" height="16" rx="3" fill="var(--accent)"></rect><text x="581.29" y="61" font-size="11">12%</text></g><g><text x="440" y="94" font-size="12" font-weight="700">B drainage</text><rect x="540" y="82" width="132.35" height="16" rx="3" fill="var(--accent)"></rect><text x="678.35" y="95" font-size="11">44%</text></g><g><text x="440" y="128" font-size="12" font-weight="700">C forest</text><rect x="540" y="116" width="88.24" height="16" rx="3" fill="var(--accent)"></rect><text x="634.24" y="129" font-size="11">29%</text></g><text x="440" y="162" font-size="12" font-weight="700">ROW</text><rect x="540" y="150" width="44.12" height="16" rx="3" fill="var(--muted)"></rect><text x="590.12" y="163" font-size="11">15%</text><text x="440" y="200" font-size="11">POA′ = POA × (1 − POD) ÷ (1 − POS)</text><text x="440" y="218" font-size="11">1 − POS = 1 − 0.32 = 0.68</text><text x="440" y="236" font-size="10.5" class="muted-fill">A drops; every other area — including ROW — rises.</text></svg>
