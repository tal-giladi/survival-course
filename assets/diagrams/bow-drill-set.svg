<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" class="diagram" viewBox="0 0 780 300" role="img" aria-label="Bow drill set: bow, string, spindle, handhold, hearth board with notch, ember pan, foot and body position"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="bd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="0" y="250" width="780" height="50" fill="var(--ground)" opacity="0.3"></rect><rect x="200" y="232" width="240" height="18" rx="2" fill="#b98b55" stroke="var(--ground)"></rect><path d="M312,232 L328,232 L338,250 L302,250 Z" fill="var(--panel-2)"></path><rect x="290" y="250" width="60" height="5" fill="var(--muted)"></rect><rect x="312" y="85" width="16" height="147" rx="5" fill="#d9b27c" stroke="var(--ground)"></rect><rect x="290" y="70" width="60" height="16" rx="7" fill="var(--ground)"></rect><path d="M140,160 Q320,120 500,160" fill="none" stroke="var(--ground)" stroke-width="7" stroke-linecap="round"></path><path d="M140,160 L312,164 M328,164 L500,160" stroke="var(--text)" stroke-width="1.3"></path><rect x="400" y="218" width="70" height="14" rx="6" fill="var(--muted)" opacity="0.6"></rect><text x="435" y="212" text-anchor="middle" font-size="10" class="muted-fill">your foot</text><g><line x1="456" y1="36" x2="360" y2="60" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="460" y="40" font-size="10.5">Handhold: smooth, lubricated socket</text></g><g><line x1="516" y1="116" x2="480" y2="157" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="520" y="120" font-size="10.5">Bow: arm-length, flexible, taut cord</text></g><g><line x1="516" y1="186" x2="328" y2="150" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="520" y="190" font-size="10.5">Spindle: straight, ~2 cm × 20 cm</text></g><g><line x1="300" y1="286" x2="320" y2="242" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="150" y="290" font-size="10.5">Notch: ~1/8 of the circle, cut to the centre of the socket</text></g><g><line x1="456" y1="281" x2="350" y2="253" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="460" y="285" font-size="10.5">Ember pan (leaf/bark) under the notch</text></g><g><line x1="180" y1="211" x2="220" y2="240" stroke="var(--muted)" stroke-width="1" marker-end="url(#bd-a)"></line><text x="30" y="215" font-size="10.5">Hearth board: ~1.5 cm thick, same or softer wood</text></g><text x="20" y="30" font-size="11" class="muted-fill">Wrist locked against the shin,</text><text x="20" y="44" font-size="11" class="muted-fill">spindle vertical, long full strokes.</text></svg>
