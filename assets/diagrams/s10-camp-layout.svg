<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" class="diagram" viewBox="0 0 640 320" role="img" aria-label="Camp layout: the water source at one edge, kitchen and food storage downwind of tents, the toilet area at least 60 metres from water and camp and downhill of the water supply&#x27;s catchment where possible, and a hand-washing station on the path from toilet to kitchen"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="cl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="cl-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--sky)"></path></marker></defs><rect x="0" y="0" width="640" height="320" fill="var(--ground)" opacity="0.12"></rect><path d="M 0 40 Q 160 20 300 50 T 640 40" fill="none" stroke="var(--info)" stroke-width="10" opacity="0.7"></path><text x="20" y="30" font-size="12" font-weight="700" style="fill:var(--info)">Stream (collect upstream of everything)</text><g><rect x="50" y="120" width="130" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="115" y="142" text-anchor="middle" font-size="12" font-weight="700">Sleeping</text><text x="115" y="158" text-anchor="middle" font-size="10" class="muted-fill">tents, upwind</text></g><g><rect x="250" y="120" width="130" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="142" text-anchor="middle" font-size="12" font-weight="700">Kitchen</text><text x="315" y="158" text-anchor="middle" font-size="10" class="muted-fill">cook, wash up here</text></g><g><rect x="250" y="200" width="130" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="217" text-anchor="middle" font-size="12" font-weight="700">Food store</text><text x="315" y="233" text-anchor="middle" font-size="10" class="muted-fill">wildlife-proof</text></g><g><rect x="460" y="235" width="150" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="535" y="257" text-anchor="middle" font-size="12" font-weight="700">Toilet area</text><text x="535" y="273" text-anchor="middle" font-size="10" class="muted-fill">≥ 60 m from water &amp; camp</text></g><g><rect x="430" y="140" width="120" height="42" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="490" y="158" text-anchor="middle" font-size="12" font-weight="700">Hand-wash</text><text x="490" y="174" text-anchor="middle" font-size="10" class="muted-fill">soap + tippy tap</text></g><path d="M 520 235 Q 520 205 500 185" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#cl-a)"></path><path d="M 430 160 L 385 150" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#cl-a)"></path><text x="440" y="215" font-size="10" class="muted-fill">path back passes the wash</text><line x1="60" y1="290" x2="180" y2="290" stroke="var(--sky)" stroke-width="2" marker-end="url(#cl-w)"></line><text x="60" y="310" font-size="11">prevailing wind: smoke and smells away from tents</text><text x="200" y="100" font-size="10" class="muted-fill">grey water strained, scattered ≥ 60 m from water</text></svg>
