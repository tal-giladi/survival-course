<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" class="diagram" viewBox="0 0 660 290" role="img" aria-label="Anchor principles often taught as SERENE or ERNEST: strong, redundant, equalised, no extension, efficient or timely, shown around a two-point anchor with a master point and a narrow angle"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="20" y="40" width="250" height="24" fill="var(--ground)"></rect><circle cx="80" cy="70" r="9" fill="var(--text)"></circle><circle cx="210" cy="70" r="9" fill="var(--text)"></circle><line x1="80" y1="70" x2="145" y2="170" stroke="var(--accent)" stroke-width="5"></line><line x1="210" y1="70" x2="145" y2="170" stroke="var(--accent)" stroke-width="5"></line><circle cx="145" cy="170" r="8" fill="var(--info)"></circle><line x1="145" y1="178" x2="145" y2="250" stroke="var(--text)" stroke-width="3" stroke-dasharray="6 4"></line><text x="160" y="176" font-size="11">master point</text><text x="145" y="128" text-anchor="middle" font-size="11" class="muted-fill">narrow angle</text><text x="145" y="270" text-anchor="middle" font-size="11" class="muted-fill">load direction</text><text x="300" y="24" font-size="13" font-weight="700">What instructors check (SERENE / ERNEST)</text><g><rect x="300" y="38" width="340" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="312" y="55" font-size="12" font-weight="700">Strong / Solid</text><text x="312" y="70" font-size="10" class="muted-fill">each component far stronger than any expected load</text></g><g><rect x="300" y="84" width="340" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="312" y="101" font-size="12" font-weight="700">Redundant</text><text x="312" y="116" font-size="10" class="muted-fill">no single point of failure</text></g><g><rect x="300" y="130" width="340" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="312" y="147" font-size="12" font-weight="700">Equalised (shared)</text><text x="312" y="162" font-size="10" class="muted-fill">load spread between points — imperfect in practice</text></g><g><rect x="300" y="176" width="340" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="312" y="193" font-size="12" font-weight="700">No Extension</text><text x="312" y="208" font-size="10" class="muted-fill">if one point fails, little or no drop and shock</text></g><g><rect x="300" y="222" width="340" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="312" y="239" font-size="12" font-weight="700">Efficient / Timely</text><text x="312" y="254" font-size="10" class="muted-fill">simple enough to build and check correctly</text></g><text x="20" y="24" font-size="12" font-weight="700" style="fill:var(--bad)">Principles, not a build guide</text></svg>
