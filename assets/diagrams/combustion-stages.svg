<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" class="diagram" viewBox="0 0 640 270" role="img" aria-label="Wood combustion stages: drying, pyrolysis, flaming combustion of gases, glowing char"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="cs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="30" y="140" width="140" height="34" fill="var(--info)" opacity="0.35" stroke="var(--info)"></rect><text x="100" y="194" text-anchor="middle" font-size="13" font-weight="700">Heating &amp; drying</text><text x="100" y="210" text-anchor="middle" font-size="11" class="muted-fill">&lt; 100–150 °C</text><text x="100" y="226" text-anchor="middle" font-size="10.5" class="muted-fill">water boils off</text><text x="100" y="240" text-anchor="middle" font-size="10.5" class="muted-fill">(steam)</text></g><g><rect x="170" y="140" width="150" height="34" fill="var(--accent-2)" opacity="0.35" stroke="var(--accent-2)"></rect><text x="245" y="194" text-anchor="middle" font-size="13" font-weight="700">Pyrolysis</text><text x="245" y="210" text-anchor="middle" font-size="11" class="muted-fill">~200–500 °C</text><text x="245" y="226" text-anchor="middle" font-size="10.5" class="muted-fill">wood breaks down</text><text x="245" y="240" text-anchor="middle" font-size="10.5" class="muted-fill">into gases + tar</text></g><g><rect x="320" y="140" width="140" height="34" fill="var(--bad)" opacity="0.35" stroke="var(--bad)"></rect><text x="390" y="194" text-anchor="middle" font-size="13" font-weight="700">Flaming</text><text x="390" y="210" text-anchor="middle" font-size="11" class="muted-fill">flame ~800–1100 °C</text><text x="390" y="226" text-anchor="middle" font-size="10.5" class="muted-fill">the GASES burn,</text><text x="390" y="240" text-anchor="middle" font-size="10.5" class="muted-fill">above the wood</text></g><g><rect x="460" y="140" width="140" height="34" fill="var(--accent)" opacity="0.35" stroke="var(--accent)"></rect><text x="530" y="194" text-anchor="middle" font-size="13" font-weight="700">Glowing char</text><text x="530" y="210" text-anchor="middle" font-size="11" class="muted-fill">~600–900 °C</text><text x="530" y="226" text-anchor="middle" font-size="10.5" class="muted-fill">carbon burns at</text><text x="530" y="240" text-anchor="middle" font-size="10.5" class="muted-fill">the surface: coals</text></g><path d="M345,140 Q360,70 390,30 Q410,80 440,140 Z" fill="var(--bad)" opacity="0.35"></path><path d="M365,140 Q380,95 390,70 Q400,100 420,140 Z" fill="var(--accent-2)" opacity="0.5"></path><text x="250" y="110" text-anchor="middle" font-size="11" class="muted-fill">volatile gases rise and mix with air</text><line x1="250" y1="130" x2="360" y2="80" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#cs-a)"></line><text x="100" y="110" text-anchor="middle" font-size="11" class="muted-fill">heat flows in ←</text><text x="320" y="264" text-anchor="middle" font-size="10" class="muted-fill">wood never “burns” directly: heat turns it into gas, the gas burns, and what is left (char) glows</text></svg>
