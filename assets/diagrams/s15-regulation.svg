<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Emotion regulation strategies arranged from early to late in the emotional process: situation selection, situation modification, attention, reappraisal and response modulation, each with a field example. Earlier strategies usually cost less effort."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><line x1="30" y1="272" x2="610" y2="272" stroke="var(--muted)" marker-end="url(#rl-a)"></line><text x="30" y="290" font-size="10" class="muted-fill">early: before the emotion builds (usually cheaper)</text><text x="610" y="290" font-size="10" text-anchor="end" class="muted-fill">late: once it has built</text><g><rect x="20" y="20" width="114" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="77" y="40" text-anchor="middle" font-size="11" font-weight="700">Situation</text><text x="77" y="54" text-anchor="middle" font-size="11" font-weight="700">selection</text><text x="77" y="74" text-anchor="middle" font-size="9" class="muted-fill">avoid or leave the trigger</text><text x="77" y="96" text-anchor="middle" font-size="9" fill="var(--info)">turn back early; do</text><text x="77" y="108" text-anchor="middle" font-size="9" fill="var(--info)">not camp by the</text><text x="77" y="120" text-anchor="middle" font-size="9" fill="var(--info)">roaring river</text></g><g><rect x="142" y="50" width="114" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="199" y="70" text-anchor="middle" font-size="11" font-weight="700">Situation</text><text x="199" y="84" text-anchor="middle" font-size="11" font-weight="700">modification</text><text x="199" y="104" text-anchor="middle" font-size="9" class="muted-fill">change the situation</text><text x="199" y="126" text-anchor="middle" font-size="9" fill="var(--info)">light, warmth, food,</text><text x="199" y="138" text-anchor="middle" font-size="9" fill="var(--info)">tidy camp</text></g><g><rect x="264" y="80" width="114" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="321" y="100" text-anchor="middle" font-size="11" font-weight="700">Attention</text><text x="321" y="114" text-anchor="middle" font-size="11" font-weight="700"></text><text x="321" y="134" text-anchor="middle" font-size="9" class="muted-fill">where you point your mind</text><text x="321" y="156" text-anchor="middle" font-size="9" fill="var(--info)">one small task;</text><text x="321" y="168" text-anchor="middle" font-size="9" fill="var(--info)">count breaths</text></g><g><rect x="386" y="110" width="114" height="120" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="1.5"></rect><text x="443" y="130" text-anchor="middle" font-size="11" font-weight="700">Reappraisal</text><text x="443" y="144" text-anchor="middle" font-size="11" font-weight="700"></text><text x="443" y="164" text-anchor="middle" font-size="9" class="muted-fill">change the meaning</text><text x="443" y="186" text-anchor="middle" font-size="9" fill="var(--info)">“this is a hard</text><text x="443" y="198" text-anchor="middle" font-size="9" fill="var(--info)">night, not the end”</text></g><g><rect x="508" y="140" width="114" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="565" y="160" text-anchor="middle" font-size="11" font-weight="700">Response</text><text x="565" y="174" text-anchor="middle" font-size="11" font-weight="700"></text><text x="565" y="194" text-anchor="middle" font-size="9" class="muted-fill">act on the body</text><text x="565" y="216" text-anchor="middle" font-size="9" fill="var(--info)">slow breathing; name</text><text x="565" y="228" text-anchor="middle" font-size="9" fill="var(--info)">the feeling</text></g></svg>
