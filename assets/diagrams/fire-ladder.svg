<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" class="diagram" viewBox="0 0 680 260" role="img" aria-label="Fuel size ladder from tinder to wrist-thick fuel"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="20" y="139.5" width="110" height="2" rx="0.5" fill="var(--accent-2)"></rect><text x="75" y="40" text-anchor="middle" font-size="13" font-weight="700">Tinder</text><text x="75" y="58" text-anchor="middle" font-size="11" class="muted-fill">hair-fine</text><text x="75" y="215" text-anchor="middle" font-size="11">2 fistfuls</text><text x="140" y="145" font-size="16" class="muted-fill">→</text></g><g><rect x="152" y="138.5" width="110" height="3" rx="1.5" fill="var(--ground)"></rect><text x="207" y="40" text-anchor="middle" font-size="13" font-weight="700">Small kindling</text><text x="207" y="58" text-anchor="middle" font-size="11" class="muted-fill">matchstick / pencil lead</text><text x="207" y="215" text-anchor="middle" font-size="11">2 big handfuls</text><text x="272" y="145" font-size="16" class="muted-fill">→</text></g><g><rect x="284" y="136.5" width="110" height="7" rx="3.5" fill="var(--ground)"></rect><text x="339" y="40" text-anchor="middle" font-size="13" font-weight="700">Kindling</text><text x="339" y="58" text-anchor="middle" font-size="11" class="muted-fill">pencil</text><text x="339" y="215" text-anchor="middle" font-size="11">an armful</text><text x="404" y="145" font-size="16" class="muted-fill">→</text></g><g><rect x="416" y="132" width="110" height="16" rx="8" fill="var(--ground)"></rect><text x="471" y="40" text-anchor="middle" font-size="13" font-weight="700">Small fuel</text><text x="471" y="58" text-anchor="middle" font-size="11" class="muted-fill">thumb</text><text x="471" y="215" text-anchor="middle" font-size="11">an armful</text><text x="536" y="145" font-size="16" class="muted-fill">→</text></g><g><rect x="548" y="123" width="110" height="34" rx="8" fill="var(--ground)"></rect><text x="603" y="40" text-anchor="middle" font-size="13" font-weight="700">Fuel</text><text x="603" y="58" text-anchor="middle" font-size="11" class="muted-fill">wrist</text><text x="603" y="215" text-anchor="middle" font-size="11">a pile knee-high</text></g><text x="340" y="245" text-anchor="middle" font-size="11" class="muted-fill">each step roughly 2–3× thicker than the last · gather ALL of it before you strike</text></svg>
