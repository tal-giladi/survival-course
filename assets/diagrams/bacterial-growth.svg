<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="730" height="250" class="diagram" viewBox="0 0 730 250" role="img" aria-label="Bacterial count doubling every 20 minutes: one cell becomes about four thousand in four hours"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="70" x2="70" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="70" y="196" font-size="11" text-anchor="middle" class="muted-fill">0 h</text></g><g><line x1="174" x2="174" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="174" y="196" font-size="11" text-anchor="middle" class="muted-fill">1 h</text></g><g><line x1="278" x2="278" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="278" y="196" font-size="11" text-anchor="middle" class="muted-fill">2 h</text></g><g><line x1="382" x2="382" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="382" y="196" font-size="11" text-anchor="middle" class="muted-fill">3 h</text></g><g><line x1="486" x2="486" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="486" y="196" font-size="11" text-anchor="middle" class="muted-fill">4 h</text></g><g><line x1="590" x2="590" y1="20" y2="180" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="590" y="196" font-size="11" text-anchor="middle" class="muted-fill">5 h</text></g><text x="62" y="184" font-size="11" text-anchor="end" class="muted-fill">1</text><text x="62" y="120" font-size="11" text-anchor="end" class="muted-fill">64</text><text x="62" y="56" font-size="11" text-anchor="end" class="muted-fill">4096</text><polyline points="70,180 80.4,176.8 90.8,173.6 101.2,170.4 111.6,167.2 122,164 132.4,160.8 142.8,157.6 153.2,154.4 163.6,151.2 174,148 184.4,144.8 194.8,141.6 205.2,138.4 215.6,135.2 226,132 236.4,128.8 246.8,125.6 257.2,122.4 267.6,119.2 278,116 288.4,112.8 298.8,109.6 309.2,106.4 319.6,103.2 330,100 340.4,96.8 350.8,93.6 361.2,90.4 371.6,87.2 382,84 392.4,80.8 402.8,77.6 413.2,74.4 423.6,71.2 434,68 444.4,64.8 454.8,61.6 465.2,58.4 475.6,55.2 486,52 496.4,48.8 506.8,45.6 517.2,42.4 527.6,39.2 538,36 548.4,32.8 558.8,29.6 569.2,26.4 579.6,23.2 590,20" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><line x1="278" x2="278" y1="20" y2="180" stroke="var(--accent-2)" stroke-width="2"></line><text x="282" y="32" font-size="11.5">2 h rule: 2⁶ = 64×</text><line x1="486" x2="486" y1="20" y2="180" stroke="var(--bad)" stroke-width="2"></line><text x="482" y="60" font-size="11.5" text-anchor="end">4 h: 2¹² ≈ 4,000×</text><text x="610" y="50" font-size="11" class="muted-fill">(log scale)</text><text x="70" y="230" font-size="11" class="muted-fill">Cells per starting cell at a 20-minute doubling time. Some bacteria also make heat-stable toxins that cooking does not destroy.</text></svg>
