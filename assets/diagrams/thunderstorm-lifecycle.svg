<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" class="diagram" viewBox="0 0 760 340" role="img" aria-label="The three stages of a single-cell thunderstorm: cumulus, mature, dissipating"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tl-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="tl-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect x="20" y="20" width="220" height="270" rx="8" fill="var(--sky)"></rect><rect x="270" y="20" width="220" height="270" rx="8" fill="var(--sky)"></rect><rect x="520" y="20" width="220" height="270" rx="8" fill="var(--sky)"></rect><path d="M70,270 Q60,200 90,170 Q100,120 130,125 Q170,130 170,180 Q190,220 180,270 Z" fill="var(--panel)" stroke="var(--muted)"></path><line x1="95" y1="285" x2="95" y2="160" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#tl-u)"></line><line x1="130" y1="285" x2="130" y2="160" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#tl-u)"></line><line x1="160" y1="285" x2="160" y2="160" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#tl-u)"></line><path d="M300,40 L500,40 L470,58 Q420,60 430,90 Q450,180 440,270 L330,270 Q320,180 350,90 Q360,60 320,58 Z" fill="var(--panel)" stroke="var(--muted)"></path><line x1="360" y1="285" x2="360" y2="70" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#tl-u)"></line><line x1="410" y1="120" x2="410" y2="282" stroke="var(--info)" stroke-width="2.5" marker-end="url(#tl-d)"></line><path d="M410,282 L470,284" stroke="var(--info)" stroke-width="2" marker-end="url(#tl-d)"></path><text x="475" y="276" font-size="10">gust front</text><line x1="395" y1="272" x2="390" y2="288" stroke="var(--info)"></line><line x1="407" y1="272" x2="402" y2="288" stroke="var(--info)"></line><line x1="419" y1="272" x2="414" y2="288" stroke="var(--info)"></line><line x1="431" y1="272" x2="426" y2="288" stroke="var(--info)"></line><path d="M380,150 l-10,20 h10 l-12,24" stroke="var(--warn)" stroke-width="3" fill="none"></path><path d="M550,50 L740,50 L720,70 Q670,80 660,110 Q650,170 640,230 L600,230 Q600,150 590,110 Q580,80 560,70 Z" fill="var(--panel)" stroke="var(--muted)" opacity="0.8"></path><line x1="590" y1="130" x2="590" y2="282" stroke="var(--info)" stroke-width="2" marker-end="url(#tl-d)"></line><line x1="620" y1="130" x2="620" y2="282" stroke="var(--info)" stroke-width="2" marker-end="url(#tl-d)"></line><line x1="650" y1="130" x2="650" y2="282" stroke="var(--info)" stroke-width="2" marker-end="url(#tl-d)"></line><path d="M700,70 l-6,12 h6 l-8,14" stroke="var(--warn)" stroke-width="2" fill="none"></path><text x="700" y="110" text-anchor="middle" font-size="10">anvil strikes</text><g><text x="130" y="308" text-anchor="middle" font-size="13" font-weight="700">Cumulus stage</text><text x="130" y="325" text-anchor="middle" font-size="10.5" class="muted-fill">updrafts only; towers grow</text></g><g><text x="380" y="308" text-anchor="middle" font-size="13" font-weight="700">Mature stage</text><text x="380" y="325" text-anchor="middle" font-size="10.5" class="muted-fill">updraft + downdraft; lightning, hail, gusts</text></g><g><text x="630" y="308" text-anchor="middle" font-size="13" font-weight="700">Dissipating stage</text><text x="630" y="325" text-anchor="middle" font-size="10.5" class="muted-fill">downdraft chokes the updraft; lightning can continue</text></g><text x="380" y="14" text-anchor="middle" font-size="11" class="muted-fill">A single cell lives roughly 30–60 minutes; multicell lines and supercells last hours.</text></svg>
