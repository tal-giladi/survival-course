<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="diagram" viewBox="0 0 700 300" role="img" aria-label="Signal mirror aiming: the mirror&#x27;s normal bisects the angle between the Sun and the target. With the V-finger method, you put the target between two extended fingers and tilt the mirror until the sun spot falls on the fingers, then rock it slightly. The flash is a narrow cone about half a degree wide, roughly 90 metres wide at 10 kilometres."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ma-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="ma-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><rect x="0" y="0" width="700" height="210" fill="var(--sky)" opacity="0.25" rx="10"></rect><circle cx="90" cy="45" r="22" fill="var(--accent-2)"></circle><text x="90" y="85" text-anchor="middle" font-size="12" font-weight="700">Sun</text><line x1="110" y1="60" x2="222" y2="148" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#ma-a)"></line><line x1="220" y1="130" x2="258" y2="178" stroke="var(--text)" stroke-width="6"></line><line x1="239" y1="154" x2="286" y2="118" stroke="var(--muted)" stroke-dasharray="3 3"></line><text x="292" y="114" font-size="10" class="muted-fill">mirror normal (bisects the angle)</text><line x1="250" y1="160" x2="610" y2="100" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#ma-b)"></line><polygon points="250,160 640,86 640,122" fill="var(--accent)" opacity="0.12"></polygon><text x="590" y="75" font-size="12" font-weight="700">aircraft</text><path d="M600 92 l24 -4 l-6 8 z M612 88 l-2 -10 l6 0 z" fill="var(--text)"></path><text x="430" y="170" font-size="11">flash cone ≈ 0.5° wide (the Sun’s disc)</text><text x="430" y="186" font-size="11">≈ 90 m wide at 10 km — easy to miss</text><line x1="0" y1="210" x2="700" y2="210" stroke="var(--line)"></line><text x="20" y="236" font-size="13" font-weight="700">V-finger method</text><text x="20" y="256" font-size="11">1 · Extend one arm; frame the target in a V between two fingers.</text><text x="20" y="272" font-size="11">2 · Hold the mirror under your eye; tilt until the sun spot lands on the V.</text><text x="20" y="288" font-size="11">3 · Rock the mirror slightly so the spot flicks across the target.</text><text x="470" y="236" font-size="13" font-weight="700">Sighting mirror</text><text x="470" y="256" font-size="11">Look through the hole at the target;</text><text x="470" y="272" font-size="11">move the mirror until the aim spot</text><text x="470" y="288" font-size="11">sits on the target. Sweep gently.</text></svg>
