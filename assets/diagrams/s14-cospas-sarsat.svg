<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="diagram" viewBox="0 0 700 300" role="img" aria-label="How a 406 megahertz distress beacon alert travels: the beacon transmits a digital message with its unique ID and GNSS position to Cospas-Sarsat satellites in low, medium and geostationary orbits; ground stations called LUTs receive the relay; a mission control centre checks it and passes it to the rescue coordination centre responsible for that area, which uses the registration details to call your contacts and launches searchers, who home in on the beacon&#x27;s 121.5 megahertz signal."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="cs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="cs-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect x="0" y="0" width="700" height="150" fill="var(--sky)" opacity="0.2" rx="10"></rect><rect x="0" y="230" width="700" height="70" fill="var(--ground)" opacity="0.3" rx="10"></rect><g><rect x="98" y="28" width="44" height="18" rx="3" fill="var(--panel-2)" stroke="var(--text)"></rect><line x1="80" y1="37" x2="160" y2="37" stroke="var(--info)" stroke-width="4"></line><text x="120" y="66" text-anchor="middle" font-size="11" font-weight="700">LEO</text></g><g><rect x="308" y="28" width="44" height="18" rx="3" fill="var(--panel-2)" stroke="var(--text)"></rect><line x1="290" y1="37" x2="370" y2="37" stroke="var(--info)" stroke-width="4"></line><text x="330" y="66" text-anchor="middle" font-size="11" font-weight="700">MEO (GNSS)</text></g><g><rect x="538" y="28" width="44" height="18" rx="3" fill="var(--panel-2)" stroke="var(--text)"></rect><line x1="520" y1="37" x2="600" y2="37" stroke="var(--info)" stroke-width="4"></line><text x="560" y="66" text-anchor="middle" font-size="11" font-weight="700">GEO</text></g><text x="350" y="18" text-anchor="middle" font-size="11" class="muted-fill">Cospas-Sarsat satellites (low, medium and geostationary orbits)</text><rect x="70" y="248" width="16" height="30" rx="3" fill="var(--accent-2)"></rect><line x1="78" y1="248" x2="78" y2="226" stroke="var(--text)" stroke-width="2"></line><text x="78" y="294" text-anchor="middle" font-size="11" font-weight="700">PLB</text><line x1="84" y1="232" x2="320" y2="72" stroke="var(--accent)" stroke-width="2" marker-end="url(#cs-a)"></line><text x="150" y="170" font-size="11" font-weight="700">406 MHz digital burst:</text><text x="150" y="185" font-size="11">unique ID (15-hex) + GNSS position</text><line x1="340" y1="72" x2="410" y2="222" stroke="var(--accent)" stroke-width="2" marker-end="url(#cs-a)"></line><g><rect x="370" y="228" width="90" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="415" y="247" text-anchor="middle" font-size="12" font-weight="700">LUT</text><text x="415" y="263" text-anchor="middle" font-size="10" class="muted-fill">ground station</text></g><g><rect x="475" y="228" width="100" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="525" y="247" text-anchor="middle" font-size="12" font-weight="700">MCC</text><text x="525" y="263" text-anchor="middle" font-size="10" class="muted-fill">mission control</text></g><g><rect x="590" y="228" width="100" height="44" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="640" y="247" text-anchor="middle" font-size="12" font-weight="700">RCC</text><text x="640" y="263" text-anchor="middle" font-size="10" class="muted-fill">rescue coordination</text></g><line x1="460" y1="250" x2="473" y2="250" stroke="var(--text)" marker-end="url(#cs-b)"></line><line x1="575" y1="250" x2="588" y2="250" stroke="var(--text)" marker-end="url(#cs-b)"></line><text x="628" y="200" text-anchor="middle" font-size="11">registration → calls</text><text x="628" y="214" text-anchor="middle" font-size="11">your contacts; tasks SAR</text><path d="M95 262 q40 -30 80 0" stroke="var(--info)" stroke-width="2" fill="none" stroke-dasharray="4 3"></path><text x="110" y="294" font-size="11">121.5 MHz homing signal for the final approach</text></svg>
