<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" class="diagram" viewBox="0 0 640 280" role="img" aria-label="Keeping warm in a stranded car: windows lose heat fastest, cover them; insulate from the seat and floor; wear hat and all layers; use a sleeping bag or blankets; share body heat; keep moving gently without sweating; eat and drink"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M60,200 L90,120 L200,110 L260,50 L430,50 L500,110 L590,120 L600,200 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.5"></path><path d="M270,60 L340,60 L340,110 L215,110 Z M350,60 L420,60 L480,110 L350,110 Z" fill="var(--sky)" opacity="0.5" stroke="var(--line)"></path><circle cx="160" cy="210" r="26" fill="var(--text)"></circle><circle cx="500" cy="210" r="26" fill="var(--text)"></circle><g><path d="M290,85 l0,-40" stroke="var(--bad)" stroke-width="2" marker-end="url(#wc-a)"></path></g><g><path d="M400,85 l0,-40" stroke="var(--bad)" stroke-width="2" marker-end="url(#wc-a)"></path></g><defs><marker id="wc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><text x="345" y="24" text-anchor="middle" font-size="11" fill="var(--bad)">Glass loses heat fastest → cover windows (sun-shade, maps, clothing)</text><ellipse cx="330" cy="150" rx="46" ry="28" fill="var(--accent-2)" opacity="0.35" stroke="var(--accent-2)"></ellipse><text x="330" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">you, in a bag</text><text x="330" y="160" text-anchor="middle" font-size="10" fill="var(--text)">hat on, all layers</text><rect x="270" y="182" width="120" height="8" fill="var(--accent)"></rect><text x="330" y="204" text-anchor="middle" font-size="10" fill="var(--accent)">blanket or mat under you</text><text x="20" y="240" font-size="11" fill="var(--text)">• Loosen tight boots, wiggle toes; small movements, not sweat-making exercise.</text><text x="20" y="256" font-size="11" fill="var(--text)">• Eat and drink: shivering burns energy; melt snow in a bottle inside your jacket, don’t eat it.</text><text x="20" y="272" font-size="11" fill="var(--text)">• Several people: huddle in one part of the car; one stays awake to watch for help and the exhaust.</text></svg>
