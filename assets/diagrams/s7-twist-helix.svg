<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Why twist adds strength: twisted fibers are squeezed together by their own tension, and each fiber runs at the helix angle alpha to the cord axis"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7th" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="s7th2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><text x="20" y="24" font-size="13" font-weight="700">No twist</text><line x1="20" y1="50" x2="230" y2="50" stroke="var(--ground)" stroke-width="3"></line><line x1="50" y1="59" x2="205" y2="59" stroke="var(--ground)" stroke-width="3"></line><line x1="20" y1="68" x2="180" y2="68" stroke="var(--ground)" stroke-width="3"></line><line x1="50" y1="77" x2="230" y2="77" stroke="var(--ground)" stroke-width="3"></line><line x1="20" y1="86" x2="205" y2="86" stroke="var(--ground)" stroke-width="3"></line><line x1="235" y1="68" x2="280" y2="68" stroke="var(--accent)" stroke-width="2" marker-end="url(#s7th)"></line><text x="20" y="116" font-size="11" class="muted-fill">Fibers are shorter than the cord and only</text><text x="20" y="130" font-size="11" class="muted-fill">touch lightly: pull and they slide apart.</text><text x="330" y="24" font-size="13" font-weight="700">Twisted</text><rect x="330" y="46" width="240" height="44" rx="22" fill="var(--accent-2)" opacity="0.25" stroke="var(--line)"></rect><path d="M320,90 L350,46" stroke="var(--ground)" stroke-width="3"></path><path d="M350,90 L380,46" stroke="var(--ground)" stroke-width="3"></path><path d="M380,90 L410,46" stroke="var(--ground)" stroke-width="3"></path><path d="M410,90 L440,46" stroke="var(--ground)" stroke-width="3"></path><path d="M440,90 L470,46" stroke="var(--ground)" stroke-width="3"></path><path d="M470,90 L500,46" stroke="var(--ground)" stroke-width="3"></path><path d="M500,90 L530,46" stroke="var(--ground)" stroke-width="3"></path><path d="M530,90 L560,46" stroke="var(--ground)" stroke-width="3"></path><path d="M560,90 L590,46" stroke="var(--ground)" stroke-width="3"></path><line x1="575" y1="68" x2="620" y2="68" stroke="var(--accent)" stroke-width="2" marker-end="url(#s7th)"></line><line x1="440" y1="90" x2="500" y2="90" stroke="var(--info)" stroke-dasharray="4 3"></line><path d="M470,90 A30,30 0 0,0 461,72" fill="none" stroke="var(--info)"></path><text x="474" y="80" font-size="12" style="fill:var(--info)">α</text><line x1="380" y1="112" x2="380" y2="94" stroke="var(--info)" stroke-width="2" marker-end="url(#s7th2)"></line><line x1="450" y1="112" x2="450" y2="94" stroke="var(--info)" stroke-width="2" marker-end="url(#s7th2)"></line><line x1="520" y1="112" x2="520" y2="94" stroke="var(--info)" stroke-width="2" marker-end="url(#s7th2)"></line><text x="330" y="130" font-size="11" class="muted-fill">Tension in each helical fiber presses it inward</text><text x="330" y="144" font-size="11" class="muted-fill">(blue): friction now grips every fiber.</text><rect x="20" y="170" width="290" height="74" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="32" y="192" font-size="12" font-weight="700">Grip grows with twist</text><text x="32" y="212" font-size="11">More twist → more inward pressure → more</text><text x="32" y="228" font-size="11">friction → fibers share load instead of slipping.</text><rect x="330" y="170" width="290" height="74" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="342" y="192" font-size="12" font-weight="700">Obliquity costs strength</text><text x="342" y="212" font-size="11">A fiber at angle α carries only ≈ cos α of its</text><text x="342" y="228" font-size="11">strength along the cord: too much twist is weak.</text></svg>
