<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Home ignition zone: 0 to 1.5 metres non-combustible, no mulch or stored wood; 1.5 to 9 metres lean, clean and green, spaced plants, trimmed trees; 9 to 30 metres reduced fuel; embers travel far ahead of the fire front and ignite most homes"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><circle cx="200" cy="160" r="140" fill="var(--ok)" opacity="0.12" stroke="var(--ok)"></circle><circle cx="200" cy="160" r="95" fill="var(--ok)" opacity="0.2" stroke="var(--ok)"></circle><circle cx="200" cy="160" r="50" fill="var(--ground)" opacity="0.35" stroke="var(--ground)"></circle><rect x="172" y="135" width="56" height="50" fill="var(--panel-2)" stroke="var(--text)"></rect><polygon points="166,135 200,110 234,135" fill="var(--panel-2)" stroke="var(--text)"></polygon><circle cx="330" cy="60" r="4" fill="var(--accent-2)"></circle><circle cx="360" cy="90" r="4" fill="var(--accent-2)"></circle><circle cx="345" cy="40" r="4" fill="var(--accent-2)"></circle><circle cx="380" cy="70" r="4" fill="var(--accent-2)"></circle><text x="390" y="55" font-size="11" fill="var(--accent-2)">embers — often km ahead of the flames</text><g><text x="360" y="120" font-size="12" font-weight="700">0–1.5 m (0–5 ft) · immediate</text><text x="360" y="136" font-size="10" class="muted-fill">gravel, no mulch or woodpile; clear gutters</text></g><g><text x="360" y="175" font-size="12" font-weight="700">1.5–9 m (5–30 ft) · intermediate</text><text x="360" y="191" font-size="10" class="muted-fill">spaced plants, mowed grass, trimmed limbs</text></g><g><text x="360" y="230" font-size="12" font-weight="700">9–30 m (30–100 ft) · extended</text><text x="360" y="246" font-size="10" class="muted-fill">thin fuel; remove ladder fuels</text></g><text x="20" y="290" font-size="11" class="muted-fill">Zone distances follow NFPA Firewise guidance; check your local fire service’s rules.</text></svg>
