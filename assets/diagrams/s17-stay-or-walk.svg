<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" class="diagram" viewBox="0 0 660 330" role="img" aria-label="Decision chart: stay with the vehicle if anyone knows your route or you have sent an alert, if help or traffic will come, or in extreme heat or a storm. Consider walking only if nobody will look, help is close, certain and reachable in the cool with enough water, and the route is known. Leave a note with direction and time"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="220" y="10" width="220" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="330" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">Stranded. Is life at immediate risk here?</text><text x="330" y="46" text-anchor="middle" font-size="10" class="muted-fill">fire, flood water, avalanche path, traffic</text></g><g><rect x="470" y="10" width="180" height="46" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="560" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">Move to safety nearby</text><text x="560" y="46" text-anchor="middle" font-size="10" class="muted-fill">then reassess</text></g><line x1="440" y1="33" x2="468" y2="33" stroke="var(--muted)" marker-end="url(#sw-a)"></line><text x="452" y="27" font-size="10" text-anchor="middle" class="muted-fill">yes</text><line x1="330" y1="56" x2="330" y2="84" stroke="var(--muted)" marker-end="url(#sw-a)"></line><text x="340" y="76" font-size="10" class="muted-fill">no</text><g><rect x="170" y="86" width="320" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="330" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">Does anyone know where you are — or can you tell them?</text><text x="330" y="124" text-anchor="middle" font-size="10" class="muted-fill">trip plan · PLB/satellite SOS · a call or text gets through</text></g><line x1="250" y1="136" x2="150" y2="172" stroke="var(--muted)" marker-end="url(#sw-a)"></line><text x="185" y="150" font-size="10" class="muted-fill">yes</text><line x1="410" y1="136" x2="500" y2="172" stroke="var(--muted)" marker-end="url(#sw-a)"></line><text x="470" y="150" font-size="10" class="muted-fill">no</text><rect x="20" y="174" width="260" height="96" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="150" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">STAY with the vehicle</text><text x="34" y="214" font-size="10.5" fill="var(--text)">• shelter, supplies and the biggest signal</text><text x="34" y="230" font-size="10.5" fill="var(--text)">• searchers follow your route</text><text x="34" y="246" font-size="10.5" fill="var(--text)">• rest in the heat, insulate in the cold</text><text x="34" y="262" font-size="10.5" fill="var(--text)">• signals ready; engine only if exhaust clear</text><rect x="330" y="174" width="310" height="96" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)" stroke-width="2"></rect><text x="485" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">Walking is worth considering only if ALL:</text><text x="344" y="214" font-size="10.5" fill="var(--text)">• help is close, certain and on a known route</text><text x="344" y="230" font-size="10.5" fill="var(--text)">• you can travel in the cool / after the storm</text><text x="344" y="246" font-size="10.5" fill="var(--text)">• water, clothing and fitness for the whole way</text><text x="344" y="262" font-size="10.5" fill="var(--text)">• waiting would clearly be worse</text><text x="330" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text)">If you do leave: note on the dashboard (time, direction, people), mark the route, never split a group without a plan.</text><text x="330" y="316" text-anchor="middle" font-size="10" class="muted-fill">Road-safety and SAR guidance: in winter storms and desert heat, staying with the vehicle is the default.</text></svg>
