<svg xmlns="http://www.w3.org/2000/svg" width="700" height="312" class="diagram" viewBox="0 0 700 312" role="img" aria-label="Converting grid bearings to magnetic for west and east declination"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="dcl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><g><rect x="6" y="6" width="340" height="300" rx="8" fill="var(--panel-2)"></rect><text x="20" y="28" font-size="12" text-anchor="start" font-weight="700">8° WEST declination</text><line x1="170" y1="250" x2="170" y2="80" stroke="var(--info)" stroke-width="2.5"></line><text x="170" y="74" font-size="12" text-anchor="middle" font-weight="700" style="fill:var(--info)">GN</text><line x1="170" y1="250" x2="146.34" y2="81.65" stroke="var(--bad)" stroke-width="2.5"></line><text x="138.34" y="85.65" font-size="12" text-anchor="end" font-weight="700" style="fill:var(--bad)">MN</text><line x1="170" y1="250" x2="299.9" y2="175" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#dcl)"></line><text x="305.9" y="189" font-size="12" text-anchor="start" font-weight="700" 