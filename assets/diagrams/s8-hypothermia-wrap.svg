<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="260" class="diagram" viewBox="0 0 740 260" role="img" aria-label="Hypothermia wrap from outside in: waterproof outer, insulation including underneath, vapour barrier, heat sources on the trunk"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="30" y="40" width="300" height="140" rx="60" fill="var(--info)" opacity="0.15" stroke="var(--info)"></rect><line x1="330" y1="55" x2="370" y2="55" stroke="var(--line)"></line><text x="376" y="59" font-size="11.5">Waterproof / windproof outer (tarp, bivy, plastic)</text></g><g><rect x="48" y="58" width="264" height="104" rx="50" fill="var(--accent-2)" opacity="0.25" stroke="var(--accent-2)"></rect><line x1="312" y1="85" x2="370" y2="85" stroke="var(--line)"></line><text x="376" y="89" font-size="11.5">Insulation: sleeping bags, jackets — especially underneath</text></g><g><rect x="66" y="76" width="228" height="68" rx="40" fill="var(--muted)" opacity="0.35" stroke="var(--muted)"></rect><line x1="294" y1="115" x2="370" y2="115" stroke="var(--line)"></line><text x="376" y="119" font-size="11.5">Vapour barrier (plastic sheet or foil) if clothes are wet</text></g><g><rect x="84" y="94" width="192" height="32" rx="30" fill="var(--bad)" opacity="0.45" stroke="var(--bad)"></rect><line x1="276" y1="145" x2="370" y2="145" stroke="var(--line)"></line><text x="376" y="149" font-size="11.5">Heat packs / warm bottles on chest, armpits, back — not on bare skin</text></g><rect x="30" y="190" width="300" height="16" rx="4" fill="var(--ground)" opacity="0.7"></rect><text x="180" y="228" font-size="11" text-anchor="middle" class="muted-fill">thick insulation from the ground — conduction is often the biggest loss</text><text x="330" y="252" text-anchor="middle" font-size="11" font-weight="700">Keep horizontal · handle gently · cover the head · evacuate moderate/severe</text></svg>
