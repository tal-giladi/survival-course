<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Improvised pack frame: a ladder or A-frame of lashed poles with padded shoulder straps and a hip strap; keeping the load&#x27;s centre of mass close to the spine reduces the turning moment on the back. A 12 kilogram load 25 centimetres out produces about 29 newton-metres; 10 centimetres out about 12."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="pf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><text x="20" y="24" font-size="14" font-weight="700">Ladder frame</text><line x1="60" y1="40" x2="60" y2="250" stroke="var(--ground)" stroke-width="7" stroke-linecap="round"></line><line x1="150" y1="40" x2="150" y2="250" stroke="var(--ground)" stroke-width="7" stroke-linecap="round"></line><line x1="50" y1="70" x2="160" y2="70" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="50" y1="140" x2="160" y2="140" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="50" y1="220" x2="160" y2="220" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><rect x="53" y="63" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="143" y="63" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="53" y="133" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="143" y="133" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="53" y="213" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><rect x="143" y="213" width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="2"></rect><path d="M 80 70 q -20 70 0 150" fill="none" stroke="var(--info)" stroke-width="5"></path><path d="M 130 70 q 20 70 0 150" fill="none" stroke="var(--info)" stroke-width="5"></path><text x="105" y="272" text-anchor="middle" font-size="11">square lashings (Stage 7) at each joint</text><text x="105" y="288" text-anchor="middle" font-size="11" class="muted-fill">padded straps; hip strap on bottom rung</text><text x="260" y="24" font-size="14" font-weight="700">Side view: keep it close</text><g><circle cx="300" cy="60" r="14" fill="var(--panel-2)" stroke="var(--text)"></circle><line x1="300" y1="74" x2="300" y2="190" stroke="var(--text)" stroke-width="4"></line><line x1="300" y1="190" x2="285" y2="260" stroke="var(--text)" stroke-width="4"></line><line x1="300" y1="190" x2="315" y2="260" stroke="var(--text)" stroke-width="4"></line><rect x="230" y="85" width="60" height="90" rx="6" fill="var(--ground)" opacity="0.7" stroke="var(--line)"></rect><circle cx="260" cy="130" r="5" fill="var(--bad)"></circle><line x1="260" y1="130" x2="260" y2="170" stroke="var(--accent)" stroke-width="2" marker-end="url(#pf-a)"></line><text x="330" y="120" font-size="11" style="fill:var(--bad)">25 cm out</text><text x="330" y="135" font-size="11" font-weight="700" style="fill:var(--bad)">≈ 29 N·m</text></g><g><circle cx="470" cy="60" r="14" fill="var(--panel-2)" stroke="var(--text)"></circle><line x1="470" y1="74" x2="470" y2="190" stroke="var(--text)" stroke-width="4"></line><line x1="470" y1="190" x2="455" y2="260" stroke="var(--text)" stroke-width="4"></line><line x1="470" y1="190" x2="485" y2="260" stroke="var(--text)" stroke-width="4"></line><rect x="436" y="85" width="24" height="90" rx="6" fill="var(--ground)" opacity="0.7" stroke="var(--line)"></rect><circle cx="448" cy="130" r="5" fill="var(--ok)"></circle><line x1="448" y1="130" x2="448" y2="170" stroke="var(--accent)" stroke-width="2" marker-end="url(#pf-a)"></line><text x="500" y="120" font-size="11" style="fill:var(--ok)">10 cm out</text><text x="500" y="135" font-size="11" font-weight="700" style="fill:var(--ok)">≈ 12 N·m</text></g><text x="260" y="272" font-size="11">M = m·g·d: 12 kg × 9.81 × 0.25 m ≈ 29 N·m</text><text x="260" y="288" font-size="11">Heavy items high and close to the spine; light, bulky items outward and low.</text></svg>
