<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" class="diagram" viewBox="0 0 720 320" role="img" aria-label="Groundwater cross-section: unsaturated zone, water table, saturated zone, a perched water table above a clay layer feeding a spring, and a seep hole dug beside a stream"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="720" height="60" fill="var(--sky)" opacity="0.5"></rect><path d="M0,60 L200,60 Q260,62 300,100 L420,100 Q460,70 720,60 L720,320 L0,320 Z" fill="var(--ground)" opacity="0.35"></path><path d="M0,170 Q200,160 330,110 L400,110 Q520,150 720,170 L720,320 L0,320 Z" fill="var(--info)" opacity="0.3"></path><path d="M0,170 Q200,160 330,110 L400,110 Q520,150 720,170" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="8 5" fill="none"></path><text x="20" y="160" font-size="12" font-weight="700" style="fill:var(--info)">Water table</text><text x="40" y="250" font-size="12">Saturated zone (aquifer): every pore is full</text><text x="40" y="95" font-size="12">Unsaturated zone: damp, not full</text><rect x="300" y="100" width="120" height="14" fill="var(--info)" opacity="0.8"></rect><text x="360" y="92" text-anchor="middle" font-size="12" font-weight="700">Stream</text><circle cx="455" cy="96" r="12" fill="var(--panel-2)" stroke="var(--text)"></circle><text x="470" y="85" font-size="11">Seep hole 1–2 m from the bank:</text><text x="470" y="99" font-size="11">fills with bank-filtered water</text><rect x="560" y="80" width="160" height="10" fill="var(--accent-2)" opacity="0.8"></rect><path d="M560,76 L720,70 L720,80 L560,80 Z" fill="var(--info)" opacity="0.5"></path><text x="580" y="116" font-size="11">Clay layer → perched water</text><circle cx="560" cy="80" r="6" fill="var(--info)"></circle><text x="508" y="62" font-size="11" font-weight="700">Spring</text><text x="360" y="310" text-anchor="middle" font-size="10.5" class="muted-fill">Springs appear where a water-bearing layer meets a less permeable one and daylights on a slope. (After USGS Water Science School.)</text></svg>
