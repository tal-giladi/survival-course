<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" class="diagram" viewBox="0 0 640 290" role="img" aria-label="Normalization of deviance: a group starts well inside the safe zone. Each time a small deviation passes without harm it becomes the new normal, and the operating point drifts step by step towards the boundary of acceptable risk, while the perceived margin stays the same."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="dd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><rect x="30" y="30" width="580" height="40" fill="var(--bad)" opacity="0.18"></rect><line x1="30" y1="70" x2="610" y2="70" stroke="var(--bad)" stroke-width="2"></line><text x="40" y="55" font-size="12" font-weight="700" fill="var(--bad)">Boundary of acceptable risk — accidents happen here</text><rect x="30" y="170" width="580" height="70" fill="var(--ok)" opacity="0.12"></rect><text x="40" y="232" font-size="11" fill="var(--ok)" font-weight="700">Original margin: rules, turnaround times, forecasts respected</text><line x1="80" y1="200" x2="150" y2="185" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="150" y1="185" x2="220" y2="175" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="220" y1="175" x2="280" y2="150" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="280" y1="150" x2="340" y2="140" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="340" y1="140" x2="400" y2="115" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="400" y1="115" x2="460" y2="100" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><line x1="460" y1="100" x2="520" y2="80" stroke="var(--bad)" stroke-width="2" marker-end="url(#dd-a)"></line><circle cx="80" cy="200" r="7" fill="var(--ok)"></circle><circle cx="150" cy="185" r="4" fill="var(--bad)"></circle><circle cx="220" cy="175" r="4" fill="var(--bad)"></circle><circle cx="280" cy="150" r="4" fill="var(--bad)"></circle><circle cx="340" cy="140" r="4" fill="var(--bad)"></circle><circle cx="400" cy="115" r="4" fill="var(--bad)"></circle><circle cx="460" cy="100" r="4" fill="var(--bad)"></circle><circle cx="520" cy="80" r="4" fill="var(--bad)"></circle><text x="150" y="205" font-size="10" text-anchor="middle" class="muted-fill">“late start, but fine”</text><text x="280" y="172" font-size="10" text-anchor="middle" class="muted-fill">“rumbles, never struck”</text><text x="400" y="138" font-size="10" text-anchor="middle" class="muted-fill">“skipped the check again”</text><text x="520" y="104" font-size="10" text-anchor="middle" class="muted-fill">“no one got hurt”</text><text x="320" y="264" text-anchor="middle" font-size="11">Each near-miss that ends well feels like proof of safety — so the next deviation feels normal.</text><text x="320" y="280" text-anchor="middle" font-size="10" class="muted-fill">After Vaughan (1996) and Rasmussen (1997). Countermeasure: fixed standards, and reviewing near-misses as if they were accidents.</text></svg>
