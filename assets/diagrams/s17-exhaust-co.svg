<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" class="diagram" viewBox="0 0 660 290" role="img" aria-label="Two cars in snow. Left: the tailpipe is buried by drifted snow, so exhaust is forced under the car and seeps into the cabin, carbon monoxide builds up. Right: tailpipe dug clear, a downwind window cracked, engine run about 10 minutes per hour, CO alarm; exhaust disperses"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="co-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="co-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"></path></marker></defs><text x="165" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad)">Tailpipe buried</text><text x="495" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ok)">Tailpipe cleared</text><line x1="330" y1="30" x2="330" y2="270" stroke="var(--line)" stroke-dasharray="4 4"></line><g transform="translate(70,120) scale(1)"><path d="M0,40 L10,20 L40,18 L60,0 L120,0 L145,20 L180,24 L185,40 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.5"></path><path d="M64,5 L90,5 L90,20 L48,20 Z M95,5 L118,5 L138,20 L95,20 Z" fill="var(--sky)" opacity="0.6" stroke="var(--line)"></path><circle cx="40" cy="42" r="12" fill="var(--text)"></circle><circle cx="148" cy="42" r="12" fill="var(--text)"></circle></g><path d="M20,175 Q60,140 120,165 L300,168 L300,200 L20,200 Z" fill="var(--sky)" opacity="0.35" stroke="var(--line)"></path><text x="40" y="196" font-size="10" class="muted-fill">drifted snow</text><path d="M72,160 C110,178 160,178 190,150" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#co-bad)"></path><path d="M150,150 C150,135 160,130 165,128" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#co-bad)"></path><text x="170" y="96" text-anchor="middle" font-size="11" fill="var(--bad)">exhaust forced under the car</text><text x="170" y="110" text-anchor="middle" font-size="11" fill="var(--bad)">and into the cabin</text><text x="165" y="228" text-anchor="middle" font-size="11" fill="var(--text)">CO: no colour, no smell. Headache,</text><text x="165" y="244" text-anchor="middle" font-size="11" fill="var(--text)">nausea, sleepiness — then unconsciousness.</text><text x="165" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bad)">Sleeping occupants may never wake.</text><g transform="translate(400,120) scale(1)"><path d="M0,40 L10,20 L40,18 L60,0 L120,0 L145,20 L180,24 L185,40 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.5"></path><path d="M64,5 L90,5 L90,20 L48,20 Z M95,5 L118,5 L138,20 L95,20 Z" fill="var(--sky)" opacity="0.6" stroke="var(--line)"></path><circle cx="40" cy="42" r="12" fill="var(--text)"></circle><circle cx="148" cy="42" r="12" fill="var(--text)"></circle><path d="M145,20 L165,-6 L180,-2 L180,24" fill="none" stroke="var(--text)" stroke-width="2"></path></g><path d="M350,190 L640,190 L640,200 L350,200 Z" fill="var(--sky)" opacity="0.35" stroke="var(--line)"></path><path d="M396,158 C380,150 365,140 352,128" fill="none" stroke="var(--ok)" stroke-width="2" marker-end="url(#co-ok)"></path><text x="352" y="118" font-size="10" fill="var(--ok)">disperses</text><rect x="390" y="150" width="24" height="40" fill="none" stroke="var(--ok)" stroke-dasharray="3 2"></rect><text x="402" y="210" text-anchor="middle" font-size="9.5" fill="var(--ok)">dug clear</text><path d="M548,112 L560,104" stroke="var(--info)" stroke-width="3"></path><text x="575" y="100" font-size="10" fill="var(--info)">window cracked</text><path d="M600,95 L612,90" stroke="var(--accent-2)" stroke-width="2"></path><text x="440" y="72" font-size="10" fill="var(--accent-2)">bright cloth on the antenna</text><text x="495" y="228" text-anchor="middle" font-size="11" fill="var(--text)">Clear the tailpipe before every run and</text><text x="495" y="244" text-anchor="middle" font-size="11" fill="var(--text)">after drifting; run ~10 min per hour;</text><text x="495" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">a battery CO alarm if you have one.</text></svg>
