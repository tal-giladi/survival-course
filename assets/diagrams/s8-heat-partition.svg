<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" class="diagram" viewBox="0 0 680 300" role="img" aria-label="Stacked bars of heat loss by mechanism in four conditions, computed with the course heat model"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><text x="210" y="36" text-anchor="end" font-size="11.5" font-weight="600">Dry, calm, 10 °C, walking</text><rect x="220" y="20" width="36.78" height="24" fill="var(--info)" opacity="0.85"></rect><text x="238.39" y="36" font-size="10" text-anchor="middle" style="fill:#fff">106</text><rect x="256.78" y="20" width="10.92" height="24" fill="var(--accent-2)" opacity="0.85"></rect><rect x="267.71" y="20" width="0.3" height="24" fill="var(--ground)" opacity="0.85"></rect><rect x="268.01" y="20" width="15.46" height="24" fill="var(--sky)" opacity="0.85"></rect><rect x="283.48" y="20" width="56.46" height="24" fill="var(--ok)" opacity="0.85"></rect><text x="311.71" y="36" font-size="10" text-anchor="middle" style="fill:#fff">163</text><text x="345.94" y="36" font-size="11" class="muted-fill">347 W</text></g><g><text x="210" y="96" text-anchor="end" font-size="11.5" font-weight="600">Clear night, −5 °C, resting on ground</text><rect x="220" y="80" width="29.39" height="24" fill="var(--info)" opacity="0.85"></rect><rect x="249.39" y="80" width="14.97" height="24" fill="var(--accent-2)" opacity="0.85"></rect><rect x="264.36" y="80" width="23.86" height="24" fill="var(--ground)" opacity="0.85"></rect><rect x="288.22" y="80" width="5.48" height="24" fill="var(--sky)" opacity="0.85"></rect><rect x="293.7" y="80" width="0" height="24" fill="var(--ok)" opacity="0.85"></rect><text x="299.7" y="96" font-size="11" class="muted-fill">213 W</text></g><g><text x="210" y="156" text-anchor="end" font-size="11.5" font-weight="600">Wet cotton, 5 °C, 30 km/h, resting</text><rect x="220" y="140" width="224.01" height="24" fill="var(--info)" opacity="0.85"></rect><text x="332.01" y="156" font-size="10" text-anchor="middle" style="fill:#fff">648</text><rect x="444.01" y="140" width="38.64" height="24" fill="var(--accent-2)" opacity="0.85"></rect><text x="463.33" y="156" font-size="10" text-anchor="middle" style="fill:#fff">112</text><rect x="482.66" y="140" width="49.03" height="24" fill="var(--ground)" opacity="0.85"></rect><text x="507.17" y="156" font-size="10" text-anchor="middle" style="fill:#fff">142</text><rect x="531.69" y="140" width="88.31" height="24" fill="var(--sky)" opacity="0.85"></rect><text x="575.84" y="156" font-size="10" text-anchor="middle" style="fill:#fff">255</text><rect x="620" y="140" width="0" height="24" fill="var(--ok)" opacity="0.85"></rect><text x="626" y="156" font-size="11" class="muted-fill">1157 W</text></g><g><text x="210" y="216" text-anchor="end" font-size="11.5" font-weight="600">Desert, 40 °C, sun, walking</text><rect x="220" y="200" width="0" height="24" fill="var(--info)" opacity="0.85"></rect><rect x="220" y="200" width="0" height="24" fill="var(--accent-2)" opacity="0.85"></rect><rect x="220" y="200" width="0" height="24" fill="var(--ground)" opacity="0.85"></rect><rect x="220" y="200" width="9.35" height="24" fill="var(--sky)" opacity="0.85"></rect><rect x="229.35" y="200" width="183.69" height="24" fill="var(--ok)" opacity="0.85"></rect><text x="321.19" y="216" font-size="10" text-anchor="middle" style="fill:#fff">531</text><text x="419.04" y="216" font-size="11" class="muted-fill">558 W</text></g><g><rect x="20" y="264" width="12" height="12" fill="var(--info)"></rect><text x="36" y="275" font-size="11">Convection</text></g><g><rect x="150" y="264" width="12" height="12" fill="var(--accent-2)"></rect><text x="166" y="275" font-size="11">Radiation</text></g><g><rect x="280" y="264" width="12" height="12" fill="var(--ground)"></rect><text x="296" y="275" font-size="11">Conduction</text></g><g><rect x="410" y="264" width="12" height="12" fill="var(--sky)"></rect><text x="426" y="275" font-size="11">Breath + wet clothing</text></g><g><rect x="540" y="264" width="12" height="12" fill="var(--ok)"></rect><text x="556" y="275" font-size="11">Sweat</text></g><text x="340" y="296" text-anchor="middle" font-size="10" class="muted-fill">Heat lost (W), from the course’s simplified model. In the desert, air, ground and sun add heat; sweat must remove it all.</text></svg>
