<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" class="diagram" viewBox="0 0 640 380" role="img" aria-label="Plan view of a multi-day camp. Prevailing wind blows from the left. The sleeping shelter sits on a slight rise with the fire and kitchen a few metres downwind of it. The woodpile is under cover beside the fire. The water source, a stream, is at the bottom; the collection point is upstream of camp. The latrine or cathole area is downwind and at least 60 metres (about 70 steps) from water, trail and camp. Washing and grey-water disposal are at least 60 metres from the stream. The signal site is in the open clearing. Food storage is away from the sleeping area where wildlife is a concern."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="cl-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="cl-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="10" y="10" width="620" height="360" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M10,330 C160,300 300,350 460,320 S600,300 630,315 L630,370 L10,370 Z" fill="var(--info)" opacity="0.35"></path><text x="330" y="355" font-size="12" font-weight="700" text-anchor="middle">Stream → (flows to the right)</text><line x1="30" y1="40" x2="100" y2="40" stroke="var(--info)" stroke-width="2.5" marker-end="url(#cl-w)"></line><text x="30" y="32" font-size="11" style="fill:var(--info)">prevailing wind</text><g><rect x="170" y="120" width="120" height="50" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="230" y="142" text-anchor="middle" font-size="12" font-weight="700">Sleep shelter</text><text x="230" y="158" text-anchor="middle" font-size="10" class="muted-fill">slight rise, drains</text></g><circle cx="345" cy="145" r="16" fill="var(--accent)"></circle><text x="345" y="180" font-size="11" text-anchor="middle" font-weight="700">Fire / kitchen</text><text x="345" y="193" font-size="10" text-anchor="middle" class="muted-fill">3–5 m downwind</text><g><rect x="330" y="70" width="100" height="34" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="380" y="84" text-anchor="middle" font-size="12" font-weight="700">Woodpile</text><text x="380" y="100" text-anchor="middle" font-size="10" class="muted-fill">under cover</text></g><g><rect x="120" y="215" width="130" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="185" y="230" text-anchor="middle" font-size="12" font-weight="700">Tools / repair</text><text x="185" y="246" text-anchor="middle" font-size="10" class="muted-fill">a place for everything</text></g><g><rect x="60" y="270" width="120" height="34" rx="8" fill="var(--sky)" stroke="var(--line)"></rect><text x="120" y="284" text-anchor="middle" font-size="12" font-weight="700">Water collection</text><text x="120" y="300" text-anchor="middle" font-size="10" class="muted-fill">upstream of camp</text></g><g><rect x="470" y="60" width="140" height="44" rx="8" fill="var(--accent-2)" stroke="var(--line)"></rect><text x="540" y="79" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Signal site</text><text x="540" y="95" text-anchor="middle" font-size="10" class="muted-fill">open ground, visible</text></g><g><rect x="500" y="200" width="120" height="46" rx="8" fill="var(--ground)" stroke="var(--line)"></rect><text x="560" y="220" text-anchor="middle" font-size="12" font-weight="700">Latrine / catholes</text><text x="560" y="236" text-anchor="middle" font-size="10" class="muted-fill">downwind, ≥ 60 m</text></g><g><rect x="330" y="230" width="120" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="390" y="247" text-anchor="middle" font-size="12" font-weight="700">Wash + grey water</text><text x="390" y="263" text-anchor="middle" font-size="10" class="muted-fill">≥ 60 m from stream</text></g><g><rect x="20" y="110" width="120" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="80" y="127" text-anchor="middle" font-size="12" font-weight="700">Food storage</text><text x="80" y="143" text-anchor="middle" font-size="10" class="muted-fill">away from beds</text></g><line x1="560" y1="246" x2="560" y2="318" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#cl-d)" marker-start="url(#cl-d)"></line><text x="566" y="290" font-size="10" class="muted-fill">≥ 60 m</text><text x="566" y="302" font-size="10" class="muted-fill">(~70 steps)</text><line x1="500" y1="222" x2="295" y2="148" stroke="var(--muted)" stroke-dasharray="4 3" marker-end="url(#cl-d)" marker-start="url(#cl-d)"></line><text x="420" y="196" font-size="10" class="muted-fill">≥ 60 m</text><text x="20" y="60" font-size="10" class="muted-fill">Not to scale. Check local rules: fires, camping, food storage</text><text x="20" y="72" font-size="10" class="muted-fill">and human-waste disposal differ by land manager.</text></svg>
