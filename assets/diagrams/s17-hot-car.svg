<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Chart: a closed car in the sun heats tens of degrees above the outside air within half an hour; with 40 degrees outside the cabin can exceed 60 degrees. Better: rest in raised shade beside the car where the air is near outdoor temperature"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="60" y1="210" x2="380" y2="210" stroke="var(--line)"></line><line x1="60" y1="30" x2="60" y2="210" stroke="var(--line)"></line><g><line x1="56" y1="210" x2="380" y2="210" stroke="var(--line)" opacity="0.3"></line><text x="52" y="214" text-anchor="end" font-size="10" class="muted-fill">20 °C</text></g><g><line x1="56" y1="178" x2="380" y2="178" stroke="var(--line)" opacity="0.3"></line><text x="52" y="182" text-anchor="end" font-size="10" class="muted-fill">30 °C</text></g><g><line x1="56" y1="146" x2="380" y2="146" stroke="var(--line)" opacity="0.3"></line><text x="52" y="150" text-anchor="end" font-size="10" class="muted-fill">40 °C</text></g><g><line x1="56" y1="114" x2="380" y2="114" stroke="var(--line)" opacity="0.3"></line><text x="52" y="118" text-anchor="end" font-size="10" class="muted-fill">50 °C</text></g><g><line x1="56" y1="82" x2="380" y2="82" stroke="var(--line)" opacity="0.3"></line><text x="52" y="86" text-anchor="end" font-size="10" class="muted-fill">60 °C</text></g><g><line x1="56" y1="50" x2="380" y2="50" stroke="var(--line)" opacity="0.3"></line><text x="52" y="54" text-anchor="end" font-size="10" class="muted-fill">70 °C</text></g><text x="60" y="226" text-anchor="middle" font-size="10" class="muted-fill">0 min</text><text x="135" y="226" text-anchor="middle" font-size="10" class="muted-fill">15 min</text><text x="210" y="226" text-anchor="middle" font-size="10" class="muted-fill">30 min</text><text x="285" y="226" text-anchor="middle" font-size="10" class="muted-fill">45 min</text><text x="360" y="226" text-anchor="middle" font-size="10" class="muted-fill">60 min</text><line x1="60" y1="146" x2="360" y2="146" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3"></line><text x="365" y="150" font-size="10" fill="var(--info)">air 40 °C</text><path d="M60,146 C110,101.2 160,88.4 210,85.2 S330,75.6 360,75.6" fill="none" stroke="var(--bad)" stroke-width="2.5"></path><text x="300" y="66" font-size="11" font-weight="700" fill="var(--bad)">closed cabin</text><text x="60" y="20" font-size="12" font-weight="700" fill="var(--text)">Illustrative: most of the rise comes in the first 30 minutes</text><g><g transform="translate(420,150) scale(1)"><path d="M0,40 L10,20 L40,18 L60,0 L120,0 L145,20 L180,24 L185,40 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.5"></path><path d="M64,5 L90,5 L90,20 L48,20 Z M95,5 L118,5 L138,20 L95,20 Z" fill="var(--sky)" opacity="0.6" stroke="var(--line)"></path><circle cx="40" cy="42" r="12" fill="var(--text)"></circle><circle cx="148" cy="42" r="12" fill="var(--text)"></circle></g><path d="M430,110 L620,110 L620,190" fill="none" stroke="var(--accent)" stroke-width="3"></path><path d="M432,120 L612,120" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="4 3"></path><rect x="400" y="194" width="230" height="10" fill="var(--ground)" opacity="0.7"></rect><text x="520" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok)">Wait in raised double shade, not inside</text><text x="520" y="226" text-anchor="middle" font-size="10" class="muted-fill">Doors open for airflow; sit on a seat</text><text x="520" y="240" text-anchor="middle" font-size="10" class="muted-fill">or cushion, off the hot ground</text></g></svg>
