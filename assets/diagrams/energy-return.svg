<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" class="diagram" viewBox="0 0 760 270" role="img" aria-label="Bar chart of expected kilocalories gained versus spent per hour for five food-getting methods; only passive methods return more than they cost"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><text x="250" y="44" font-size="12" text-anchor="end">Passive set-lines (where legal)</text><rect x="260" y="30" width="142.5" height="14" fill="var(--ok)"></rect><rect x="260" y="46" width="47.5" height="14" fill="var(--bad)" opacity="0.7"></rect><text x="408.5" y="50" font-size="11.5" font-weight="700" style="fill:var(--ok)">+80 kcal/h</text></g><g><text x="250" y="86" font-size="12" text-anchor="end">Hook-and-line fishing, good water</text><rect x="260" y="72" width="79.5625" height="14" fill="var(--ok)"></rect><rect x="260" y="88" width="95" height="14" fill="var(--bad)" opacity="0.7"></rect><text x="361" y="92" font-size="11.5" font-weight="700" style="fill:var(--bad)">-13 kcal/h</text></g><g><text x="250" y="128" font-size="12" text-anchor="end">Insects in warm season</text><rect x="260" y="114" width="95" height="14" fill="var(--ok)"></rect><rect x="260" y="130" width="142.5" height="14" fill="var(--bad)" opacity="0.7"></rect><text x="408.5" y="134" font-size="11.5" font-weight="700" style="fill:var(--bad)">-40 kcal/h</text></g><g><text x="250" y="170" font-size="12" text-anchor="end">Small-game trapping (licensed)</text><rect x="260" y="156" width="49.875" height="14" fill="var(--ok)"></rect><rect x="260" y="172" width="118.75" height="14" fill="var(--bad)" opacity="0.7"></rect><text x="384.75" y="176" font-size="11.5" font-weight="700" style="fill:var(--bad)">-58 kcal/h</text></g><g><text x="250" y="212" font-size="12" text-anchor="end">Stalking game (licensed)</text><rect x="260" y="198" width="47.5" height="14" fill="var(--ok)"></rect><rect x="260" y="214" width="356.25" height="14" fill="var(--bad)" opacity="0.7"></rect><text x="622.25" y="218" font-size="11.5" font-weight="700" style="fill:var(--bad)">-260 kcal/h</text></g><rect x="260" y="244" width="14" height="10" fill="var(--ok)"></rect><text x="280" y="253" font-size="11">expected gain / h</text><rect x="400" y="244" width="14" height="10" fill="var(--bad)" opacity="0.7"></rect><text x="420" y="253" font-size="11">energy cost / h</text><text x="20" y="268" font-size="10" class="muted-fill">Illustrative model values (the Energy Budget sim). Real returns vary hugely with place, season, skill — and the law.</text></svg>
