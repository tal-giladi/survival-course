<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" class="diagram" viewBox="0 0 700 240" role="img" aria-label="Deploying a personal locator beacon: fully extend the antenna and hold it vertical, give it a clear view of the sky away from rock walls and dense canopy, do not shield it with your body, and leave it on until rescuers reach you or tell you otherwise."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="0" width="700" height="170" fill="var(--sky)" opacity="0.2" rx="10"></rect><rect x="0" y="170" width="700" height="70" fill="var(--ground)" opacity="0.35" rx="10"></rect><g><rect x="100" y="120" width="26" height="46" rx="5" fill="var(--accent-2)"></rect><line x1="113" y1="120" x2="113" y2="40" stroke="var(--text)" stroke-width="3"></line><text x="113" y="200" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ok)">✓ antenna vertical, open sky</text><path d="M60 40 q53 -40 106 0" stroke="var(--ok)" fill="none" stroke-width="2"></path></g><g><rect x="320" y="150" width="46" height="20" rx="5" fill="var(--accent-2)"></rect><line x1="366" y1="160" x2="420" y2="160" stroke="var(--text)" stroke-width="3"></line><path d="M290 20 L300 170 L270 170 Z M420 30 q40 60 20 140" fill="var(--ground)" opacity="0.8"></path><text x="350" y="200" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bad)">✗ lying flat, in a gully</text></g><g><rect x="560" y="120" width="26" height="46" rx="5" fill="var(--accent-2)"></rect><circle cx="560" cy="110" r="40" fill="var(--ground)" opacity="0.9"></circle><text x="570" y="200" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--bad)">✗ under dense canopy / your body</text></g><text x="350" y="228" text-anchor="middle" font-size="11" class="muted-fill">Leave it switched on until rescuers reach you or an RCC tells you to switch off. Keep it warm and dry if you can.</text></svg>
