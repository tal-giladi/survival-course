<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="230" class="diagram" viewBox="0 0 660 230" role="img" aria-label="Starvation timeline: glycogen, then gluconeogenesis, then ketosis, then protein loss"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="40" y="50" width="100.24903194555162" height="34" rx="6" fill="var(--warn)" opacity="0.85"></rect><text x="91.12451597277581" y="72" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">Day 0–1</text><foreignObject x="40" y="92" width="150" height="44"><div style="font-size:11px;color:var(--text)">liver glycogen used up; hunger, irritability</div></foreignObject></g><g><rect x="142.24903194555162" y="50" width="100.24903194555162" height="34" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="193.37354791832743" y="72" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">Days 1–3</text><foreignObject x="142.24903194555162" y="136" width="150" height="44"><div style="font-size:11px;color:var(--text)">gluconeogenesis from protein; ketones rising</div></foreignObject></g><g><rect x="244.49806389110324" y="50" width="249.4745021419447" height="34" rx="6" fill="var(--info)" opacity="0.85"></rect><text x="370.23531496207556" y="72" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">Weeks 1–3</text><foreignObject x="244.49806389110324" y="92" width="251.4745021419447" height="44"><div style="font-size:11px;color:var(--text)">ketosis: brain runs largely on ketones; protein spared</div></foreignObject></g><g><rect x="495.97256603304794" y="50" width="122.02743396695206" height="34" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="557.986283016524" y="72" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#fff">Weeks 3+</text><foreignObject x="495.97256603304794" y="136" width="150" height="44"><div style="font-size:11px;color:var(--text)">fat stores deplete; muscle and organ protein lost; danger</div></foreignObject></g><text x="330" y="30" text-anchor="middle" font-size="12" font-weight="700">Without food (with water, at rest): what the body burns</text><text x="330" y="220" text-anchor="middle" font-size="10" class="muted-fill">Log time axis. Performance and mood decline within days — long before life is threatened. Water and warmth come first.</text></svg>
