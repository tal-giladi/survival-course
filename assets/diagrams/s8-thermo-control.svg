<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="345" class="diagram" viewBox="0 0 680 345" role="img" aria-label="Thermoregulation as a control loop: skin and core sensors feed the hypothalamus, which drives vasomotor tone, shivering, sweating and behaviour"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="20" y="20" width="170" height="52" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="105" y="42" text-anchor="middle" font-size="13" font-weight="700">Skin sensors</text><text x="105" y="60" text-anchor="middle" font-size="10.5" class="muted-fill">early warning: skin cooling</text></g><g><rect x="20" y="110" width="170" height="52" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="105" y="132" text-anchor="middle" font-size="13" font-weight="700">Core sensors</text><text x="105" y="150" text-anchor="middle" font-size="10.5" class="muted-fill">blood temperature, spinal cord</text></g><g><rect x="250" y="65" width="180" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--line)"></rect><text x="340" y="87" text-anchor="middle" font-size="13" font-weight="700">Hypothalamus</text><text x="340" y="105" text-anchor="middle" font-size="10.5" class="muted-fill">compares with set point ≈ 37 °C</text></g><g><rect x="490" y="10" width="170" height="52" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="575" y="32" text-anchor="middle" font-size="13" font-weight="700">Vasomotor tone</text><text x="575" y="50" text-anchor="middle" font-size="10.5" class="muted-fill">constrict ↔ dilate skin vessels</text></g><g><rect x="490" y="80" width="170" height="52" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="575" y="102" text-anchor="middle" font-size="13" font-weight="700">Shivering</text><text x="575" y="120" text-anchor="middle" font-size="10.5" class="muted-fill">heat ×2–5, burns glycogen</text></g><g><rect x="490" y="150" width="170" height="52" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="575" y="172" text-anchor="middle" font-size="13" font-weight="700">Sweating</text><text x="575" y="190" text-anchor="middle" font-size="10.5" class="muted-fill">up to 1–2 L/h; needs water</text></g><g><rect x="490" y="220" width="170" height="52" rx="10" fill="var(--ok-soft)" stroke="var(--line)"></rect><text x="575" y="242" text-anchor="middle" font-size="13" font-weight="700">Behaviour</text><text x="575" y="260" text-anchor="middle" font-size="10.5" class="muted-fill">layers, shelter, pace — strongest!</text></g><line x1="190" y1="46" x2="248" y2="91" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><line x1="190" y1="136" x2="248" y2="91" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><line x1="430" y1="91" x2="488" y2="36" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><line x1="430" y1="91" x2="488" y2="106" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><line x1="430" y1="91" x2="488" y2="176" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><line x1="430" y1="91" x2="488" y2="246" stroke="var(--accent)" stroke-width="2" marker-end="url(#tc)"></line><path d="M575,275 Q575,315 340,315 Q100,315 105,165" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tc)"></path><text x="340" y="338" text-anchor="middle" font-size="11" class="muted-fill">feedback: effectors change heat flow → temperatures change → sensors</text></svg>
