<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" class="diagram" viewBox="0 0 760 330" role="img" aria-label="Energy stores: glycogen about 2,000 kcal, fat about 100,000 kcal; timeline of a fast from glycogen use to fat adaptation to lean tissue loss"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="13" font-weight="700">Stores in a 70 kg adult with 20 % body fat (areas to scale)</text><rect x="30" y="40" width="16" height="16" fill="var(--info)"></rect><text x="52" y="52" font-size="12">Glycogen ≈ 500 g ≈ 2,000 kcal</text><rect x="260" y="40" width="150" height="96" fill="var(--accent)" opacity="0.85"></rect><text x="418" y="60" font-size="12">Fat ≈ 14 kg × 7,700 kcal/kg</text><text x="418" y="76" font-size="12">≈ 108,000 kcal</text><text x="418" y="100" font-size="11" class="muted-fill">Protein (muscle, organs) is structure,</text><text x="418" y="115" font-size="11" class="muted-fill">not a store — but it is spent too.</text><text x="20" y="170" font-size="13" font-weight="700">A fast, day by day (log scale)</text><g><rect x="60" y="184" width="160.78694683476752" height="18" rx="9" fill="var(--info)" opacity="0.85"></rect><text x="226.78694683476752" y="197" font-size="11.5" text-anchor="start">Glycogen — first 1–2 days of hard work</text></g><g><rect x="181.63062987814607" y="210" width="160.78694683476755" height="18" rx="9" fill="var(--accent)" opacity="0.85"></rect><text x="348.4175767129136" y="223" font-size="11.5" text-anchor="start">Shift to fat, ketones rise — hunger peaks, then eases</text></g><g><rect x="342.4175767129136" y="236" width="259.9858999604613" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><text x="336.4175767129136" y="249" font-size="11.5" text-anchor="end">Fat-adapted — cold tolerance, mood, strength fall</text></g><g><rect x="602.4034766733749" y="262" width="117.59652332662506" height="18" rx="9" fill="var(--bad)" opacity="0.85"></rect><text x="596.4034766733749" y="275" font-size="11.5" text-anchor="end">Serious lean-tissue loss — weeks; illness and injury risk</text></g><g><line x1="60" x2="60" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="60" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">day 0</text></g><g><line x1="181.63062987814607" x2="181.63062987814607" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="181.63062987814607" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">1 d</text></g><g><line x1="303.26125975629213" x2="303.26125975629213" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="303.26125975629213" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">3 d</text></g><g><line x1="424.89188963443814" x2="424.89188963443814" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="424.89188963443814" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">7 d</text></g><g><line x1="535.1975640088694" x2="535.1975640088694" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="535.1975640088694" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">14 d</text></g><g><line x1="650.8792883734295" x2="650.8792883734295" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="650.8792883734295" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">28 d</text></g><g><line x1="720" x2="720" y1="180" y2="292" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="720" y="306" font-size="10.5" text-anchor="middle" class="muted-fill">42 d</text></g><text x="380" y="324" font-size="10" text-anchor="middle" class="muted-fill">Timings vary with body fat, activity and cold. Water shortage kills far sooner.</text></svg>
