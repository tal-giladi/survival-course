<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" class="diagram" viewBox="0 0 760 420" role="img" aria-label="Cross-sections of a warm front and a cold front, showing cloud sequences and rain bands"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="fc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="fc-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><text x="10" y="20" font-size="14" font-weight="700">Warm front — shallow slope (~1:150), wide cloud shield</text><rect x="10" y="30" width="740" height="160" fill="var(--sky)"></rect><path d="M40,180 L740,40 L740,180 Z" fill="var(--info)" opacity="0.18"></path><text x="600" y="165" font-size="12" font-weight="600">cold air</text><text x="120" y="80" font-size="12" font-weight="600">warm air rides up over the cold</text><line x1="80" y1="150" x2="300" y2="110" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#fc-a)"></line><path d="M720,48 q-20,-4 -40,-4 M700,56 q-20,-3 -38,-2" stroke="var(--muted)" stroke-width="2" fill="none"></path><text x="690" y="75" text-anchor="middle" font-size="11">Ci</text><rect x="520" y="72" width="120" height="12" fill="var(--muted)" opacity="0.35"></rect><text x="580" y="100" text-anchor="middle" font-size="11">Cs (halo)</text><rect x="330" y="100" width="170" height="30" fill="var(--muted)" opacity="0.55"></rect><text x="415" y="120" text-anchor="middle" font-size="11">As</text><rect x="140" y="130" width="190" height="34" fill="var(--muted)" opacity="0.85"></rect><text x="235" y="152" text-anchor="middle" font-size="11" style="fill:#fff">Ns</text><line x1="150" y1="166" x2="146" y2="186" stroke="var(--info)"></line><line x1="168" y1="166" x2="164" y2="186" stroke="var(--info)"></line><line x1="186" y1="166" x2="182" y2="186" stroke="var(--info)"></line><line x1="204" y1="166" x2="200" y2="186" stroke="var(--info)"></line><line x1="222" y1="166" x2="218" y2="186" stroke="var(--info)"></line><line x1="240" y1="166" x2="236" y2="186" stroke="var(--info)"></line><line x1="258" y1="166" x2="254" y2="186" stroke="var(--info)"></line><line x1="276" y1="166" x2="272" y2="186" stroke="var(--info)"></line><line x1="294" y1="166" x2="290" y2="186" stroke="var(--info)"></line><line x1="312" y1="166" x2="308" y2="186" stroke="var(--info)"></line><text x="235" y="205" text-anchor="middle" font-size="11" class="muted-fill">steady rain, hours</text><text x="745" y="205" text-anchor="end" font-size="11" class="muted-fill">first cirrus ~12–24 h (≈ 500–1000 km) ahead</text><text x="10" y="232" font-size="14" font-weight="700">Cold front — steep slope, narrow band of intense weather</text><rect x="10" y="242" width="740" height="160" fill="var(--sky)"></rect><path d="M10,392 L10,300 Q200,300 330,392 Z" fill="var(--info)" opacity="0.25"></path><text x="60" y="380" font-size="12" font-weight="600">cold air pushes in underneath</text><line x1="60" y1="345" x2="220" y2="345" stroke="var(--info)" stroke-width="2.5" marker-end="url(#fc-b)"></line><text x="745" y="300" text-anchor="end" font-size="12" font-weight="600">warm, moist air forced up quickly</text><path d="M280,392 Q270,330 300,290 Q310,262 350,258 L420,258 Q380,266 390,290 Q410,330 400,392 Z" fill="var(--panel)" stroke="var(--muted)"></path><path d="M335,320 l-8,14 h8 l-10,18" stroke="var(--warn)" stroke-width="2.5" fill="none"></path><line x1="300" y1="376" x2="296" y2="400" stroke="var(--info)" stroke-width="2"></line><line x1="318" y1="376" x2="314" y2="400" stroke="var(--info)" stroke-width="2"></line><line x1="336" y1="376" x2="332" y2="400" stroke="var(--info)" stroke-width="2"></line><line x1="354" y1="376" x2="350" y2="400" stroke="var(--info)" stroke-width="2"></line><line x1="372" y1="376" x2="368" y2="400" stroke="var(--info)" stroke-width="2"></line><text x="340" y="252" text-anchor="middle" font-size="11">Cb line</text><ellipse cx="110" cy="275" rx="22" ry="9" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="170" cy="275" rx="22" ry="9" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="230" cy="275" rx="22" ry="9" fill="var(--panel)" stroke="var(--muted)"></ellipse><text x="170" y="262" text-anchor="middle" font-size="11">behind: Sc / Cu, clearing</text><text x="745" y="330" text-anchor="end" font-size="11" class="muted-fill">Ahead: wind backing, pressure falling</text><text x="745" y="348" text-anchor="end" font-size="11" class="muted-fill">At the front: gusts, heavy showers, thunder</text><text x="745" y="366" text-anchor="end" font-size="11" class="muted-fill">Behind: wind veers, temp drops, pressure rises</text><text x="745" y="384" text-anchor="end" font-size="10" class="muted-fill">(backing/veering as seen in the N. Hemisphere)</text></svg>
