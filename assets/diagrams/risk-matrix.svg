<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" class="diagram" viewBox="0 0 560 400" role="img" aria-label="Five by five risk matrix of likelihood versus consequence"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="105" y="325" text-anchor="end" font-size="12">Rare</text><text x="105" y="265" text-anchor="end" font-size="12">Unlikely</text><text x="105" y="205" text-anchor="end" font-size="12">Possible</text><text x="105" y="145" text-anchor="end" font-size="12">Likely</text><text x="105" y="85" text-anchor="end" font-size="12">Almost certain</text><text x="140" y="360" text-anchor="middle" font-size="12">Minor</text><text x="220" y="360" text-anchor="middle" font-size="12">Moderate</text><text x="300" y="360" text-anchor="middle" font-size="12">Serious</text><text x="380" y="360" text-anchor="middle" font-size="12">Critical</text><text x="460" y="360" text-anchor="middle" font-size="12">Catastrophic</text><g><rect x="102" y="292" width="76" height="56" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="140" y="325" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">1</text></g><g><rect x="182" y="292" width="76" height="56" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="220" y="325" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">2</text></g><g><rect x="262" y="292" width="76" height="56" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="300" y="325" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">3</text></g><g><rect x="342" y="292" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="380" y="325" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">4</text></g><g><rect x="422" y="292" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="460" y="325" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">5</text></g><g><rect x="102" y="232" width="76" height="56" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="140" y="265" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">2</text></g><g><rect x="182" y="232" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="220" y="265" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">4</text></g><g><rect x="262" y="232" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="300" y="265" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">6</text></g><g><rect x="342" y="232" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="380" y="265" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">8</text></g><g><rect x="422" y="232" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="460" y="265" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">10</text></g><g><rect x="102" y="172" width="76" height="56" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="140" y="205" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">3</text></g><g><rect x="182" y="172" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="220" y="205" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">6</text></g><g><rect x="262" y="172" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="300" y="205" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">9</text></g><g><rect x="342" y="172" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="380" y="205" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">12</text></g><g><rect x="422" y="172" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="460" y="205" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">15</text></g><g><rect x="102" y="112" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="140" y="145" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">4</text></g><g><rect x="182" y="112" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="220" y="145" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">8</text></g><g><rect x="262" y="112" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="300" y="145" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">12</text></g><g><rect x="342" y="112" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="380" y="145" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">16</text></g><g><rect x="422" y="112" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="460" y="145" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">20</text></g><g><rect x="102" y="52" width="76" height="56" rx="6" fill="var(--warn)" opacity="0.8"></rect><text x="140" y="85" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">5</text></g><g><rect x="182" y="52" width="76" height="56" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="220" y="85" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">10</text></g><g><rect x="262" y="52" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="300" y="85" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">15</text></g><g><rect x="342" y="52" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="380" y="85" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">20</text></g><g><rect x="422" y="52" width="76" height="56" rx="6" fill="var(--bad)" opacity="0.8"></rect><text x="460" y="85" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">25</text></g><text x="20" y="40" font-size="13" font-weight="700" transform="rotate(-90 20 180)">LIKELIHOOD →</text><text x="340" y="390" text-anchor="middle" font-size="13" font-weight="700">CONSEQUENCE →</text><text x="330" y="20" text-anchor="middle" font-size="12" class="muted-fill">Risk score = likelihood × consequence (1–25)</text></svg>
