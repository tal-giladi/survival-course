text></g><g><circle cx="210" cy="116.74" r="4" fill="var(--accent)"></circle><text x="216" y="110.74" font-size="10.5" text-anchor="start">AMS common above ~2,500 m (14.3 kPa)</text></g><g><circle cx="390" cy="167.39" r="4" fill="var(--accent)"></circle><text x="396" y="161.39" font-size="10.5" text-anchor="start">≈ half sea-level O₂ (9.3 kPa)</text></g><g><circle cx="590.94" cy="207.33" r="4" fill="var(--accent)"></circle><text x="584.94" y="201.33" font-size="10.5" text-anchor="end">Everest (5.3 kPa)</text></g><text x="320" y="302" text-anchor="middle" font-size="10" class="muted-fill">Standard atmosphere; real pressure is a little higher near the equator and in summer. The oxygen fraction stays 20.9 %.</text></svg>
