<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" class="diagram" viewBox="0 0 640 310" role="img" aria-label="Inspired oxygen partial pressure falls with altitude: roughly half of the sea-level value at 5,500 metres"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="150" y="40" width="120" height="220" fill="var(--warn)" opacity="0.1"></rect><text x="210" y="52" font-size="10.5" text-anchor="middle" style="fill:var(--warn)">high</text></g><g><rect x="270" y="40" width="120" height="220" fill="var(--accent-2)" opacity="0.1"></rect><text x="330" y="52" font-size="10.5" text-anchor="middle" style="fill:var(--accent-2)">very high</text></g><g><rect x="390" y="40" width="210" height="220" fill="var(--bad)" opacity="0.1"></rect><text x="495" y="52" font-size="10.5" text-anchor="middle" style="fill:var(--bad)">extreme</text></g><g><line x1="60" y1="260" x2="600" y2="260" stroke="var(--muted)"></line><line x1="60" y1="260" x2="60" y2="40" stroke="var(--muted)"></line><text x="330" y="289" font-size="11" text-anchor="middle" class="muted-fill">altitude (m)</text><text x="54" y="28" font-size="11" class="muted-fill">inspired PO₂ (kPa)</text></g><text x="54" y="264" font-size="10" t