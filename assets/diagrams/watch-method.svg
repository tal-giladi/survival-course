<svg xmlns="http://www.w3.org/2000/svg" width="640" height="344" class="diagram" viewBox="0 0 640 344" role="img" aria-label="Watch method for northern and southern hemispheres at 16:00 solar time"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="wm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><g><circle cx="160" cy="160" r="95" fill="var(--panel)" stroke="var(--text)" stroke-width="2"></circle><text x="160" y="81" font-size="11" text-anchor="middle">12</text><text x="201.5" y="92.11989148589159" font-size="11" text-anchor="middle">1</text><text x="231.8801085141084" y="122.5" font-size="11" text-anchor="middle">2</text><text x="243" y="164" font-size="11" text-anchor="middle">3</text><text x="231.88010851410843" y="205.49999999999997" font-size="11" text-anchor="middle">4</text><text x="201.5" y="235.88010851410843" font-size="11" text-anchor="middle">5</text><text x="160" y="247" font-size="11" text-anchor="middle">6</text><text x="118.5" y="235.8801085141084" font-size="11" text-anchor="middle">7</text><text x="88.1198914858916" y="205.50000000000003