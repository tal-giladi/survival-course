<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" class="diagram" viewBox="0 0 640 280" role="img" aria-label="A tippy tap: a drinks bottle hung from a cord between two sticks with a small hole in the cap; a foot loop or hand tilts it to pour a thin stream; soap on a string; a gravel soak-away catches the water"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="80" y1="40" x2="80" y2="250" stroke="var(--ground)" stroke-width="7"></line><line x1="300" y1="40" x2="300" y2="250" stroke="var(--ground)" stroke-width="7"></line><line x1="70" y1="45" x2="310" y2="45" stroke="var(--ground)" stroke-width="6"></line><line x1="190" y1="45" x2="190" y2="80" stroke="var(--accent)" stroke-width="2"></line><g transform="rotate(35 190 110)"><rect x="172" y="80" width="36" height="70" rx="10" fill="var(--info)" opacity="0.55" stroke="var(--text)"></rect><rect x="182" y="150" width="16" height="10" fill="var(--text)"></rect></g><path d="M 158 150 Q 150 180 152 210" fill="none" stroke="var(--sky)" stroke-width="2" stroke-dasharray="3 3"></path><line x1="120" y1="45" x2="120" y2="120" stroke="var(--accent)" stroke-width="1.5"></line><ellipse cx="120" cy="128" rx="12" ry="8" fill="var(--ok)"></ellipse><text x="100" y="150" font-size="10">soap</text><ellipse cx="160" cy="250" rx="70" ry="10" fill="var(--muted)" opacity="0.4"></ellipse><text x="100" y="272" font-size="10" class="muted-fill">gravel soak-away</text><text x="340" y="60" font-size="13" font-weight="700">Tippy tap</text><text x="340" y="90" font-size="12">1. Small hole in the cap (hot nail or knife point).</text><text x="340" y="112" font-size="12">2. Hang the bottle so a tilt pours a thin stream.</text><text x="340" y="134" font-size="12">3. Wet · soap · scrub ≥ 20 s (backs, thumbs, nails).</text><text x="340" y="156" font-size="12">4. Rinse in the stream · shake or air dry.</text><text x="340" y="178" font-size="12">5. Refill from the reserve; no hands inside it.</text><text x="340" y="200" font-size="12">Uses a fraction of a litre per wash.</text></svg>
