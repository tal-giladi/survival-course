<svg xmlns="http://www.w3.org/2000/svg" width="640" height="334" class="diagram" viewBox="0 0 640 334" role="img" aria-label="Wind chill temperature versus wind speed for five air temperatures, using the 2001 NWS formula"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" y1="280" x2="600" y2="280" stroke="var(--muted)"></line><line x1="60" y1="280" x2="60" y2="30" stroke="var(--muted)"></line><text x="330" y="309" font-size="11" text-anchor="middle" class="muted-fill">wind at 10 m (km/h)</text><text x="54" y="18" font-size="11" class="muted-fill">wind chill (°C)</text></g><g><line x1="60" x2="600" y1="280" y2="280" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="284" font-size="10" text-anchor="end" class="muted-fill">-50</text></g><g><line x1="60" x2="600" y1="238.33333333333334" y2="238.33333333333334" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="242.33333333333334" font-size="10" text-anchor="end" class="muted-fill">-40</text></g><g><line x1="60" x2="600" y1="196.66666666666669" y2="196.66666666666669" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="200.66666666666669" font-size="10" text-anchor="end" class="muted-fill">-30</text></g><g><line x1="60" x2="600" y1="155" y2="155" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="159" font-size="10" text-anchor="end" class="muted-fill">-20</text></g><g><line x1="60" x2="600" y1="113.33333333333334" y2="113.33333333333334" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="117.33333333333334" font-size="10" text-anchor="end" class="muted-fill">-10</text></g><g><line x1="60" x2="600" y1="71.66666666666666" y2="71.66666666666666" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="75.66666666666666" font-size="10" text-anchor="end" class="muted-fill">0</text></g><g><line x1="60" x2="600" y1="30" y2="30" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="34" font-size="10" text-anchor="end" class="muted-fill">10</text></g><text x="60" y="294" font-size="10" text-anchor="middle" class="muted-fill">5</text><text x="195" y="294" font-size="10" text-anchor="middle" class="muted-fill">20</text><text x="330" y="294" font-size="10" text-anchor="middle" class="muted-fill">35</text><text x="465" y="294" font-size="10" text-anchor="middle" class="muted-fill">50</text><rect x="60" y="280" width="540" height="-91.66666666666666" fill="var(--bad)" opacity="0.08"></rect><text x="596" y="267.5" font-size="10" text-anchor="end" style="fill:var(--bad)">−28 °C and below: exposed skin can freeze within 10–30 min, faster as it falls</text><g><path d="M60,54.65480884551167 L105,60.58985769948916 L150,64.37930293575948 L195,67.22101144786848 L240,69.5170739083114 L285,71.45490987078233 L330,73.1380112934356 L375,74.6299142415121 L420,75.97258540359189 L465,77.19527529677543 L510,78.31922998572364 L555,79.36039449333802 L600,80.33105776947107" fill="none" stroke="var(--ok)" stroke-width="2.4"></path><text x="604" y="84.33105776947107" font-size="11" style="fill:var(--ok)">5 °C</text></g><g><path d="M60,78.28926647919758 L105,85.47770913908832 L150,90.06742869556166 L195,93.50926366575388 L240,96.29022027563255 L285,98.63729829