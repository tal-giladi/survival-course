<svg xmlns="http://www.w3.org/2000/svg" width="640" height="334" class="diagram" viewBox="0 0 640 334" role="img" aria-label="Wind chill temperature versus wind speed for five air temperatures, using the 2001 NWS formula"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" y1="280" x2="600" y2="280" stroke="var(--muted)"></line><line x1="60" y1="280" x2="60" y2="30" stroke="var(--muted)"></line><text x="330" y="309" font-size="11" text-anchor="middle" class="muted-fill">wind at 10 m (km/h)</text><text x="54" y="18" font-size="11" class="muted-fill">wind chill (°C)</text></g><g><line x1="60" x2="600" y1="280" y2="280" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="284" font-size="10" text-anchor="end" class="muted-fill">-50</text></g><g><line x1="60" x2="600" y1="238.33" y2="238.33" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="242.33" font-size="10" text-anchor="end" class="muted-fill">-40</text></g><g><line x1="60" x2="600" y1="196.67" y2="196.67" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="200.67" font-size="10" text-anchor="end" class="muted-fill">-30</text></g><g><line x1="60" x2="600" y1="155" y2="155" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="159" font-size="10" text-anchor="end" class="muted-fill">-20</text></g><g><line x1="60" x2="600" y1="113.33" y2="113.33" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="117.33" font-size="10" text-anchor="end" class="muted-fill">-10</text></g><g><line x1="60" x2="600" y1="71.67" y2="71.67" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="75.67" font-size="10" text-anchor="end" class="muted-fill">0</text></g><g><line x1="60" x2="600" y1="30" y2="30" stroke="var(--line)" stroke-width="0.6"></line><text x="54" y="34" font-size="10" text-anchor="end" class="muted-fill">10</text></g><text x="60" y="294" font-size="10" text-anchor="middle" class="muted-fill">5</text><text x="195" y="294" font-size="10" text-anchor="middle" class="muted-fill">20</text><text x="330" y="294" font-size="10" text-anchor="middle" class="muted-fill">35</text><text x="465" y="294" font-size="10" text-anchor="middle" class="muted-fill">50</text><rect x="60" y="280" width="540" height="-91.67" fill="var(--bad)" opacity="0.08"></rect><text x="596" y="267.5" font-size="10" text-anchor="end" style="fill:var(--bad)">−28 °C and below: exposed skin can freeze within 10–30 min, faster as it falls</text><g><path d="M60,54.65 L105,60.59 L150,64.38 L195,67.22 L240,69.52 L285,71.45 L330,73.14 L375,74.63 L420,75.97 L465,77.2 L510,78.32 L555,79.36 L600,80.33" fill="none" stroke="var(--ok)" stroke-width="2.4"></path><text x="604" y="84.33" font-size="11" style="fill:var(--ok)">5 °C</text></g><g><path d="M60,78.29 L105,85.48 L150,90.07 L195,93.51 L240,96.29 L285,98.64 L330,100.68 L375,102.48 L420,104.11 L465,105.59 L510,106.95 L555,108.21 L600,109.39" fill="none" stroke="var(--info)" stroke-width="2.4"></path><text x="604" y="113.39" font-size="11" style="fill:var(--info)">0 °C</text></g><g><path d="M60,125.56 L105,135.25 L150,141.44 L195,146.09 L240,149.84 L285,153 L330,155.75 L375,158.19 L420,160.38 L465,162.38 L510,164.22 L555,165.92 L600,167.5" fill="none" stroke="var(--accent)" stroke-width="2.4"></path><text x="604" y="171.5" font-size="11" style="fill:var(--accent)">-10 °C</text></g><g><path d="M60,172.83 L105,185.03 L150,192.82 L195,198.66 L240,203.38 L285,207.37 L330,210.83 L375,213.89 L420,216.65 L465,219.17 L510,221.48 L555,223.62 L600,225.62" fill="none" stroke="var(--accent-2)" stroke-width="2.4"></path><text x="604" y="229.62" font-size="11" style="fill:var(--accent-2)">-20 °C</text></g><g><path d="M60,220.1 L105,234.8 L150,244.2 L195,251.24 L240,256.93 L285,261.73 L330,265.9 L375,269.6 L420,272.93 L465,275.96 L510,278.74 L555,281.32 L600,283.73" fill="none" stroke="var(--bad)" stroke-width="2.4"></path><text x="604" y="287.73" font-size="11" style="fill:var(--bad)">-30 °C</text></g><text x="320" y="328" text-anchor="middle" font-size="10" class="muted-fill">Wind chill describes bare-skin cooling. It cannot drop a wet object below the air temperature.</text></svg>
