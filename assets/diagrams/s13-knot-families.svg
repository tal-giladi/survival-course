<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" class="diagram" viewBox="0 0 660 300" role="img" aria-label="Knot families: stopper and loop knots are tied in the rope itself, hitches tie a rope to an object, bends join two ropes. Every knot is dressed, set, left with an adequate tail and checked"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="13" font-weight="700">Three families</text><rect x="20" y="36" width="200" height="150" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M40 120 C 80 60, 150 60, 150 110 C 150 150, 90 150, 100 110 C 110 80, 170 90, 200 120" fill="none" stroke="var(--accent)" stroke-width="6"></path><text x="120" y="168" text-anchor="middle" font-size="12" font-weight="700">Knot (stopper, loop)</text><text x="120" y="181" text-anchor="middle" font-size="10" class="muted-fill">in the rope itself</text><rect x="230" y="36" width="200" height="150" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="322" y="46" width="16" height="100" rx="4" fill="var(--ground)"></rect><path d="M250 70 L 322 80 M338 84 C 360 90, 360 104, 338 108 L322 110 M338 116 C 360 122, 360 132, 338 134 L 250 128" fill="none" stroke="var(--accent)" stroke-width="6"></path><text x="330" y="168" text-anchor="middle" font-size="12" font-weight="700">Hitch</text><text x="330" y="181" text-anchor="middle" font-size="10" class="muted-fill">rope to an object (or another rope)</text><rect x="440" y="36" width="200" height="150" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M455 100 L 535 100 C 560 100, 560 80, 540 82" fill="none" stroke="var(--accent)" stroke-width="6"></path><path d="M625 110 L 545 110 C 520 110, 520 128, 542 126" fill="none" stroke="var(--info)" stroke-width="6"></path><text x="540" y="168" text-anchor="middle" font-size="12" font-weight="700">Bend</text><text x="540" y="181" text-anchor="middle" font-size="10" class="muted-fill">joins two rope ends</text><text x="20" y="214" font-size="13" font-weight="700">Every time:</text><g><rect x="20" y="226" width="150" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="95" y="248" text-anchor="middle" font-size="12" font-weight="700">1. Dress</text><text x="95" y="264" text-anchor="middle" font-size="10" class="muted-fill">strands parallel</text></g><g><rect x="180" y="226" width="150" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="255" y="248" text-anchor="middle" font-size="12" font-weight="700">2. Set</text><text x="255" y="264" text-anchor="middle" font-size="10" class="muted-fill">pull every strand</text></g><g><rect x="340" y="226" width="150" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="415" y="248" text-anchor="middle" font-size="12" font-weight="700">3. Tail</text><text x="415" y="264" text-anchor="middle" font-size="10" class="muted-fill">long enough</text></g><g><rect x="500" y="226" width="150" height="50" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="575" y="248" text-anchor="middle" font-size="12" font-weight="700">4. Check</text><text x="575" y="264" text-anchor="middle" font-size="10" class="muted-fill">name it + partner</text></g><text x="20" y="294" font-size="10" class="muted-fill">Stylised shapes — learn the actual knots from an instructor or a reputable visual reference.</text></svg>
