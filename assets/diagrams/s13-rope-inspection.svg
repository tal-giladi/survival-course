<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" class="diagram" viewBox="0 0 660 300" role="img" aria-label="Rope inspection: run the whole rope through your hands, looking and feeling for core shots, flat or soft spots, stiff spots, glazing, heavy fuzz or cuts, and stains; when in doubt, retire it"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="13" font-weight="700">Inspect: every metre, through your hands, eyes on the sheath</text><path d="M20 70 C 140 40, 220 100, 330 70 S 520 40, 640 70" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round"></path><circle cx="80" cy="72" r="9" fill="none" stroke="var(--bad)" stroke-width="3"></circle><circle cx="180" cy="62" r="9" fill="none" stroke="var(--bad)" stroke-width="3"></circle><circle cx="280" cy="72" r="9" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><circle cx="380" cy="62" r="9" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><circle cx="480" cy="72" r="9" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><circle cx="580" cy="62" r="9" fill="none" stroke="var(--bad)" stroke-width="3"></circle><g><rect x="20" y="110" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="30" y="131" font-size="12" font-weight="700">1. Core shot</text><text x="30" y="148" font-size="10" class="muted-fill">white core visible through sheath</text></g><g><rect x="230" y="110" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="240" y="131" font-size="12" font-weight="700">2. Flat or soft spot</text><text x="240" y="148" font-size="10" class="muted-fill">core damaged or broken inside</text></g><g><rect x="440" y="110" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)"></rect><text x="450" y="131" font-size="12" font-weight="700">3. Stiff or lumpy spot</text><text x="450" y="148" font-size="10" class="muted-fill">heat, chemicals or crushing</text></g><g><rect x="20" y="172" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)"></rect><text x="30" y="193" font-size="12" font-weight="700">4. Glazed / shiny</text><text x="30" y="210" font-size="10" class="muted-fill">friction heat has melted fibres</text></g><g><rect x="230" y="172" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)"></rect><text x="240" y="193" font-size="12" font-weight="700">5. Heavy fuzz, cuts</text><text x="240" y="210" font-size="10" class="muted-fill">abrasion; sheath thinning</text></g><g><rect x="440" y="172" width="200" height="52" rx="8" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="450" y="193" font-size="12" font-weight="700">6. Stains, odd colour</text><text x="450" y="210" font-size="10" class="muted-fill">possible chemical contamination</text></g><text x="20" y="246" font-size="11">Also check the history: shock loads, contact with acids (e.g., battery acid),</text><text x="20" y="262" font-size="11">long UV exposure, age beyond the maker’s limit, unknown use.</text><text x="20" y="280" font-size="12" font-weight="700" style="fill:var(--bad)">Doubts about a life-safety rope? Retire it. It cannot be “partly trusted”.</text></svg>
