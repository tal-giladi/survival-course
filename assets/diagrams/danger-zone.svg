<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" class="diagram" viewBox="0 0 760 280" role="img" aria-label="Thermometer showing the food danger zone from 4 to 60 degrees Celsius and safe cooking temperatures"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="66" width="40" height="128.8" fill="var(--bad)" opacity="0.3"></rect><rect x="70" y="20" width="20" height="230" rx="10" fill="none" stroke="var(--text)" stroke-width="2"></rect><circle cx="80" cy="258" r="16" fill="var(--bad)"></circle><rect x="75" y="112" width="10" height="138" fill="var(--bad)"></rect><text x="30" y="130.4" font-size="12" font-weight="700" transform="rotate(-90 30 130.4)" text-anchor="middle" style="fill:var(--bad)">DANGER ZONE</text><g><line x1="92" x2="120" y1="33.80000000000001" y2="33.80000000000001" stroke="var(--ok)" stroke-width="2"></line><line x1="120" x2="150" y1="33.80000000000001" y2="26" stroke="var(--line)"></line><text x="156" y="30" font-size="12">74 °C / 165 °F — poultry, leftovers, wild game (CDC for Trichinella)</text></g><g><line x1="92" x2="120" y1="40.69999999999999" y2="40.69999999999999" stroke="var(--ok)" stroke-width="2"></line><line x1="120" x2="150" y1="40.69999999999999" y2="50" stroke="var(--line)"></line><text x="156" y="54" font-size="12">71 °C / 160 °F — minced meat</text></g><g><line x1="92" x2="120" y1="59.10000000000002" y2="59.10000000000002" stroke="var(--ok)" stroke-width="2"></line><line x1="120" x2="150" y1="59.10000000000002" y2="74" stroke="var(--line)"></line><text x="156" y="78" font-size="12">63 °C / 145 °F — whole cuts of beef/pork/lamb (+3 min rest), fish</text></g><g><line x1="92" x2="120" y1="66" y2="66" stroke="var(--accent-2)" stroke-width="2"></line><line x1="120" x2="150" y1="66" y2="110" stroke="var(--line)"></line><text x="156" y="114" font-size="12">60 °C / 140 °F — top of the danger zone: keep hot food above</text></g><g><line x1="92" x2="120" y1="194.8" y2="194.8" stroke="var(--info)" stroke-width="2"></line><line x1="120" x2="150" y1="194.8" y2="196" stroke="var(--line)"></line><text x="156" y="200" font-size="12">4 °C / 40 °F — bottom of the danger zone: keep cold food below</text></g><g><line x1="92" x2="120" y1="245.4" y2="245.4" stroke="var(--info)" stroke-width="2"></line><line x1="120" x2="150" y1="245.4" y2="238" stroke="var(--line)"></line><text x="156" y="242" font-size="12">−18 °C / 0 °F — freezer: growth stops (microbes survive)</text></g><text x="156" y="150" font-size="12" font-weight="700">In the danger zone, bacteria can double every ~20 minutes.</text><text x="156" y="168" font-size="11.5" class="muted-fill">Discard perishables left out &gt; 2 h (&gt; 1 h above 32 °C / 90 °F). Use a thermometer — colour lies.</text></svg>
