<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" class="diagram" viewBox="0 0 760 340" role="img" aria-label="Schematic of slab avalanche starting-zone frequency by slope angle, peaking near 38 degrees within the 30 to 45 degree band"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="225" y="40" width="165" height="220" fill="var(--bad)" opacity="0.12"></rect><text x="307.5" y="56" text-anchor="middle" font-size="12" font-weight="700">30°–45°: most slab avalanches start here</text><line x1="60" y1="260" x2="580" y2="260" stroke="var(--muted)" marker-end="url(#sa)"></line><line x1="60" y1="260" x2="60" y2="30" stroke="var(--muted)" marker-end="url(#sa)"></line><text x="115" y="278" text-anchor="middle" font-size="11" class="muted-fill">20°</text><text x="170" y="278" text-anchor="middle" font-size="11" class="muted-fill">25°</text><text x="225" y="278" text-anchor="middle" font-size="11" class="muted-fill">30°</text><text x="280" y="278" text-anchor="middle" font-size="11" class="muted-fill">35°</text><text x="335" y="278" text-anchor="middle" font-size="11" class="muted-fill">40°</text><text x="390" y="278" text-anchor="middle" font-size="11" class="muted-fill">45°</text><text x="445" y="278" text-anchor="middle" font-size="11" class="muted-fill">50°</text><text x="500" y="278" text-anchor="middle" font-size="11" class="muted-fill">55°</text><polyline points="60,259.99999516959014 71,259.9999786183168 82,259.9999114097122 93,259.99965642888037 104,259.99875280746465 115,259.99576223694146 126,259.98652197821474 137,259.9598762096567 148,259.88819426881787 159,259.7083832301754 170,259.2880536968538 181,258.373072130777 192,256.5200286111405 203,253.03262215439628 214,246.94282068279168 225,237.09577038565746 236,222.39303165998143 247,202.20273665804726 258,176.85568846860696 269,148.0448379469824 280,118.89512460815666 291,93.53373651107572 302,76.178308298437 313,70 324,76.178308298437 335,93.53373651107572 346,118.89512460815666 357,148.0448379469824 368,176.85568846860696 379,202.20273665804726 390,222.39303165998143 401,237.09577038565746 412,246.94282068279168 423,253.03262215439628 434,256.5200286111405 445,258.373072130777 456,259.2880536968538 467,259.7083832301754 478,259.88819426881787 489,259.9598762096567 500,259.98652197821474 511,259.99576223694146 522,259.99875280746465 533,259.99965642888037 544,259.9999114097122 555,259.9999786183168" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><text x="346" y="96" font-size="11">peak ≈ 35–40°</text><text x="20" y="150" font-size="11" transform="rotate(-90 20 150)">starting zones (schematic)</text><text x="320" y="300" text-anchor="middle" font-size="11" class="muted-fill">Below ~30° slabs rarely release — but you can still be hit by avalanches from steeper slopes above (runout zones).</text><g transform="translate(600,40)"><rect x="0" y="0" width="150" height="220" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="75" y="18" text-anchor="middle" font-size="11" font-weight="700">slope from a map</text><path d="M20,190 L130,190 L130,80 Z" fill="var(--ground)" opacity="0.5"></path><text x="75" y="206" text-anchor="middle" font-size="10">run (horizontal)</text><text x="138" y="140" font-size="10" transform="rotate(90 138 140)">rise</text><text x="50" y="178" font-size="11">θ</text><text x="75" y="48" text-anchor="middle" font-size="10.5">tan θ = rise ÷ run</text><text x="75" y="64" text-anchor="middle" font-size="10">0.58 → 30° · 1.0 → 45°</text></g></svg>
