<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" class="diagram" viewBox="0 0 760 340" role="img" aria-label="Schematic of slab avalanche starting-zone frequency by slope angle, peaking near 38 degrees within the 30 to 45 degree band"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="225" y="40" width="165" height="220" fill="var(--bad)" opacity="0.12"></rect><text x="307.5" y="56" text-anchor="middle" font-size="12" font-weight="700">30°–45°: most slab avalanches start here</text><line x1="60" y1="260" x2="580" y2="260" stroke="var(--muted)" marker-end="url(#sa)"></line><line x1="60" y1="260" x2="60" y2="30" stroke="var(--muted)" marker-end="url(#sa)"></line><text x="115" y="278" text-anchor="middle" font-size="11" class="muted-fill">20°</text><text x="170" y="278" text-anchor="middle" font-size="11" class="muted-fill">25°</text><text x="225" y="278" text-anchor="middle" font-size="11" class="muted-fill">30°</text><text x="280" y="278" text-anchor="middle" font-size="11" class="muted-fill">35°</text><text x="335" y="278" text-anchor="middle" font-size="11" class="muted-fill">40°</text><text x="390" y="278" text-anchor="middle" font-size="11" class="muted-fill">45°</text><text x="445" y="278" text-anchor="middle" font-size="11" class="muted-fill">50°</text><text x="500" y="278" text-anchor="middle" font-size="11" class="muted-fill">55°</text><polyline points="60,260 71,260 82,260 93,260 104,260 115,260 126,259.99 137,259.96 148,259.89 159,259.71 170,259.29 181,258.37 192,256.52 203,253.03 214,246.94 225,237.1 236,222.39 247,202.2 258,176.86 269,148.04 280,118.9 291,93.53 302,76.18 313,70 324,76.18 335,93.53 346,118.9 357,148.04 368,176.86 379,202.2 390,222.39 401,237.1 412,246.94 423,253.03 434,256.52 445,258.37 456,259.29 467,259.71 478,259.89 489,259.96 500,259.99 511,260 522,260 533,260 544,260 555,260" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><text x="346" y="96" font-size="11">peak ≈ 35–40°</text><text x="20" y="150" font-size="11" transform="rotate(-90 20 150)">starting zones (schematic)</text><text x="320" y="300" text-anchor="middle" font-size="11" class="muted-fill">Below ~30° slabs rarely release — but you can still be hit by avalanches from steeper slopes above (runout zones).</text><g transform="translate(600,40)"><rect x="0" y="0" width="150" height="220" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="75" y="18" text-anchor="middle" font-size="11" font-weight="700">slope from a map</text><path d="M20,190 L130,190 L130,80 Z" fill="var(--ground)" opacity="0.5"></path><text x="75" y="206" text-anchor="middle" font-size="10">run (horizontal)</text><text x="138" y="140" font-size="10" transform="rotate(90 138 140)">rise</text><text x="50" y="178" font-size="11">θ</text><text x="75" y="48" text-anchor="middle" font-size="10.5">tan θ = rise ÷ run</text><text x="75" y="64" text-anchor="middle" font-size="10">0.58 → 30° · 1.0 → 45°</text></g></svg>
