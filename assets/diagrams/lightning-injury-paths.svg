<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" class="diagram" viewBox="0 0 760 240" role="img" aria-label="Five ways lightning injures people: direct strike, side flash, ground current, contact and upward streamers"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="10" y="10" width="140" height="190" rx="6" fill="var(--sky)"></rect><rect x="10" y="170" width="140" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="80" y="222" text-anchor="middle" font-size="12" font-weight="700">Direct strike</text></g><g><rect x="160" y="10" width="140" height="190" rx="6" fill="var(--sky)"></rect><rect x="160" y="170" width="140" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="230" y="222" text-anchor="middle" font-size="12" font-weight="700">Side flash</text></g><g><rect x="310" y="10" width="140" height="190" rx="6" fill="var(--sky)"></rect><rect x="310" y="170" width="140" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="380" y="222" text-anchor="middle" font-size="12" font-weight="700">Ground current</text></g><g><rect x="460" y="10" width="140" height="190" rx="6" fill="var(--sky)"></rect><rect x="460" y="170" width="140" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="530" y="222" text-anchor="middle" font-size="12" font-weight="700">Contact</text></g><g><rect x="610" y="10" width="140" height="190" rx="6" fill="var(--sky)"></rect><rect x="610" y="170" width="140" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="680" y="222" text-anchor="middle" font-size="12" font-weight="700">Upward streamer</text></g><path d="M80,15 l-8,40 l10,0 l-8,65" stroke="var(--warn)" stroke-width="3" fill="none"></path><g><circle cx="76" cy="126" r="6" fill="var(--accent)"></circle><line x1="76" y1="132" x2="76" y2="154" stroke="var(--accent)" stroke-width="3"></line><line x1="76" y1="154" x2="70" y2="170" stroke="var(--accent)" stroke-width="3"></line><line x1="76" y1="154" x2="82" y2="170" stroke="var(--accent)" stroke-width="3"></line></g><rect x="190" y="60" width="8" height="110" fill="var(--ground)"></rect><circle cx="194" cy="60" r="28" fill="var(--ok)" opacity="0.6"></circle><path d="M194,15 l-4,30" stroke="var(--warn)" stroke-width="3"></path><path d="M198,100 l14,10 l-6,4 l14,10" stroke="var(--warn)" stroke-width="2.5" fill="none"></path><g><circle cx="232" cy="126" r="6" fill="var(--accent)"></circle><line x1="232" y1="132" x2="232" y2="154" stroke="var(--accent)" stroke-width="3"></line><line x1="232" y1="154" x2="226" y2="170" stroke="var(--accent)" stroke-width="3"></line><line x1="232" y1="154" x2="238" y2="170" stroke="var(--accent)" stroke-width="3"></line></g><path d="M352,15 l-6,40 l8,0 l-6,115" stroke="var(--warn)" stroke-width="3" fill="none"></path><ellipse cx="348" cy="180" rx="14" ry="5" fill="none" stroke="var(--warn)" stroke-dasharray="3 3"></ellipse><ellipse cx="348" cy="180" rx="28" ry="9" fill="none" stroke="var(--warn)" stroke-dasharray="3 3"></ellipse><ellipse cx="348" cy="180" rx="42" ry="13" fill="none" stroke="var(--warn)" stroke-dasharray="3 3"></ellipse><g><circle cx="398" cy="126" r="6" fill="var(--accent)"></circle><line x1="398" y1="132" x2="398" y2="154" stroke="var(--accent)" stroke-width="3"></line><line x1="398" y1="154" x2="392" y2="170" stroke="var(--accent)" stroke-width="3"></line><line x1="398" y1="154" x2="404" y2="170" stroke="var(--accent)" stroke-width="3"></line></g><text x="380" y="195" text-anchor="middle" font-size="9">step voltage</text><line x1="470" y1="110" x2="580" y2="110" stroke="var(--muted)" stroke-width="2"></line><line x1="470" y1="110" x2="470" y2="170" stroke="var(--ground)" stroke-width="3"></line><line x1="510" y1="110" x2="510" y2="170" stroke="var(--ground)" stroke-width="3"></line><line x1="550" y1="110" x2="550" y2="170" stroke="var(--ground)" stroke-width="3"></line><line x1="580" y1="110" x2="580" y2="170" stroke="var(--ground)" stroke-width="3"></line><path d="M475,15 l-6,40 l8,0 l-6,55" stroke="var(--warn)" stroke-width="3" fill="none"></path><g><circle cx="560" cy="126" r="6" fill="var(--accent)"></circle><line x1="560" y1="132" x2="560" y2="154" stroke="var(--accent)" stroke-width="3"></line><line x1="560" y1="154" x2="554" y2="170" stroke="var(--accent)" stroke-width="3"></line><line x1="560" y1="154" x2="566" y2="170" stroke="var(--accent)" stroke-width="3"></line></g><text x="520" y="100" text-anchor="middle" font-size="9">wire fence</text><path d="M680,15 l-8,30 l8,0 l-6,30" stroke="var(--warn)" stroke-width="3" fill="none"></path><path d="M676,120 l4,-14 l-4,-6 l6,-16" stroke="var(--warn)" stroke-width="1.5" fill="none" stroke-dasharray="2 2"></path><g><circle cx="676" cy="126" r="6" fill="var(--accent)"></circle><line x1="676" y1="132" x2="676" y2="154" stroke="var(--accent)" stroke-width="3"></line><line x1="676" y1="154" x2="670" y2="170" stroke="var(--accent)" stroke-width="3"></line><line x1="676" y1="154" x2="682" y2="170" stroke="var(--accent)" stroke-width="3"></line></g></svg>
