<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" class="diagram" viewBox="0 0 600 360" role="img" aria-label="Crescent Moon: lit side faces the Sun; the line through the horns extended to the horizon gives rough south"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="580" height="290" rx="8" fill="var(--panel-2)"></rect><g transform="translate(300,130) rotate(37.69)"><circle r="38" fill="var(--muted)" opacity="0.35"></circle><path d="M0,-38 A38,38 0 0 1 0,38 A20.9,38 0 0 0 0,-38 Z" fill="var(--warn)"></path></g><line x1="323.24" y1="99.93" x2="168.64" y2="300" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4"></line><line x1="300" y1="130" x2="500" y2="288" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="2 5"></line><text x="520" y="292" font-size="22" text-anchor="middle" style="fill:var(--warn)">☀</text><text x="520" y="266" font-size="10" text-anchor="middle" class="muted-fill">Sun (below horizon)</text><rect x="10" y="300" width="580" height="50" fill="var(--ground)" opacity="0.5"></rect><text x="168.64" y="326" font-size="12" text-anchor="middle" font-weight="800">▲ roughly SOUTH</text><text x="350" y="100" font-size="11" text-anchor="start">lit side faces the Sun</text><text x="20" y="344" font-size="10" text-anchor="start" class="muted-fill">Northern Hemisphere, mid-latitudes. A rough guide only (±15–30°); poor with a near-full or near-new Moon.</text></svg>
