<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" class="diagram" viewBox="0 0 740 280" role="img" aria-label="Improvised litter: two poles through jackets or a folded tarp, padding on top, patient packaged in a sleeping bag, six to eight carriers rotating"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="26" font-size="13" font-weight="700">Pole-and-tarp (or pole-and-jackets) litter</text><line x1="80" y1="110" x2="660" y2="110" stroke="var(--ground)" stroke-width="10" stroke-linecap="round"></line><line x1="80" y1="190" x2="660" y2="190" stroke="var(--ground)" stroke-width="10" stroke-linecap="round"></line><path d="M130,104 L610,104 L610,196 L130,196 Z" fill="var(--sky)" opacity="0.35" stroke="var(--info)" stroke-dasharray="6 4"></path><text x="370" y="98" text-anchor="middle" font-size="11">tarp folded around the poles in thirds — friction holds it</text><rect x="170" y="122" width="400" height="56" rx="26" fill="var(--accent-2)" opacity="0.55"></rect><text x="370" y="156" text-anchor="middle" font-size="12" style="fill:#fff">patient in sleeping bag on a pad</text><circle cx="100" cy="66" r="12" fill="var(--accent)" opacity="0.8"></circle><circle cx="100" cy="220" r="12" fill="var(--accent)" opacity="0.8"></circle><circle cx="370" cy="66" r="12" fill="var(--accent)" opacity="0.8"></circle><circle cx="370" cy="220" r="12" fill="var(--accent)" opacity="0.8"></circle><circle cx="640" cy="66" r="12" fill="var(--accent)" opacity="0.8"></circle><circle cx="640" cy="220" r="12" fill="var(--accent)" opacity="0.8"></circle><text x="370" y="246" text-anchor="middle" font-size="11" class="muted-fill">6 carriers + relief team; swap every few minutes; one leader calls lifts and steps</text><text x="370" y="264" text-anchor="middle" font-size="11" class="muted-fill">Test with a sandbag or rucksack at ground level first — never carry a real person over hazards to practise.</text></svg>
