<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" class="diagram" viewBox="0 0 660 270" role="img" aria-label="Cascading failure: a power cut takes down mobile networks after their backup batteries run out, water and sewage pumping, fuel pumps and card payments, traffic lights and lifts, refrigeration, heating and cooling, and strains hospitals"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><g><rect x="230" y="14" width="200" height="46" rx="8" fill="var(--bad)" stroke="var(--line)"></rect><text x="330" y="34" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">POWER FAILS</text><text x="330" y="50" text-anchor="middle" font-size="10" class="muted-fill">storm, heat, quake, grid fault</text></g><g><line x1="330" y1="60" x2="90" y2="110" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="20" y="110" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="90" y="130" text-anchor="middle" font-size="12" font-weight="700">Mobile network</text><text x="90" y="146" text-anchor="middle" font-size="10" class="muted-fill">backup batteries: hours</text></g></g><g><line x1="330" y1="60" x2="250" y2="110" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="180" y="110" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="250" y="130" text-anchor="middle" font-size="12" font-weight="700">Water pumping</text><text x="250" y="146" text-anchor="middle" font-size="10" class="muted-fill">pressure drops in hours</text></g></g><g><line x1="330" y1="60" x2="410" y2="110" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="340" y="110" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="410" y="130" text-anchor="middle" font-size="12" font-weight="700">Sewage pumping</text><text x="410" y="146" text-anchor="middle" font-size="10" class="muted-fill">backups, overflows</text></g></g><g><line x1="330" y1="60" x2="570" y2="110" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="500" y="110" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="570" y="130" text-anchor="middle" font-size="12" font-weight="700">Fuel pumps &amp; card payments</text><text x="570" y="146" text-anchor="middle" font-size="10" class="muted-fill">no fuel, cash only</text></g></g><g><line x1="330" y1="60" x2="90" y2="210" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="20" y="210" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="90" y="230" text-anchor="middle" font-size="12" font-weight="700">Traffic lights, lifts</text><text x="90" y="246" text-anchor="middle" font-size="10" class="muted-fill">jams, people trapped</text></g></g><g><line x1="330" y1="60" x2="250" y2="210" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="180" y="210" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="250" y="230" text-anchor="middle" font-size="12" font-weight="700">Refrigeration</text><text x="250" y="246" text-anchor="middle" font-size="10" class="muted-fill">food &amp; medicine spoil</text></g></g><g><line x1="330" y1="60" x2="410" y2="210" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="340" y="210" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="410" y="230" text-anchor="middle" font-size="12" font-weight="700">Heating &amp; cooling</text><text x="410" y="246" text-anchor="middle" font-size="10" class="muted-fill">even gas boilers need power</text></g></g><g><line x1="330" y1="60" x2="570" y2="210" stroke="var(--bad)" stroke-width="1.3" opacity="0.7" marker-end="url(#ic-a)"></line><g><rect x="500" y="210" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="570" y="230" text-anchor="middle" font-size="12" font-weight="700">Hospitals</text><text x="570" y="246" text-anchor="middle" font-size="10" class="muted-fill">on generators, stretched</text></g></g><text x="330" y="262" text-anchor="middle" font-size="11" class="muted-fill">Plan for the second-order failures: water, communication, cash, fuel, medicines.</text></svg>
