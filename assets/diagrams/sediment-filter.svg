<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" class="diagram" viewBox="0 0 700 310" role="img" aria-label="Improvised layered sediment filter in a cut bottle: cloth, sand, charcoal, sand, gravel; it clarifies water but does not make it safe to drink"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M200,40 L200,238 Q200,256 218,256 L302,256 Q320,256 320,238 L320,40" fill="none" stroke="var(--text)" stroke-width="2.5"></path><g><rect x="202" y="50" width="116" height="18" fill="var(--accent-2)" opacity="0.7"></rect><text x="335" y="63" font-size="12">Cloth (pre-filter)</text></g><g><rect x="202" y="68" width="116" height="60" fill="var(--warn-soft)" opacity="0.7"></rect><text x="335" y="102" font-size="12">Fine sand</text></g><g><rect x="202" y="128" width="116" height="34" fill="var(--text)" opacity="0.7"></rect><text x="335" y="149" font-size="12">Charcoal (not activated)</text></g><g><rect x="202" y="162" width="116" height="40" fill="var(--warn-soft)" opacity="0.7"></rect><text x="335" y="186" font-size="12">Fine sand</text></g><g><rect x="202" y="202" width="116" height="36" fill="var(--ground)" opacity="0.7"></rect><text x="335" y="224" font-size="12">Gravel</text></g><path d="M260,256 L260,284" stroke="var(--info)" stroke-width="4" stroke-dasharray="4 4"></path><text x="40" y="70" font-size="12">Muddy water in</text><text x="200" y="298" font-size="12">Clearer water out</text><g transform="translate(488,90)"><rect width="206" height="118" rx="8" fill="var(--bad-soft)" stroke="var(--bad)"></rect><text x="10" y="24" font-size="13" font-weight="700" style="fill:var(--bad)">Clarifies — does NOT purify</text><text x="10" y="46" font-size="11.5">Removes silt and some cysts;</text><text x="10" y="64" font-size="11.5">viruses and most bacteria pass.</text><text x="10" y="86" font-size="11.5">Always follow with boiling,</text><text x="10" y="104" font-size="11.5">chemical, UV or SODIS.</text></g></svg>
