ath><path d="M527,186 q2,-10 0,-18" stroke="var(--ok)" stroke-width="2" fill="none"></path><path d="M554,186 q2,-10 0,-18" stroke="var(--ok)" stroke-width="2" fill="none"></path><path d="M581,186 q2,-10 0,-18" stroke="var(--ok)" stroke-width="2" fill="none"></path><path d="M608,186 q2,-10 0,-18" stroke="var(--ok)" stroke-width="2" fill="none"></path><rect x="380" y="100" width="250" height="60" fill="var(--info)" opacity="0.08"></rect><line x1="400" y1="186" x2="610" y2="186" stroke="var(--accent)" stroke-width="2" marker-end="url(#dc-a)"></line><text x="505" y="204" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">stems bent and pressed the way the animal went</text><text x="380" y="236" text-anchor="start" font-size="11" font-weight="400">At dawn, a dark line through dewy grass</text><text x="380" y="252" text-anchor="start" font-size="11" font-weight="400">shows where dew was knocked off.</text><text x="380" y="276" text-anchor="start" font-size="11" font-weight="400" class="muted-fill">Stems spring back over hours; the lean fades.</text></svg>
