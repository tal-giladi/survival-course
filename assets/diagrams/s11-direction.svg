<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Direction of travel cues. Cross-section of a footprint: heel strike at the rear, weight rolls forward, the toe end is dug deepest and a ridge of soil is shoved up behind the toes at push-off. Plan view: grass stems bent and pressed in the direction of travel, and a dark dew-free line through wet grass."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="dc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><text x="20" y="26" text-anchor="start" font-size="13" font-weight="700">Cross-section of a print in soft soil</text><path d="M20,120 L110,120 Q120,121 126,138 L150,142 L230,146 Q250,150 262,164 Q272,168 280,150 L292,122 L340,120" fill="none" stroke="var(--ground)" stroke-width="3"></path><path d="M20,120 L110,120 Q120,121 126,138 L150,142 L230,146 Q250,150 262,164 Q272,168 280,150 L292,122 L340,120 L340,190 L20,190 Z" fill="var(--ground)" opacity="0.3"></path><path d="M236,146 q8,-12 16,0" fill="var(--ground)" opacity="0.8"></path><li