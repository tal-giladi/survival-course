<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" class="diagram" viewBox="0 0 760 250" role="img" aria-label="Flash-to-bang: seconds between lightning and thunder times 343 metres per second gives distance; about 3 seconds per kilometre"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="40" width="640" height="90" fill="var(--bad)" opacity="0.1"></rect><rect x="60" y="40" width="400" height="90" fill="var(--bad)" opacity="0.12"></rect><path d="M30,70 q10,-30 40,-20 q20,-20 40,0 q20,0 10,20 z" fill="var(--muted)"></path><path d="M60,72 l-6,14 h6 l-8,18" stroke="var(--warn)" stroke-width="3" fill="none"></path><line x1="60" y1="140" x2="740" y2="140" stroke="var(--muted)"></line><g><line x1="60" x2="60" y1="136" y2="146" stroke="var(--muted)"></line><text x="60" y="162" text-anchor="middle" font-size="11">0 km</text><text x="60" y="180" text-anchor="middle" font-size="11" class="muted-fill">0 s</text></g><g><line x1="100" x2="100" y1="136" y2="146" stroke="var(--muted)"></line><text x="100" y="162" text-anchor="middle" font-size="11">1 km</text><text x="100" y="180" text-anchor="middle" font-size="11" class="muted-fill">3 s</text></g><g><line x1="140" x2="140" y1="136" y2="146" stroke="var(--muted)"></line><text x="140" y="162" text-anchor="middle" font-size="11">2 km</text><text x="140" y="180" text-anchor="middle" font-size="11" class="muted-fill">6 s</text></g><g><line x1="180" x2="180" y1="136" y2="146" stroke="var(--muted)"></line><text x="180" y="162" text-anchor="middle" font-size="11">3 km</text><text x="180" y="180" text-anchor="middle" font-size="11" class="muted-fill">9 s</text></g><g><line x1="260" x2="260" y1="136" y2="146" stroke="var(--muted)"></line><text x="260" y="162" text-anchor="middle" font-size="11">5 km</text><text x="260" y="180" text-anchor="middle" font-size="11" class="muted-fill">15 s</text></g><g><line x1="380" x2="380" y1="136" y2="146" stroke="var(--muted)"></line><text x="380" y="162" text-anchor="middle" font-size="11">8 km</text><text x="380" y="180" text-anchor="middle" font-size="11" class="muted-fill">23 s</text></g><g><line x1="460" x2="460" y1="136" y2="146" stroke="var(--muted)"></line><text x="460" y="162" text-anchor="middle" font-size="11">10 km</text><text x="460" y="180" text-anchor="middle" font-size="11" class="muted-fill">29 s</text></g><g><line x1="540" x2="540" y1="136" y2="146" stroke="var(--muted)"></line><text x="540" y="162" text-anchor="middle" font-size="11">12 km</text><text x="540" y="180" text-anchor="middle" font-size="11" class="muted-fill">35 s</text></g><g><line x1="700" x2="700" y1="136" y2="146" stroke="var(--muted)"></line><text x="700" y="162" text-anchor="middle" font-size="11">16 km</text><text x="700" y="180" text-anchor="middle" font-size="11" class="muted-fill">47 s</text></g><circle cx="224" cy="118" r="6" fill="var(--accent)"></circle><line x1="224" y1="124" x2="224" y2="134" stroke="var(--accent)" stroke-width="2"></line><text x="224" y="104" text-anchor="middle" font-size="11" font-weight="700">you: 12 s → 12 × 343 m ≈ 4.1 km</text><text x="454" y="60" text-anchor="end" font-size="11.5" font-weight="700">≈ 10 km: “30-second” mark (old 30-30 rule)</text><text x="580" y="85" text-anchor="middle" font-size="11.5" font-weight="700">lightning can strike ~16 km (10 mi) from the storm</text><text x="380" y="208" text-anchor="middle" font-size="12" font-weight="600">distance (m) = 343 × seconds · ≈ 3 s per km · ≈ 5 s per mile</text><text x="380" y="230" text-anchor="middle" font-size="11" class="muted-fill">If you can hear thunder, you are within striking distance. Wait 30 minutes after the last thunder before going back out.</text></svg>
