<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" class="diagram" viewBox="0 0 640 400" role="img" aria-label="Lost-person strategies around the initial planning point"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="ls2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="ls3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><circle cx="320" cy="200" r="60" fill="none" stroke="var(--line)" stroke-dasharray="4 5"></circle><circle cx="320" cy="200" r="120" fill="none" stroke="var(--line)" stroke-dasharray="4 5"></circle><circle cx="320" cy="200" r="180" fill="none" stroke="var(--line)" stroke-dasharray="4 5"></circle><circle cx="320" cy="200" r="8" fill="var(--accent)"></circle><text x="332" y="204" font-size="12" text-anchor="start" font-weight="800">IPP / last known point</text><text x="334" y="224" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--ok)">Staying put — the search stops growing</text><path d="M140,350 C200,300 260,260 310,210" fill="none" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#ls)"></path><text x="20" y="370" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--accent-2)">Backtracking to a known point</text><path d="M320,200 L380,110 L450,60 L550,40" fill="none" stroke="var(--info)" stroke-width="2" marker-end="url(#ls2)"></path><text x="440" y="30" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--info)">Route / direction travel</text><path d="M320,200 L296.0585899672032,265.7784834550136" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="3 3"></path><path d="M320,200 L259.3782217350893,235.00000000000003" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="3 3"></path><path d="M320,200 L251.06345728914545,187.8446275633149" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="3 3"></path><path d="M320,200 L275.00486732194224,146.37688898167156" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="3 3"></path><text x="20" y="160" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--accent)">Direction sampling: short out-and-backs</text><text x="20" y="175" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--accent)">from a fixed anchor</text><path d="M320,200 L470,260" stroke="var(--muted)" stroke-width="2"></path><path d="M470,280 l20,-40 l20,40 z" fill="var(--ground)" opacity="0.7"></path><text x="430" y="315" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--muted)">View enhancing (safe high ground)</text><path d="M320,200 q-20,-40 20,-60 q40,-20 10,-60 q-30,-40 -70,-10 q-40,30 -80,-10" fill="none" stroke="var(--warn)" stroke-width="1.8"></path><text x="90" y="50" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--warn)">Random traversing — most costly</text><path d="M330,210 C360,280 340,340 380,385" fill="none" stroke="var(--bad)" stroke-width="2" marker-end="url(#ls3)"></path><text x="390" y="385" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--bad)">Following drainages downhill — gorge risk</text></svg>
