<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="diagram" viewBox="0 0 640 250" role="img" aria-label="Folded bark container: an ellipse is scored across the grain, the ends fold up along the score and are pinned; the grain must run around the container, not up it"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><text x="20" y="22" font-size="13" font-weight="700">1. Cut a rectangle, grain running lengthwise</text><rect x="30" y="40" width="260" height="120" rx="6" fill="var(--accent-2)" opacity="0.3" stroke="var(--line)"></rect><line x1="40" y1="52" x2="280" y2="52" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><line x1="40" y1="71" x2="280" y2="71" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><line x1="40" y1="90" x2="280" y2="90" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><line x1="40" y1="109" x2="280" y2="109" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><line x1="40" y1="128" x2="280" y2="128" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><line x1="40" y1="147" x2="280" y2="147" stroke="var(--ground)" stroke-width="1" opacity="0.6"></line><ellipse cx="160" cy="100" rx="40" ry="55" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 4"></ellipse><line x1="40" y1="175" x2="280" y2="175" stroke="var(--info)" stroke-width="2" marker-end="url(#s7bc)"></line><text x="160" y="195" text-anchor="middle" font-size="11" style="fill:var(--info)">grain (fibers) — bark bends easily across it, splits along it</text><text x="160" y="214" text-anchor="middle" font-size="11">score the lens shape on the inner face only</text><text x="360" y="22" font-size="13" font-weight="700">2. Fold the ends up along the score</text><path d="M380,190 Q470,210 560,190 L600,90 Q470,120 340,90 Z" fill="var(--accent-2)" opacity="0.35" stroke="var(--line)"></path><path d="M340,90 Q470,120 600,90" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 4"></path><path d="M340,90 L330,60 M600,90 L610,60" stroke="var(--ground)" stroke-width="3"></path><rect x="315" y="55" width="30" height="45" rx="4" fill="none" stroke="var(--text)" stroke-width="1.5"></rect><rect x="595" y="55" width="30" height="45" rx="4" fill="none" stroke="var(--text)" stroke-width="1.5"></rect><text x="470" y="236" text-anchor="middle" font-size="11">pin the folded ends with split sticks; add a rim hoop for stiffness</text><text x="470" y="216" text-anchor="middle" font-size="11" class="muted-fill">the lens score lets the base stay flat as the sides rise</text></svg>
