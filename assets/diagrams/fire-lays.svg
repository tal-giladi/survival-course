<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Six fire lays: teepee, log cabin, lean-to, star, long log, Dakota hole"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g transform="translate(10,5)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Teepee</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g stroke="var(--ground)" stroke-linecap="round" stroke-width="4"><path d="M90,116 Q92,96 100,84 Q108,96 110,116 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="70" y1="117" x2="100" y2="50"></line><line x1="130" y1="117" x2="100" y2="50"></line><line x1="88" y1="117" x2="100" y2="52"></line><line x1="112" y1="117" x2="100" y2="52"></line></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">fast start · tall flame · signal</text></g><g transform="translate(220,5)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Log cabin</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g stroke="var(--ground)" stroke-linecap="round" stroke-width="7"><path d="M92,112 Q93.6,96 100,86.4 Q106.4,96 108,112 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="55" y1="112" x2="145" y2="112"></line><line x1="60" y1="98" x2="140" y2="98"></line><line x1="55" y1="84" x2="145" y2="84"></line><line x1="60" y1="70" x2="140" y2="70"></line></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">stable pot platform · coal bed</text></g><g transform="translate(430,5)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Lean-to</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g stroke="var(--ground)" stroke-linecap="round"><line x1="40" y1="108" x2="160" y2="108" stroke-width="14"></line><path d="M85,116 Q87,96 95,84 Q103,96 105,116 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="70" y1="117" x2="120" y2="72" stroke-width="4"></line><line x1="95" y1="117" x2="140" y2="78" stroke-width="4"></line></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">wind shield · quick</text></g><g transform="translate(10,170)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Star</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g stroke="var(--ground)" stroke-linecap="round" stroke-width="8"><path d="M94,110 Q95.2,98 100,90.8 Q104.8,98 106,110 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="20" y1="113" x2="88" y2="108"></line><line x1="180" y1="113" x2="112" y2="108"></line><line x1="50" y1="100" x2="92" y2="104" stroke-width="6"></line><line x1="150" y1="100" x2="108" y2="104" stroke-width="6"></line></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">slow, fuel-thrifty · cooking</text></g><g transform="translate(220,170)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Long log</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g stroke="var(--ground)" stroke-linecap="round"><line x1="20" y1="110" x2="180" y2="110" stroke-width="14"></line><line x1="20" y1="94" x2="180" y2="94" stroke-width="14"></line><path d="M30,88 Q60,60 90,85 Q120,58 150,85 Q165,70 175,88 Z" fill="var(--accent-2)" opacity="0.7" stroke="none"></path></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">overnight warmth along your body</text></g><g transform="translate(430,170)"><rect x="0" y="0" width="200" height="150" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="18" text-anchor="middle" font-size="12.5" font-weight="700">Dakota hole</text><line x1="10" y1="118" x2="190" y2="118" stroke="var(--ground)" stroke-width="2"></line><g><rect x="10" y="80" width="180" height="38" fill="var(--ground)" opacity="0.3"></rect><path d="M68,80 L73,116 L107,116 L112,80 Z" fill="var(--panel-2)" stroke="var(--ground)" stroke-width="2"></path><path d="M80,114 Q88,92 90,70 Q96,92 100,114 Z" fill="var(--accent-2)" opacity="0.85"></path><line x1="150" y1="80" x2="108" y2="112" stroke="var(--panel-2)" stroke-width="7"></line><text x="150" y="74" font-size="9" class="muted-fill">air tunnel</text></g><text x="100" y="138" text-anchor="middle" font-size="10" class="muted-fill">low light, low smoke, fuel-efficient</text></g></svg>
