<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="312" class="diagram" viewBox="0 0 640 312" role="img" aria-label="Aiming directly at a river junction versus aiming off to one side"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"></path></marker></defs><g><rect x="6" y="6" width="308" height="300" rx="8" fill="var(--panel-2)"></rect><text x="20" y="28" font-size="12" text-anchor="start" font-weight="700">Aim straight at the junction</text><line x1="10" x2="310" y1="70" y2="70" stroke="var(--info)" stroke-width="5"></line><line x1="160" x2="180" y1="70" y2="40" stroke="var(--info)" stroke-width="3"></line><circle cx="160" cy="70" r="8" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><text x="186" y="60" font-size="11" text-anchor="start" style="fill:var(--accent-2)">junction</text><path d="M160,280 L125,72 L195,72 Z" fill="var(--bad)" opacity="0.15"></path><line x1="160" y1="280" x2="160" y2="74" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"></line><circle cx="160" cy="280" r="6" fill="var(--text)"></circle><g><text x="100" y="104" font-size="22" text-anchor="start" font-weight="800" style="fill:var(--bad)">? ←  → ?</text><text x="20" y="136" font-size="11" text-anchor="start" class="muted-fill">error cone straddles the junction</text></g></g><g><rect x="326" y="6" width="308" height="300" rx="8" fill="var(--panel-2)"></rect><text x="340" y="28" font-size="12" text-anchor="start" font-weight="700">Aim off to the left</text><line x1="330" x2="630" y1="70" y2="70" stroke="var(--info)" stroke-width="5"></line><line x1="480" x2="500" y1="70" y2="40" stroke="var(--info)" stroke-width="3"></line><circle cx="480" cy="70" r="8" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><text x="506" y="60" font-size="11" text-anchor="start" style="fill:var(--accent-2)">junction</text><path d="M480,280 L375,72 L445,72 Z" fill="var(--ok)" opacity="0.15"></path><line x1="480" y1="280" x2="410" y2="74" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"></line><circle cx="480" cy="280" r="6" fill="var(--text)"></circle><g><path d="M414,82 L466,82" stroke="var(--ok)" stroke-width="3" marker-end="url(#ao)"></path><text x="340" y="120" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--ok)">Hit the river → turn RIGHT</text><text x="340" y="136" font-size="11" text-anchor="start" class="muted-fill">error cone lies wholly left of the junction</text></g></g></svg>
