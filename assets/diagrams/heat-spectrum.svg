<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="250" class="diagram" viewBox="0 0 740 250" role="img" aria-label="Heat illness spectrum: cramps and syncope, heat exhaustion, heat stroke; and exercise-associated hyponatraemia as a look-alike"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><linearGradient id="hs-g" x1="0" x2="1"><stop offset="0" stop-color="var(--ok)"></stop><stop offset="1" stop-color="var(--bad)"></stop></linearGradient></defs><rect x="20" y="40" width="540" height="14" rx="7" fill="url(#hs-g)" opacity="0.7"></rect><text x="20" y="30" font-size="12" font-weight="700">Mental status is the dividing line</text><g><rect x="20" y="70" width="170" height="130" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="30" y="92" font-size="12" font-weight="700">Cramps / fainting</text><text x="30" y="112" font-size="10.5" class="muted-fill">mind normal</text><text x="30" y="128" font-size="10.5" class="muted-fill">rest, shade</text><text x="30" y="144" font-size="10.5" class="muted-fill">fluids + salt</text></g><g><rect x="200" y="70" width="170" height="130" rx="8" fill="var(--panel-2)" stroke="var(--warn)" stroke-width="2"></rect><text x="210" y="92" font-size="12" font-weight="700">Heat exhaustion</text><text x="210" y="112" font-size="10.5" class="muted-fill">weak, dizzy, headache</text><text x="210" y="128" font-size="10.5" class="muted-fill">mind normal</text><text x="210" y="144" font-size="10.5" class="muted-fill">rest, cool, drink</text><text x="210" y="160" font-size="10.5" class="muted-fill">better in ~30 min</text></g><g><rect x="380" y="70" width="170" height="130" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="390" y="92" font-size="12" font-weight="700">Heat stroke</text><text x="390" y="112" font-size="10.5" class="muted-fill">hot + ALTERED MIND</text><text x="390" y="128" font-size="10.5" class="muted-fill">COOL FIRST</text><text x="390" y="144" font-size="10.5" class="muted-fill">(immersion best)</text><text x="390" y="160" font-size="10.5" class="muted-fill">transport second</text></g><g><rect x="580" y="70" width="150" height="130" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="2"></rect><text x="590" y="92" font-size="12" font-weight="700">Hyponatraemia</text><text x="590" y="112" font-size="10.5" class="muted-fill">altered mind</text><text x="590" y="128" font-size="10.5" class="muted-fill">normal temperature</text><text x="590" y="144" font-size="10.5" class="muted-fill">drank lots of water</text><text x="590" y="160" font-size="10.5" class="muted-fill">no more water</text><text x="590" y="176" font-size="10.5" class="muted-fill">evacuate</text></g><text x="580" y="60" font-size="11" class="muted-fill">look-alike</text><text x="20" y="232" font-size="11" class="muted-fill">Heat stroke: cold-water immersion is best; otherwise soak and fan continuously; stop at ~38.5 °C (WMS 2024).</text></svg>
