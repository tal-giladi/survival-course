<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="diagram" viewBox="0 0 640 250" role="img" aria-label="Trip plan timeline: depart at 07:00 with a plan left with a contact, check in at the fuel stop at 11:00, expected arrival 15:00, and an agreed alarm time of 18:00 when the contact calls the police with the route, vehicle and people"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><line x1="40" y1="90" x2="610" y2="90" stroke="var(--line)" stroke-width="3" marker-end="url(#tp-a)"></line><g><circle cx="60" cy="90" r="9" fill="var(--accent)"></circle><text x="60" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">07:00</text><text x="60" y="118" text-anchor="middle" font-size="11" fill="var(--text)">Depart; plan left</text></g><g><circle cx="230" cy="90" r="9" fill="var(--accent)"></circle><text x="230" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">11:00</text><text x="230" y="118" text-anchor="middle" font-size="11" fill="var(--text)">Fuel + check-in text</text></g><g><circle cx="400" cy="90" r="9" fill="var(--ok)"></circle><text x="400" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">15:00</text><text x="400" y="118" text-anchor="middle" font-size="11" fill="var(--text)">Expected arrival</text></g><g><circle cx="560" cy="90" r="9" fill="var(--bad)"></circle><text x="560" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">18:00</text><text x="560" y="118" text-anchor="middle" font-size="11" fill="var(--text)">Alarm time</text></g><rect x="400" y="80" width="160" height="20" fill="var(--accent-2)" opacity="0.18"></rect><text x="480" y="140" text-anchor="middle" font-size="10" class="muted-fill">grace period</text><g><rect x="40" y="160" width="270" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="175" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">The plan says</text><text x="175" y="208" text-anchor="middle" font-size="10" class="muted-fill">route + alternatives · vehicle, colour, plate · people · kit</text></g><g><rect x="330" y="160" width="280" height="70" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="470" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">At the alarm time, the contact…</text><text x="470" y="208" text-anchor="middle" font-size="10" class="muted-fill">calls police/SAR with the plan — does not wait</text></g></svg>
