<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="diagram" viewBox="0 0 700 300" role="img" aria-label="Haemorrhage classes: heart rate climbs early; blood pressure holds until about 30 percent of blood volume is lost, then falls"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="70" y="40" width="174" height="210" fill="var(--ok)" opacity="0.12"></rect><text x="157" y="58" text-anchor="middle" font-size="13" font-weight="700">Class I</text><text x="157" y="74" text-anchor="middle" font-size="10.5" class="muted-fill">&lt; 15 %</text></g><g><rect x="244" y="40" width="174" height="210" fill="var(--warn)" opacity="0.12"></rect><text x="331" y="58" text-anchor="middle" font-size="13" font-weight="700">Class II</text><text x="331" y="74" text-anchor="middle" font-size="10.5" class="muted-fill">15–30 %</text></g><g><rect x="418" y="40" width="116" height="210" fill="var(--accent-2)" opacity="0.12"></rect><text x="476" y="58" text-anchor="middle" font-size="13" font-weight="700">Class III</text><text x="476" y="74" text-anchor="middle" font-size="10.5" class="muted-fill">30–40 %</text></g><g><rect x="534" y="40" width="116" height="210" fill="var(--bad)" opacity="0.12"></rect><text x="592" y="58" text-anchor="middle" font-size="13" font-weight="700">Class IV</text><text x="592" y="74" text-anchor="middle" font-size="10.5" class="muted-fill">&gt; 40 %</text></g><polyline points="70,214 244,174 418,126 534,90 650,60" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><polyline points="70,126 244,130 418,150 534,194 650,238" fill="none" stroke="var(--info)" stroke-width="3" stroke-dasharray="7 4"></polyline><text x="104.8" y="174" font-size="12" fill="var(--bad)" font-weight="700">heart rate</text><text x="545.5999999999999" y="222" font-size="12" fill="var(--info)" font-weight="700">systolic BP</text><line x1="70" x2="650" y1="250" y2="250" stroke="var(--line)"></line><text x="70" y="268" text-anchor="middle" font-size="11" class="muted-fill">0%</text><text x="186" y="268" text-anchor="middle" font-size="11" class="muted-fill">10%</text><text x="302" y="268" text-anchor="middle" font-size="11" class="muted-fill">20%</text><text x="418" y="268" text-anchor="middle" font-size="11" class="muted-fill">30%</text><text x="534" y="268" text-anchor="middle" font-size="11" class="muted-fill">40%</text><text x="650" y="268" text-anchor="middle" font-size="11" class="muted-fill">50%</text><text x="360" y="290" text-anchor="middle" font-size="11" class="muted-fill">fraction of blood volume lost (70 kg adult ≈ 4.9 L)</text><text x="20" y="24" font-size="12" font-weight="700">Compensation hides blood loss: pulse rises early; falling BP and confusion come late.</text></svg>
