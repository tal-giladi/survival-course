<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" class="diagram" viewBox="0 0 640 320" role="img" aria-label="Eight major track families: dog family with four toes and claws; cat family with four toes and no claws; weasel family with five toes and a C-shaped pad; bears with five toes and a very wide pad; hoofed animals with two hoof halves; rabbits and hares with furry prints and long hind feet; birds with three forward toes; humans with heel, ball and tread."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="10" y="10" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(84 68) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><g><ellipse cx="-16.2" cy="-7.2" rx="6" ry="7.8"></ellipse><ellipse cx="-17.01" cy="-18.6" rx="1.8" ry="2.4"></ellipse></g><g><ellipse cx="16.2" cy="-7.2" rx="6" ry="7.8"></ellipse><ellipse cx="17.01" cy="-18.6" rx="1.8" ry="2.4"></ellipse></g><g><ellipse cx="-6.6" cy="-21.6" rx="6" ry="7.8"></ellipse><ellipse cx="-6.93" cy="-33" rx="1.8" ry="2.4"></ellipse></g><g><ellipse cx="6.6" cy="-21.6" rx="6" ry="7.8"></ellipse><ellipse cx="6.93" cy="-33" rx="1.8" ry="2.4"></ellipse></g><path d="M-12,18 Q0,1.2 12,18 Q7.2,26.4 0,24 Q-7.2,26.4 -12,18 Z"></path></g></g><text x="84" y="124" text-anchor="middle" font-size="12" font-weight="700">Dog family</text><text x="84" y="140" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">4 toes · claws · oval</text></g><g><rect x="167" y="10" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(241 68) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><ellipse cx="-20.4" cy="-2.4" rx="6" ry="7.2"></ellipse><ellipse cx="-7.8" cy="-16.8" rx="6" ry="7.2"></ellipse><ellipse cx="7.8" cy="-24" rx="6" ry="7.2"></ellipse><ellipse cx="21" cy="-7.2" rx="6" ry="7.2"></ellipse><path d="M-16.2,16.8 Q-13.2,3.6 0,3.6 Q13.2,3.6 16.2,16.8 Q14.4,26.4 7.8,22.8 Q3.6,27.6 0,22.8 Q-3.6,27.6 -7.8,22.8 Q-14.4,26.4 -16.2,16.8 Z"></path></g></g><text x="241" y="124" text-anchor="middle" font-size="12" font-weight="700">Cat family</text><text x="241" y="140" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">4 toes · no claws · round</text></g><g><rect x="324" y="10" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(398 68) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><ellipse cx="-21.6" cy="-4.8" rx="4.2" ry="5.4"></ellipse><ellipse cx="-12" cy="-18" rx="4.2" ry="5.4"></ellipse><ellipse cx="0" cy="-22.8" rx="4.2" ry="5.4"></ellipse><ellipse cx="12" cy="-18" rx="4.2" ry="5.4"></ellipse><ellipse cx="21.6" cy="-4.8" rx="4.2" ry="5.4"></ellipse><path d="M-18,8.4 Q0,-7.2 18,8.4 L12,14.4 Q0,3.6 -12,14.4 Z"></path></g></g><text x="398" y="124" text-anchor="middle" font-size="12" font-weight="700">Weasel family</text><text x="398" y="140" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">5 toes · C-shaped pad</text></g><g><rect x="481" y="10" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(555 68) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><ellipse cx="-20.4" cy="-12" rx="4.8" ry="5.4"></ellipse><ellipse cx="-10.8" cy="-19.2" rx="4.8" ry="5.4"></ellipse><ellipse cx="0" cy="-21.6" rx="4.8" ry="5.4"></ellipse><ellipse cx="10.8" cy="-19.2" rx="4.8" ry="5.4"></ellipse><ellipse cx="20.4" cy="-12" rx="4.8" ry="5.4"></ellipse><path d="M-21.6,-4.8 Q0,-10.8 21.6,-4.8 L14.4,27.6 Q0,31.2 -12,27.6 Z"></path></g></g><text x="555" y="124" text-anchor="middle" font-size="12" font-weight="700">Bears</text><text x="555" y="140" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">5 toes · very wide pad</text></g><g><rect x="10" y="162" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(84 220) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><path d="M-2.4,-30 Q-20.4,-7.2 -14.4,25.2 L-2.4,25.2 Z"></path><path d="M2.4,-30 Q20.4,-7.2 14.4,25.2 L2.4,25.2 Z"></path></g></g><text x="84" y="276" text-anchor="middle" font-size="12" font-weight="700">Hoofed animals</text><text x="84" y="292" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">2 hoof halves</text></g><g><rect x="167" y="162" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(241 220) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="1.4" opacity="0.6"><ellipse cx="0" cy="0" rx="13.2" ry="33" stroke-dasharray="2 2"></ellipse></g><text x="241" y="276" text-anchor="middle" font-size="12" font-weight="700">Rabbits and hares</text><text x="241" y="292" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">furry · long hind feet</text></g><g><rect x="324" y="162" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(398 220) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g stroke-linecap="round"><path d="M0,15 L-21.6,-18 Q0,-10.8 21.6,-18 Z" opacity="0.35"></path><path d="M0,15 L-21.6,-18 M0,15 L0,-30 M0,15 L21.6,-18 M0,15 L0,21.6" fill="none" stroke-width="4.2"></path></g></g><text x="398" y="276" text-anchor="middle" font-size="12" font-weight="700">Birds</text><text x="398" y="292" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">3 forward toes (+1 back)</text></g><g><rect x="481" y="162" width="148" height="142" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g transform="translate(555 220) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><path d="M-3,-30 Q-12,-28.8 -11.4,-15 Q-10.2,-1.2 -6.6,3.6 L6.6,3.6 Q9.6,-9 8.4,-21 Q6,-30 -3,-30 Z"></path><rect x="-7.8" y="8.4" width="15.6" height="20.4" rx="6"></rect><line x1="-6" y1="-21.6" x2="8.4" y2="-21.6" stroke-width="1.5" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-6" y1="-15.6" x2="8.4" y2="-15.6" stroke-width="1.5" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-6" y1="-9.6" x2="8.4" y2="-9.6" stroke-width="1.5" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-6" y1="-3.6" x2="8.4" y2="-3.6" stroke-width="1.5" opacity="0.6" style="stroke:var(--panel)"></line></g></g><text x="555" y="276" text-anchor="middle" font-size="12" font-weight="700">Humans</text><text x="555" y="292" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">heel, ball, tread</text></g></svg>
