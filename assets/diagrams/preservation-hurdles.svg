<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" class="diagram" viewBox="0 0 760 240" role="img" aria-label="Preservation hurdles: cold, drying, acid, salt or sugar, heat and seal, smoke — each blocks microbial growth"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><text x="20" y="120" font-size="13" font-weight="700">Microbes</text><line x1="90" y1="116" x2="740" y2="116" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ph)"></line><g><rect x="110" y="70" width="18" height="92" rx="4" fill="var(--info)"></rect><text x="119" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Cold</text><foreignObject x="70" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">&lt; 4 °C slows growth; freezing stops it</div></foreignObject></g><g><rect x="215" y="70" width="18" height="92" rx="4" fill="var(--accent-2)"></rect><text x="224" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Dry</text><foreignObject x="175" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">low water activity: jerky, dried fruit, flour</div></foreignObject></g><g><rect x="320" y="70" width="18" height="92" rx="4" fill="var(--accent)"></rect><text x="329" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Acid</text><foreignObject x="280" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">pH ≤ 4.6: pickles, fermented foods</div></foreignObject></g><g><rect x="425" y="70" width="18" height="92" rx="4" fill="var(--warn)"></rect><text x="434" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Salt / sugar</text><foreignObject x="385" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">binds water: salt fish, jams</div></foreignObject></g><g><rect x="530" y="70" width="18" height="92" rx="4" fill="var(--ok)"></rect><text x="539" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Heat + seal</text><foreignObject x="490" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">canning: kill, then keep out</div></foreignObject></g><g><rect x="635" y="70" width="18" height="92" rx="4" fill="var(--muted)"></rect><text x="644" y="60" font-size="12.5" font-weight="700" text-anchor="middle">Smoke</text><foreignObject x="595" y="170" width="100" height="60"><div style="font-size:10.5px;line-height:1.25;text-align:center;color:var(--muted)">surface drying + antimicrobials</div></foreignObject></g><text x="380" y="24" font-size="12" text-anchor="middle" class="muted-fill">Each hurdle slows or stops growth. Combining them (dry + salt + smoke) is how traditional foods keep for months.</text></svg>
