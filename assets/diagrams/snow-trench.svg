<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" class="diagram" viewBox="0 0 720 240" role="img" aria-label="Snow trench cross-section: a body-width trench in firm snow, roofed with a tarp or snow blocks, bed of boughs and pad"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="720" height="240" fill="var(--sky)" opacity="0.3"></rect><rect y="80" width="720" height="160" fill="var(--panel)" stroke="var(--line)"></rect><path d="M250,80 L250,190 L470,190 L470,80" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></path><path d="M220,80 L360,55 L500,80" fill="none" stroke="var(--accent)" stroke-width="5"></path><text x="712" y="50" font-size="12" text-anchor="end">tarp or snow blocks,</text><text x="712" y="66" font-size="12" text-anchor="end">A-shaped to shed load</text><rect x="260" y="172" width="200" height="18" fill="var(--accent-2)" opacity="0.4"></rect><g><rect x="280" y="154" width="140" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="430" cy="161" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><text x="260" y="215" font-size="12">boughs + pad: never lie on snow directly</text><text x="40" y="110" font-size="12">~1 m 