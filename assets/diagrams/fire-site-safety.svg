<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Safe fire site: 3 m cleared circle, no overhanging branches, not on roots or peat, downwind clearance, water ready; carbon monoxide in enclosed spaces"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="210" width="400" height="90" fill="var(--ground)" opacity="0.35"></rect><ellipse cx="200" cy="225" rx="150" ry="30" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-dasharray="6 4"></ellipse><text x="200" y="272" text-anchor="middle" font-size="11">≥ 3 m cleared to mineral soil, no roots / duff / peat</text><path d="M185,222 Q195,190 200,175 Q205,190 215,222 Z" fill="var(--accent-2)" opacity="0.85"></path><ellipse cx="160" cy="226" rx="9" ry="5" fill="var(--muted)"></ellipse><ellipse cx="175" cy="226" rx="9" ry="5" fill="var(--muted)"></ellipse><ellipse cx="225" cy="226" rx="9" ry="5" fill="var(--muted)"></ellipse><ellipse cx="240" cy="226" rx="9" ry="5" fill="var(--muted)"></ellipse><rect x="300" y="200" width="18" height="22" rx="3" fill="var(--info)"></rect><text x="309" y="195" text-anchor="middle" font-size="10">water</text><path d="M30,40 Q110,60 190,90" stroke="var(--bad)" stroke-width="6" fill="none"></path><text x="40" y="30" font-size="10.5" style="fill:var(--bad)">no overhanging branches</text><text x="300" y="60" font-size="10.5" class="muted-fill">wind →</text><text x="300" y="76" font-size="10.5" class="muted-fill">sparks travel far downwind:</text><text x="300" y="92" font-size="10.5" class="muted-fill">strong wind + dry fuel = don’t light</text><g transform="translate(430,60)"><path d="M0,150 L90,20 L180,150 Z" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"></path><rect x="70" y="120" width="40" height="30" fill="var(--muted)"></rect><text x="90" y="140" text-anchor="middle" font-size="10" style="fill:#fff">stove</text><text x="90" y="100" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--bad)">CO</text><line x1="10" y1="30" x2="170" y2="150" stroke="var(--bad)" stroke-width="4"></line><text x="90" y="175" text-anchor="middle" font-size="11" font-weight="700">No fires, stoves or charcoal</text><text x="90" y="191" text-anchor="middle" font-size="11">in tents, snow caves or cars</text><text x="90" y="207" text-anchor="middle" font-size="10" class="muted-fill">CO is odourless and invisible</text></g></svg>
