<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="230" class="diagram" viewBox="0 0 660 230" role="img" aria-label="Uses of smoke: signaling with white or black smoke, insect deterrent, drying and smoking food, and hide tanning, with the material and why it works"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="10" y="22" font-size="13" font-weight="700">Smoke = incomplete combustion on purpose</text><g><rect x="10" y="34" width="140" height="30" rx="6" fill="var(--info)" opacity="0.8"></rect><text x="80" y="54" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">Signal (day)</text><text x="162" y="47" font-size="11">green leaves, damp moss on a hot fire</text><text x="162" y="61" font-size="10" class="muted-fill">white smoke against dark forest</text></g><g><rect x="10" y="72" width="140" height="30" rx="6" fill="var(--text)" opacity="0.8"></rect><text x="80" y="92" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--panel)">Signal (snow / sky)</text><text x="162" y="85" font-size="11">rubber, oil-soaked rag (sparingly)</text><text x="162" y="99" font-size="10" class="muted-fill">black smoke against snow or cloud</text></g><g><rect x="10" y="110" width="140" height="30" rx="6" fill="var(--accent-2)" opacity="0.8"></rect><text x="80" y="130" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">Insect deterrent</text><text x="162" y="123" font-size="11">punky wood, green leaves, smoulder</text><text x="162" y="137" font-size="10" class="muted-fill">thin, steady smoke — never in a closed shelter</text></g><g><rect x="10" y="148" width="140" height="30" rx="6" fill="var(--accent)" opacity="0.8"></rect><text x="80" y="168" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">Drying / smoking food</text><text x="162" y="161" font-size="11">hardwood, low heat, long time</text><text x="162" y="175" font-size="10" class="muted-fill">drying + surface antimicrobials; not a cook step</text></g><g><rect x="10" y="186" width="140" height="30" rx="6" fill="var(--ok)" opacity="0.8"></rect><text x="80" y="206" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">Hide tanning</text><text x="162" y="199" font-size="11">punky wood smoulder</text><text x="162" y="213" font-size="10" class="muted-fill">aldehydes cross-link collagen</text></g></svg>
