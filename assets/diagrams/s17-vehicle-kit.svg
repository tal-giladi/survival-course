<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" class="diagram" viewBox="0 0 660 330" role="img" aria-label="Vehicle emergency kit grouped by function: water and food; warmth and shelter; being seen and calling for help; car repair and recovery; first aid and navigation; with climate add-ons for heat and cold"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700" fill="var(--text)">A vehicle kit, by function</text><g><rect x="20" y="40" width="200" height="116" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="30" y="60" font-size="12.5" font-weight="700" fill="var(--accent)">Water &amp; food</text><text x="32" y="80" font-size="10.5" fill="var(--text)">• 4+ L water / person / day of wait</text><text x="32" y="98" font-size="10.5" fill="var(--text)">• non-perishable snacks</text></g><g><rect x="233" y="40" width="200" height="116" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="243" y="60" font-size="12.5" font-weight="700" fill="var(--accent)">Warmth &amp; shelter</text><text x="245" y="80" font-size="10.5" fill="var(--text)">• blankets / sleeping bag</text><text x="245" y="98" font-size="10.5" fill="var(--text)">• hat, gloves, spare dry layers</text><text x="245" y="116" font-size="10.5" fill="var(--text)">• tarp or sheet + cord (shade)</text></g><g><rect x="446" y="40" width="200" height="116" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="456" y="60" font-size="12.5" font-weight="700" fill="var(--accent)">Be seen &amp; call</text><text x="458" y="80" font-size="10.5" fill="var(--text)">• charged phone + cable + power bank</text><text x="458" y="98" font-size="10.5" fill="var(--text)">• PLB / satellite messenger (remote)</text><text x="458" y="116" font-size="10.5" fill="var(--text)">• torch, whistle, signal mirror</text><text x="458" y="134" font-size="10.5" fill="var(--text)">• hi-vis vest, warning triangle</text></g><g><rect x="20" y="168" width="200" height="116" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="30" y="188" font-size="12.5" font-weight="700" fill="var(--accent)">Car &amp; recovery</text><text x="32" y="208" font-size="10.5" fill="var(--text)">• jumper cables / jump pack</text><text x="32" y="226" font-size="10.5" fill="var(--text)">• spare tyre, jack, tyre inflator</text><text x="32" y="244" font-size="10.5" fill="var(--text)">• shovel; traction boards (sand/snow)</text><text x="32" y="262" font-size="10.5" fill="var(--text)">• tow strap, fuel and coolant checked</text></g><g><rect x="233" y="168" width="200" height="116" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="243" y="188" font-size="12.5" font-weight="700" fill="var(--accent)">Care &amp; navigation</text><text x="245" y="208" font-size="10.5" fill="var(--text)">• first-aid kit + your medicines</text><text x="245" y="226" font-size="10.5" fill="var(--text)">• paper map, route plan</text><text x="245" y="244" font-size="10.5" fill="var(--text)">• multi-tool, duct tape, gloves</text></g><rect x="446" y="168" width="200" height="116" rx="8" fill="none" stroke="var(--accent-2)" stroke-dasharray="5 3"></rect><text x="456" y="188" font-size="12.5" font-weight="700" fill="var(--accent-2)">Climate add-ons</text><text x="458" y="208" font-size="10.5" fill="var(--text)">Heat: far more water, shade</text><text x="458" y="224" font-size="10.5" fill="var(--text)">cloth, hats, sun-shade</text><text x="458" y="244" font-size="10.5" fill="var(--text)">Cold: sleeping bag, boots,</text><text x="458" y="260" font-size="10.5" fill="var(--text)">snow brush, ice scraper, sand/grit,</text><text x="458" y="276" font-size="10.5" fill="var(--text)">tank kept at least half full</text><text x="20" y="316" font-size="11" class="muted-fill">Lists after Ready.gov and national road-safety agencies. Scale water and warmth to the longest wait your route could produce.</text></svg>
