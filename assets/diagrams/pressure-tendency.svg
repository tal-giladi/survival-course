<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" class="diagram" viewBox="0 0 700 330" role="img" aria-label="Pressure tendency: steady, slowly falling and rapidly falling barometer traces over 12 hours"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><line x1="70" y1="270" x2="680" y2="270" stroke="var(--muted)" marker-end="url(#pt)"></line><line x1="70" y1="270" x2="70" y2="30" stroke="var(--muted)" marker-end="url(#pt)"></line><text x="70" y="288" text-anchor="middle" font-size="11" class="muted-fill">0 h</text><text x="220" y="288" text-anchor="middle" font-size="11" class="muted-fill">3 h</text><text x="370" y="288" text-anchor="middle" font-size="11" class="muted-fill">6 h</text><text x="520" y="288" text-anchor="middle" font-size="11" class="muted-fill">9 h</text><text x="670" y="288" text-anchor="middle" font-size="11" class="muted-fill">12 h</text><g><line x1="70" x2="680" y1="40" y2="40" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="64" y="44" text-anchor="end" font-size="11" class="muted-fill">1024</text></g><g><line x1="70" x2="680" y1="88" y2="88" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="64" y="92" text-anchor="end" font-size="11" class="muted-fill">1020</text></g><g><line x1="70" x2="680" y1="136" y2="136" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="64" y="140" text-anchor="end" font-size="11" class="muted-fill">1016</text></g><g><line x1="70" x2="680" y1="184" y2="184" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="64" y="188" text-anchor="end" font-size="11" class="muted-fill">1012</text></g><g><line x1="70" x2="680" y1="232" y2="232" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="64" y="236" text-anchor="end" font-size="11" class="muted-fill">1008</text></g><g><polyline points="70,76 670,64" fill="none" stroke="var(--ok)" stroke-width="3"></polyline><text x="666" y="56" text-anchor="end" font-size="11.5" font-weight="600">Steady / rising: settled</text></g><g><polyline points="70,76 670,124" fill="none" stroke="var(--warn)" stroke-width="3"></polyline><text x="666" y="144" text-anchor="end" font-size="11.5" font-weight="600">Slow fall ~1 hPa/3 h: change within a day</text></g><g><polyline points="70,76 220,148 370,220 470,256" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><text x="478" y="260" text-anchor="start" font-size="11.5" font-weight="600">Rapid fall ~6 hPa/3 h: gales / storm soon</text></g><text x="20" y="160" font-size="12" transform="rotate(-90 20 160)">pressure (hPa)</text><text x="375" y="312" text-anchor="middle" font-size="11" class="muted-fill">The trend matters more than the number. An altimeter that “climbs” ~8 m while you sit still means pressure fell ~1 hPa.</text></svg>
