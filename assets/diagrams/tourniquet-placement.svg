<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" class="diagram" viewBox="0 0 740 300" role="img" aria-label="Tourniquet placement: 5 to 8 centimetres above the wound on the limb, never over a joint; high and tight if the wound cannot be seen"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M60,120 L560,110 Q600,108 610,140 L620,190 L580,196 L560,150 L60,170 Z" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"></path><text x="70" y="100" font-size="12" class="muted-fill">hip / groin</text><circle cx="330" cy="143" r="20" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"></circle><text x="330" y="100" text-anchor="middle" font-size="12" class="muted-fill">knee (joint)</text><ellipse cx="470" cy="140" rx="16" ry="7" fill="var(--bad)"></ellipse><text x="470" y="220" text-anchor="middle" font-size="12" fill="var(--bad)">wound</text><line x1="470" y1="150" x2="470" y2="206" stroke="var(--bad)"></line><rect x="400" y="108" width="20" height="70" rx="4" fill="var(--accent)"></rect><text x="410" y="248" text-anchor="middle" font-size="12" font-weight="700">5–8 cm above</text><text x="410" y="264" text-anchor="middle" font-size="11" class="muted-fill">tighten until bleeding stops</text><line x1="410" y1="182" x2="410" y2="234" stroke="var(--accent)"></line><rect x="110" y="112" width="20" height="64" rx="4" fill="var(--accent-2)"></rect><text x="120" y="210" text-anchor="middle" font-size="12" font-weight="700">“high and tight”</text><text x="120" y="226" text-anchor="middle" font-size="11" class="muted-fill">when you can’t see or</text><text x="120" y="240" text-anchor="middle" font-size="11" class="muted-fill">find the wound quickly</text><line x1="312" y1="120" x2="348" y2="166" stroke="var(--bad)" stroke-width="3"></line><line x1="348" y1="120" x2="312" y2="166" stroke="var(--bad)" stroke-width="3"></line><text x="330" y="196" text-anchor="middle" font-size="11" fill="var(--bad)">not over a joint</text><text x="20" y="28" font-size="13" font-weight="700">Life-threatening limb bleeding → tourniquet early; note the time; never loosen it.</text><text x="20" y="48" font-size="11" class="muted-fill">Still bleeding? Add a second tourniquet just above the first.</text><text x="20" y="64" font-size="11" class="muted-fill">Groin, armpit and neck (junctional) wounds can’t take one — pack and press.</text></svg>
