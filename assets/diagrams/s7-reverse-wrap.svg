<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="diagram" viewBox="0 0 640 250" role="img" aria-label="Reverse wrap: each ply is twisted one way, the plies are wrapped around each other the opposite way, so their torques cancel and the cord stays locked"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7rw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="s7rw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><g><path d="M60,60 C80,60 90,120 110,120" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M110,120 C130,120 140,60 160,60" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M160,60 C180,60 190,120 210,120" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M210,120 C230,120 240,60 260,60" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M260,60 C280,60 290,120 310,120" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M310,120 C330,120 340,60 360,60" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M360,60 C380,60 390,120 410,120" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M410,120 C430,120 440,60 460,60" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M460,60 C480,60 490,120 510,120" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M510,120 C530,120 540,60 560,60" fill="none" stroke="var(--accent-2)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path></g><g><path d="M60,120 C80,120 90,60 110,60" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M110,60 C130,60 140,120 160,120" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M160,120 C180,120 190,60 210,60" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M210,60 C230,60 240,120 260,120" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M260,120 C280,120 290,60 310,60" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M310,60 C330,60 340,120 360,120" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M360,120 C380,120 390,60 410,60" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M410,60 C430,60 440,120 460,120" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M460,120 C480,120 490,60 510,60" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path><path d="M510,60 C530,60 540,120 560,120" fill="none" stroke="var(--info)" stroke-width="18" stroke-linecap="round" opacity="0.85"></path></g><text x="60" y="30" font-size="12" font-weight="700">Each ply: twisted clockwise (Z) — plies wrapped round each other anticlockwise (S)</text><path d="M40,150 A20,12 0 1,0 80,150" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#s7rw)"></path><text x="90" y="162" font-size="11">ply twist wants to unwind one way…</text><path d="M340,150 A20,12 0 1,1 380,150" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#s7rw)"></path><text x="390" y="162" font-size="11">…the ply wrap pushes back the other way</text><rect x="40" y="182" width="560" height="54" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="54" y="204" font-size="12" font-weight="700">Balanced torque = the cord does not unwind or kink when you let go or load it.</text><text x="54" y="222" font-size="11" class="muted-fill">A single twisted strand (or plies twisted the same way) stores unbalanced torque: under load it spins, untwists and fails.</text></svg>
