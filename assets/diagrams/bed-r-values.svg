<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" class="diagram" viewBox="0 0 720 330" role="img" aria-label="Bar chart of thermal resistance of common ground insulation layers"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="10" y="20" font-size="14" font-weight="700">Thermal resistance R = d / k of what you lie on (m²·K/W)</text><text x="10" y="38" font-size="11" class="muted-fill">Heat flow through the bed ∝ 1/R. Thickness is what is left after your body compresses it.</text><g><text x="10" y="73" font-size="12">Bare damp soil (contact only)</text><rect x="240" y="58" width="10.56" height="22" rx="4" fill="var(--bad)" opacity="0.8"></rect><text x="258.56" y="73" font-size="12" font-weight="700">0.10</text><text x="690" y="73" font-size="10" text-anchor="end" class="muted-fill">clothing compressed flat</text></g><g><text x="10" y="106" font-size="12">Pack + rope + spare clothes</text><rect x="240" y="91" width="12.67" height="22" rx="4" fill="var(--bad)" opacity="0.8"></rect><text x="260.67" y="106" font-size="12" font-weight="700">0.12</text><text x="690" y="106" font-size="10" text-anchor="end" class="muted-fill">covers part of the body</text></g><g><text x="10" y="139" font-size="12">1 cm closed-cell foam pad</text><rect x="240" y="124" width="30.61" height="22" rx="4" fill="var(--bad)" opacity="0.8"></rect><text x="278.61" y="139" font-size="12" font-weight="700">0.29</text><text x="690" y="139" font-size="10" text-anchor="end" class="muted-fill">k ≈ 0.04</text></g><g><text x="10" y="172" font-size="12">10 cm dry leaves (→ 2.5 cm)</text><rect x="240" y="157" width="52.78" height="22" rx="4" fill="var(--accent-2)" opacity="0.8"></rect><text x="300.78" y="172" font-size="12" font-weight="700">0.50</text><text x="690" y="172" font-size="10" text-anchor="end" class="muted-fill">k ≈ 0.05</text></g><g><text x="10" y="205" font-size="12">30 cm dry leaves (→ 7.5 cm)</text><rect x="240" y="190" width="158.33" height="22" rx="4" fill="var(--ok)" opacity="0.8"></rect><text x="406.33" y="205" font-size="12" font-weight="700">1.50</text><text x="690" y="205" font-size="10" text-anchor="end" class="muted-fill">k ≈ 0.05</text></g><g><text x="10" y="238" font-size="12">30 cm leaves, soaked</text><rect x="240" y="223" width="40.11" height="22" rx="4" fill="var(--accent-2)" opacity="0.8"></rect><text x="288.11" y="238" font-size="12" font-weight="700">0.38</text><text x="690" y="238" font-size="10" text-anchor="end" class="muted-fill">k ×4</text></g><g><text x="10" y="271" font-size="12">20 cm conifer boughs (→ 7 cm)</text><rect x="240" y="256" width="123.5" height="22" rx="4" fill="var(--ok)" opacity="0.8"></rect><text x="371.5" y="271" font-size="12" font-weight="700">1.17</text><text x="690" y="271" font-size="10" text-anchor="end" class="muted-fill">k ≈ 0.06</text></g><g><text x="10" y="304" font-size="12">30 cm settled snow</text><rect x="240" y="289" width="263.89" height="22" rx="4" fill="var(--ok)" opacity="0.8"></rect><text x="511.89" y="304" font-size="12" font-weight="700">2.50</text><text x="690" y="304" font-size="10" text-anchor="end" class="muted-fill">k ≈ 0.12 — but it is at ≤ 0 °C</text></g></svg>
