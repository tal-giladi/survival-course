<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" class="diagram" viewBox="0 0 720 280" role="img" aria-label="Snakebite first aid: do and do not lists"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="340" height="260" rx="10" fill="var(--ok-soft)"></rect><rect x="370" y="10" width="340" height="260" rx="10" fill="var(--bad-soft)"></rect><text x="24" y="36" font-size="14" font-weight="800" fill="var(--ok)">DO</text><text x="384" y="36" font-size="14" font-weight="800" fill="var(--bad)">DON’T (myths)</text><text x="24" y="66" font-size="12">✓ Move away; don’t catch or kill the snake</text><text x="24" y="98" font-size="12">✓ Keep the patient calm, still, lying down</text><text x="24" y="130" font-size="12">✓ Remove rings, watches, tight boots</text><text x="24" y="162" font-size="12">✓ Splint; mark swelling edge and time</text><text x="24" y="194" font-size="12">✓ Evacuate to a hospital with antivenom</text><text x="24" y="226" font-size="12">✓ Australia: pressure immobilisation bandage</text><text x="384" y="66" font-size="12">✗ Cut or incise the bite</text><text x="384" y="98" font-size="12">✗ Suck (mouth or suction pump)</text><text x="384" y="130" font-size="12">✗ Tight tourniquet</text><text x="384" y="162" font-size="12">✗ Ice or cold packs</text><text x="384" y="194" font-size="12">✗ Electric shock, alcohol, herbal pastes</text><text x="384" y="226" font-size="12">✗ Waste time on snake identification</text></svg>
