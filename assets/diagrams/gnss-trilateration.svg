<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" class="diagram" viewBox="0 0 620 360" role="img" aria-label="GNSS positioning: range circles from satellites intersecting at the receiver, with clock error blurring every range"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><circle cx="90" cy="60" r="284.1851217221259" fill="none" stroke="var(--info)" stroke-width="10" opacity="0.12"></circle><circle cx="90" cy="60" r="270.1851217221259" fill="none" stroke="var(--info)" stroke-width="1.5"></circle><rect x="76" y="52" width="28" height="16" fill="var(--accent)" rx="3"></rect><line x1="64" x2="116" y1="60" y2="60" stroke="var(--accent)" stroke-width="3"></line><text x="90" y="46" font-size="11" text-anchor="middle" font-weight="700">sat 1</text></g><g><circle cx="330" cy="30" r="216.23748416156684" fill="none" stroke="var(--info)" stroke-width="10" opacity="0.12"></circle><circle cx="330" cy="30" r="202.23748416156684" fill="none" stroke="var(--info)" stroke-width="1.5"></circle><rect x="316" y="22" width="28" height="16" fill="var(--accent)" rx="3"></rect><line x1="304" x2="356" y1="30" y2="30" stroke="var(--accent)" stroke-width="3"></line><text x="330" y="16" font-size="11" text-anchor="middle" font-weight="700">sat 2</text></g><g><circle cx="540" cy="90" r="291.8488797889961" fill="none" stroke="var(--info)" stroke-width="10" opacity="0.12"></circle><circle cx="540" cy="90" r="277.8488797889961" fill="none" stroke="var(--info)" stroke-width="1.5"></circle><rect x="526" y="82" width="28" height="16" fill="var(--accent)" rx="3"></rect><line x1="514" x2="566" y1="90" y2="90" stroke="var(--accent)" stroke-width="3"></line><text x="540" y="76" font-size="11" text-anchor="middle" font-weight="700">sat 3</text></g><circle cx="300" cy="230" r="7" fill="var(--bad)"></circle><text x="312" y="250" font-size="12" text-anchor="start" font-weight="700">receiver</text><rect x="0" y="300" width="620" height="60" fill="var(--ground)" opacity="0.3"></rect><text x="12" y="322" font-size="11" text-anchor="start">range = c × travel time. The receiver’s cheap clock is off by an unknown amount — 1 µs ≈ 300 m on EVERY range.</text><text x="12" y="342" font-size="11" text-anchor="start">Unknowns: x, y, z and clock offset → at least 4 satellites. Blurred bands show the clock error before it is solved.</text></svg>
