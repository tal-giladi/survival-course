<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" class="diagram" viewBox="0 0 720 230" role="img" aria-label="SODIS steps: clear PET bottle up to 2 litres, clear water, lay flat in full sun, wait at least 6 hours or 2 days if cloudy, drink directly from the bottle"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><circle cx="660" cy="36" r="22" fill="var(--accent-2)" opacity="0.9"></circle><g><rect x="10" y="70" width="128" height="80" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="74" y="100" text-anchor="middle" font-size="12" font-weight="700">1. Clear PET bottle</text><foreignObject x="16" y="106" width="116" height="44"><div style="font-size:10.5px;text-align:center;color:var(--text);line-height:1.25">≤ 2 L, unscratched, labels off</div></foreignObject></g><g><rect x="150" y="70" width="128" height="80" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="214" y="100" text-anchor="middle" font-size="12" font-weight="700">2. Clear water</text><foreignObject x="156" y="106" width="116" height="44"><div style="font-size:10.5px;text-align:center;color:var(--text);line-height:1.25">Settle/cloth if cloudy (&lt; ~30 NTU)</div></foreignObject></g><g><rect x="290" y="70" width="128" height="80" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="354" y="100" text-anchor="middle" font-size="12" font-weight="700">3. Lay flat in full sun</text><foreignObject x="296" y="106" width="116" height="44"><div style="font-size:10.5px;text-align:center;color:var(--text);line-height:1.25">On a roof or dark/reflective surface</div></foreignObject></g><g><rect x="430" y="70" width="128" height="80" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="494" y="100" text-anchor="middle" font-size="12" font-weight="700">4. Wait</text><foreignObject x="436" y="106" width="116" height="44"><div style="font-size:10.5px;text-align:center;color:var(--text);line-height:1.25">≥ 6 h sunny; 2 days if cloudy</div></foreignObject></g><g><rect x="570" y="70" width="128" height="80" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="634" y="100" text-anchor="middle" font-size="12" font-weight="700">5. Drink from the bottle</text><foreignObject x="576" y="106" width="116" height="44"><div style="font-size:10.5px;text-align:center;color:var(--text);line-height:1.25">Don’t pour into dirty cups</div></foreignObject></g><rect x="300" y="170" width="120" height="30" rx="14" fill="var(--info)" opacity="0.5" stroke="var(--text)"></rect><text x="360" y="190" text-anchor="middle" font-size="11">bottle lying flat</text><text x="360" y="222" text-anchor="middle" font-size="10.5" class="muted-fill">UV-A + heat inactivate microbes. Does nothing for chemicals. Not for continuous rain — collect the rain instead. (CDC; WHO; Eawag SODIS manual.)</text></svg>
