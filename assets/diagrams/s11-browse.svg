<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Browse sign. A twig clipped by a rabbit, hare or rodent has a clean, angled cut about 45 degrees. A twig browsed by a deer is torn, ragged and often crushed, because deer have no upper front teeth."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="300" height="200" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="330" y="10" width="300" height="200" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="160" y="34" text-anchor="middle" font-size="13" font-weight="700">Rabbit / hare / rodent</text><text x="480" y="34" text-anchor="middle" font-size="13" font-weight="700">Deer and other ruminants</text><path d="M60,190 L180,80 L196,74 L182,96 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="196" y1="74" x2="182" y2="96" stroke="var(--accent)" stroke-width="3"></line><line x1="190" y1="86" x2="236" y2="96" stroke="var(--muted)" stroke-width="1"></line><text x="238" y="100" text-anchor="start" font-size="11" font-weight="400">clean ~45° cut</text><text x="40" y="204" text-anchor="start" font-size="10" font-weight="400" class="muted-fill">Sharp upper and lower incisors snip like shears.</text><path d="M380,190 L500,80 L506,72 L512,80 L516,70 L520,84 L512,92 L506,90 Z" fill="var(--accent-2)" opacity="0.8"></path><path d="M500,80 l4,-10 M508,84 l8,-6 M512,92 l10,0" stroke="var(--accent-2)" stroke-width="1.5"></path><line x1="516" y1="82" x2="556" y2="96" stroke="var(--muted)" stroke-width="1"></line><text x="558" y="100" text-anchor="start" font-size="11" font-weight="400">torn, ragged,</text><text x="558" y="113" text-anchor="start" font-size="11" font-weight="400">fibres pulled</text><text x="346" y="204" text-anchor="start" font-size="10" font-weight="400" class="muted-fill">No upper incisors: they grip against a pad and tear.</text><text x="320" y="236" text-anchor="middle" font-size="11" font-weight="400">Height matters too: browse far above the snow line or ground points to a taller animal (or deep snow earlier).</text><text x="320" y="252" text-anchor="middle" font-size="11" font-weight="400" class="muted-fill">Freshly cut wood is pale and moist; it darkens and dries over days.</text></svg>
