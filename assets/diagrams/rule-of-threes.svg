<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" class="diagram" viewBox="0 0 780 290" role="img" aria-label="Rule of threes as ranges on a logarithmic time axis"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="150" x2="150" y1="20" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="150" y="268" text-anchor="middle" font-size="11" class="muted-fill">1 min</text></g><g><line x1="358.67850145081684" x2="358.67850145081684" y1="20" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="358.67850145081684" y="268" text-anchor="middle" font-size="11" class="muted-fill">1 h</text></g><g><line x1="520.6559561492332" x2="520.6559561492332" y1="20" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="520.6559561492332" y="268" text-anchor="middle" font-size="11" class="muted-fill">1 day</text></g><g><line x1="619.8341292833513" x2="619.8341292833513" y1="20" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="619.8341292833513" y="268" text-anchor="middle" font-size="11" class="muted-fill">1 wk</text></g><g><line x1="694.0064795254334" x2="694.0064795254334" y1="20" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="694.0064795254334" y="268" text-anchor="middle" font-size="11" class="muted-fill">1 mo</text></g><g><text x="10" y="44" font-size="13" font-weight="600">Air / airway</text><rect x="205.99352047456654" y="30" width="35.327978074616624" height="18" rx="9" fill="var(--bad)" opacity="0.85"></rect><text x="205.99352047456654" y="64" text-anchor="start" font-size="10.5" class="muted-fill">blocked airway, drowning, avalanche burial</text></g><g><text x="10" y="100" font-size="13" font-weight="600">Severe exposure</text><rect x="358.67850145081684" y="86" width="161.9774546984164" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><text x="358.67850145081684" y="120" text-anchor="start" font-size="10.5" class="muted-fill">cold-wet-wind or extreme heat without protection</text></g><g><text x="10" y="156" font-size="13" font-weight="600">Water</text><rect x="520.6559561492332" y="142" width="99.17817313411808" height="18" rx="9" fill="var(--info)" opacity="0.85"></rect><text x="619.8341292833513" y="176" text-anchor="end" font-size="10.5" class="muted-fill">hours in desert heat; ~3 days typical; a week in cool rest</text></g><g><text x="10" y="212" font-size="13" font-weight="600">Food</text><rect x="675.8276497579178" y="198" width="53.506807842132275" height="18" rx="9" fill="var(--ok)" opacity="0.85"></rect><text x="729.3344576000501" y="232" text-anchor="end" font-size="10.5" class="muted-fill">weeks; energy and mood fall long before</text></g><text x="390" y="286" text-anchor="middle" font-size="10" class="muted-fill">time to serious harm (log scale) — ranges, not guarantees</text></svg>
