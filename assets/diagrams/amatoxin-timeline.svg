<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" class="diagram" viewBox="0 0 760 220" role="img" aria-label="Amatoxin poisoning timeline: latent period, gastrointestinal phase, false recovery, then liver failure over three to six days"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="40" y="40" width="56.67" height="22" rx="6" fill="var(--muted)" opacity="0.85"></rect><text x="102.67" y="56" font-size="11.5">Latent: no symptoms (6–24 h)</text></g><g><rect x="96.67" y="70" width="132.22" height="22" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="102.67" y="86" font-size="11.5">Violent GI phase: vomiting, watery diarrhoea</text></g><g><rect x="228.89" y="100" width="151.11" height="22" rx="6" fill="var(--warn)" opacity="0.85"></rect><text x="234.89" y="116" font-size="11.5">“False recovery” — liver damage continues</text></g><g><rect x="380" y="130" width="340" height="22" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="386" y="146" font-size="11.5">Liver (± kidney) failure; transplant or death</text></g><g><line x1="40" x2="40" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="40" y="180" font-size="11" text-anchor="middle" class="muted-fill">0 d</text></g><g><line x1="153.33" x2="153.33" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="153.33" y="180" font-size="11" text-anchor="middle" class="muted-fill">1 d</text></g><g><line x1="266.67" x2="266.67" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="266.67" y="180" font-size="11" text-anchor="middle" class="muted-fill">2 d</text></g><g><line x1="380" x2="380" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="380" y="180" font-size="11" text-anchor="middle" class="muted-fill">3 d</text></g><g><line x1="493.33" x2="493.33" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="493.33" y="180" font-size="11" text-anchor="middle" class="muted-fill">4 d</text></g><g><line x1="606.67" x2="606.67" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="606.67" y="180" font-size="11" text-anchor="middle" class="muted-fill">5 d</text></g><g><line x1="720" x2="720" y1="30" y2="166" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="720" y="180" font-size="11" text-anchor="middle" class="muted-fill">6 d</text></g><text x="20" y="200" font-size="11" class="muted-fill">The delay is the trap: by the time anyone connects the illness to the meal, the toxin has done its work.</text><text x="20" y="215" font-size="11" class="muted-fill">Suspected ingestion → emergency care and a poison centre immediately, even without symptoms.</text></svg>
