<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" class="diagram" viewBox="0 0 660 330" role="img" aria-label="Schematics of 1:1, 2:1 and 3:1 hauling systems. In the 2:1 the load hangs on two rope parts each carrying the haul force; in the 3:1 Z system an anchor pulley and a travelling pulley on the load line give three parts. Ideal advantage is the number of rope parts pulling on the load"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ma-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><text x="20" y="22" font-size="12" font-weight="700">1:1 — direct</text><line x1="80" y1="50" x2="560" y2="50" stroke="var(--accent)" stroke-width="3"></line><line x1="80" y1="50" x2="30" y2="50" stroke="var(--accent)" stroke-width="3" marker-end="url(#ma-a)"></line><rect x="560" y="36" width="60" height="28" rx="4" fill="var(--ground)"></rect><text x="590" y="55" text-anchor="middle" font-size="11" font-weight="700">load</text><text x="300" y="42" text-anchor="middle" font-size="11">T = F</text><text x="20" y="75" font-size="10" class="muted-fill">haulers 