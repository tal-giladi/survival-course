"60" height="28" rx="4" fill="var(--ground)"></rect><text x="590" y="245" text-anchor="middle" font-size="11" font-weight="700">load</text><text x="250" y="234" text-anchor="middle" font-size="11">F</text><text x="250" y="262" text-anchor="middle" font-size="11">F</text><text x="250" y="308" text-anchor="middle" font-size="11">F (haul)</text><text x="430" y="290" font-size="11">load gets 2F (via B) + F = 3F</text><text x="20" y="326" font-size="10" class="muted-fill">Ideal (frictionless) values. Friction at each pulley reduces them — see the next figure. Schematic only.</text></svg>
