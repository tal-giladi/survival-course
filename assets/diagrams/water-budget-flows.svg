<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" class="diagram" viewBox="0 0 700 330" role="img" aria-label="Daily water balance for a resting adult: inputs from drink, food and metabolism equal outputs from urine, skin, breath, faeces and sweat"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="120" y="40" text-anchor="middle" font-size="14" font-weight="700">IN ≈ 3.2 L</text><text x="440" y="40" text-anchor="middle" font-size="14" font-weight="700">OUT ≈ 3.2 L</text><g><rect x="60" y="60" width="120" height="137.28" fill="var(--info)" opacity="0.75" stroke="var(--panel)"></rect><text x="190" y="132.64" font-size="12">Drinks 2.20 L</text></g><g><rect x="60" y="197.28" width="120" height="43.68" fill="var(--accent)" opacity="0.75" stroke="var(--panel)"></rect><text x="190" y="223.12" font-size="12">Water in food 0.70 L</text></g><g><rect x="60" y="240.96" width="120" height="18.72" fill="var(--ok)" opacity="0.75" stroke="var(--panel)"></rect><text x="190" y="254.32" font-size="12">Metabolic water 0.30 L</text></g><g><rect x="380" y="60" width="120" height="87.36" fill="var(--warn)" opacity="0.75" stroke="var(--panel)"></rect><text x="510" y="107.68" font-size="12">Urine 1.40 L</text></g><g><rect x="380" y="147.36" width="120" height="31.2" fill="var(--accent-2)" opacity="0.75" stroke="var(--panel)"></rect><text x="510" y="166.96" font-size="12">Skin (insensible) 0.50 L</text></g><g><rect x="380" y="178.56" width="120" height="21.84" fill="var(--info)" opacity="0.75" stroke="var(--panel)"></rect><text x="510" y="193.48" font-size="12">Breath 0.35 L</text></g><g><rect x="380" y="200.4" width="120" height="9.36" fill="var(--ground)" opacity="0.75" stroke="var(--panel)"></rect><text x="510" y="209.08" font-size="12">Faeces 0.15 L</text></g><g><rect x="380" y="209.76" width="120" height="49.92" fill="var(--bad)" opacity="0.75" stroke="var(--panel)"></rect><text x="510" y="238.72" font-size="12">Sweat (resting, mild) 0.80 L</text></g><text x="350" y="290" text-anchor="middle" font-size="12">Hiking in heat adds 0.5–1.5 L of sweat per hour to the OUT column — it dwarfs everything else.</text><text x="350" y="318" text-anchor="middle" font-size="10.5" class="muted-fill">Typical temperate values for a ~70 kg adult at light activity; rounded. Urine cannot fall much below ~0.5 L/day without kidney strain.</text></svg>
