<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" class="diagram" viewBox="0 0 720 260" role="img" aria-label="Wound irrigation: a jet of clean water from a syringe or pierced bag, held a few centimetres away and angled so debris washes out and away"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="170" width="600" height="50" rx="12" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M300,170 Q340,195 380,170" fill="var(--bad)" opacity="0.6"></path><circle cx="320" cy="180" r="3" fill="var(--ground)"></circle><circle cx="340" cy="180" r="3" fill="var(--ground)"></circle><circle cx="356" cy="180" r="3" fill="var(--ground)"></circle><g transform="translate(40,50) rotate(35 250 90)"><rect x="150" y="80" width="110" height="24" rx="4" fill="var(--sky)" opacity="0.5" stroke="var(--line)"></rect><rect x="120" y="86" width="34" height="12" fill="var(--muted)"></rect><rect x="260" y="88" width="24" height="8" fill="var(--muted)"></rect></g><path d="M320,164 L336,176" fill="none" stroke="var(--info)" stroke-width="4" stroke-dasharray="4 3"></path><path d="M380,178 Q440,190 480,200" fill="none" stroke="var(--info)" stroke-width="3" marker-end="url(#wi)"></path><defs><marker id="wi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><text x="490" y="204" font-size="11">debris flushed out and away</text><text x="60" y="30" font-size="13" font-weight="700">Irrigate: lots of clean (drinkable) water, under pressure</text><text x="60" y="48" font-size="11" class="muted-fill">Syringe or a pinhole in a clean bag · a few cm away · angled · a litre or more if dirty</text><text x="60" y="244" font-size="11" class="muted-fill">Bleeding first, cleaning second. Leave dirty wounds and bites open — closing traps bacteria.</text></svg>
