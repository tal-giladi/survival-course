<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" class="diagram" viewBox="0 0 640 270" role="img" aria-label="Schematic scat shapes: pellets from deer and rabbits; a tubular, twisted scat with tapered ends containing hair and bone from the dog family; a segmented scat often scraped over from the cat family; bird droppings with a white uric-acid cap; an owl pellet, which is regurgitated fur and bone, not scat. Look, photograph with a scale, never touch with bare hands."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="10" y="20" width="118" height="170" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><ellipse cx="44" cy="80" rx="9" ry="7" fill="var(--ground)"></ellipse><ellipse cx="68" cy="80" rx="9" ry="7" fill="var(--ground)"></ellipse><ellipse cx="92" cy="80" rx="9" ry="7" fill="var(--ground)"></ellipse><ellipse cx="44" cy="110" rx="9" ry="7" fill="var(--ground)"></ellipse><ellipse cx="68" cy="110" rx="9" ry="7" fill="var(--ground)"></ellipse><ellipse cx="92" cy="110" rx="9" ry="7" fill="var(--ground)"></ellipse><text x="69" y="164" text-anchor="middle" font-size="10" font-weight="700">Pellets</text><text x="69" y="178" text-anchor="middle" font-size="9" font-weight="400" class="muted-fill">deer, rabbits, hares</text></g><g><rect x="136" y="20" width="118" height="170" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M158,104 q18,-22 36,-4 q18,18 38,-12" fill="none" stroke="var(--ground)" stroke-width="13" stroke-linecap="round"></path><path d="M170,98 l8,2 M206,104 l8,-4" stroke="var(--panel-2)" stroke-width="1.5"></path><text x="195" y="164" text-anchor="middle" font-size="10" font-weight="700">Twisted, tapered</text><text x="195" y="178" text-anchor="middle" font-size="9" font-weight="400" class="muted-fill">dog family: hair, bone</text></g><g><rect x="262" y="20" width="118" height="170" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="280" y="92" width="19" height="18" rx="7" fill="var(--ground)"></rect><rect x="301" y="92" width="19" height="18" rx="7" fill="var(--ground)"></rect><rect x="322" y="92" width="19" height="18" rx="7" fill="var(--ground)"></rect><rect x="343" y="92" width="19" height="18" rx="7" fill="var(--ground)"></rect><text x="321" y="164" text-anchor="middle" font-size="10" font-weight="700">Segmented, blunt</text><text x="321" y="178" text-anchor="middle" font-size="9" font-weight="400" class="muted-fill">cat family, often covered</text></g><g><rect x="388" y="20" width="118" height="170" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g><ellipse cx="447" cy="104" rx="26" ry="14" fill="var(--ground)"></ellipse><ellipse cx="450" cy="96" rx="18" ry="9" fill="var(--panel)" stroke="var(--line)"></ellipse></g><text x="447" y="164" text-anchor="middle" font-size="10" font-weight="700">White cap</text><text x="447" y="178" text-anchor="middle" font-size="9" font-weight="400" class="muted-fill">birds (uric acid)</text></g><g><rect x="514" y="20" width="118" height="170" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><g><ellipse cx="573" cy="100" rx="34" ry="16" fill="var(--muted)" opacity="0.6"></ellipse><path d="M554,98 l14,4 M578,94 l12,8" stroke="var(--panel)" stroke-width="2.5"></path></g><text x="573" y="164" text-anchor="middle" font-size="10" font-weight="700">Owl pellet</text><text x="573" y="178" text-anchor="middle" font-size="9" font-weight="400" class="muted-fill">regurgitated — not scat</text></g><rect x="10" y="204" width="620" height="54" rx="8" fill="var(--bad)" opacity="0.12"></rect><text x="320" y="226" text-anchor="middle" font-size="12" font-weight="700">Look and photograph with a scale — never touch or sniff scat with bare hands; use a stick.</text><text x="320" y="244" text-anchor="middle" font-size="11" font-weight="400">Scat and droppings can carry parasite eggs and viruses. Wash hands; keep dogs and children away.</text></svg>
