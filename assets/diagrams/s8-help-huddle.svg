<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="HELP posture for one person in a lifejacket and huddle posture for a group"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="120" width="640" height="140" fill="var(--sky)" opacity="0.15"></rect><path d="M0,120 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0" fill="none" stroke="var(--sky)" stroke-width="2"></path><circle cx="160" cy="100" r="16" fill="var(--panel-2)" stroke="var(--text)"></circle><rect x="138" y="116" width="44" height="46" rx="10" fill="var(--warn)" opacity="0.9"></rect><path d="M142,130 L160,150 L178,130" stroke="var(--text)" stroke-width="5" fill="none" stroke-linecap="round"></path><path d="M150,162 Q140,190 165,195 Q185,196 175,170" stroke="var(--text)" stroke-width="7" fill="none" stroke-linecap="round"></path><text x="160" y="222" text-anchor="middle" font-size="13" font-weight="700">HELP</text><text x="160" y="240" text-anchor="middle" font-size="11" class="muted-fill">arms across chest, knees up, legs crossed, still</text><g><circle cx="494" cy="98" r="13" fill="var(--panel-2)" stroke="var(--text)"></circle><rect x="479" y="110" width="30" height="34" rx="8" fill="var(--warn)" opacity="0.9"></rect></g><g><circle cx="460" cy="110" r="13" fill="var(--panel-2)" stroke="var(--text)"></circle><rect x="445" y="122" width="30" height="34" rx="8" fill="var(--warn)" opacity="0.9"></rect></g><g><circle cx="426" cy="98" r="13" fill="var(--panel-2)" stroke="var(--text)"></circle><rect x="411" y="110" width="30" height="34" rx="8" fill="var(--warn)" opacity="0.9"></rect></g><g><circle cx="460" cy="86" r="13" fill="var(--panel-2)" stroke="var(--text)"></circle><rect x="445" y="98" width="30" height="34" rx="8" fill="var(--warn)" opacity="0.9"></rect></g><text x="460" y="222" text-anchor="middle" font-size="13" font-weight="700">Huddle</text><text x="460" y="240" text-anchor="middle" font-size="11" class="muted-fill">chests together, arms linked, children in the middle</text><text x="320" y="24" text-anchor="middle" font-size="12" font-weight="700">Both need flotation. Both reduce heat loss from the chest sides, armpits and groin.</text></svg>
