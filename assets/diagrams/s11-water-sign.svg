<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" class="diagram" viewBox="0 0 640 320" role="img" aria-label="Landscape clues to water. Game trails converge and run downhill into a dry wash. A line of greener, taller vegetation follows the wash. Birds fly low and direct toward water at dawn and dusk. Dig at the outside of a bend in the wash, at the lowest point. All are clues, not proof, and any water found must be treated."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ws-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><rect x="0" y="0" width="640" height="320" fill="var(--sky)" opacity="0.35"></rect><path d="M0,120 L90,60 L180,110 L260,70 L360,130 L460,80 L560,120 L640,90 L640,320 L0,320 Z" fill="var(--ground)" opacity="0.45"></path><path d="M40,300 C160,250 200,230 260,240 C330,252 380,210 460,200 C520,192 580,220 640,210" fill="none" stroke="var(--accent-2)" stroke-width="18" opacity="0.35"></path><text x="560" y="236" text-anchor="start" font-size="11" font-weight="700">dry wash</text><path d="M70,258 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M110,245.41148922791595 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M150,235.17058030384206 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M190,229.0501002679189 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M230,227.81405146348635 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M270,231.03055711792086 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M310,237.17759983880265 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M350,244.01566455379242 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M390,249.13604990615858 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M430,250.55060235330194 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M470,247.17848549326277 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M510,239.11080651140782 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M550,227.58830996397853 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><path d="M590,214.6976002382437 l-4,-16 l4,-4 l4,4 z" fill="var(--ok)" opacity="0.85"></path><text x="120" y="222" text-anchor="start" font-size="10" font-weight="400">green line of trees / reeds</text><path d="M90,70 C110,140 170,180 250,236" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-dasharray="4 4"></path><path d="M260,80 C265,150 262,200 262,236" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-dasharray="4 4"></path><path d="M455,90 C420,150 360,190 300,232" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-dasharray="4 4"></path><text x="300" y="120" text-anchor="start" font-size="11" font-weight="700">game trails converge downhill</text><circle cx="252" cy="244" r="12" fill="var(--info)" opacity="0.7"></circle><text x="228" y="276" text-anchor="start" font-size="10" font-weight="700">dig: outside of bend, lowest point</text><path d="M430,30 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="var(--text)" stroke-width="1.5"></path><path d="M460,42 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="var(--text)" stroke-width="1.5"></path><path d="M490,34 q6,-6 12,0 q6,-6 12,0" fill="none" stroke="var(--text)" stroke-width="1.5"></path><line x1="500" y1="46" x2="290" y2="210" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ws-a)"></line><text x="630" y="62" text-anchor="end" font-size="10" font-weight="400">birds flying low and direct</text><text x="630" y="75" text-anchor="end" font-size="10" font-weight="400" class="muted-fill">at dawn/dusk (a clue, not proof)</text><rect x="10" y="10" width="250" height="40" rx="6" fill="var(--panel)" opacity="0.85" stroke="var(--line)"></rect><text x="20" y="27" text-anchor="start" font-size="11" font-weight="700">Several clues together beat one.</text><text x="20" y="42" text-anchor="start" font-size="11" font-weight="400">Treat all water; watch for flash floods.</text></svg>
