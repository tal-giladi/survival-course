<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="160" class="diagram" viewBox="0 0 740 160" role="img" aria-label="First hour timeline"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="10" y="20" width="140" height="120" rx="10" fill="var(--bad)" opacity="0.18" stroke="var(--bad)"></rect><text x="80" y="45" text-anchor="middle" font-size="14" font-weight="800">0–5 min</text><text x="80" y="68" text-anchor="middle" font-size="11">STOP. Immediate</text><text x="80" y="84" text-anchor="middle" font-size="11">danger? Injuries?</text></g><g><rect x="155" y="20" width="140" height="120" rx="10" fill="var(--accent-2)" opacity="0.18" stroke="var(--accent-2)"></rect><text x="225" y="45" text-anchor="middle" font-size="14" font-weight="800">5–15</text><text x="225" y="68" text-anchor="middle" font-size="11">Inventory. Call /</text><text x="225" y="84" text-anchor="middle" font-size="11">message if signal.</text><text x="225" y="100" text-anchor="middle" font-size="11">Mark position.</text></g><g><rect x="300" y="20" width="140" height="120" rx="10" fill="var(--warn)" opacity="0.18" stroke="var(--warn)"></rect><text x="370" y="45" text-anchor="middle" font-size="14" font-weight="800">15–30</text><text x="370" y="68" text-anchor="middle" font-size="11">Decide stay/move.</text><text x="370" y="84" text-anchor="middle" font-size="11">Protect from wet &amp;</text><text x="370" y="100" text-anchor="middle" font-size="11">wind now.</text></g><g><rect x="445" y="20" width="140" height="120" rx="10" fill="var(--accent)" opacity="0.18" stroke="var(--accent)"></rect><text x="515" y="45" text-anchor="middle" font-size="14" font-weight="800">30–60</text><text x="515" y="68" text-anchor="middle" font-size="11">Shelter &amp; insulation,</text><text x="515" y="84" text-anchor="middle" font-size="11">fire prep, water plan,</text><text x="515" y="100" text-anchor="middle" font-size="11">signals ready.</text></g><g><rect x="590" y="20" width="140" height="120" rx="10" fill="var(--info)" opacity="0.18" stroke="var(--info)"></rect><text x="660" y="45" text-anchor="middle" font-size="14" font-weight="800">60+</text><text x="660" y="68" text-anchor="middle" font-size="11">Reassess. Plan for</text><text x="660" y="84" text-anchor="middle" font-size="11">dark. Rest. Keep</text><text x="660" y="100" text-anchor="middle" font-size="11">signaling.</text></g></svg>
