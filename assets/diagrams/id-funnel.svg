<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" class="diagram" viewBox="0 0 760 300" role="img" aria-label="Identification funnel: legality, full key features, look-alike exclusion, expert confirmation, correct preparation; any doubt exits to do not eat"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="idf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><g><rect x="30" y="20" width="540" height="38" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="300" y="44" font-size="12.5" text-anchor="middle">1. Legal to pick here? Protected species? Permission?</text><line x1="570" y1="39" x2="620" y2="39" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#idf)"></line></g><g><rect x="52" y="72" width="495" height="38" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="299.5" y="96" font-size="12.5" text-anchor="middle">2. Every key feature checked, on a mature plant, in season</text><line x1="547" y1="91" x2="620" y2="91" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#idf)"></line></g><g><rect x="74" y="124" width="450" height="38" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="299" y="148" font-size="12.5" text-anchor="middle">3. Every look-alike in the region positively excluded</text><line x1="524" y1="143" x2="620" y2="143" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#idf)"></line></g><g><rect x="96" y="176" width="405" height="38" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="298.5" y="200" font-size="12.5" text-anchor="middle">4. Confirmed in person by a local expert</text><line x1="501" y1="195" x2="620" y2="195" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#idf)"></line></g><g><rect x="118" y="228" width="360" height="38" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="298" y="252" font-size="12.5" text-anchor="middle">5. Right part, stage and preparation; small amount</text><line x1="478" y1="247" x2="620" y2="247" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#idf)"></line></g><rect x="624" y="20" width="120" height="246" rx="10" fill="var(--bad)" opacity="0.15" stroke="var(--bad)"></rect><text x="684" y="130" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--bad)">Any doubt</text><text x="684" y="150" font-size="14" font-weight="700" text-anchor="middle" style="fill:var(--bad)">→ do not eat</text><text x="20" y="292" font-size="11" class="muted-fill">No “universal edibility test”, app or photo substitutes for any gate. This course never passes gate 4 — so you never eat what you identified here.</text></svg>
