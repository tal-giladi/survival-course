<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Sleeping-altitude profiles: a staged ascent with rest days versus a rapid ascent"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" y1="250" x2="600" y2="250" stroke="var(--muted)"></line><line x1="60" y1="250" x2="60" y2="40" stroke="var(--muted)"></line><text x="330" y="279" font-size="11" text-anchor="middle" class="muted-fill">day</text><text x="54" y="28" font-size="11" class="muted-fill">sleeping altitude (m)</text></g><text x="54" y="254" font-size="10" text-anchor="end" class="muted-fill">1000</text><text x="54" y="201.5" font-size="10" text-anchor="end" class="muted-fill">2000</text><text x="54" y="149" font-size="10" text-anchor="end" class="muted-fill">3000</text><text x="54" y="96.5" font-size="10" text-anchor="end" class="muted-fill">4000</text><text x="54" y="44" font-size="10" text-anchor="end" class="muted-fill">5000</text><text x="60" y="264" font-size="10" text-anchor="middle" class="muted-fill">0</text><text x="114" y="264" font-size="10" text-anchor="middle" class="muted-fill">1</text><text x="168" y="264" font-size="10" text-anchor="middle" class="muted-fill">2</text><text x="222" y="264" font-size="10" text-anchor="middle" class="muted-fill">3</text><text x="276" y="264" font-size="10" text-anchor="middle" class="muted-fill">4</text><text x="330" y="264" font-size="10" text-anchor="middle" class="muted-fill">5</text><text x="384" y="264" font-size="10" text-anchor="middle" class="muted-fill">6</text><text x="438" y="264" font-size="10" text-anchor="middle" class="muted-fill">7</text><text x="492" y="264" font-size="10" text-anchor="middle" class="muted-fill">8</text><text x="546" y="264" font-size="10" text-anchor="middle" class="muted-fill">9</text><text x="600" y="264" font-size="10" text-anchor="middle" class="muted-fill">10</text><line x1="60" x2="600" y1="145" y2="145" stroke="var(--muted)" stroke-dasharray="4 4"></line><text x="64" y="141" font-size="10" class="muted-fill">above 3,000 m: ≤ 500 m/day gain in sleeping altitude, rest day every 3–4 days</text><path d="M60,155.5 L114,155.5 L114,145 L168,145 L168,118.75 L222,118.75 L222,97.75 L276,97.75 L276,97.75 L330,97.75 L330,76.75 L384,76.75 L384,55.75 L438,55.75 L438,55.75 L492,55.75 L492,40 L546,40 L546,40 L600,40" fill="none" stroke="var(--ok)" stroke-width="2.6"></path><path d="M60,103 L114,103 L114,50.5 L168,50.5 L168,50.5 L222,50.5 L222,50.5 L276,50.5 L276,50.5 L330,50.5 L330,50.5 L384,50.5 L384,50.5 L438,50.5 L438,50.5 L492,50.5 L492,50.5 L546,50.5 L546,50.5 L600,50.5" fill="none" stroke="var(--bad)" stroke-width="2.6" stroke-dasharray="6 4"></path><text x="394.8" y="68.875" font-size="11" style="fill:var(--ok)">staged ascent</text><text x="178.8" y="42.625" font-size="11" style="fill:var(--bad)">fly/drive in, sleep high: high AMS risk</text></svg>
