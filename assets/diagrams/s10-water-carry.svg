<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Carrying water: a bin bag liner inside a rucksack separates the waterproof function from the load-carrying function; water weighs 1 kilogram per litre; use food-safe containers, never ones that held fuel or chemicals"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700">Separate the jobs: the liner holds water, the pack carries it</text><rect x="60" y="60" width="130" height="170" rx="24" fill="var(--ground)" opacity="0.55" stroke="var(--line)"></rect><rect x="72" y="80" width="106" height="140" rx="18" fill="var(--info)" opacity="0.55" stroke="var(--info)" stroke-dasharray="4 3"></rect><path d="M 100 80 q 25 -26 50 0" fill="none" stroke="var(--text)" stroke-width="2"></path><text x="125" y="150" text-anchor="middle" font-size="12" font-weight="700">8 L = 8 kg</text><text x="125" y="166" text-anchor="middle" font-size="10" class="muted-fill">liner twisted,</text><text x="125" y="178" text-anchor="middle" font-size="10" class="muted-fill">folded, tied</text><text x="125" y="250" text-anchor="middle" font-size="11">pack = support + straps</text><text x="125" y="264" text-anchor="middle" font-size="11">bag = waterproof liner</text><text x="250" y="62" font-size="12" font-weight="700" style="fill:var(--ok)">Good</text><text x="250" y="82" font-size="11">✓ Drinks bottles, bladders (food-grade)</text><text x="250" y="100" font-size="11">✓ New, unscented bag inside a pack or hole</text><text x="250" y="118" font-size="11">✓ Dry bag or stuff sack with liner</text><text x="250" y="136" font-size="11">✓ Cooking pot with lid (short distances)</text><text x="250" y="170" font-size="12" font-weight="700" style="fill:var(--bad)">Never</text><text x="250" y="190" font-size="11">✗ Anything that held fuel, oil, pesticide or chemicals</text><text x="250" y="208" font-size="11">✗ Scented or treated bin bags</text><text x="250" y="226" font-size="11">✗ Containers you cannot close in a pack</text><text x="250" y="264" font-size="11" class="muted-fill">Improvised containers are not treatment: treat the water (Stages 1 and 4).</text></svg>
