<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" class="diagram" viewBox="0 0 560 280" role="img" aria-label="Forward bearing 065 degrees and back bearing 245 degrees"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="bbf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="bbb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="bbn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><g><line x1="110" y1="220" x2="110" y2="150" stroke="var(--info)" stroke-width="1.5" marker-end="url(#bbn)"></line><text x="110" y="144" font-size="11" text-anchor="middle" style="fill:var(--info)">N</text></g><g><line x1="381.89" y1="93.21" x2="381.89" y2="23.21" stroke="var(--info)" stroke-width="1.5" marker-end="url(#bbn)"></line><text x="381.89" y="17.21" font-size="11" text-anchor="middle" style="fill:var(--info)">N</text></g><line x1="110" y1="220" x2="373.89" y2="97.21" stroke="var(--accent-2)" stroke-width="3" marker-end="url(#bbf)"></line><line x1="381.89" y1="107.21" x2="122" y2="230" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#bbb)"></line><circle cx="110" cy="220" r="6" fill="var(--text)"></circle><text x="100" y="240" font-size="12" text-anchor="end" font-weight="700">Start</text><circle cx="381.89" cy="93.21" r="6" fill="var(--text)"></circle><text x="391.89" y="87.21" font-size="12" text-anchor="start" font-weight="700">Target</text><text x="250" y="120" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent-2)">forward 065°</text><text x="260" y="200" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent)">back 245°</text><text x="20" y="266" font-size="12" text-anchor="start">Back bearing = forward ± 180°. Sighting back at the start shows whether you have drifted sideways.</text></svg>
