<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" class="diagram" viewBox="0 0 760 210" role="img" aria-label="Five gates for any wild animal harvest: legal, trained, ethical, safe, energetically worth it"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="14" y="30" width="128" height="92" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="78" y="62" font-size="15" font-weight="700" text-anchor="middle">Legal?</text><foreignObject x="20" y="70" width="116" height="50"><div style="font-size:11px;line-height:1.25;text-align:center;color:var(--muted)">licence, season, species, method, place</div></foreignObject><line x1="142" y1="76" x2="160" y2="76" stroke="var(--accent)" stroke-width="2" marker-end="url(#hg)"></line></g><g><rect x="162" y="30" width="128" height="92" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="226" y="62" font-size="15" font-weight="700" text-anchor="middle">Trained?</text><foreignObject x="168" y="70" width="116" height="50"><div style="font-size:11px;line-height:1.25;text-align:center;color:var(--muted)">hunter education, supervised practice</div></foreignObject><line x1="290" y1="76" x2="308" y2="76" stroke="var(--accent)" stroke-width="2" marker-end="url(#hg)"></line></g><g><rect x="310" y="30" width="128" height="92" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="374" y="62" font-size="15" font-weight="700" text-anchor="middle">Ethical?</text><foreignObject x="316" y="70" width="116" height="50"><div style="font-size:11px;line-height:1.25;text-align:center;color:var(--muted)">humane, no non-target catches, fair chase</div></foreignObject><line x1="438" y1="76" x2="456" y2="76" stroke="var(--accent)" stroke-width="2" marker-end="url(#hg)"></line></g><g><rect x="458" y="30" width="128" height="92" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="522" y="62" font-size="15" font-weight="700" text-anchor="middle">Safe?</text><foreignObject x="464" y="70" width="116" height="50"><div style="font-size:11px;line-height:1.25;text-align:center;color:var(--muted)">firearms, knives, zoonoses, terrain</div></foreignObject><line x1="586" y1="76" x2="604" y2="76" stroke="var(--accent)" stroke-width="2" marker-end="url(#hg)"></line></g><g><rect x="606" y="30" width="128" height="92" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="670" y="62" font-size="15" font-weight="700" text-anchor="middle">Worth it?</text><foreignObject x="612" y="70" width="116" height="50"><div style="font-size:11px;line-height:1.25;text-align:center;color:var(--muted)">energy, time and water vs. return</div></foreignObject></g><text x="380" y="160" font-size="12.5" text-anchor="middle" font-weight="700">Fail any gate → don’t. In a short emergency, the answer is almost always “ration and get rescued”.</text><text x="380" y="184" font-size="11" text-anchor="middle" class="muted-fill">This course teaches concepts only — no trap, snare or weapon methods. Learn those, where legal, from licensed instructors.</text></svg>
