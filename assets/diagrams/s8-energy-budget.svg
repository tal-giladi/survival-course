<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" class="diagram" viewBox="0 0 640 230" role="img" aria-label="Approximate daily energy expenditure for rest, hiking, cold-weather travel and polar sledge hauling"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><text x="220" y="44" text-anchor="end" font-size="12">Resting, 24 h (temperate)</text><rect x="230" y="28" width="83.6923076923077" height="24" rx="5" fill="var(--ok)" opacity="0.85"></rect><text x="319.6923076923077" y="45" font-size="11.5" font-weight="700">≈ 1,700 kcal</text></g><g><text x="220" y="88" text-anchor="end" font-size="12">Hiking day, temperate</text><rect x="230" y="72" width="157.53846153846155" height="24" rx="5" fill="var(--info)" opacity="0.85"></rect><text x="393.53846153846155" y="89" font-size="11.5" font-weight="700">≈ 3,200 kcal</text></g><g><text x="220" y="132" text-anchor="end" font-size="12">Cold-weather travel, hauling</text><rect x="230" y="116" width="221.53846153846155" height="24" rx="5" fill="var(--accent-2)" opacity="0.85"></rect><text x="457.53846153846155" y="133" font-size="11.5" font-weight="700">≈ 4,500 kcal</text></g><g><text x="220" y="176" text-anchor="end" font-size="12">Heavy sledge hauling, polar</text><rect x="230" y="160" width="295.3846153846154" height="24" rx="5" fill="var(--bad)" opacity="0.85"></rect><text x="531.3846153846155" y="177" font-size="11.5" font-weight="700">≈ 6,000 kcal</text></g><text x="320" y="216" text-anchor="middle" font-size="10" class="muted-fill">Approximate values for a 70 kg adult. Cold adds cost through heavy clothing, snow travel and shivering.</text></svg>
