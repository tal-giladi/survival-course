<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Random errors grow with the square root of the number of legs; systematic bias grows linearly"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="12" text-anchor="start" font-weight="700">Four 500 m legs, pace error ±5 % (±25 m) each</text><line x1="60" x2="540" y1="110" y2="110" stroke="var(--text)" stroke-width="2"></line><g><circle cx="60" cy="110" r="4" fill="var(--text)"></circle><text x="60" y="96" font-size="10" text-anchor="middle">start</text></g><g><circle cx="180" cy="110" r="4" fill="var(--text)"></circle><text x="180" y="96" font-size="10" text-anchor="middle">leg 1</text></g><g><circle cx="300" cy="110" r="4" fill="var(--text)"></circle><text x="300" y="96" font-size="10" text-anchor="middle">leg 2</text></g><g><circle cx="420" cy="110" r="4" fill="var(--text)"></circle><text x="420" y="96" font-size="10" text-anchor="middle">leg 3</text></g><g><circle cx="540" cy="110" r="4" fill="var(--text)"></circle><text x="540" y="96" font-size="10" text-anchor="middle">leg 4</text></g><g><circle cx="180" cy="110" r="22.5" fill="var(--info)" opacity="0.12" stroke="var(--info)"></circle><text x="180" y="146.5" font-size="10" text-anchor="middle" style="fill:var(--info)">±25 m</text></g><g><circle cx="300" cy="110" r="31.82" fill="var(--info)" opacity="0.12" stroke="var(--info)"></circle><text x="300" y="155.82" font-size="10" text-anchor="middle" style="fill:var(--info)">±35 m</text></g><g><circle cx="420" cy="110" r="38.97" fill="var(--info)" opacity="0.12" stroke="var(--info)"></circle><text x="420" y="162.97" font-size="10" text-anchor="middle" style="fill:var(--info)">±43 m</text></g><g><circle cx="540" cy="110" r="45" fill="var(--info)" opacity="0.12" stroke="var(--info)"></circle><text x="540" y="169" font-size="10" text-anchor="middle" style="fill:var(--info)">±50 m</text></g><text x="20" y="60" font-size="11" text-anchor="start" style="fill:var(--info)">Random errors partly cancel: σ_total = σ_leg × √n</text><line x1="60" x2="540" y1="230" y2="230" stroke="var(--text)" stroke-width="2"></line><circle cx="60" cy="230" r="4" fill="var(--text)"></circle><circle cx="180" cy="230" r="4" fill="var(--text)"></circle><circle cx="300" cy="230" r="4" fill="var(--text)"></circle><circle cx="420" cy="230" r="4" fill="var(--text)"></circle><circle cx="540" cy="230" r="4" fill="var(--text)"></circle><g><line x1="180" x2="157.5" y1="230" y2="230" stroke="var(--bad)" stroke-width="5" opacity="0.7"></line><text x="180" y="252" font-size="10" text-anchor="middle" style="fill:var(--bad)">25 m short</text></g><g><line x1="300" x2="255" y1="230" y2="230" stroke="var(--bad)" stroke-width="5" opacity="0.7"></line><text x="300" y="252" font-size="10" text-anchor="middle" style="fill:var(--bad)">50 m short</text></g><g><line x1="420" x2="352.5" y1="230" y2="230" stroke="var(--bad)" stroke-width="5" opacity="0.7"></line><text x="420" y="252" font-size="10" text-anchor="middle" style="fill:var(--bad)">75 m short</text></g><g><line x1="540" x2="450" y1="230" y2="230" stroke="var(--bad)" stroke-width="5" opacity="0.7"></line><text x="540" y="252" font-size="10" text-anchor="middle" style="fill:var(--bad)">100 m short</text></g><text x="20" y="200" font-size="11" text-anchor="start" style="fill:var(--bad)">A systematic bias (e.g. shorter paces uphill, uncorrected) adds every leg: n × b</text><text x="20" y="286" font-size="11" text-anchor="start" class="muted-fill">After 4 legs: random ≈ ±50 m, systematic = 100 m. Calibrate out the bias; re-fix position often.</text></svg>
