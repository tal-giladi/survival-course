<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" class="diagram" viewBox="0 0 740 330" role="img" aria-label="Energy cost of a half-day work block versus what it returns. Water, firewood and shelter cost about 350 kcal and return essentials; signals and repair cost about 150 kcal; food-getting costs about 350 kcal and returns 0 to 250 kcal on average, so it usually loses energy in a short wait; rest costs nothing."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700">What a work block costs — and what it buys (illustrative)</text><text x="20" y="44" font-size="11" class="muted-fill">Cost in extra kcal above camp life, for about 2–3 hours of work</text><g><text x="20" y="77" font-size="12" font-weight="700">Collect + treat water</text><rect x="180" y="64" width="140" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="326" y="77" font-size="11">350 kcal</text><text x="395" y="77" font-size="11" style="fill:var(--text)">→ ≈ 5 L safe water — covers a day</text></g><g><text x="20" y="113" font-size="12" font-weight="700">Firewood</text><rect x="180" y="100" width="140" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="326" y="113" font-size="11">350 kcal</text><text x="395" y="113" font-size="11" style="fill:var(--text)">→ a night of fire + boiling</text></g><g><text x="20" y="149" font-size="12" font-weight="700">Improve shelter / bed</text><rect x="180" y="136" width="140" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="326" y="149" font-size="11">350 kcal</text><text x="395" y="149" font-size="11" style="fill:var(--text)">→ warmer, better sleep every night</text></g><g><text x="20" y="185" font-size="12" font-weight="700">Signals</text><rect x="180" y="172" width="60" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="246" y="185" font-size="11">150 kcal</text><text x="395" y="185" font-size="11" style="fill:var(--text)">→ the fastest way home</text></g><g><text x="20" y="221" font-size="12" font-weight="700">Repair / maintain</text><rect x="180" y="208" width="60" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="246" y="221" font-size="11">150 kcal</text><text x="395" y="221" font-size="11" style="fill:var(--text)">→ prevents bigger failures</text></g><g><text x="20" y="257" font-size="12" font-weight="700">Food-getting</text><rect x="180" y="244" width="140" height="18" rx="4" fill="var(--bad)" opacity="0.85"></rect><text x="326" y="257" font-size="11">350 kcal</text><text x="395" y="257" font-size="11" style="fill:var(--bad)">✗ ≈ 0–250 kcal, highly variable</text></g><g><text x="20" y="293" font-size="12" font-weight="700">Rest / nap</text><rect x="180" y="280" width="0" height="18" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="186" y="293" font-size="11">0 kcal</text><text x="395" y="293" font-size="11" style="fill:var(--text)">→ repays sleep debt, saves water</text></g><text x="20" y="318" font-size="11" class="muted-fill">In a wait of days, food-getting rarely repays its energy and water cost. Where legal, passive methods that work while you do other tasks cost least.</text></svg>
