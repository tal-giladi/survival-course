<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" class="diagram" viewBox="0 0 760 360" role="img" aria-label="Wildfire on a slope runs uphill; plan escape routes across or down to a safety zone and avoid chimneys and saddles"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="we" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="we2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"></path></marker></defs><rect x="0" y="0" width="760" height="360" fill="var(--sky)"></rect><path d="M0,330 L300,120 L380,160 L470,70 L760,300 L760,360 L0,360 Z" fill="var(--ground)" opacity="0.55"></path><path d="M370,158 L385,150 L400,340 L360,340 Z" fill="var(--ground)" opacity="0.4"></path><text x="395" y="210" font-size="11" font-weight="600">chimney / gully</text><text x="380" y="150" text-anchor="middle" font-size="11" font-weight="600">saddle</text><path d="M60,320 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><path d="M88,302 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><path d="M116,284 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><path d="M144,266 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><path d="M172,248 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><path d="M200,230 q6,-22 12,-4 q4,-16 10,4 z" fill="var(--bad)" opacity="0.85"></path><line x1="120" y1="270" x2="260" y2="160" stroke="var(--bad)" stroke-width="4" marker-end="url(#we)"></line><text x="150" y="250" font-size="12" font-weight="700" transform="rotate(-36 150 250)">fire runs uphill</text><text x="20" y="352" font-size="11" font-weight="600">fastest in the afternoon, and through chimneys and saddles</text><circle cx="300" cy="126" r="7" fill="var(--accent)"></circle><text x="318" y="108" font-size="11" font-weight="700">you</text><path d="M300,130 Q420,120 560,200 L640,250" stroke="var(--ok)" stroke-width="3" stroke-dasharray="8 5" fill="none" marker-end="url(#we2)"></path><text x="520" y="185" font-size="11.5" font-weight="700">escape route (pre-scouted, timed)</text><ellipse cx="660" cy="270" rx="70" ry="22" fill="var(--ok)" opacity="0.35" stroke="var(--ok)"></ellipse><text x="660" y="275" text-anchor="middle" font-size="11" font-weight="700">safety zone</text><text x="660" y="310" text-anchor="middle" font-size="10.5" class="muted-fill">already burned, rock, water, bare ground;</text><text x="660" y="324" text-anchor="middle" font-size="10.5" class="muted-fill">radius ≥ 4 × flame height (NWCG)</text><g transform="translate(20,20)"><rect x="0" y="0" width="210" height="96" rx="6" fill="var(--panel)" stroke="var(--line)"></rect><text x="10" y="20" font-size="12" font-weight="700">LCES</text><text x="10" y="38" font-size="11">Lookouts — someone watches the fire</text><text x="10" y="54" font-size="11">Communications — everyone warned</text><text x="10" y="70" font-size="11">Escape routes — two, known, timed</text><text x="10" y="86" font-size="11">Safety zones — big enough, reachable</text></g></svg>
