<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" class="diagram" viewBox="0 0 720 240" role="img" aria-label="Four tarp pitches: A-frame, lean-to, diamond and wedge, each shown relative to the wind"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tp-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><g><rect x="5" y="10" width="170" height="220" rx="8" fill="var(--panel-2)"></rect><text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700">A-frame</text><text x="90" y="214" text-anchor="middle" font-size="10" class="muted-fill">rain from both sides; ends open</text><g><line x1="30" y1="80" x2="150" y2="80" stroke="var(--muted)"></line><path d="M90,80 L40,180 L140,180 Z" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="3"></path><path d="M20,120 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path><path d="M20,134 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path></g></g><g><rect x="185" y="10" width="170" height="220" rx="8" fill="var(--panel-2)"></rect><text x="270" y="32" text-anchor="middle" font-size="13" font-weight="700">Lean-to</text><text x="270" y="214" text-anchor="middle" font-size="10" class="muted-fill">back to wind; open to a fire</text><g><line x1="230" y1="80" x2="330" y2="80" stroke="var(--muted)"></line><path d="M300,80 L220,180" stroke="var(--accent)" stroke-width="4"></path><path d="M195,130 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path><path d="M195,144 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path><path d="M320,175 q6,-18 12,0 q-6,-8 -12,0" fill="var(--accent-2)"></path></g></g><g><rect x="365" y="10" width="170" height="220" rx="8" fill="var(--panel-2)"></rect><text x="450" y="32" text-anchor="middle" font-size="13" font-weight="700">Diamond</text><text x="450" y="214" text-anchor="middle" font-size="10" class="muted-fill">one corner staked into the wind</text><g><path d="M400,180 L450,70 L520,120 L470,190 Z" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="3"></path><line x1="450" y1="70" x2="450" y2="180" stroke="var(--text)" stroke-width="2"></line><path d="M372,160 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path><path d="M372,174 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path></g></g><g><rect x="545" y="10" width="170" height="220" rx="8" fill="var(--panel-2)"></rect><text x="630" y="32" text-anchor="middle" font-size="13" font-weight="700">Wedge</text><text x="630" y="214" text-anchor="middle" font-size="10" class="muted-fill">low closed end into the wind</text><g><path d="M570,180 L690,100 L690,180 Z" fill="var(--accent)" opacity="0.25" stroke="var(--accent)" stroke-width="3"></path><line x1="690" y1="100" x2="690" y2="180" stroke="var(--text)" stroke-width="2"></line><path d="M548,150 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path><path d="M548,164 l30,0" stroke="var(--info)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#tp-w)"></path></g></g></svg>
