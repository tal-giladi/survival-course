<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="258" class="diagram" viewBox="0 0 700 258" role="img" aria-label="Smoke must contrast with its background: pale smoke from green or damp fuel shows against dark forest; dark smoke from rubber or oil shows against snow or a pale sky. Wind flattens a smoke column so it hugs the ground; smoke signals work best in calm air in the morning."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="20" width="210" height="190" rx="10" fill="var(--ground)" opacity="0.7"></rect><g><circle cx="100" cy="170" r="12" fill="var(--panel)" opacity="0.85"></circle><circle cx="104" cy="148" r="17" fill="var(--panel)" opacity="0.73"></circle><circle cx="108" cy="126" r="22" fill="var(--panel)" opacity="0.61"></circle><circle cx="112" cy="104" r="27" fill="var(--panel)" opacity="0.49"></circle></g><text x="115" y="232" text-anchor="middle" font-size="12" font-weight="700">Pale smoke vs dark forest ✓</text><rect x="245" y="20" width="210" height="190" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><g><circle cx="335" cy="170" r="12" fill="var(--text)" opacity="0.85"></circle><circle cx="339" cy="148" r="17" fill="var(--text)" opacity="0.73"></circle><circle cx="343" cy="126" r="22" fill="var(--text)" opacity="0.61"></circle><circle cx="347" cy="104" r="27" fill="var(--text)" opacity="0.49"></circle></g><text x="350" y="232" text-anchor="middle" font-size="12" font-weight="700">Dark smoke vs snow or haze ✓</text><rect x="480" y="20" width="210" height="190" rx="10" fill="var(--sky)" opacity="0.35"></rect><ellipse cx="530" cy="175" rx="18" ry="8" fill="var(--muted)" opacity="0.7"></ellipse><ellipse cx="560" cy="169" rx="22" ry="8" fill="var(--muted)" opacity="0.6"></ellipse><ellipse cx="590" cy="163" rx="26" ry="8" fill="var(--muted)" opacity="0.49999999999999994"></ellipse><ellipse cx="620" cy="157" rx="30" ry="8" fill="var(--muted)" opacity="0.3999999999999999"></ellipse><ellipse cx="650" cy="151" rx="34" ry="8" fill="var(--muted)" opacity="0.29999999999999993"></ellipse><text x="600" y="60" text-anchor="middle" font-size="12">wind →</text><text x="585" y="232" text-anchor="middle" font-size="12" font-weight="700">Wind flattens the column ✗</text><text x="350" y="248" text-anchor="middle" font-size="10" class="muted-fill">Only where fire is legal and safe — never in high fire danger. Prepare the fire in advance; light it when you hear or see searchers.</text></svg>
