<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" class="diagram" viewBox="0 0 700 260" role="img" aria-label="VHF and UHF radio travels roughly line of sight. From a valley floor the ridge blocks the signal; from the ridge top the radio horizon is much larger. Radio horizon in kilometres is about 4.1 times the square root of antenna height in metres, for each end of the link."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M0 230 L120 230 L200 120 L260 90 L330 150 L400 215 L470 225 L700 225 L700 260 L0 260 Z" fill="var(--ground)" opacity="0.7"></path><circle cx="420" cy="208" r="7" fill="var(--bad)"></circle><text x="420" y="196" text-anchor="middle" font-size="11" font-weight="700">valley</text><line x1="420" y1="208" x2="120" y2="160" stroke="var(--bad)" stroke-dasharray="5 4"></line><text x="275" y="170" font-size="10.5" fill="var(--bad)" style="fill:var(--bad)">blocked</text><circle cx="260" cy="84" r="7" fill="var(--ok)"></circle><text x="245" y="80" text-anchor="end" font-size="11" font-weight="700">ridge top</text><line x1="260" y1="84" x2="660" y2="160" stroke="var(--ok)" stroke-width="2"></line><line x1="260" y1="84" x2="20" y2="170" stroke="var(--ok)" stroke-width="2"></line><rect x="640" y="130" width="12" height="30" fill="var(--info)"></rect><text x="646" y="122" text-anchor="middle" font-size="11">repeater / team</text><text x="20" y="28" font-size="13" font-weight="700">Radio horizon (km) ≈ 4.1 × (√h₁ + √h₂), heights in m</text><text x="20" y="48" font-size="11">Hand-held at 1.5 m to another at 1.5 m on flat ground: ≈ 10 km at best — much less in forest or hills.</text><text x="20" y="64" font-size="11">Climb: 1.5 m on a hill 300 m above the plain to a team at 1.5 m: ≈ 4.1 × (17.4 + 1.2) ≈ 76 km line of sight.</text></svg>
