<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="diagram" viewBox="0 0 700 300" role="img" aria-label="Rain catchment: a tilted tarp catches rain over its horizontal footprint; 1 millimetre on 1 square metre equals 1 litre"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><line x1="120" y1="20" x2="112" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="150" y1="20" x2="142" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="180" y1="20" x2="172" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="210" y1="20" x2="202" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="240" y1="20" x2="232" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="270" y1="20" x2="262" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="300" y1="20" x2="292" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="330" y1="20" x2="322" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="360" y1="20" x2="352" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="390" y1="20" x2="382" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="420" y1="20" x2="412" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="450" y1="20" x2="442" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="480" y1="20" x2="472" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="510" y1="20" x2="502" y2="60" stroke="var(--info)" stroke-width="2"></line><line x1="140" y1="150" x2="440" y2="100" stroke="var(--accent)" stroke-width="6"></line><line x1="140" y1="150" x2="140" y2="230" stroke="var(--text)" stroke-width="3"></line><line x1="440" y1="100" x2="440" y2="230" stroke="var(--text)" stroke-width="3"></line><path d="M140,150 Q130,170 150,190" stroke="var(--info)" stroke-width="3" fill="none" marker-end="url(#rc-a)"></path><rect x="130" y="192" width="44" height="38" rx="4" fill="var(--info)" opacity="0.35" stroke="var(--text)"></rect><text x="126" y="248" font-size="11">Container</text><line x1="140" y1="270" x2="440" y2="270" stroke="var(--accent-2)" stroke-width="2"></line><line x1="140" y1="262" x2="140" y2="278" stroke="var(--accent-2)" stroke-width="2"></line><line x1="440" y1="262" x2="440" y2="278" stroke="var(--accent-2)" stroke-width="2"></line><text x="290" y="292" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--accent-2)">Horizontal footprint counts, not fabric area</text><text x="300" y="98" text-anchor="middle" font-size="12" font-weight="700" transform="rotate(-9 300 98)">Tarp</text><g transform="translate(470,80)"><rect width="215" height="150" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="12" y="26" font-size="13" font-weight="700">V = A × R × η</text><text x="12" y="50" font-size="12">A = footprint (m²)</text><text x="12" y="70" font-size="12">R = rainfall (mm)</text><text x="12" y="90" font-size="12">η = capture efficiency (0.6–0.9)</text><text x="12" y="116" font-size="12" font-weight="700">1 mm on 1 m² = 1 L</text><text x="12" y="138" font-size="11">6 m² × 10 mm × 0.8 = 48 L</text></g></svg>
