" x2="245" y2="172" stroke="var(--ground)" stroke-width="5"></line><line x1="375" y1="102" x2="375" y2="172" stroke="var(--ground)" stroke-width="5"></line><circle cx="282" cy="140" r="10" fill="var(--text)"></circle><path d="M272,132 Q282,120 296,134 M292,146 L340,150 M300,148 L298,170 M336,150 L346,170" stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none"></path><line x1="225" y1="172" x2="395" y2="172" stroke="var(--ground)" stroke-width="3"></line></g><text x="310" y="210" text-anchor="middle" font-size="11" class="muted-fill">head and neck, under a sturdy table</text></g><g><rect x="415" y="20" width="190" height="200" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="510" y="44" text-anchor="middle" font-size="16" font-weight="800">HOLD ON</text><g><rect x="435" y="92" width="150" height="10" fill="var(--ground)"></rect><line x1="445" y1="102" x2="445" y2="172" stroke="var(--accent-2)" stroke-width="6"></line><line x1="575" y1="102" x2="575" y2="172" stroke="var(--ground)" stroke-width="5"></line><circle cx="482" cy="140" r="10" fill="var(--text)"></circle><path d="M470,138 L447,128 M492,146 L540,150 M500,148 L498,170 M536,150 L546,170" stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none"></path><line x1="425" y1="172" x2="595" y2="172" stroke="var(--ground)" stroke-width="3"></line></g><text x="510" y="210" text-anchor="middle" font-size="11" class="muted-fill">until the shaking stops</text></g></svg>
