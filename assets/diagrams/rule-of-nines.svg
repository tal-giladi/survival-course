<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" class="diagram" viewBox="0 0 700 380" role="img" aria-label="Rule of nines for adults: head 9 percent, each arm 9, front of trunk 18, back of trunk 18, each leg 18, genitals 1; the patient’s palm with fingers is about 1 percent"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><circle cx="180" cy="50" r="28" fill="var(--accent)" opacity="0.75"></circle><text x="180" y="55" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">9</text><rect x="135" y="82" width="90" height="130" rx="10" fill="var(--accent-2)" opacity="0.7"></rect><text x="180" y="150" text-anchor="middle" font-size="15" font-weight="700" style="fill:#fff">18</text><text x="180" y="168" text-anchor="middle" font-size="10" style="fill:#fff">front</text><rect x="100" y="86" width="30" height="130" rx="12" fill="var(--info)" opacity="0.7"></rect><text x="115" y="155" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">9</text><rect x="230" y="86" width="30" height="130" rx="12" fill="var(--info)" opacity="0.7"></rect><text x="245" y="155" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">9</text><rect x="137" y="216" width="40" height="150" rx="14" fill="var(--ok)" opacity="0.7"></rect><text x="157" y="295" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">18</text><rect x="183" y="216" width="40" height="150" rx="14" fill="var(--ok)" opacity="0.7"></rect><text x="203" y="295" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">18</text><circle cx="180" cy="214" r="7" fill="var(--bad)"></circle><text x="240" y="236" font-size="11">1 (genitals)</text><text x="180" y="20" text-anchor="middle" font-size="12" class="muted-fill">adult, front view</text><rect x="330" y="82" width="90" height="130" rx="10" fill="var(--accent-2)" opacity="0.4" stroke="var(--accent-2)" stroke-dasharray="5 3"></rect><text x="375" y="150" text-anchor="middle" font-size="15" font-weight="700">18</text><text x="375" y="168" text-anchor="middle" font-size="10">back of trunk</text><text x="330" y="330" font-size="11">Total: 9 + 9 + 9 + 18 + 18 + 18 + 18 + 1 = 100 %</text><g transform="translate(470,60)"><rect width="210" height="140" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><path d="M60,120 L60,70 Q60,58 70,58 L70,40 Q76,30 82,40 L82,58 L88,30 Q94,22 100,30 L98,58 L108,34 Q114,26 120,34 L114,62 L126,48 Q134,44 136,54 L120,92 Q112,120 90,120 Z" fill="var(--accent)" opacity="0.6"></path><text x="150" y="80" font-size="13" font-weight="700">≈ 1 %</text><text x="105" y="136" text-anchor="middle" font-size="10.5" class="muted-fill">patient’s palm + fingers</text></g><text x="470" y="230" font-size="11" class="muted-fill">Use the palm for small or scattered burns.</text><text x="470" y="246" font-size="11" class="muted-fill">Count partial + full thickness only.</text><text x="470" y="262" font-size="11" class="muted-fill">Children: bigger head, smaller legs —</text><text x="470" y="278" font-size="11" class="muted-fill">adult nines under-count the head.</text></svg>
