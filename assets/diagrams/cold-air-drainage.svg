<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" class="diagram" viewBox="0 0 720 300" role="img" aria-label="Valley cross-section on a calm clear night: cold air drains downslope and pools in the valley floor, leaving a warmer belt part-way up the slopes"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect width="720" height="300" fill="var(--sky)" opacity="0.35"></rect><path d="M0,40 L200,150 L320,250 L400,255 L520,160 L720,50 L720,300 L0,300 Z" fill="var(--ground)" opacity="0.7"></path><path d="M250,200 L320,248 L400,252 L470,200 Q360,215 250,200 Z" fill="var(--info)" opacity="0.35"></path><path d="M40,70 L170,138" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ca)"></path><path d="M640,80 L540,150" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ca)"></path><path d="M150,125 L250,185" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ca)"></path><path d="M600,105 L500,170" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ca)"></path><text x="360" y="238" text-anchor="middle" font-size="12" font-weight="700">cold pool: −4 °C, frost, fog</text><rect x="150" y="100" width="120" height="16" fill="var(--ok)" opacity="0.25"></rect><text x="120" y="96" font-size="12" font-weight="700" style="fill:var(--ok)">thermal belt: +1 °C</text><text x="20" y="30" font-size="12">ridge: +0 °C but windy</text><text x="710" y="30" font-size="12" text-anchor="end">clear sky → strong radiative cooling of the ground</text><text x="560" y="140" font-size="11" class="muted-fill">dense cold air flows downhill</text><text x="360" y="292" text-anchor="middle" font-size="11" class="muted-fill">Illustrative values for a calm, clear night. Wind or cloud mixes the air and removes most of the difference.</text></svg>
