<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" class="diagram" viewBox="0 0 720 330" role="img" aria-label="Landscape cross-section showing where to look for water: valley bottoms, outer bends of dry washes, bases of cliffs, green vegetation lines, converging animal trails and bird flight lines"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="wt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="wt-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><rect width="720" height="330" fill="var(--sky)" opacity="0.5"></rect><path d="M0,120 L120,80 L200,110 L250,100 L260,200 L330,240 L420,250 L520,230 L600,160 L720,140 L720,330 L0,330 Z" fill="var(--ground)" opacity="0.55"></path><path d="M250,100 L262,200" stroke="var(--text)" stroke-width="3"></path><text x="140" y="70" font-size="12" font-weight="700">Cliff</text><circle cx="268" cy="206" r="7" fill="var(--info)"></circle><text x="190" y="228" font-size="11.5">Seep at cliff base</text><path d="M340,245 Q380,262 420,250" stroke="var(--info)" stroke-width="6" fill="none" opacity="0.8"></path><text x="330" y="282" font-size="11.5">Lowest point / outer bend of a dry wash:</text><text x="330" y="297" font-size="11.5">dig in damp sand</text><g><line x1="300" y1="228" x2="300" y2="200" stroke="var(--accent)" stroke-width="3"></line><circle cx="300" cy="196" r="12" fill="var(--accent)"></circle></g><g><line x1="322" y1="228" x2="322" y2="200" stroke="var(--accent)" stroke-width="3"></line><circle cx="322" cy="196" r="12" fill="var(--accent)"></circle></g><g><line x1="470" y1="240" x2="470" y2="210" stroke="var(--accent)" stroke-width="3"></line><circle cx="470" cy="205" r="12" fill="var(--accent)"></circle></g><g><line x1="492" y1="240" x2="492" y2="210" stroke="var(--accent)" stroke-width="3"></line><circle cx="492" cy="205" r="12" fill="var(--accent)"></circle></g><g><line x1="514" y1="240" x2="514" y2="210" stroke="var(--accent)" stroke-width="3"></line><circle cx="514" cy="205" r="12" fill="var(--accent)"></circle></g><text x="455" y="185" font-size="11.5">Green line of willows, reeds,</text><text x="455" y="199" font-size="11.5">cottonwoods or palms</text><path d="M600,165 Q540,190 505,232" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#wt-b)"></path><path d="M690,150 Q600,200 520,238" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#wt-b)"></path><text x="540" y="140" font-size="11.5">Game trails converge downhill</text><path d="M40,40 Q200,20 300,170" stroke="var(--info)" stroke-width="1.8" fill="none" marker-end="url(#wt-a)"></path><text x="40" y="30" font-size="11.5">Seed-eating birds fly low &amp; direct at dawn/dusk</text><text x="360" y="320" text-anchor="middle" font-size="10.5" class="muted-fill">Each clue raises the probability of water; none guarantees it. Weigh the sweat cost of checking.</text></svg>
