<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" class="diagram" viewBox="0 0 700 320" role="img" aria-label="Solar still cross-section: sunlight enters through the plastic sheet, heats moist soil, water evaporates, condenses on the underside of the sheet, runs to the low point under the rock and drips into a cup; losses shown"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="ss-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect width="700" height="100" fill="var(--sky)" opacity="0.5"></rect><rect y="100" width="700" height="220" fill="var(--ground)" opacity="0.4"></rect><path d="M170,100 Q350,330 530,100 Z" fill="var(--panel-2)"></path><path d="M150,100 L350,210 L550,100" fill="none" stroke="var(--info)" stroke-width="3"></path><circle cx="350" cy="195" r="10" fill="var(--muted)"></circle><rect x="330" y="220" width="40" height="34" rx="4" fill="none" stroke="var(--text)" stroke-width="2"></rect><rect x="332" y="238" width="36" height="14" fill="var(--info)" opacity="0.6"></rect><line x1="370" y1="240" x2="470" y2="100" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 3"></line><text x="480" y="95" font-size="11">Drinking tube (optional)</text><path d="M90,20 L220,150" stroke="var(--accent-2)" stroke-width="3" marker-end="url(#ss-a)"></path><text x="20" y="18" font-size="12" font-weight="700" style="fill:var(--accent-2)">Sunlight ~15–30 MJ/m²/day</text><path d="M260,230 L260,170" stroke="var(--info)" stroke-width="2" marker-end="url(#ss-b)"></path><path d="M440,230 L440,170" stroke="var(--info)" stroke-width="2" marker-end="url(#ss-b)"></path><text x="190" y="250" font-size="11">Moist soil / plants /</text><text x="190" y="264" font-size="11">poured seawater or urine</text><text x="240" y="130" font-size="11">Vapour condenses under sheet,</text><text x="240" y="144" font-size="11">runs down to the low point</text><g transform="translate(560,150)"><text font-size="12" font-weight="700">Where energy goes</text><text y="18" font-size="11">Reflected by plastic</text><text y="34" font-size="11">Conducted into ground</text><text y="50" font-size="11">Drips fall back, leaks</text><text y="66" font-size="11" font-weight="700" style="fill:var(--ok)">≤ ~15 % → your cup</text></g><text x="350" y="305" text-anchor="middle" font-size="11">Best case ≈ 1–1.5 L/day from a ~1 m pit in desert summer (Jackson &amp; van Bavel 1965). Often far less.</text></svg>
