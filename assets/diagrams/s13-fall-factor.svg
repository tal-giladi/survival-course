<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" class="diagram" viewBox="0 0 660 290" role="img" aria-label="Fall factor equals fall distance divided by rope length available to absorb it: 0.5, 1 and 2. A higher fall factor means a higher peak force, even for a shorter fall"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ff-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><text x="20" y="22" font-size="13" font-weight="700">Fall factor = fall distance ÷ rope length absorbing it</text><g><rect x="40" y="40" width="140" height="10" fill="var(--ground)"></rect><circle cx="110" cy="56" r="6" fill="var(--text)"></circle><line x1="110" y1="56" x2="110" y2="160" stroke="var(--accent)" stroke-width="4"></line><line x1="140" y1="60" x2="140" y2="112" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ff-a)"></line><text x="146" y="90" font-size="10" class="muted-fill">2 m</text><text x="102" y="112" text-anchor="end" font-size="10" class="muted-fill">4 m rope</text><text x="110" y="250" text-anchor="middle" font-size="11">Fall 2 m on 4 m of rope</text><text x="110" y="272" text-anchor="middle" font-size="15" font-weight="800" style="fill:var(--ok)">FF 0.5</text></g><g><rect x="250" y="40" width="140" height="10" fill="var(--ground)"></rect><circle cx="320" cy="56" r="6" fill="var(--text)"></circle><line x1="320" y1="56" x2="320" y2="160" stroke="var(--accent)" stroke-width="4"></line><line x1="350" y1="60" x2="350" y2="164" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ff-a)"></line><text x="356" y="116" font-size="10" class="muted-fill">4 m</text><text x="312" y="112" text-anchor="end" font-size="10" class="muted-fill">4 m rope</text><text x="320" y="250" text-anchor="middle" font-size="11">Fall 4 m on 4 m</text><text x="320" y="272" text-anchor="middle" font-size="15" font-weight="800" style="fill:var(--accent-2)">FF 1</text></g><g><rect x="460" y="40" width="140" height="10" fill="var(--ground)"></rect><circle cx="530" cy="56" r="6" fill="var(--text)"></circle><line x1="530" y1="56" x2="530" y2="108" stroke="var(--accent)" stroke-width="4"></line><line x1="560" y1="60" x2="560" y2="164" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ff-a)"></line><text x="566" y="116" font-size="10" class="muted-fill">4 m</text><text x="522" y="86" text-anchor="end" font-size="10" class="muted-fill">2 m rope</text><text x="530" y="250" text-anchor="middle" font-size="11">Fall 4 m on 2 m (below anchor)</text><text x="530" y="272" text-anchor="middle" font-size="15" font-weight="800" style="fill:var(--bad)">FF 2</text></g></svg>
