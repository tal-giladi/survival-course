<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" class="diagram" viewBox="0 0 560 340" role="img" aria-label="Shadow-stick method: two marks of the shadow tip give a west to east line"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="ssn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect x="10" y="10" width="540" height="320" rx="8" fill="var(--ground)" opacity="0.18"></rect><circle cx="260" cy="250" r="6" fill="var(--text)"></circle><text x="270" y="268" font-size="12" text-anchor="start" font-weight="700">stick (vertical)</text><line x1="260" y1="250" x2="150" y2="150" stroke="var(--muted)" stroke-width="5" opacity="0.5"></line><line x1="260" y1="250" x2="235" y2="128" stroke="var(--muted)" stroke-width="5" opacity="0.8"></line><circle cx="150" cy="150" r="7" fill="var(--bad)"></circle><text x="138" y="140" font-size="12" text-anchor="end" font-weight="700">1st mark</text><circle cx="235" cy="128" r="7" fill="var(--bad)"></circle><text x="215" y="158" font-size="12" text-anchor="start" font-weight="700">2nd mark (15–30 min later)</text><line x1="90" y1="165.5" x2="385" y2="89" stroke="var(--accent-2)" stroke-width="3" marker-end="url(#ss)"></line><text x="80" y="190" font-size="12" text-anchor="start" font-weight="800" style="fill:var(--accent-2)">W</text><text x="385" y="80" font-size="12" text-anchor="start" font-weight="800" style="fill:var(--accent-2)">E</text><line x1="470" y1="250" x2="435" y2="115" stroke="var(--info)" stroke-width="2.5" marker-end="url(#ssn)"></line><text x="430" y="106" font-size="12" text-anchor="start" font-weight="800" style="fill:var(--info)">N</text><text x="476" y="250" font-size="11" text-anchor="start" style="fill:var(--info)">⊥ = N–S</text><text x="430" y="300" font-size="11" text-anchor="start" class="muted-fill">sun ☀ (low, to the SE)</text><text x="20" y="322" font-size="11" text-anchor="start" class="muted-fill">Shadow tips move W → E. Most accurate near midday at mid-latitudes; poorer early/late and near solstices.</text></svg>
