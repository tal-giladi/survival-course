<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" class="diagram" viewBox="0 0 760 250" role="img" aria-label="Stacked bars: basal metabolic rate, activity and environment add up to daily energy expenditure in three situations"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="210" x2="210" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="210" y="206" font-size="11" text-anchor="middle" class="muted-fill">0</text></g><g><line x1="298" x2="298" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="298" y="206" font-size="11" text-anchor="middle" class="muted-fill">1000</text></g><g><line x1="386" x2="386" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="386" y="206" font-size="11" text-anchor="middle" class="muted-fill">2000</text></g><g><line x1="474" x2="474" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="474" y="206" font-size="11" text-anchor="middle" class="muted-fill">3000</text></g><g><line x1="562" x2="562" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="562" y="206" font-size="11" text-anchor="middle" class="muted-fill">4000</text></g><g><line x1="650" x2="650" y1="20" y2="190" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="650" y="206" font-size="11" text-anchor="middle" class="muted-fill">5000</text></g><g><text x="200" y="52" font-size="12.5" text-anchor="end">Camp work, 18 °C</text><rect x="210" y="34" width="145.2" height="28" fill="var(--info)"></rect><rect x="355.2" y="34" width="80.08" height="28" fill="var(--accent)"></rect><text x="441.28" y="53" font-size="12.5" font-weight="700">≈ 2560 kcal</text></g><g><text x="200" y="106" font-size="12.5" text-anchor="end">Hiking 8 h with pack, 5 °C</text><rect x="210" y="88" width="145.2" height="28" fill="var(--info)"></rect><rect x="355.2" y="88" width="188.76" height="28" fill="var(--accent)"></rect><rect x="543.96" y="88" width="16.72" height="28" fill="var(--accent-2)"></rect><text x="566.68" y="107" font-size="12.5" font-weight="700">≈ 3985 kcal</text></g><g><text x="200" y="160" font-size="12.5" text-anchor="end">Skiing out 8 h, −20 °C</text><rect x="210" y="142" width="145.2" height="28" fill="var(--info)"></rect><rect x="355.2" y="142" width="188.76" height="28" fill="var(--accent)"></rect><rect x="543.96" y="142" width="83.6" height="28" fill="var(--accent-2)"></rect><text x="633.56" y="161" font-size="12.5" font-weight="700">≈ 4745 kcal</text></g><g font-size="11.5"><rect x="210" y="222" width="14" height="12" fill="var(--info)"></rect><text x="230" y="232">BMR (Mifflin–St Jeor)</text><rect x="380" y="222" width="14" height="12" fill="var(--accent)"></rect><text x="400" y="232">Activity + digestion</text><rect x="540" y="222" width="14" height="12" fill="var(--accent-2)"></rect><text x="560" y="232">Cold / heat strain</text></g><text x="380" y="248" font-size="10" text-anchor="middle" class="muted-fill">kcal per day · illustrative, 70 kg man, 175 cm, 30 y (BMR ≈ 1,650 kcal)</text></svg>
