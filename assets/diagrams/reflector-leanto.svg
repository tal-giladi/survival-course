<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" class="diagram" viewBox="0 0 720 260" role="img" aria-label="Lean-to with a long fire in front and a log reflector wall behind the fire, sending radiant heat into the shelter"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><rect y="210" width="720" height="50" fill="var(--ground)" opacity="0.55"></rect><path d="M80,210 L230,70" stroke="var(--accent)" stroke-width="8"></path><line x1="230" y1="70" x2="230" y2="210" stroke="var(--text)" stroke-width="4"></line><g><rect x="110" y="190" width="90" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="210" cy="197" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><path d="M330,210 q10,-45 20,-10 q10,-40 20,0 q10,-30 20,5 q6,-20 10,5" fill="var(--accent-2)" opacity="0.85"></path><text x="320" y="232" font-size="12">long fire, parallel to the shelter</text><rect x="480" y="130" width="16" height="20" fill="var(--ground)" stroke="var(--text)"></rect><rect x="480" y="150" width="16" height="20" fill="var(--ground)" stroke="var(--text)"></rect><rect x="480" y="170" width="16" height="20" fill="var(--ground)" stroke="var(--text)"></rect><rect x="480" y="190" width="16" height="20" fill="var(--ground)" stroke="var(--text)"></rect><text x="505" y="130" font-size="12">log reflector wall</text><path d="M340,170 L230,170" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rf)"></path><path d="M360,160 L240,130" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rf)"></path><path d="M470,160 L400,150" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rf)"></path><path d="M470,190 L400,190" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rf)"></path><text x="40" y="40" font-size="12" font-weight="700">Radiant heat comes from both the fire and the reflector.</text><text x="40" y="58" font-size="11" class="muted-fill">About 1 m between fire and bed; clear flammables; check fire rules first.</text></svg>
