<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Tripod forces for a 20 kilogram load: each leg carries W divided by three times the cosine of the splay angle, and each foot pushes outward with W times the tangent of the angle divided by three. At 20 degrees each leg carries about 70 newtons and each foot pushes out about 24 newtons; at 45 degrees about 92 and 65 newtons."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tf-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="tf-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><line x1="40" y1="250" x2="280" y2="250" stroke="var(--ground)" stroke-width="4"></line><line x1="160" y1="50" x2="90" y2="250" stroke="var(--text)" stroke-width="5" stroke-linecap="round"></line><line x1="160" y1="50" x2="230" y2="250" stroke="var(--text)" stroke-width="5" stroke-linecap="round"></line><line x1="160" y1="50" x2="170" y2="255" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"></line><line x1="160" y1="50" x2="160" y2="150" stroke="var(--accent)" stroke-width="2" marker-end="url(#tf-w)"></line><text x="166" y="130" font-size="12" font-weight="700" style="fill:var(--accent)">W</text><line x1="160" y1="50" x2="160" y2="250" stroke="var(--line)" stroke-dasharray="3 4"></line><path d="M 160 90 A 40 40 0 0 1 146 88" fill="none" stroke="var(--text)"></path><text x="130" y="86" font-size="12">θ</text><line x1="230" y1="250" x2="270" y2="250" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#tf-a)"></line><text x="236" y="272" font-size="11" style="fill:var(--bad)">foot thrust</text><text x="40" y="290" font-size="11" class="muted-fill">Stake or dig in the feet when legs splay wide.</text><text x="320" y="40" font-size="13" font-weight="700">20 kg load (W ≈ 196 N)</text><text x="320" y="62" font-size="12">Leg force = W / (3 cos θ) · Foot thrust = W tan θ / 3</text><text x="330" y="92" font-size="11" font-weight="700">θ</text><text x="400" y="92" font-size="11" font-weight="700">each leg</text><text x="500" y="92" font-size="11" font-weight="700">each foot outward</text><g><text x="330" y="118" font-size="12">10°</text><rect x="400" y="106" width="39.8" height="16" rx="4" fill="var(--info)" opacity="0.8"></rect><text x="443.8" y="119" font-size="11">66 N</text><rect x="500" y="106" width="6.91" height="16" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="510.91" y="119" font-size="11">12 N</text></g><g><text x="330" y="148" font-size="12">20°</text><rect x="400" y="136" width="41.72" height="16" rx="4" fill="var(--info)" opacity="0.8"></rect><text x="445.72" y="149" font-size="11">70 N</text><rect x="500" y="136" width="14.27" height="16" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="518.27" y="149" font-size="11">24 N</text></g><g><text x="330" y="178" font-size="12">30°</text><rect x="400" y="166" width="45.26" height="16" rx="4" fill="var(--info)" opacity="0.8"></rect><text x="449.26" y="179" font-size="11">75 N</text><rect x="500" y="166" width="22.63" height="16" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="526.63" y="179" font-size="11">38 N</text></g><g><text x="330" y="208" font-size="12">45°</text><rect x="400" y="196" width="55.44" height="16" rx="4" fill="var(--info)" opacity="0.8"></rect><text x="459.44" y="209" font-size="11">92 N</text><rect x="500" y="196" width="39.2" height="16" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="543.2" y="209" font-size="11">65 N</text></g><text x="320" y="250" font-size="11">Leg force rises slowly with splay; thrust rises fast.</text><text x="320" y="266" font-size="11">Most tripods fail by feet sliding or the lashing</text><text x="320" y="282" font-size="11">slipping — not by legs breaking.</text></svg>
