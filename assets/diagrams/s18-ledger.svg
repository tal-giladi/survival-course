<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Daily resource ledger for four resources. Water: stock 4 litres, income 3, use 3.5, net minus 0.5 a day, 8 days of reserve. Food: stock 3,000 kcal, no income, use 600 a day, 5 days. Fuel: stock 6 armfuls, income 4, use 5, 6 days. Phone: 60 percent, use 8 percent a day, 7.5 days. Food is the limiting resource."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700">One line per resource: stock · income − use = net · days of reserve</text><text x="154" y="50" font-size="11" font-weight="700" class="muted-fill">Stock</text><text x="284" y="50" font-size="11" font-weight="700" class="muted-fill">Income / day</text><text x="414" y="50" font-size="11" font-weight="700" class="muted-fill">Use / day</text><text x="555" y="50" font-size="11" font-weight="700" class="muted-fill">Days</text><g><text x="20" y="82" font-size="13" font-weight="700">Water</text><text x="20" y="96" font-size="10" class="muted-fill">L</text><g><rect x="150" y="70" width="81.8181818181818" height="22" rx="4" fill="var(--info)" opacity="0.9"></rect><text x="235.8181818181818" y="86" font-size="11">4</text></g><g><rect x="280" y="70" width="61.36363636363636" height="22" rx="4" fill="var(--info)" opacity="0.9"></rect><text x="345.3636363636364" y="86" font-size="11">3</text></g><g><rect x="410" y="70" width="71.59090909090908" height="22" rx="4" fill="var(--info)" opacity="0.55"></rect><text x="485.59090909090907" y="86" font-size="11">3.5</text></g><rect x="548" y="68" width="46" height="26" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="571" y="86" font-size="12" font-weight="700" text-anchor="middle">8.0</text></g><g><text x="20" y="134" font-size="13" font-weight="700">Food</text><text x="20" y="148" font-size="10" class="muted-fill">kcal ×100</text><g><rect x="150" y="122" width="81.8181818181818" height="22" rx="4" fill="var(--accent-2)" opacity="0.9"></rect><text x="235.8181818181818" y="138" font-size="11">30</text></g><g><rect x="280" y="122" width="2" height="22" rx="4" fill="var(--accent-2)" opacity="0.9"></rect><text x="286" y="138" font-size="11">0</text></g><g><rect x="410" y="122" width="16.363636363636363" height="22" rx="4" fill="var(--accent-2)" opacity="0.55"></rect><text x="430.3636363636364" y="138" font-size="11">6</text></g><rect x="548" y="120" width="46" height="26" rx="6" fill="var(--bad)" stroke="var(--line)"></rect><text x="571" y="138" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">5.0</text></g><g><text x="20" y="186" font-size="13" font-weight="700">Fuel</text><text x="20" y="200" font-size="10" class="muted-fill">armfuls</text><g><rect x="150" y="174" width="81.8181818181818" height="22" rx="4" fill="var(--accent)" opacity="0.9"></rect><text x="235.8181818181818" y="190" font-size="11">6</text></g><g><rect x="280" y="174" width="54.54545454545453" height="22" rx="4" fill="var(--accent)" opacity="0.9"></rect><text x="338.5454545454545" y="190" font-size="11">4</text></g><g><rect x="410" y="174" width="68.18181818181819" height="22" rx="4" fill="var(--accent)" opacity="0.55"></rect><text x="482.1818181818182" y="190" font-size="11">5</text></g><rect x="548" y="172" width="46" height="26" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="571" y="190" font-size="12" font-weight="700" text-anchor="middle">6.0</text></g><g><text x="20" y="238" font-size="13" font-weight="700">Phone</text><text x="20" y="252" font-size="10" class="muted-fill">% battery</text><g><rect x="150" y="226" width="81.8181818181818" height="22" rx="4" fill="var(--sky)" opacity="0.9"></rect><text x="235.8181818181818" y="242" font-size="11">60</text></g><g><rect x="280" y="226" width="2" height="22" rx="4" fill="var(--sky)" opacity="0.9"></rect><text x="286" y="242" font-size="11">0</text></g><g><rect x="410" y="226" width="10.90909090909091" height="22" rx="4" fill="var(--sky)" opacity="0.55"></rect><text x="424.90909090909093" y="242" font-size="11">8</text></g><rect x="548" y="224" width="46" height="26" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="571" y="242" font-size="12" font-weight="700" text-anchor="middle">7.5</text></g><text x="20" y="284" font-size="11" class="muted-fill">Days of reserve = stock ÷ (use − income). The smallest number is your limiting resource — plan today around it.</text></svg>
