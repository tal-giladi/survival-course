<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Anatomy of a dog-family print and a cat-family print. Dog: four toes, claw marks, oval symmetrical outline, small triangular heel pad and an X-shaped negative space. Cat: four toes with one leading toe, no claws, round asymmetrical outline, large heel pad with three lobes at the rear."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="300" height="290" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="330" y="10" width="300" height="290" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="160" y="34" text-anchor="middle" font-size="14" font-weight="700">Dog family (canid)</text><text x="480" y="34" text-anchor="middle" font-size="14" font-weight="700">Cat family (felid)</text><g transform="translate(150 170) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><g><ellipse cx="-45.900000000000006" cy="-20.4" rx="17" ry="22.1"></ellipse><ellipse cx="-48.19500000000001" cy="-52.7" rx="5.1" ry="6.8"></ellipse></g><g><ellipse cx="45.900000000000006" cy="-20.4" rx="17" ry="22.1"></ellipse><ellipse cx="48.19500000000001" cy="-52.7" rx="5.1" ry="6.8"></ellipse></g><g><ellipse cx="-18.7" cy="-61.199999999999996" rx="17" ry="22.1"></ellipse><ellipse cx="-19.635" cy="-93.50000000000001" rx="5.1" ry="6.8"></ellipse></g><g><ellipse cx="18.7" cy="-61.199999999999996" rx="17" ry="22.1"></ellipse><ellipse cx="19.635" cy="-93.50000000000001" rx="5.1" ry="6.8"></ellipse></g><path d="M-34,51 Q0,3.4 34,51 Q20.4,74.8 0,68 Q-20.4,74.8 -34,51 Z"></path></g></g><path d="M118,166 L182,214 M182,166 L118,214" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 4" fill="none"></path><ellipse cx="150" cy="170" rx="62" ry="100" fill="none" stroke="var(--muted)" stroke-dasharray="3 4"></ellipse><g transform="translate(470 170) rotate(0)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.6"><g><ellipse cx="-57.800000000000004" cy="-6.8" rx="17" ry="20.4"></ellipse><ellipse cx="-22.1" cy="-47.6" rx="17" ry="20.4"></ellipse><ellipse cx="22.1" cy="-68" rx="17" ry="20.4"></ellipse><ellipse cx="59.49999999999999" cy="-20.4" rx="17" ry="20.4"></ellipse><path d="M-45.900000000000006,47.6 Q-37.4,10.2 0,10.2 Q37.4,10.2 45.900000000000006,47.6 Q40.8,74.8 22.1,64.6 Q10.2,78.2 0,64.6 Q-10.2,78.2 -22.1,64.6 Q-40.8,74.8 -45.900000000000006,47.6 Z"></path></g></g><circle cx="470" cy="170" r="86" fill="none" stroke="var(--muted)" stroke-dasharray="3 4"></circle><line x1="196" y1="98" x2="250" y2="70" stroke="var(--muted)" stroke-width="1"></line><text x="252" y="68" text-anchor="start" font-size="11" font-weight="400">claw marks</text><line x1="196" y1="150" x2="250" y2="120" stroke="var(--muted)" stroke-width="1"></line><text x="252" y="118" text-anchor="start" font-size="11" font-weight="400">4 toes</text><line x1="182" y1="214" x2="240" y2="200" stroke="var(--muted)" stroke-width="1"></line><text x="242" y="198" text-anchor="start" font-size="11" font-weight="400">X-shaped</text><text x="242" y="211" text-anchor="start" font-size="11" font-weight="400">open ground</text><line x1="170" y1="232" x2="230" y2="262" stroke="var(--muted)" stroke-width="1"></line><text x="200" y="276" text-anchor="start" font-size="11" font-weight="400">small heel pad</text><text x="30" y="292" text-anchor="start" font-size="11" font-weight="400" class="muted-fill">Oval, symmetrical, claws usually show</text><line x1="486" y1="110" x2="560" y2="64" stroke="var(--muted)" stroke-width="1"></line><text x="562" y="62" text-anchor="start" font-size="11" font-weight="400">leading</text><text x="562" y="75" text-anchor="start" font-size="11" font-weight="400">toe</text><line x1="530" y1="150" x2="580" y2="132" stroke="var(--muted)" stroke-width="1"></line><text x="560" y="128" text-anchor="start" font-size="11" font-weight="400">no claws</text><line x1="500" y1="240" x2="560" y2="262" stroke="var(--muted)" stroke-width="1"></line><text x="500" y="278" text-anchor="start" font-size="11" font-weight="400">3-lobed rear edge</text><line x1="440" y1="205" x2="372" y2="236" stroke="var(--muted)" stroke-width="1"></line><text x="338" y="250" text-anchor="start" font-size="11" font-weight="400">large heel pad</text><text x="350" y="292" text-anchor="start" font-size="11" font-weight="400" class="muted-fill">Round, asymmetrical, claws retracted</text><text x="320" y="322" text-anchor="middle" font-size="11" font-weight="400" class="muted-fill">Front prints, toes up. Measure without claws; note only the features you can actually see.</text></svg>
