<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" class="diagram" viewBox="0 0 700 260" role="img" aria-label="Recovery position: patient on side, upper knee bent to stop rolling, head tilted so the mouth drains downward"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="200" width="700" height="60" fill="var(--ground)" opacity="0.35"></rect><rect x="60" y="196" width="560" height="8" rx="4" fill="var(--info)" opacity="0.6"></rect><text x="340" y="230" text-anchor="middle" font-size="11" class="muted-fill">insulating pad under the whole body (cold ground steals heat)</text><circle cx="130" cy="160" r="26" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></circle><path d="M112,176 L100,190" stroke="var(--accent)" stroke-width="2"></path><text x="20" y="100" font-size="11">mouth angled down</text><text x="20" y="114" font-size="11">— fluid drains out</text><path d="M150,170 Q250,140 360,170 L360,192 Q250,196 150,192 Z" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></path><path d="M170,150 Q150,120 128,134" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"></path><text x="175" y="116" font-size="11">top hand under cheek</text><path d="M180,192 L110,194" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"></path><path d="M360,186 L560,188" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"></path><path d="M360,172 L450,120 L470,192" fill="none" stroke="var(--accent-2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path><text x="470" y="110" font-size="11">upper knee bent at ~90° —</text><text x="470" y="124" font-size="11">stops the body rolling forward</text><text x="20" y="24" font-size="13" font-weight="700">For: unresponsive (or vomiting, drowsy) and breathing normally</text><text x="20" y="42" font-size="11" class="muted-fill">Check breathing continuously. Not breathing normally → CPR (learn it on a hands-on course).</text><text x="20" y="58" font-size="11" class="muted-fill">Suspected spine injury: airway still comes first; log-roll with helpers, keep head in line.</text></svg>
