<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" class="diagram" viewBox="0 0 720 348" role="img" aria-label="Logarithmic size scale: viruses 0.02 to 0.1 micrometres, bacteria 0.5 to 5, Cryptosporidium 4 to 6, Giardia 8 to 19, helminth eggs 30 to 80, compared with filter pore sizes"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="80" y1="230" x2="640" y2="230" stroke="var(--line)" stroke-width="2"></line><g><line x1="80" y1="225" x2="80" y2="235" stroke="var(--text)"></line><text x="80" y="250" text-anchor="middle" font-size="12">0.01 µm</text></g><g><line x1="220" y1="225" x2="220" y2="235" stroke="var(--text)"></line><text x="220" y="250" text-anchor="middle" font-size="12">0.1 µm</text></g><g><line x1="360" y1="225" x2="360" y2="235" stroke="var(--text)"></line><text x="360" y="250" text-anchor="middle" font-size="12">1 µm</text></g><g><line x1="500" y1="225" x2="500" y2="235" stroke="var(--text)"></line><text x="500" y="250" text-anchor="middle" font-size="12">10 µm</text></g><g><line x1="640" y1="225" x2="640" y2="235" stroke="var(--text)"></line><text x="640" y="250" text-anchor="middle" font-size="12">100 µm</text></g><g><rect x="122.14" y="60" width="97.86" height="18" rx="9" fill="var(--bad)" opacity="0.8"></rect><text x="230" y="74" font-size="12">Viruses</text></g><g><rect x="317.86" y="90" width="140" height="18" rx="9" fill="var(--accent-2)" opacity="0.8"></rect><text x="467.86" y="104" font-size="12">Bacteria</text></g><g><rect x="444.29" y="120" width="24.65" height="18" rx="9" fill="var(--warn)" opacity="0.8"></rect><text x="478.94" y="134" font-size="12">Cryptosporidium oocysts</text></g><g><rect x="486.43" y="150" width="52.59" height="18" rx="9" fill="var(--accent)" opacity="0.8"></rect><text x="549.03" y="164" font-size="12">Giardia cysts</text></g><g><rect x="566.8" y="180" width="59.64" height="18" rx="9" fill="var(--ground)" opacity="0.8"></rect><text x="636.43" y="194" font-size="12">Helminth eggs</text></g><g><line x1="122.14" y1="40" x2="122.14" y2="230" stroke="var(--info)" stroke-dasharray="4 4" stroke-width="1.8"></line><text x="122.14" y="272" text-anchor="middle" font-size="11" style="fill:var(--info)">Ultrafilter ~0.01–0.02 µm</text></g><g><line x1="220" y1="40" x2="220" y2="230" stroke="var(--info)" stroke-dasharray="4 4" stroke-width="1.8"></line><text x="220" y="286" text-anchor="middle" font-size="11" style="fill:var(--info)">Hollow-fibre 0.1 µm</text></g><g><line x1="262.14" y1="40" x2="262.14" y2="230" stroke="var(--info)" stroke-dasharray="4 4" stroke-width="1.8"></line><text x="262.14" y="300" text-anchor="middle" font-size="11" style="fill:var(--info)">Ceramic 0.2 µm</text></g><g><line x1="542.14" y1="40" x2="542.14" y2="230" stroke="var(--info)" stroke-dasharray="4 4" stroke-width="1.8"></line><text x="542.14" y="314" text-anchor="middle" font-size="11" style="fill:var(--info)">Folded cloth ~20 µm</text></g><text x="80" y="30" font-size="12" font-weight="700">Anything larger than the pore (right of a line) is strained out.</text><text x="360" y="340" text-anchor="middle" font-size="10.5" class="muted-fill">Sizes after CDC Yellow Book. Each gridline is ×10. Viruses slip through microfilters; cloth only stops the largest particles.</text></svg>
