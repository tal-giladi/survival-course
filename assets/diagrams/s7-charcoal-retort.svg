<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="288" class="diagram" viewBox="0 0 660 288" role="img" aria-label="Charcoal retort: wood sealed in a tin with a small vent is heated in a fire; without oxygen it pyrolyses, and the escaping wood gas burns at the vent; stages from drying to carbonisation"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M40,230 Q80,120 120,230 Q150,140 190,230 Q220,150 250,230 Z" fill="var(--accent-2)" opacity="0.75"></path><rect x="80" y="130" width="130" height="80" rx="6" fill="var(--muted)" stroke="var(--line)" stroke-width="2"></rect><rect x="92" y="146" width="30" height="50" rx="3" fill="var(--ground)"></rect><rect x="130" y="146" width="30" height="50" rx="3" fill="var(--ground)"></rect><rect x="168" y="146" width="30" height="50" rx="3" fill="var(--ground)"></rect><circle cx="145" cy="130" r="4" fill="var(--text)"></circle><path d="M145,126 Q135,100 150,80 Q160,100 145,126" fill="var(--accent-2)"></path><text x="170" y="92" font-size="11">wood gas burns at the vent</text><text x="170" y="106" font-size="11" class="muted-fill">stop when the jet dies;</text><text x="170" y="120" font-size="11" class="muted-fill">seal the vent; cool</text><text x="145" y="250" text-anchor="middle" font-size="11">sealed tin, one small hole: no air in</text><text x="300" y="22" font-size="13" font-weight="700">Stages as the wood heats</text><g><rect x="300" y="36" width="100" height="36" rx="6" fill="var(--info)" opacity="0.85"></rect><text x="350" y="58" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">&lt; 200 °C</text><text x="412" y="52" font-size="12" font-weight="700">drying</text><text x="412" y="67" font-size="11" class="muted-fill">gives off: steam</text></g><g><rect x="300" y="86" width="100" height="36" rx="6" fill="var(--accent)" opacity="0.85"></rect><text x="350" y="108" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">200–280 °C</text><text x="412" y="102" font-size="12" font-weight="700">torrefaction</text><text x="412" y="117" font-size="11" class="muted-fill">gives off: acids, CO₂</text></g><g><rect x="300" y="136" width="100" height="36" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="350" y="158" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">280–400 °C</text><text x="412" y="152" font-size="12" font-weight="700">pyrolysis (exothermic)</text><text x="412" y="167" font-size="11" class="muted-fill">gives off: tar, CO, CH₄ — flammable</text></g><g><rect x="300" y="186" width="100" height="36" rx="6" fill="var(--text)" opacity="0.85"></rect><text x="350" y="208" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--panel)">400–600 °C</text><text x="412" y="202" font-size="12" font-weight="700">carbonisation</text><text x="412" y="217" font-size="11" class="muted-fill">gives off: charcoal ≈ 75–90 % C</text></g><text x="20" y="278" font-size="11">Yield: ~25–30 % of dry wood mass as charcoal, but ~50–60 % of its energy is lost as gas and heat.</text></svg>
