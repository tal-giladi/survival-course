<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" class="diagram" viewBox="0 0 520 300" role="img" aria-label="Fire triangle: heat, fuel, oxygen"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><polygon points="260,30 460,270 60,270" fill="var(--accent-2)" opacity="0.15" stroke="var(--accent-2)" stroke-width="3"></polygon><text x="260" y="170" text-anchor="middle" font-size="16" font-weight="700">combustion</text><text x="260" y="190" text-anchor="middle" font-size="11" class="muted-fill">remove any side → fire dies</text><text x="120" y="130" text-anchor="middle" font-size="15" font-weight="700">HEAT</text><text x="120" y="148" text-anchor="middle" font-size="11" class="muted-fill">ignition, then the fire’s own</text><text x="120" y="162" text-anchor="middle" font-size="11" class="muted-fill">heat drying &amp; pyrolysing fuel</text><text x="400" y="130" text-anchor="middle" font-size="15" font-weight="700">OXYGEN</text><text x="400" y="148" text-anchor="middle" font-size="11" class="muted-fill">gaps between sticks,</text><text x="400" y="162" text-anchor="middle" font-size="11" class="muted-fill">gentle airflow</text><text x="260" y="292" text-anchor="middle" font-size="15" font-weight="700">FUEL — dry, fine first, then larger</text></svg>
