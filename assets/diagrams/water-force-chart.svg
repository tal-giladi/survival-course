<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" class="diagram" viewBox="0 0 720 330" role="img" aria-label="Drag force on a wader&#x27;s legs grows with the square of water velocity; above about 2 metres per second it exceeds the grip of feet on a slippery bed"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="wf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="70" y="190" width="600" height="45" fill="var(--warn)" opacity="0.15"></rect><text x="690" y="216.5" text-anchor="end" font-size="11" font-weight="600">foot grip on slippery rock ≈ 150–300 N</text><line x1="70" y1="280" x2="690" y2="280" stroke="var(--muted)" marker-end="url(#wf)"></line><line x1="70" y1="280" x2="70" y2="20" stroke="var(--muted)" marker-end="url(#wf)"></line><text x="70" y="298" text-anchor="middle" font-size="11" class="muted-fill">0 m/s</text><text x="220" y="298" text-anchor="middle" font-size="11" class="muted-fill">1 m/s</text><text x="370" y="298" text-anchor="middle" font-size="11" class="muted-fill">2 m/s</text><text x="520" y="298" text-anchor="middle" font-size="11" class="muted-fill">3 m/s</text><text x="670" y="298" text-anchor="middle" font-size="11" class="muted-fill">4 m/s</text><text x="62" y="284" text-anchor="end" font-size="11" class="muted-fill">0 N</text><text x="62" y="224" text-anchor="end" font-size="11" class="muted-fill">200 N</text><text x="62" y="164" text-anchor="end" font-size="11" class="muted-fill">400 N</text><text x="62" y="104" text-anchor="end" font-size="11" class="muted-fill">600 N</text><text x="62" y="44" text-anchor="end" font-size="11" class="muted-fill">800 N</text><polyline points="70,280 85,279.775 100,279.1 115,277.975 130,276.4 145,274.375 160,271.9 175,268.975 190,265.6 205,261.775 220,257.5 235,252.775 250.00000000000003,247.6 265,241.975 280,235.89999999999998 295,229.375 310,222.4 325,214.97499999999997 340,207.10000000000002 355,198.775 370,190 385,180.775 400,171.09999999999997 415.00000000000006,160.97499999999997 430.00000000000006,150.39999999999998 445,139.375 460,127.9 475,115.975 490.00000000000006,103.59999999999997 505.00000000000006,90.77499999999998 520,77.5 535,63.775000000000006 550,49.60000000000002 565,34.974999999999966 580,19.89999999999992 595,4.375 610,-11.599999999999966 625,-28.024999999999977 640,-44.89999999999998 655,-62.224999999999966 670,-80" fill="none" stroke="var(--bad)" stroke-width="3"></polyline><g><circle cx="220" cy="257.5" r="5" fill="var(--bad)"></circle><text x="212" y="247.5" text-anchor="end" font-size="11.5" font-weight="700">1 m/s → 75 N</text></g><g><circle cx="370" cy="190" r="5" fill="var(--bad)"></circle><text x="362" y="180" text-anchor="end" font-size="11.5" font-weight="700">2 m/s → 300 N</text></g><g><circle cx="520" cy="77.5" r="5" fill="var(--bad)"></circle><text x="512" y="67.5" text-anchor="end" font-size="11.5" font-weight="700">3 m/s → 675 N</text></g><text x="380" y="40" text-anchor="middle" font-size="12" font-weight="600">F = ½ ρ C_d A v² · knee-deep, both legs: A ≈ 0.15 m², C_d ≈ 1</text><text x="380" y="320" text-anchor="middle" font-size="11" class="muted-fill">Double the speed → four times the force. Deeper water adds area and buoyancy, so it gets worse faster still.</text></svg>
