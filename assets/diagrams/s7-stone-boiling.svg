<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Stone boiling energy balance: hot stones give up heat to the water; about 3 kilograms of stones at 500 degrees are needed to bring 2 litres of water from 15 degrees to boiling, allowing for losses"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><path d="M40,200 Q70,120 100,200 Q120,140 150,200 Z" fill="var(--accent-2)" opacity="0.8"></path><circle cx="60" cy="190" r="14" fill="var(--muted)" stroke="var(--line)"></circle><circle cx="90" cy="190" r="14" fill="var(--muted)" stroke="var(--line)"></circle><circle cx="120" cy="190" r="14" fill="var(--muted)" stroke="var(--line)"></circle><text x="95" y="228" text-anchor="middle" font-size="11">stones heated ~30 min</text><text x="112" y="244" text-anchor="middle" font-size="11" class="muted-fill">dry, non-layered rock (not from a river bed)</text><path d="M170,170 Q230,110 290,160" fill="none" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#s7sb)"></path><text x="230" y="112" text-anchor="middle" font-size="11">tongs, shake off ash</text><path d="M300,110 L320,210 L440,210 L460,110 Z" fill="var(--info)" opacity="0.3" stroke="var(--line)" stroke-width="2"></path><line x1="305" y1="130" x2="455" y2="130" stroke="var(--info)" stroke-width="2"></line><circle cx="350" cy="195" r="12" fill="var(--muted)"></circle><circle cx="395" cy="195" r="12" fill="var(--muted)"></circle><circle cx="340" cy="170" r="3" fill="none" stroke="var(--info)"></circle><circle cx="370" cy="162" r="3" fill="none" stroke="var(--info)"></circle><circle cx="400" cy="154" r="3" fill="none" stroke="var(--info)"></circle><circle cx="420" cy="146" r="3" fill="none" stroke="var(--info)"></circle><text x="380" y="236" text-anchor="middle" font-size="11">bark, wood, hide or a lined pit</text><rect x="480" y="30" width="150" height="190" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="492" y="52" font-size="12" font-weight="700">2 L, 15 → 100 °C</text><text x="492" y="72" font-size="11">water: 2 × 4.18 × 85</text><text x="492" y="88" font-size="11">≈ 710 kJ</text><text x="492" y="112" font-size="11">stone: c ≈ 0.8 kJ/(kg·°C)</text><text x="492" y="128" font-size="11">500 → 100 °C: 320 kJ/kg</text><text x="492" y="152" font-size="11">ideal: 710/320 ≈ 2.2 kg</text><text x="492" y="168" font-size="11">with ~30 % losses:</text><text x="492" y="190" font-size="13" font-weight="700" style="fill:var(--accent)">≈ 3 kg of stones</text><text x="492" y="208" font-size="10" class="muted-fill">in 4–6 batches</text></svg>
