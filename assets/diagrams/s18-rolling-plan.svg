<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" class="diagram" viewBox="0 0 640 320" role="img" aria-label="A rolling plan with three horizons. Today: detailed tasks by block. Tomorrow: main tasks and what must be ready tonight. Three to five days: resource reserves, weather, rescue windows and stay-or-move. Triggers that force a re-plan: water under one day of reserve, a storm forecast, illness or injury, gear failure, a change in rescue expectations. Each evening, review and roll the plan forward one day."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="20" y="50" width="180" height="110" rx="8" fill="var(--accent)" stroke="var(--line)"></rect><text x="110" y="102" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Today</text><text x="110" y="118" text-anchor="middle" font-size="10" class="muted-fill">tasks by block, who/what</text></g><g><rect x="230" y="50" width="180" height="110" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="102" text-anchor="middle" font-size="12" font-weight="700">Tomorrow</text><text x="320" y="118" text-anchor="middle" font-size="10" class="muted-fill">main jobs; ready by tonight</text></g><g><rect x="440" y="50" width="180" height="110" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="530" y="102" text-anchor="middle" font-size="12" font-weight="700">Next 3–5 days</text><text x="530" y="118" text-anchor="middle" font-size="10" class="muted-fill">reserves · weather · rescue · stay/move</text></g><text x="110" y="140" font-size="10" text-anchor="middle" style="fill:#fff">detailed</text><text x="320" y="140" font-size="10" text-anchor="middle" class="muted-fill">outline</text><text x="530" y="140" font-size="10" text-anchor="middle" class="muted-fill">options + reserves</text><text x="20" y="32" font-size="13" font-weight="700">Plan in three horizons — detail where it pays</text><path d="M 530 170 C 530 215, 110 215, 110 170" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#rp-a)"></path><text x="320" y="228" font-size="11" text-anchor="middle" font-weight="700" style="fill:var(--accent)">Every evening: review, update the ledger, roll forward one day</text><text x="20" y="262" font-size="12" font-weight="700">Re-plan at once when a trigger fires:</text><g><rect x="20" y="272" width="116" height="30" rx="6" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="78" y="291" font-size="10" text-anchor="middle">water &lt; 1 day of reserve</text></g><g><rect x="142" y="272" width="116" height="30" rx="6" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="200" y="291" font-size="10" text-anchor="middle">storm forecast</text></g><g><rect x="264" y="272" width="116" height="30" rx="6" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="322" y="291" font-size="10" text-anchor="middle">illness or injury</text></g><g><rect x="386" y="272" width="116" height="30" rx="6" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="444" y="291" font-size="10" text-anchor="middle">key gear fails</text></g><g><rect x="508" y="272" width="116" height="30" rx="6" fill="var(--panel-2)" stroke="var(--bad)"></rect><text x="566" y="291" font-size="10" text-anchor="middle">rescue expectation changes</text></g></svg>
