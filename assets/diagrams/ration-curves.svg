<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" class="diagram" viewBox="0 0 800 250" role="img" aria-label="Food remaining over six days for three strategies: eat freely, even ration with reserve, and starving while saving food"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" x2="580" y1="170" y2="170" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="52" y="174" font-size="11" text-anchor="end" class="muted-fill">0%</text></g><g><line x1="60" x2="580" y1="95" y2="95" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="52" y="99" font-size="11" text-anchor="end" class="muted-fill">50%</text></g><g><line x1="60" x2="580" y1="20" y2="20" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="52" y="24" font-size="11" text-anchor="end" class="muted-fill">100%</text></g><text x="60" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 0</text><text x="146.67" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 1</text><text x="233.33" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 2</text><text x="320" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 3</text><text x="406.67" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 4</text><text x="493.33" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 5</text><text x="580" y="206" font-size="11" text-anchor="middle" class="muted-fill">day 6</text><g><path d="M60,20 L146.67,87.5 L233.33,155 L320,170 L406.67,170 L493.33,170 L580,170" fill="none" stroke="var(--bad)" stroke-width="3"></path><rect x="600" y="40" width="14" height="4" fill="var(--bad)"></rect><text x="620" y="46" font-size="11.5">Eat freely until gone</text></g><g><path d="M60,20 L146.67,41 L233.33,62 L320,83 L406.67,104 L493.33,125 L580,147.5" fill="none" stroke="var(--ok)" stroke-width="3"></path><rect x="600" y="66" width="14" height="4" fill="var(--ok)"></rect><text x="620" y="72" font-size="11.5">Even ration + 15 % reserve</text></g><g><path d="M60,20 L146.67,24.5 L233.33,29 L320,33.5 L406.67,38 L493.33,42.5 L580,50" fill="none" stroke="var(--warn)" stroke-width="3"></path><rect x="600" y="92" width="14" height="4" fill="var(--warn)"></rect><text x="620" y="98" font-size="11.5">Starve now, “save it for later”</text></g><text x="60" y="240" font-size="11" class="muted-fill">Food left in the pack. Food in the pack does no work — but food eaten on day 1 is gone when the hard day comes.</text></svg>
