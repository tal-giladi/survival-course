<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" class="diagram" viewBox="0 0 640 350" role="img" aria-label="The improvisation cycle: define the function, list the properties it needs, inventory candidate objects, build simply, test before trusting, use and monitor; a failed test loops back to the candidates"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="mc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="mc-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><ellipse cx="320" cy="175" rx="165" ry="115" fill="none" stroke="var(--line)" stroke-dasharray="4 5"></ellipse><g><rect x="225" y="53" width="190" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="72" text-anchor="middle" font-size="12" font-weight="700">1 · Define the function</text><text x="320" y="88" text-anchor="middle" font-size="10" class="muted-fill">what must it DO? (not what is it)</text></g><g><rect x="385.21" y="103" width="190" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="480.21" y="122" text-anchor="middle" font-size="12" font-weight="700">2 · List the properties</text><text x="480.21" y="138" text-anchor="middle" font-size="10" class="muted-fill">waterproof, rigid, strong, soft…</text></g><g><rect x="385.21" y="203" width="190" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="480.21" y="222" text-anchor="middle" font-size="12" font-weight="700">3 · Inventory candidates</text><text x="480.21" y="238" text-anchor="middle" font-size="10" class="muted-fill">kit, clothing, nature, rubbish</text></g><g><rect x="225" y="253" width="190" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="272" text-anchor="middle" font-size="12" font-weight="700">4 · Build simply</text><text x="320" y="288" text-anchor="middle" font-size="10" class="muted-fill">reversible, least critical gear</text></g><g><rect x="64.79" y="203" width="190" height="44" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="159.79" y="222" text-anchor="middle" font-size="12" font-weight="700">5 · Test before trusting</text><text x="159.79" y="238" text-anchor="middle" font-size="10" class="muted-fill">at ground level, over-load it</text></g><g><rect x="64.79" y="103" width="190" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="159.79" y="122" text-anchor="middle" font-size="12" font-weight="700">6 · Use and monitor</text><text x="159.79" y="138" text-anchor="middle" font-size="10" class="muted-fill">inspect often, carry a plan B</text></g><text x="320" y="169" text-anchor="middle" font-size="15" font-weight="800">Function</text><text x="320" y="187" text-anchor="middle" font-size="15" font-weight="800">over form</text><path d="M 258 187 Q 320 235 382 187" fill="none" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#mc-b)"></path><text x="320" y="233" text-anchor="middle" font-size="10" style="fill:var(--bad)">test fails → try the next candidate</text><text x="20" y="340" font-size="11" class="muted-fill">Arrows run clockwise. Most failures: skipping step 1 (wrong problem) or step 5 (untested build).</text></svg>
