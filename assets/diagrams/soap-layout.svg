<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="390" class="diagram" viewBox="0 0 700 390" role="img" aria-label="SOAP note layout: Subjective, Objective, Assessment, Plan"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="680" height="370" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="30" y="36" font-size="12" class="muted-fill">Patient · date · time · location (grid ref) · responder name</text><g><rect x="24" y="50" width="46" height="62" rx="8" fill="var(--accent)"></rect><text x="47" y="90" text-anchor="middle" font-size="26" font-weight="800" style="fill:#fff">S</text><text x="84" y="68" font-size="13" font-weight="700">Subjective — what they tell you</text><text x="84" y="86" font-size="11" class="muted-fill">Age, sex, chief complaint</text><text x="84" y="100" font-size="11" class="muted-fill">SAMPLE: Symptoms, Allergies, Medications,</text><text x="84" y="114" font-size="11" class="muted-fill">Past history, Last in/out, Events</text><text x="84" y="128" font-size="11" class="muted-fill">OPQRST for pain</text></g><g><rect x="24" y="132" width="46" height="62" rx="8" fill="var(--info)"></rect><text x="47" y="172" text-anchor="middle" font-size="26" font-weight="800" style="fill:#fff">O</text><text x="84" y="150" font-size="13" font-weight="700">Objective — what you find</text><text x="84" y="168" font-size="11" class="muted-fill">Scene and mechanism</text><text x="84" y="182" font-size="11" class="muted-fill">Head-to-toe findings</text><text x="84" y="196" font-size="11" class="muted-fill">Vital signs with times (table)</text></g><g><rect x="24" y="214" width="46" height="62" rx="8" fill="var(--accent-2)"></rect><text x="47" y="254" text-anchor="middle" font-size="26" font-weight="800" style="fill:#fff">A</text><text x="84" y="232" font-size="13" font-weight="700">Assessment — problem list</text><text x="84" y="250" font-size="11" class="muted-fill">Each problem, most serious first</text><text x="84" y="264" font-size="11" class="muted-fill">Anticipated problems (e.g. shock, infection)</text></g><g><rect x="24" y="296" width="46" height="62" rx="8" fill="var(--ok)"></rect><text x="47" y="336" text-anchor="middle" font-size="26" font-weight="800" style="fill:#fff">P</text><text x="84" y="314" font-size="13" font-weight="700">Plan — for each problem</text><text x="84" y="332" font-size="11" class="muted-fill">Treatment given and planned</text><text x="84" y="346" font-size="11" class="muted-fill">Monitoring interval</text><text x="84" y="360" font-size="11" class="muted-fill">Evacuation: none / non-urgent / urgent / emergent</text></g></svg>
