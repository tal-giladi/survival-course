<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="268" class="diagram" viewBox="0 0 700 268" role="img" aria-label="Safe storage: narrow-mouth covered container with a tap versus an open bucket where hands and cups re-contaminate the water"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g transform="translate(40,30)"><text x="120" y="0" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--ok)">✓ Safer</text><rect x="60" y="30" width="120" height="150" rx="16" fill="var(--info)" opacity="0.3" stroke="var(--text)" stroke-width="2"></rect><rect x="100" y="14" width="40" height="18" rx="4" fill="var(--text)"></rect><rect x="180" y="150" width="26" height="10" fill="var(--text)"></rect><path d="M206,160 L206,178" stroke="var(--info)" stroke-width="3"></path><text x="120" y="205" text-anchor="middle" font-size="11.5">Narrow neck, lid, tap or pour</text><text x="120" y="221" text-anchor="middle" font-size="11.5">Labelled &quot;treated&quot;; residual chlorine</text></g><g transform="translate(380,30)"><text x="140" y="0" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--bad)">✗ Riskier</text><path d="M60,50 L80,180 L200,180 L220,50 Z" fill="var(--info)" opacity="0.3" stroke="var(--text)" stroke-width="2"></path><path d="M150,20 Q140,60 150,90" stroke="var(--accent-2)" stroke-width="10" stroke-linecap="round" fill="none"></path><rect x="130" y="86" width="40" height="26" rx="4" fill="none" stroke="var(--text)" stroke-width="2"></rect><text x="235" y="80" font-size="11">hand + cup</text><text x="140" y="205" text-anchor="middle" font-size="11.5">Open bucket, dipping cups and hands</text><text x="140" y="221" text-anchor="middle" font-size="11.5">Re-contaminates treated water</text></g></svg>
