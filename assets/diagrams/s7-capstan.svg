<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Capstan equation: a rope wrapped around a post holds a large load with a small pull because friction grows exponentially with the angle of wrap"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker><marker id="s7cp2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><circle cx="150" cy="120" r="50" fill="var(--ground)" opacity="0.55" stroke="var(--line)"></circle><path d="M100,120 A50,50 0 1,1 200,120" fill="none" stroke="var(--accent-2)" stroke-width="6"></path><line x1="100" y1="120" x2="100" y2="220" stroke="var(--accent-2)" stroke-width="6"></line><line x1="200" y1="120" x2="200" y2="220" stroke="var(--accent-2)" stroke-width="6"></line><line x1="100" y1="200" x2="100" y2="240" stroke="var(--bad)" stroke-width="2" marker-end="url(#s7cp2)"></line><text x="40" y="236" font-size="12" font-weight="700" style="fill:var(--bad)">T₂ (load)</text><line x1="200" y1="200" x2="200" y2="225" stroke="var(--accent)" stroke-width="2" marker-end="url(#s7cp)"></line><text x="210" y="236" font-size="12" font-weight="700" style="fill:var(--accent)">T₁ (hold)</text><text x="150" y="40" text-anchor="middle" font-size="12">wrap angle θ = π (half a turn)</text><text x="150" y="124" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">μ</text><text x="150" y="20" text-anchor="middle" font-size="14" font-weight="700">T₂ = T₁ · e^(μθ)</text><g><line x1="360" y1="210" x2="610" y2="210" stroke="var(--line)"></line><line x1="360" y1="210" x2="360" y2="50" stroke="var(--line)"></line><text x="485" y="240" text-anchor="middle" font-size="11" class="muted-fill">turns around the post (μ = 0.3)</text><text x="326" y="130" text-anchor="middle" font-size="11" class="muted-fill" transform="rotate(-90 326 130)">T₂ / T₁ (log)</text></g><text x="360" y="224" text-anchor="middle" font-size="10" class="muted-fill">0</text><text x="443.3333333333333" y="224" text-anchor="middle" font-size="10" class="muted-fill">1</text><text x="526.6666666666666" y="224" text-anchor="middle" font-size="10" class="muted-fill">2</text><text x="610" y="224" text-anchor="middle" font-size="10" class="muted-fill">3</text><text x="354" y="214" text-anchor="end" font-size="10" class="muted-fill">1×</text><text x="354" y="148.8501689884953" text-anchor="end" font-size="10" class="muted-fill">10×</text><text x="354" y="83.70033797699062" text-anchor="end" font-size="10" class="muted-fill">100×</text><polyline points="360,210 364.1666666666667,207.33333333333334 368.3333333333333,204.66666666666666 372.5,202 376.6666666666667,199.33333333333334 380.8333333333333,196.66666666666666 385,194 389.1666666666667,191.33333333333334 393.3333333333333,188.66666666666666 397.5,186 401.6666666666667,183.33333333333331 405.8333333333333,180.66666666666666 410,178 414.1666666666667,175.3333333333