<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" class="diagram" viewBox="0 0 660 280" role="img" aria-label="Making a stranded vehicle visible: hood up, bright cloth on the antenna, a large ground signal such as a V or SOS in contrasting materials, signal mirror flashes toward aircraft or vehicles, headlights or hazards flashed at night in groups of three, whistle blasts in threes; a PLB or satellite messenger sends an alert directly"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="170" width="660" height="110" fill="var(--ground)" opacity="0.35"></rect><g transform="translate(60,120) scale(1)"><path d="M0,40 L10,20 L40,18 L60,0 L120,0 L145,20 L180,24 L185,40 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="1.5"></path><path d="M64,5 L90,5 L90,20 L48,20 Z M95,5 L118,5 L138,20 L95,20 Z" fill="var(--sky)" opacity="0.6" stroke="var(--line)"></path><circle cx="40" cy="42" r="12" fill="var(--text)"></circle><circle cx="148" cy="42" r="12" fill="var(--text)"></circle><path d="M145,20 L165,-6 L180,-2 L180,24" fill="none" stroke="var(--text)" stroke-width="2"></path></g><line x1="200" y1="120" x2="200" y2="80" stroke="var(--text)" stroke-width="1.5"></line><path d="M200,80 l24,6 l-24,8 z" fill="var(--accent-2)"></path><text x="230" y="80" font-size="10.5" fill="var(--accent-2)">bright cloth</text><text x="120" y="110" font-size="10.5" text-anchor="middle" fill="var(--text)">hood up = “need help”</text><g transform="translate(330,176)"><path d="M0,0 L40,60 L80,0" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"></path><text x="40" y="82" text-anchor="middle" font-size="10.5" fill="var(--text)">V = “require assistance”</text></g><text x="470" y="210" font-size="10.5" fill="var(--text)">Ground signals: large (several m),</text><text x="470" y="226" font-size="10.5" fill="var(--text)">contrasting, on open ground,</text><text x="470" y="242" font-size="10.5" fill="var(--text)">straight lines — rare in nature</text><circle cx="560" cy="60" r="10" fill="var(--accent-2)"></circle><path d="M260,160 L548,66" stroke="var(--accent-2)" stroke-width="1.5" stroke-dasharray="6 4"></path><text x="440" y="96" font-size="10.5" fill="var(--accent-2)">mirror flash — visible for kilometres in sun</text><path d="M520,52 l40,-8 l6,10 l-40,8 z" fill="var(--muted)"></path><text x="20" y="24" font-size="12" font-weight="700" fill="var(--text)">By day: hood up, cloth, ground signal, mirror · By night: lights and whistle in threes</text><text x="20" y="42" font-size="12" font-weight="700" fill="var(--text)">Always: PLB / satellite SOS if you carry one</text><text x="20" y="272" font-size="10" class="muted-fill">Signals only work when someone is looking — which is why the trip plan comes first.</text></svg>
