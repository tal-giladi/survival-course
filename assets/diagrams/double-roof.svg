<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" class="diagram" viewBox="0 0 720 280" role="img" aria-label="Desert double-roof shade: two sheets with a 20 to 30 centimetre air gap, raised so air flows underneath, over a shallow scrape down to cooler sand"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="dr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="dr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect width="720" height="210" fill="var(--sky)" opacity="0.35"></rect><rect y="210" width="720" height="70" fill="var(--ground)" opacity="0.5"></rect><circle cx="660" cy="40" r="22" fill="var(--accent-2)"></circle><path d="M630,55 L480,100" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#dr)"></path><path d="M590,63 L420,100" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#dr)"></path><path d="M550,71 L360,100" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#dr)"></path><path d="M150,100 L570,100" stroke="var(--accent-2)" stroke-width="5"></path><path d="M150,130 L570,130" stroke="var(--accent)" stroke-width="5"></path><text x="580" y="104" font-size="12">top sheet: hot</text><text x="580" y="134" font-size="12">lower: cooler</text><text x="40" y="118" font-size="12">20–30 cm air gap</text><path d="M40,160 L680,160" stroke="var(--info)" stroke-dasharray="8 5" stroke-width="2" marker-end="url(#dr2)"></path><path d="M40,180 L680,180" stroke="var(--info)" stroke-dasharray="8 5" stroke-width="2" marker-end="url(#dr2)"></path><text x="40" y="200" font-size="12" style="fill:var(--info)">breeze under the roof (raise it 40–60 cm or leave sides open)</text><line x1="160" y1="100" x2="160" y2="230" stroke="var(--text)" stroke-width="4"></line><line x1="560" y1="100" x2="560" y2="230" stroke="var(--text)" stroke-width="4"></line><path d="M220,210 L240,240 L480,240 L500,210" fill="var(--panel-2)" stroke="var(--text)"></path><g><rect x="270" y="222" width="150" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="430" cy="229" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><text x="230" y="270" font-size="12">scrape down 30–50 cm: sand below the surface is far cooler</text><text x="20" y="30" font-size="12" font-weight="700">Build in the cool morning or evening — never at the peak of the day.</text></svg>
