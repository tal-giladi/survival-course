<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" class="diagram" viewBox="0 0 660 270" role="img" aria-label="Three field repairs: a boot sole bound with cord through the lace eyelets and under the arch, with tape over it; a broken tent pole bridged with a splint sleeve or tent stake and taped at both ends; a torn fabric patched on both sides with round-cornered tape extending at least 2 to 3 centimetres beyond the tear"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="13" font-weight="700">Boot sole</text><path d="M 30 160 L 30 90 Q 60 70 100 90 L 150 120 Q 190 130 190 160 Z" fill="var(--ground)" opacity="0.6" stroke="var(--text)"></path><path d="M 30 165 L 190 165 Q 196 160 190 158" fill="none" stroke="var(--text)" stroke-width="6"></path><path d="M 150 165 L 200 178" stroke="var(--bad)" stroke-width="6"></path><path d="M 120 120 L 114 175" stroke="var(--accent)" stroke-width="3"></path><path d="M 145 120 L 139 175" stroke="var(--accent)" stroke-width="3"></path><path d="M 170 120 L 164 175" stroke="var(--accent)" stroke-width="3"></path><text x="20" y="205" font-size="11">Tough binding (cord, ties) takes</text><text x="20" y="220" font-size="11">the load; tape covers it. Avoid</text><text x="20" y="235" font-size="11">wraps under the ball of the foot.</text><text x="240" y="24" font-size="13" font-weight="700">Broken tent pole</text><line x1="240" y1="110" x2="330" y2="110" stroke="var(--muted)" stroke-width="8" stroke-linecap="round"></line><line x1="336" y1="112" x2="430" y2="112" stroke="var(--muted)" stroke-width="8" stroke-linecap="round"></line><rect x="295" y="100" width="80" height="22" rx="6" fill="var(--info)" opacity="0.55" stroke="var(--info)"></rect><rect x="290" y="98" width="14" height="26" fill="var(--accent)" opacity="0.8"></rect><rect x="366" y="98" width="14" height="26" fill="var(--accent)" opacity="0.8"></rect><text x="240" y="160" font-size="11">Splint sleeve (or a tent stake)</text><text x="240" y="175" font-size="11">centred on the break, taped at</text><text x="240" y="190" font-size="11">both ends. Sharp ends taped over</text><text x="240" y="205" font-size="11">so they cannot cut the fly.</text><text x="470" y="24" font-size="13" font-weight="700">Fabric tear</text><rect x="470" y="50" width="170" height="120" fill="var(--sky)" opacity="0.4" stroke="var(--line)"></rect><rect x="500" y="85" width="110" height="50" rx="14" fill="var(--accent)" opacity="0.55"></rect><path d="M 520 110 L 560 104 L 592 112" stroke="var(--text)" stroke-width="2" fill="none"></path><text x="470" y="195" font-size="11">Clean and dry; round corners;</text><text x="470" y="210" font-size="11">2–3 cm beyond the tear; both</text><text x="470" y="225" font-size="11">sides if you can; warm the tape.</text><text x="20" y="260" font-size="11" class="muted-fill">Each repair separates the load path (tough material) from the cover (smooth, sealing material).</text></svg>
