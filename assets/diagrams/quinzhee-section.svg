<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" class="diagram" viewBox="0 0 720 300" role="img" aria-label="Quinzhee cross-section: even 30 cm walls marked by depth sticks, a sleeping platform above the entrance level, a cold sink, and a ventilation hole"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="qz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect width="720" height="300" fill="var(--sky)" opacity="0.3"></rect><rect y="230" width="720" height="70" fill="var(--panel)" stroke="var(--line)"></rect><path d="M150,230 Q360,-20 570,230 Z" fill="var(--panel)" stroke="var(--text)" stroke-width="2"></path><path d="M200,230 Q360,40 520,230 Z" fill="var(--panel-2)" stroke="var(--muted)"></path><line x1="250" y1="110" x2="268" y2="130" stroke="var(--accent-2)" stroke-width="4"></line><line x1="360" y1="50" x2="360" y2="76" stroke="var(--accent-2)" stroke-width="4"></line><line x1="470" y1="110" x2="452" y2="130" stroke="var(--accent-2)" stroke-width="4"></line><line x1="200" y1="180" x2="226" y2="186" stroke="var(--accent-2)" stroke-width="4"></line><text x="540" y="96" font-size="12" style="fill:var(--accent-2)">30 cm depth sticks:</text><text x="540" y="112" font-size="12" style="fill:var(--accent-2)">stop when you reach one</text><rect x="290" y="170" width="200" height="30" fill="var(--accent-2)" opacity="0.35"></rect><g><rect x="310" y="154" width="140" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="460" cy="161" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><text x="300" y="215" font-size="11">sleeping bench, raised above the entrance</text><path d="M150,262 L240,262 L240,230" fill="none" stroke="var(--text)" stroke-width="2"></path><text x="40" y="258" font-size="12">entrance low:</text><text x="40" y="274" font-size="12">cold air sinks out</text><line x1="420" y1="72" x2="432" y2="40" stroke="var(--info)" stroke-width="6"></line><path d="M440,70 L452,38" stroke="var(--info)" stroke-width="2" marker-end="url(#qz)"></path><text x="462" y="50" font-size="12" font-weight="700" style="fill:var(--info)">vent hole (keep it clear)</text><text x="20" y="24" font-size="12" font-weight="700">Pile → wait 1–2 h to sinter → hollow to an even wall</text><text x="20" y="215" font-size="11" class="muted-fill">Inside air: near 0 °C</text><text x="20" y="229" font-size="11" class="muted-fill">or a few degrees below.</text><text x="20" y="292" font-size="11" style="fill:var(--bad)">No flame without a working vent. Keep the shovel inside. Never alone and never in avalanche terrain.</text></svg>
