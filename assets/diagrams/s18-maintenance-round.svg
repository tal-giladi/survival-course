<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" class="diagram" viewBox="0 0 640 350" role="img" aria-label="A daily maintenance round of nine checks arranged in a circle: feet, body, clothing, sleep system, shelter, water system, fire kit, tools and signals. Morning round before work, evening round before dark."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="mr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><circle cx="320" cy="175" r="125" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"></circle><g><rect x="240" y="143" width="160" height="64" rx="8" fill="var(--accent)" stroke="var(--line)"></rect><text x="320" y="172" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Daily round</text><text x="320" y="188" text-anchor="middle" font-size="10" class="muted-fill">morning + evening, ~15 min</text></g><g><rect x="258" y="30" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="47" text-anchor="middle" font-size="12" font-weight="700">Feet</text><text x="320" y="63" text-anchor="middle" font-size="10" class="muted-fill">dry, inspect, air</text></g><g><rect x="338.35" y="59.24" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="400.35" y="76.24" text-anchor="middle" font-size="12" font-weight="700">Body</text><text x="400.35" y="92.24" text-anchor="middle" font-size="10" class="muted-fill">hands, cuts, sun, bites</text></g><g><rect x="381.1" y="133.29" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="443.1" y="150.29" text-anchor="middle" font-size="12" font-weight="700">Clothing</text><text x="443.1" y="166.29" text-anchor="middle" font-size="10" class="muted-fill">dry, mend small tears</text></g><g><rect x="366.25" y="217.5" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="428.25" y="234.5" text-anchor="middle" font-size="12" font-weight="700">Sleep system</text><text x="428.25" y="250.5" text-anchor="middle" font-size="10" class="muted-fill">air, dry, loft</text></g><g><rect x="300.75" y="272.46" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="362.75" y="289.46" text-anchor="middle" font-size="12" font-weight="700">Shelter</text><text x="362.75" y="305.46" text-anchor="middle" font-size="10" class="muted-fill">lines, pegs, drips</text></g><g><rect x="215.25" y="272.46" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="277.25" y="289.46" text-anchor="middle" font-size="12" font-weight="700">Water system</text><text x="277.25" y="305.46" text-anchor="middle" font-size="10" class="muted-fill">backflush, clean/dirty</text></g><g><rect x="149.75" y="217.5" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="211.75" y="234.5" text-anchor="middle" font-size="12" font-weight="700">Fire kit</text><text x="211.75" y="250.5" text-anchor="middle" font-size="10" class="muted-fill">dry tinder, next fuel</text></g><g><rect x="134.9" y="133.29" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="196.9" y="150.29" text-anchor="middle" font-size="12" font-weight="700">Tools</text><text x="196.9" y="166.29" text-anchor="middle" font-size="10" class="muted-fill">clean, dry, sharpen</text></g><g><rect x="177.65" y="59.24" width="124" height="40" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="239.65" y="76.24" text-anchor="middle" font-size="12" font-weight="700">Signals</text><text x="239.65" y="92.24" text-anchor="middle" font-size="10" class="muted-fill">refresh, ready</text></g><path d="M 453 155 A 133 133 0 0 1 453 195" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#mr-a)"></path><text x="20" y="340" font-size="10" class="muted-fill">Fix it while it is small, dry it while the sun is out, and put every item back in its place.</text></svg>
