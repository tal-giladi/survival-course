<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Family communication plan: each family member texts one out-of-area contact, who relays news; three pre-agreed meeting places near home, in the neighbourhood and out of town"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="fp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="230" y="20" width="180" height="56" rx="8" fill="var(--accent)" stroke="var(--line)"></rect><text x="320" y="45" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Out-of-area contact</text><text x="320" y="61" text-anchor="middle" font-size="10" class="muted-fill">one person, another region</text></g><g><g><rect x="20" y="130" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="90" y="150" text-anchor="middle" font-size="12" font-weight="700">Parent A</text><text x="90" y="166" text-anchor="middle" font-size="10" class="muted-fill">at work</text></g><line x1="90" y1="130" x2="320" y2="80" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#fp-a)"></line></g><g><g><rect x="178" y="130" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="248" y="150" text-anchor="middle" font-size="12" font-weight="700">Parent B</text><text x="248" y="166" text-anchor="middle" font-size="10" class="muted-fill">commuting</text></g><line x1="248" y1="130" x2="320" y2="80" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#fp-a)"></line></g><g><g><rect x="336" y="130" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="406" y="150" text-anchor="middle" font-size="12" font-weight="700">Child</text><text x="406" y="166" text-anchor="middle" font-size="10" class="muted-fill">at school</text></g><line x1="406" y1="130" x2="320" y2="80" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#fp-a)"></line></g><g><g><rect x="494" y="130" width="140" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="564" y="150" text-anchor="middle" font-size="12" font-weight="700">Grandparent</text><text x="564" y="166" text-anchor="middle" font-size="10" class="muted-fill">at home</text></g><line x1="564" y1="130" x2="320" y2="80" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#fp-a)"></line></g><text x="320" y="112" text-anchor="middle" font-size="11" class="muted-fill">short texts: “OK, at X, next update 20:00”</text><g><rect x="40" y="230" width="170" height="50" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="125" y="252" text-anchor="middle" font-size="12" font-weight="700">1 · Near home</text><text x="125" y="268" text-anchor="middle" font-size="10" class="muted-fill">outside, clear of buildings</text></g><g><rect x="235" y="230" width="170" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="252" text-anchor="middle" font-size="12" font-weight="700">2 · Neighbourhood</text><text x="320" y="268" text-anchor="middle" font-size="10" class="muted-fill">school, park, library</text></g><g><rect x="430" y="230" width="170" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="515" y="252" text-anchor="middle" font-size="12" font-weight="700">3 · Out of town</text><text x="515" y="268" text-anchor="middle" font-size="10" class="muted-fill">relative / friend</text></g><text x="320" y="215" text-anchor="middle" font-size="12" font-weight="700">Meeting places (if you cannot go home or cannot communicate)</text><text x="320" y="310" text-anchor="middle" font-size="11" class="muted-fill">Everyone carries the plan on paper: numbers, meeting places, school/work pick-up rules, medical needs.</text></svg>
