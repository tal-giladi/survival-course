<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" class="diagram" viewBox="0 0 740 300" role="img" aria-label="Relocation procedure flowchart"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="10" y="20" width="130" height="54" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="75" y="42" font-size="12" text-anchor="middle" font-weight="700">1. STOP</text><text x="75" y="60" font-size="10" text-anchor="middle" class="muted-fill">shelter, eat, calm</text></g><g><rect x="160" y="20" width="130" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="225" y="42" font-size="12" text-anchor="middle" font-weight="700">2. Last known point</text><text x="225" y="60" font-size="10" text-anchor="middle" class="muted-fill">where + when?</text></g><g><rect x="310" y="20" width="130" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="375" y="42" font-size="12" text-anchor="middle" font-weight="700">3. Estimate circle</text><text x="375" y="60" font-size="10" text-anchor="middle" class="muted-fill">radius ≈ speed × time</text></g><g><rect x="460" y="20" width="130" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="525" y="42" font-size="12" text-anchor="middle" font-weight="700">4. Test the ground</text><text x="525" y="60" font-size="10" text-anchor="middle" class="muted-fill">features, altitude, aspect</text></g><g><rect x="610" y="20" width="120" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="670" y="42" font-size="12" text-anchor="middle" font-weight="700">5. Located?</text><text x="670" y="60" font-size="10" text-anchor="middle" class="muted-fill">match 2+ clues</text></g><line x1="140" y1="47" x2="158" y2="47" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><line x1="290" y1="47" x2="308" y2="47" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><line x1="440" y1="47" x2="458" y2="47" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><line x1="590" y1="47" x2="608" y2="47" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><line x1="670" y1="74" x2="670" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><line x1="640" y1="74" x2="460" y2="190" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><text x="676" y="100" font-size="10" text-anchor="start" font-weight="700" style="fill:var(--ok)">yes</text><text x="520" y="130" font-size="10" text-anchor="start" font-weight="700" style="fill:var(--bad)">no</text><g><rect x="560" y="122" width="170" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="645" y="144" font-size="12" text-anchor="middle" font-weight="700">Navigate out</text><text x="645" y="162" font-size="10" text-anchor="middle" class="muted-fill">handrail + catching feature</text></g><g><rect x="250" y="190" width="300" height="54" rx="8" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"></rect><text x="400" y="212" font-size="12" text-anchor="middle" font-weight="700">Short, reversible search</text><text x="400" y="230" font-size="10" text-anchor="middle" class="muted-fill">backtrack, or go to a big catching feature; set a time trigger</text></g><line x1="400" y1="244" x2="400" y2="262" stroke="var(--muted)" stroke-width="2" marker-end="url(#rf)"></line><rect x="150" y="264" width="500" height="30" rx="8" fill="var(--bad)" opacity="0.12"></rect><text x="400" y="284" font-size="12" text-anchor="middle" font-weight="700">Light or energy running low? → STAY: shelter, message your position, signal</text></svg>
