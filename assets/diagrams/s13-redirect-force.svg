<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" class="diagram" viewBox="0 0 660 250" role="img" aria-label="Force on a redirect pulley: 2 times the rope tension when the rope makes a U-turn, 1.41 times at 90 degrees between strands, equal to the tension at 120 degrees, and nearly zero when the rope runs straight past"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><text x="20" y="22" font-size="13" font-weight="700">A redirect pulley’s anchor feels the vector sum of both strands</text><g><line x1="90" y1="160" x2="90" y2="100" stroke="var(--accent)" stroke-width="4"></line><line x1="90" y1="160" x2="90" y2="100" stroke="var(--accent)" stroke-width="4"></line><circle cx="90" cy="100" r="10" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></circle><line x1="90" y1="88" x2="90" y2="38" stroke="var(--bad)" stroke-width="3" marker-end="url(#rd-a)"></line><text x="90" y="200" text-anchor="middle" font-size="12">0° between strands</text><text x="90" y="220" text-anchor="middle" font-size="14" font-weight="800">2.00 T</text></g><g><line x1="207.57" y1="142.43" x2="250" y2="100" stroke="var(--accent)" stroke-width="4"></line><line x1="292.43" y1="142.43" x2="250" y2="100" stroke="var(--accent)" stroke-width="4"></line><circle cx="250" cy="100" r="10" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></circle><line x1="250" y1="88" x2="250" y2="52.64" stroke="var(--bad)" stroke-width="3" marker-end="url(#rd-a)"></line><text x="250" y="200" text-anchor="middle" font-size="12">90° between strands</text><text x="250" y="220" text-anchor="middle" font-size="14" font-weight="800">1.41 T</text></g><g><line x1="358.04" y1="130" x2="410" y2="100" stroke="var(--accent)" stroke-width="4"></line><line x1="461.96" y1="130" x2="410" y2="100" stroke="var(--accent)" stroke-width="4"></line><circle cx="410" cy="100" r="10" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></circle><line x1="410" y1="88" x2="410" y2="63" stroke="var(--bad)" stroke-width="3" marker-end="url(#rd-a)"></line><text x="410" y="200" text-anchor="middle" font-size="12">120° between strands</text><text x="410" y="220" text-anchor="middle" font-size="14" font-weight="800">1.00 T</text></g><g><line x1="510" y1="100" x2="570" y2="100" stroke="var(--accent)" stroke-width="4"></line><line x1="630" y1="100" x2="570" y2="100" stroke="var(--accent)" stroke-width="4"></line><circle cx="570" cy="100" r="10" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></circle><text x="570" y="200" text-anchor="middle" font-size="12">180° between strands</text><text x="570" y="220" text-anchor="middle" font-size="14" font-weight="800">≈ 0</text></g><text x="20" y="244" font-size="11" class="muted-fill">T = rope tension. Force = 2·T·cos(angle ÷ 2), friction ignored.</text></svg>
