<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="280" class="diagram" viewBox="0 0 660 280" role="img" aria-label="Generator placement: never inside the home, garage, basement or shed, even with doors open; outdoors at least 6 metres or 20 feet from doors, windows and vents, exhaust pointing away; CO alarms inside on every level"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="0" width="660" height="230" fill="var(--sky)" opacity="0.25"></rect><rect x="0" y="230" width="660" height="50" fill="var(--ground)" opacity="0.35"></rect><rect x="40" y="110" width="180" height="120" fill="var(--panel-2)" stroke="var(--line)"></rect><polygon points="30,110 130,50 230,110" fill="var(--panel-2)" stroke="var(--line)"></polygon><rect x="70" y="140" width="40" height="40" fill="var(--sky)" stroke="var(--line)"></rect><rect x="150" y="170" width="36" height="60" fill="var(--ground)" stroke="var(--line)"></rect><rect x="220" y="150" width="90" height="80" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="265" y="166" text-anchor="middle" font-size="11">garage</text><rect x="245" y="200" width="40" height="26" rx="4" fill="var(--bad)"></rect><line x1="238" y1="176" x2="292" y2="226" stroke="var(--bad)" stroke-width="4"></line><line x1="292" y1="176" x2="238" y2="226" stroke="var(--bad)" stroke-width="4"></line><text x="130" y="100" text-anchor="middle" font-size="11" font-weight="700">CO alarm on every level</text><circle cx="130" cy="125" r="7" fill="var(--ok)"></circle><rect x="520" y="200" width="50" height="30" rx="5" fill="var(--ok)"></rect><text x="545" y="219" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">GEN</text><path d="M570,205 q18,-10 30,-30 q10,-18 30,-22" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"></path><text x="600" y="140" font-size="10" text-anchor="middle" class="muted-fill">exhaust away</text><line x1="310" y1="250" x2="520" y2="250" stroke="var(--accent)" stroke-width="2" marker-start="url(#gp-a)" marker-end="url(#gp-a)"></line><defs><marker id="gp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><text x="415" y="268" text-anchor="middle" font-size="12" font-weight="700">≥ 6 m (20 ft) from doors, windows, vents</text><text x="450" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad)">Never indoors: not in a garage, basement or shed,</text><text x="450" y="48" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad)">nor by a window — even with doors open.</text><text x="450" y="68" text-anchor="middle" font-size="11" class="muted-fill">Never plug it into a wall socket: “backfeeding”</text><text x="450" y="84" text-anchor="middle" font-size="11" class="muted-fill">can electrocute line workers and neighbours.</text></svg>
