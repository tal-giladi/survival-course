<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="diagram" viewBox="0 0 640 250" role="img" aria-label="Pine pitch glue: resin gives stickiness, charcoal powder gives stiffness and filler, a little fat or dung fiber gives toughness; heat gently, never boil or flame"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><circle cx="70" cy="80" r="52" fill="var(--accent-2)" opacity="0.2" stroke="var(--accent-2)" stroke-width="2"></circle><text x="70" y="72" text-anchor="middle" font-size="12" font-weight="700">Resin (sap)</text><text x="70" y="88" text-anchor="middle" font-size="10">the adhesive: sticky when warm,</text><text x="70" y="102" text-anchor="middle" font-size="10">glassy and brittle when cold</text></g><g><circle cx="290" cy="80" r="52" fill="var(--text)" opacity="0.2" stroke="var(--text)" stroke-width="2"></circle><text x="290" y="72" text-anchor="middle" font-size="12" font-weight="700">Charcoal powder</text><text x="290" y="88" text-anchor="middle" font-size="10">filler: stiffens, cuts brittleness,</text><text x="290" y="102" text-anchor="middle" font-size="10">soaks up solvent-like oils</text></g><g><circle cx="510" cy="80" r="52" fill="var(--info)" opacity="0.2" stroke="var(--info)" stroke-width="2"></circle><text x="510" y="72" text-anchor="middle" font-size="12" font-weight="700">Temper (fat, beeswax,</text><text x="510" y="88" text-anchor="middle" font-size="10">dung/plant fiber)</text><text x="510" y="102" text-anchor="middle" font-size="10">toughness: stops shattering</text></g><text x="180" y="84" text-anchor="middle" font-size="20">+</text><text x="400" y="84" text-anchor="middle" font-size="20">+</text><text x="290" y="160" text-anchor="middle" font-size="12">Common start: ~3–5 parts resin : 1 part charcoal : a little temper (by volume) — then test and adjust</text><rect x="40" y="180" width="560" height="54" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="54" y="202" font-size="12" font-weight="700" style="fill:var(--bad)">Heat low and slow, next to (not over) the flame.</text><text x="54" y="220" font-size="11">Resin’s volatile terpenes (turpentine) catch fire and stick to skin as a burn. Smoking = too hot.</text></svg>
