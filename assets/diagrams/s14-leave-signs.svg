<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" class="diagram" viewBox="0 0 700 250" role="img" aria-label="Leaving signs for rescuers: a dated note at the vehicle or last known point stating time, direction, plan and condition; arrows made of sticks or stones at every junction pointing the way you went; a bright item or marker at each turn; and a large arrow in the open for aircraft."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="0" width="700" height="250" rx="10" fill="var(--ground)" opacity="0.25"></rect><rect x="20" y="30" width="170" height="120" rx="6" fill="var(--panel)" stroke="var(--line)"></rect><text x="30" y="52" font-size="12" font-weight="700">NOTE at car / LKP</text><text x="30" y="72" font-size="10.5">Sat 14:30 — Dana, Ari (2)</text><text x="30" y="88" font-size="10.5">Ari: sprained ankle</text><text x="30" y="104" font-size="10.5">Going N on stream to road</text><text x="30" y="120" font-size="10.5">Back here by 17:00 if blocked</text><text x="30" y="136" font-size="10.5">Have water, whistle, torch</text><path d="M220 200 L330 200 L420 110 L560 110" stroke="var(--muted)" stroke-width="10" fill="none" opacity="0.5"></path><path d="M330 200 L380 240" stroke="var(--muted)" stroke-width="10" opacity="0.5"></path><g stroke="var(--accent-2)" stroke-width="5" stroke-linecap="round"><line x1="300" y1="180" x2="345" y2="180"></line><line x1="345" y1="180" x2="333" y2="170"></line><line x1="345" y1="180" x2="333" y2="190"></line></g><text x="300" y="165" font-size="11" font-weight="700">arrow at every junction</text><rect x="425" y="92" width="10" height="16" fill="var(--bad)"></rect><text x="440" y="90" font-size="11">bright marker at turns</text><g stroke="var(--accent)" stroke-width="8" stroke-linecap="round"><line x1="560" y1="200" x2="660" y2="200"></line><line x1="660" y1="200" x2="630" y2="180"></line><line x1="660" y1="200" x2="630" y2="220"></line></g><text x="610" y="170" text-anchor="middle" font-size="11" font-weight="700">big arrow in the open</text><text x="610" y="236" text-anchor="middle" font-size="10" class="muted-fill">ground-to-air: “going this way”</text><text x="20" y="175" font-size="10.5" class="muted-fill">Use loose sticks, stones or tape —</text><text x="20" y="190" font-size="10.5" class="muted-fill">not blazes cut into trees — and</text><text x="20" y="205" font-size="10.5" class="muted-fill">remove non-emergency markers later.</text></svg>
