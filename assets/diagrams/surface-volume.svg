<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" class="diagram" viewBox="0 0 640 280" role="img" aria-label="Surface-to-volume ratio of sticks falls as four divided by diameter"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="320" y="22" text-anchor="middle" font-size="13" font-weight="700">Surface area per unit volume, A/V = 4/d</text><g><rect x="60" y="50" width="56" height="170" fill="var(--accent-2)" opacity="0.85"></rect><text x="88" y="44" text-anchor="middle" font-size="11">4.0 mm⁻¹</text><circle cx="88" cy="244" r="1" fill="var(--ground)"></circle><text x="88" y="272" text-anchor="middle" font-size="11" class="muted-fill">1 mm</text></g><g><rect x="155" y="163.33333333333334" width="56" height="56.666666666666664" fill="var(--accent-2)" opacity="0.85"></rect><text x="183" y="157.33333333333334" text-anchor="middle" font-size="11">1.3 mm⁻¹</text><circle cx="183" cy="244" r="1" fill="var(--ground)"></circle><text x="183" y="272" text-anchor="middle" font-size="11" class="muted-fill">3 mm</text></g><g><rect x="250" y="191.66666666666666" width="56" height="28.333333333333332" fill="var(--accent)" opacity="0.85"></rect><text x="278" y="185.66666666666666" text-anchor="middle" font-size="11">0.67 mm⁻¹</text><circle cx="278" cy="244" r="1.6666666666666665" fill="var(--ground)"></circle><text x="278" y="272" text-anchor="middle" font-size="11" class="muted-fill">6 mm</text></g><g><rect x="345" y="205.83333333333334" width="56" height="14.166666666666666" fill="var(--accent)" opacity="0.85"></rect><text x="373" y="199.83333333333334" text-anchor="middle" font-size="11">0.33 mm⁻¹</text><circle cx="373" cy="244" r="3.333333333333333" fill="var(--ground)"></circle><text x="373" y="272" text-anchor="middle" font-size="11" class="muted-fill">12 mm</text></g><g><rect x="440" y="213.2" width="56" height="6.8" fill="var(--ground)" opacity="0.85"></rect><text x="468" y="207.2" text-anchor="middle" font-size="11">0.16 mm⁻¹</text><circle cx="468" cy="244" r="6.944444444444445" fill="var(--ground)"></circle><text x="468" y="272" text-anchor="middle" font-size="11" class="muted-fill">25 mm</text></g><g><rect x="535" y="216.6" width="56" height="3.4" fill="var(--ground)" opacity="0.85"></rect><text x="563" y="210.6" text-anchor="middle" font-size="11">0.08 mm⁻¹</text><circle cx="563" cy="244" r="13.88888888888889" fill="var(--ground)"></circle><text x="563" y="272" text-anchor="middle" font-size="11" class="muted-fill">50 mm</text></g><line x1="40" y1="220" x2="620" y2="220" stroke="var(--line)"></line><text x="600" y="120" text-anchor="end" font-size="11" class="muted-fill">halve the diameter → double the</text><text x="600" y="136" text-anchor="end" font-size="11" class="muted-fill">surface each gram of wood exposes to heat</text></svg>
