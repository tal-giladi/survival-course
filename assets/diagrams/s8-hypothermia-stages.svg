<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="346" class="diagram" viewBox="0 0 660 346" role="img" aria-label="Hypothermia stages by core temperature following the WMS 2019 guideline: cold stressed, mild, moderate, severe"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="30" width="30" height="286" rx="15" fill="var(--panel-2)" stroke="var(--line)"></rect><g><rect x="60" y="30" width="30" height="44" fill="var(--ok)" opacity="0.85"></rect><line x1="92" x2="120" y1="52" y2="52" stroke="var(--ok)" stroke-width="2"></line><text x="126" y="49" font-size="13" font-weight="700">Cold stressed</text><text x="126" y="65" font-size="11" class="muted-fill">Shivering, normal mental status, can care for self. Not hypothermic.</text></g><g><rect x="60" y="74" width="30" height="66" fill="var(--warn)" opacity="0.85"></rect><line x1="92" x2="120" y1="107" y2="107" stroke="var(--warn)" stroke-width="2"></line><text x="126" y="104" font-size="13" font-weight="700">Mild (35–32 °C)</text><text x="126" y="120" font-size="11" class="muted-fill">Shivering, &quot;umbles&quot;: stumbles, mumbles, fumbles, grumbles; judgment impaired.</text></g><g><rect x="60" y="140" width="30" height="88" fill="var(--accent-2)" opacity="0.85"></rect><line x1="92" x2="120" y1="184" y2="184" stroke="var(--accent-2)" stroke-width="2"></line><text x="126" y="181" font-size="13" font-weight="700">Moderate (32–28 °C)</text><text x="126" y="197" font-size="11" class="muted-fill">Consciousness falls; shivering may stop; arrhythmia risk rises.</text></g><g><rect x="60" y="228" width="30" height="88" fill="var(--bad)" opacity="0.85"></rect><line x1="92" x2="120" y1="272" y2="272" stroke="var(--bad)" stroke-width="2"></line><text x="126" y="269" font-size="13" font-weight="700">Severe (&lt; 28 °C)</text><text x="126" y="285" font-size="11" class="muted-fill">Unconscious; vital signs faint or absent; high risk of cardiac arrest.</text></g><text x="54" y="34" font-size="11" text-anchor="end">37 °C</text><text x="54" y="78" font-size="11" text-anchor="end">35 °C</text><text x="54" y="144" font-size="11" text-anchor="end">32 °C</text><text x="54" y="232" font-size="11" text-anchor="end">28 °C</text><text x="54" y="320" font-size="11" text-anchor="end">24 °C</text><text x="330" y="340" text-anchor="middle" font-size="10" class="muted-fill">In the field you rarely have a core thermometer: classify by mental status and shivering, and treat the worst case you cannot rule out.</text></svg>
