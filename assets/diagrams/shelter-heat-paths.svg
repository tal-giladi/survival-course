<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" class="diagram" viewBox="0 0 720 330" role="img" aria-label="Cross-section of a person in a tarp shelter with the four heat-loss paths and the shelter control for each"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="hp-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker><marker id="hp-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="hp-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ground)"></path></marker><marker id="hp-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"></path></marker></defs><rect width="720" height="250" fill="var(--sky)" opacity="0.4"></rect><rect y="250" width="720" height="80" fill="var(--ground)" opacity="0.55"></rect><path d="M160,250 L360,70 L560,250" fill="none" stroke="var(--accent)" stroke-width="5"></path><path d="M160,250 L360,70 L560,250 Z" fill="var(--accent)" opacity="0.08"></path><rect x="250" y="232" width="220" height="18" fill="var(--accent-2)" opacity="0.35"></rect><text x="360" y="245" text-anchor="middle" font-size="11">bed: 20–30 cm loose → 5–8 cm compressed</text><g><rect x="290" y="212" width="120" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="420" cy="219" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><path d="M330,200 L300,40" stroke="var(--accent-2)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hp-r)"></path><text x="190" y="30" font-size="12" font-weight="700" style="fill:var(--accent-2)">Radiation → cold clear sky</text><text x="190" y="46" font-size="11" class="muted-fill">control: roof or canopy overhead</text><path d="M20,150 L150,170" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#hp-c)"></path><path d="M20,172 L150,192" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#hp-c)"></path><path d="M20,194 L150,214" stroke="var(--info)" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#hp-c)"></path><text x="12" y="130" font-size="12" font-weight="700" style="fill:var(--info)">Convection: wind</text><text x="12" y="144" font-size="11" class="muted-fill">control: walls, lee site, low pitch</text><path d="M360,258 L360,305" stroke="var(--ground)" stroke-width="4" marker-end="url(#hp-k)"></path><text x="372" y="300" font-size="12" font-weight="700">Conduction → ground (often the biggest drain)</text><text x="372" y="316" font-size="11" class="muted-fill">control: thick, dry bed; pad; raised bed in the tropics</text><path d="M420,205 C470,170 500,160 540,120" stroke="var(--ok)" stroke-width="2.5" fill="none" marker-end="url(#hp-e)"></path><text x="548" y="110" font-size="12" font-weight="700" style="fill:var(--ok)">Evaporation</text><text x="548" y="126" font-size="11" class="muted-fill">wet clothes, sweat, breath</text><text x="548" y="140" font-size="11" class="muted-fill">control: roof, drainage, don’t sweat</text><line x1="400" y1="20" x2="392" y2="44" stroke="var(--info)" stroke-width="2"></line><line x1="430" y1="30" x2="422" y2="54" stroke="var(--info)" stroke-width="2"></line><line x1="460" y1="20" x2="452" y2="44" stroke="var(--info)" stroke-width="2"></line><line x1="490" y1="30" x2="482" y2="54" stroke="var(--info)" stroke-width="2"></line><line x1="520" y1="20" x2="512" y2="44" stroke="var(--info)" stroke-width="2"></line><line x1="550" y1="30" x2="542" y2="54" stroke="var(--info)" stroke-width="2"></line></svg>
