<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" class="diagram" viewBox="0 0 820 280" role="img" aria-label="Hypothermia wrap: ground insulation, dry insulation, vapour barrier and outer wind shell, with warm bottles at chest and armpits"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="70" width="440" height="150" rx="60" fill="none" stroke="var(--ground)" stroke-width="8" opacity="0.8"></rect><rect x="78" y="84" width="404" height="122" rx="50" fill="none" stroke="var(--accent-2)" stroke-width="8" opacity="0.8"></rect><rect x="96" y="98" width="368" height="94" rx="40" fill="none" stroke="var(--sky)" stroke-width="8" opacity="0.8"></rect><rect x="114" y="112" width="332" height="66" rx="30" fill="none" stroke="var(--info)" stroke-width="8" opacity="0.8"></rect><ellipse cx="280" cy="144" rx="130" ry="24" fill="var(--panel-2)" stroke="var(--line)"></ellipse><circle cx="160" cy="144" r="18" fill="var(--panel-2)" stroke="var(--line)"></circle><rect x="230" y="125" width="20" height="14" rx="4" fill="var(--bad)" opacity="0.8"></rect><rect x="290" y="125" width="20" height="14" rx="4" fill="var(--bad)" opacity="0.8"></rect><rect x="260" y="153" width="20" height="14" rx="4" fill="var(--bad)" opacity="0.8"></rect><text x="280" y="240" text-anchor="middle" font-size="10.5">red: warm bottles at chest, armpits, back</text><g><rect x="530" y="70" width="14" height="14" fill="var(--ground)"></rect><text x="552" y="82" font-size="11">Ground insulation (pads, packs, branches)</text></g><g><rect x="530" y="104" width="14" height="14" fill="var(--accent-2)"></rect><text x="552" y="116" font-size="11">Sleeping bag / dry insulation all around</text></g><g><rect x="530" y="138" width="14" height="14" fill="var(--sky)"></rect><text x="552" y="150" font-size="11">Vapour barrier (plastic, bivy, foil)</text></g><g><rect x="530" y="172" width="14" height="14" fill="var(--info)"></rect><text x="552" y="184" font-size="11">Wind/rain shell (tarp, tent)</text></g><text x="20" y="28" font-size="13" font-weight="700">Stop heat loss first: out of wind and wet, horizontal, handled gently</text><text x="20" y="46" font-size="11" class="muted-fill">Warm, sweet drinks only if alert and able to swallow. No rubbing, no alcohol. Covering the head matters.</text><text x="20" y="260" font-size="11" class="muted-fill">Moderate/severe hypothermia (drowsy, not shivering, unresponsive) → emergent evacuation, handle like glass.</text></svg>
