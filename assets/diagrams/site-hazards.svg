<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" class="diagram" viewBox="0 0 720 320" role="img" aria-label="Terrain hazards that rule out a shelter site: rockfall runout, avalanche slopes, flood zones, widowmakers and insect nests"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="720" height="320" fill="var(--sky)" opacity="0.35"></rect><path d="M0,30 L90,40 L110,160 L260,230 L420,260 L520,262 L600,240 L720,200 L720,320 L0,320 Z" fill="var(--ground)" opacity="0.7"></path><path d="M90,40 L110,160" stroke="var(--text)" stroke-width="3"></path><path d="M110,160 L230,222 L110,222 Z" fill="var(--bad)" opacity="0.2"></path><circle cx="130" cy="190" r="4" fill="var(--muted)"></circle><circle cx="160" cy="205" r="4" fill="var(--muted)"></circle><circle cx="190" cy="214" r="4" fill="var(--muted)"></circle><circle cx="145" cy="210" r="4" fill="var(--muted)"></circle><text x="120" y="150" font-size="12" font-weight="700" style="fill:var(--bad)">rockfall runout: fresh chips, no lichen</text><path d="M430,262 Q470,272 520,264" fill="none" stroke="var(--info)" stroke-width="6"></path><path d="M380,248 L600,248" stroke="var(--info)" stroke-dasharray="5 4"></path><text x="460" y="284" font-size="11" font-weight="700" style="fill:var(--info)">high-water line: debris in branches, silt</text><line x1="660" y1="215" x2="666" y2="120" stroke="var(--text)" stroke-width="5"></line><line x1="664" y1="150" x2="690" y2="130" stroke="var(--text)" stroke-width="3"></line><text x="712" y="110" font-size="12" font-weight="700" text-anchor="end" style="fill:var(--bad)">widowmaker: dead tree/limbs</text><ellipse cx="320" cy="244" rx="14" ry="7" fill="var(--accent-2)"></ellipse><text x="275" y="285" font-size="12">ant / wasp nest, game trail</text><circle cx="600" cy="224" r="11" fill="var(--ok)"></circle><text x="600" y="228" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">✓</text><text x="712" y="300" font-size="12" font-weight="700" text-anchor="end" style="fill:var(--ok)">above flood line, living trees, no slope above</text><text x="10" y="20" font-size="12">Look UP (limbs, cliffs, cornices), UPSTREAM (flood), DOWN (nests, drainage), and AROUND (wind).</text></svg>
