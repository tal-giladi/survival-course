<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" class="diagram" viewBox="0 0 660 290" role="img" aria-label="Terrain classes from walking to steep ground, exposed scrambling and climbing. The key question is whether a slip becomes a fall; once it can, rope work and formal training are needed, and the untrained answer is to turn back or call for help"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="13" font-weight="700">Ask: “If I slip here, do I stop — or fall?”</text><g><rect x="20" y="40" width="150" height="150" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="30" y="60" font-size="12" font-weight="700">Walking</text><line x1="40" y1="110" x2="99.42" y2="101.65" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="40" y1="110" x2="110" y2="110" stroke="var(--line)" stroke-dasharray="3 3"></line><text x="115" y="108" font-size="10" class="muted-fill">~8°</text><text x="30" y="134" font-size="10">hands not needed;</text><text x="30" y="147" font-size="10">a slip = a stumble</text><text x="30" y="164" font-size="10" class="muted-fill">Who: you, with judgement</text></g><g><rect x="178" y="40" width="150" height="150" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="2"></rect><text x="188" y="60" font-size="12" font-weight="700">Steep ground</text><line x1="198" y1="110" x2="252.38" y2="84.64" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="198" y1="110" x2="268" y2="110" stroke="var(--line)" stroke-dasharray="3 3"></line><text x="273" y="108" font-size="10" class="muted-fill">~25°</text><text x="188" y="134" font-size="10">hands for balance;</text><text x="188" y="147" font-size="10">a slip may slide</text><text x="188" y="164" font-size="10" class="muted-fill">Who: you — turn back</text><text x="188" y="177" font-size="10" class="muted-fill">early if unsure</text></g><g><rect x="336" y="40" width="150" height="150" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)" stroke-width="2"></rect><text x="346" y="60" font-size="12" font-weight="700">Exposed scramble</text><line x1="356" y1="110" x2="398.43" y2="67.57" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="356" y1="110" x2="426" y2="110" stroke="var(--line)" stroke-dasharray="3 3"></line><text x="431" y="108" font-size="10" class="muted-fill">~45°</text><text x="346" y="134" font-size="10">hands needed; a slip</text><text x="346" y="147" font-size="10">can become a fall</text><text x="346" y="164" font-size="10" class="muted-fill">Who: training and</text><text x="346" y="177" font-size="10" class="muted-fill">experience</text></g><g><rect x="494" y="40" width="150" height="150" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="504" y="60" font-size="12" font-weight="700">Climbing</text><line x1="514" y1="110" x2="534.52" y2="53.62" stroke="var(--ground)" stroke-width="6" stroke-linecap="round"></line><line x1="514" y1="110" x2="584" y2="110" stroke="var(--line)" stroke-dasharray="3 3"></line><text x="589" y="108" font-size="10" class="muted-fill">~70°</text><text x="504" y="134" font-size="10">the rope or your</text><text x="504" y="147" font-size="10">grip holds you</text><text x="504" y="164" font-size="10" class="muted-fill">Who: formal training</text><text x="504" y="177" font-size="10" class="muted-fill">only</text></g><text x="20" y="214" font-size="11">Low-angle: the ground carries most of the load; a rope only helps.</text><text x="20" y="232" font-size="11">High-angle: the rope carries the load — a life-safety system.</text><text x="20" y="262" font-size="11" class="muted-fill">Angles are rough guides: rock quality, wetness, snow, ice and what lies below matter more.</text><text x="20" y="280" font-size="11" class="muted-fill">Going down is harder than going up — do not climb what you cannot reverse.</text></svg>
