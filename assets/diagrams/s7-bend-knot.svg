text x="380" y="102" font-size="11">Figure-eight loop</text><rect x="540" y="92" width="75" height="12" rx="3" fill="var(--ok)"></rect><text x="619" y="102" font-size="10" class="muted-fill">75%</text></g><g><text x="380" y="126" font-size="11">Round turn + 2 half hitches</text><rect x="540" y="116" width="75" height="12" rx="3" fill="var(--ok)"></rect><text x="619" y="126" font-size="10" class="muted-fill">75%</text></g><g><text x="380" y="150" font-size="11">Bowline</text><rect x="540" y="140" width="65" height="12" rx="3" fill="var(--accent-2)"></rect><text x="609" y="150" font-size="10" class="muted-fill">65%</text></g><g><text x="380" y="174" font-size="11">Clove hitch</text><rect x="540" y="164" width="60" height="12" rx="3" fill="var(--accent-2)"></rect><text x="604" y="174" font-size="10" class="muted-fill">60%</text></g><g><text x="380" y="198" font-size="11">Overhand loop</text><rect x="540" y="188" width="50" height="12" rx="3" fill="var(--bad)"></rect><text x="594" y="198" font-size="10" class="muted-fill">50%</text></g><g><text x="380" y="222" font-size="11">Reef knot (as a bend)</text><rect x="540" y="212" width="45" height="12" rx="3" fill="var(--bad)"></rect><text x="589" y="222" font-size="10" class="muted-fill">45%</text></g></svg>
