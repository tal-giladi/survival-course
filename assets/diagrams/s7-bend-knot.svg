<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" class="diagram" viewBox="0 0 680 260" role="img" aria-label="Strength kept when cord bends around a pin of diameter D, and typical knot efficiencies"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" y1="210" x2="310" y2="210" stroke="var(--line)"></line><line x1="60" y1="210" x2="60" y2="50" stroke="var(--line)"></line><text x="185" y="240" text-anchor="middle" font-size="11" class="muted-fill">bend ratio D/d (pin ÷ cord diameter)</text><text x="26" y="130" text-anchor="middle" font-size="11" class="muted-fill" transform="rotate(-90 26 130)">strength kept</text></g><text x="60" y="224" text-anchor="middle" font-size="10" class="muted-fill">1</text><text x="110" y="224" text-anchor="middle" font-size="10" class="muted-fill">2</text><text x="160" y="224" text-anchor="middle" font-size="10" class="muted-fill">4</text><text x="210" y="224" text-anchor="middle" font-size="10" class="muted-fill">8</text><text x="260" y="224" text-anchor="middle" font-size="10" class="muted-fill">16</text><text x="310" y="224" text-anchor="middle" font-size="10" class="muted-fill">32</text><text x="54" y="134" text-anchor="end" font-size="10" class="muted-fill">50%</text><text x="54" y="94" text-anchor="end" font-size="10" class="muted-fill">75%</text><text x="54" y="54" text-anchor="end" font-size="10" class="muted-fill">100%</text><polyline points="60,130 65,127.27 70,124.64 75,122.1 80,119.64 85,117.27 90,114.98 95,112.77 100,110.63 105,108.56 110,106.57 115,104.64 120,102.78 125,100.98 130,99.25 135,97.57 140,95.95 145,94.38 150,92.87 155,91.41 160,90 165,88.64 170,87.32 175,86.05 180,84.82 185,83.64 190,82.49 195,81.38 200,80.31 205,79.28 210,78.28 215,77.32 220,76.39 225,75.49 230,74.62 235,73.78 240,72.97 245,72.19 250,71.44 255,70.71 260,70 265,69.32 270,68.66 275,68.03 280,67.41 285,66.82 290,66.25 295,65.69 300,65.16 305,64.64 310,64.14" fill="none" stroke="var(--accent)" stroke-width="3"></polyline><text x="210" y="58" font-size="10" class="muted-fill">≈ 1 − 0.5/√(D/d)</text><text x="380" y="30" font-size="12" font-weight="700">Typical knot efficiency (pliable cord)</text><g><text x="380" y="54" font-size="11">Straight cord</text><rect x="540" y="44" width="100" height="12" rx="3" fill="var(--ok)"></rect><text x="644" y="54" font-size="10" class="muted-fill">100%</text></g><g><text x="380" y="78" font-size="11">Lashing wraps</text><rect x="540" y="68" width="85" height="12" rx="3" fill="var(--ok)"></rect><text x="629" y="78" font-size="10" class="muted-fill">85%</text></g><g><text x="380" y="102" font-size="11">Figure-eight loop</text><rect x="540" y="92" width="75" height="12" rx="3" fill="var(--ok)"></rect><text x="619" y="102" font-size="10" class="muted-fill">75%</text></g><g><text x="380" y="126" font-size="11">Round turn + 2 half hitches</text><rect x="540" y="116" width="75" height="12" rx="3" fill="var(--ok)"></rect><text x="619" y="126" font-size="10" class="muted-fill">75%</text></g><g><text x="380" y="150" font-size="11">Bowline</text><rect x="540" y="140" width="65" height="12" rx="3" fill="var(--accent-2)"></rect><text x="609" y="150" font-size="10" class="muted-fill">65%</text></g><g><text x="380" y="174" font-size="11">Clove hitch</text><rect x="540" y="164" width="60" height="12" rx="3" fill="var(--accent-2)"></rect><text x="604" y="174" font-size="10" class="muted-fill">60%</text></g><g><text x="380" y="198" font-size="11">Overhand loop</text><rect x="540" y="188" width="50" height="12" rx="3" fill="var(--bad)"></rect><text x="594" y="198" font-size="10" class="muted-fill">50%</text></g><g><text x="380" y="222" font-size="11">Reef knot (as a bend)</text><rect x="540" y="212" width="45" height="12" rx="3" fill="var(--bad)"></rect><text x="589" y="222" font-size="10" class="muted-fill">45%</text></g></svg>
