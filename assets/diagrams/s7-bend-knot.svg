<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" class="diagram" viewBox="0 0 680 260" role="img" aria-label="Strength kept when cord bends around a pin of diameter D, and typical knot efficiencies"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="60" y1="210" x2="310" y2="210" stroke="var(--line)"></line><line x1="60" y1="210" x2="60" y2="50" stroke="var(--line)"></line><text x="185" y="240" text-anchor="middle" font-size="11" class="muted-fill">bend ratio D/d (pin ÷ cord diameter)</text><text x="26" y="130" text-anchor="middle" font-size="11" class="muted-fill" transform="rotate(-90 26 130)">strength kept</text></g><text x="60" y="224" text-anchor="middle" font-size="10" class="muted-fill">1</text><text x="110" y="224" text-anchor="middle" font-size="10" class="muted-fill">2</text><text x="160" y="224" text-anchor="middle" font-size="10" class="muted-fill">4</text><text x="210" y="224" text-anchor="middle" font-size="10" class="muted-fill">8</text><text x="260" y="224" text-anchor="middle" font-size="10" class="muted-fill">16</text><text x="310" y="224" text-anchor="middle" font-size="10" class="muted-fill">32</text><text x="54" y="134" text-anchor="end" font-size="10