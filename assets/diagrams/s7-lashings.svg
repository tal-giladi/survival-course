<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" class="diagram" viewBox="0 0 660 270" role="img" aria-label="Square lashing for poles crossing at right angles, diagonal lashing for poles that tend to spring apart, and tripod lashing for three poles"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="110" y="22" text-anchor="middle" font-size="13" font-weight="700">Square</text><line x1="110" y1="40" x2="110" y2="210" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><line x1="30" y1="120" x2="190" y2="120" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><rect x="93" y="103" width="28" height="28" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></rect><rect x="96" y="106" width="28" height="28" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></rect><rect x="99" y="109" width="28" height="28" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></rect><path d="M96,106 L124,134 M124,106 L96,134" stroke="var(--info)" stroke-width="2"></path><text x="110" y="232" text-anchor="middle" font-size="11">3–4 wraps, then 2–3 frapping turns</text><text x="110" y="248" text-anchor="middle" font-size="11" class="muted-fill">poles cross and touch at 90°</text><text x="330" y="22" text-anchor="middle" font-size="13" font-weight="700">Diagonal</text><line x1="270" y1="50" x2="390" y2="200" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><line x1="390" y1="50" x2="270" y2="200" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><path d="M318,113 L342,137 M320,111 L344,135 M316,115 L340,139" stroke="var(--accent-2)" stroke-width="2.5"></path><path d="M342,113 L318,137 M344,115 L320,139" stroke="var(--accent-2)" stroke-width="2.5"></path><text x="330" y="232" text-anchor="middle" font-size="11">starts with a timber hitch that pulls</text><text x="330" y="248" text-anchor="middle" font-size="11" class="muted-fill">springy poles together, then wraps both ways</text><text x="550" y="22" text-anchor="middle" font-size="13" font-weight="700">Tripod</text><line x1="500" y1="210" x2="552" y2="70" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><line x1="550" y1="215" x2="550" y2="60" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><line x1="600" y1="210" x2="548" y2="70" stroke="var(--ground)" stroke-width="14" stroke-linecap="round"></line><path d="M534,84 Q550,80 566,84" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></path><path d="M534,89 Q550,85 566,89" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></path><path d="M534,94 Q550,90 566,94" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></path><path d="M534,99 Q550,95 566,99" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></path><text x="550" y="232" text-anchor="middle" font-size="11">loose figure-eight weave round 3 legs,</text><text x="550" y="248" text-anchor="middle" font-size="11" class="muted-fill">then spread the legs to lock it</text></svg>
