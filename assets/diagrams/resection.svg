<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" class="diagram" viewBox="0 0 600 390" role="img" aria-label="Resection: back-bearing lines from three features forming a cocked hat"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="10" y="10" width="580" height="370" rx="8" fill="var(--panel-2)"></rect><g><line x1="80" y1="60" x2="326.69711020318255" y2="298.56423843824246" stroke="var(--accent-2)" stroke-width="2"></line><circle cx="80" cy="60" r="7" fill="var(--text)"></circle><text x="90" y="52" font-size="12" text-anchor="start" font-weight="700">Summit ▲</text><text x="90" y="68" font-size="10" text-anchor="start" class="muted-fill">bearing to it 312° → back 132°</text></g><g><line x1="470" y1="80" x2="210.08225279983958" y2="290.6701740464458" stroke="var(--accent-2)" stroke-width="2"></line><circle cx="470" cy="80" r="7" fill="var(--text)"></circle><text x="460" y="72" font-size="12" text-anchor="end" font-weight="700">Mast</text><text x="460" y="58" font-size="10" text-anchor="end" class="muted-fill">bearing to it 053° → back 233°</text></g><g><line x1="330" y1="330" x2="230.0231754133341" y2="140.38878095632327" stroke="var(--accent-2)" stroke-width="2"></line><circle cx="330" cy="330" r="7" fill="var(--text)"></circle><text x="340" y="322" font-size="12" text-anchor="start" font-weight="700">Lake outflow</text><text x="340" y="338" font-size="10" text-anchor="start" class="muted-fill">bearing to it 149° → back 329°</text></g><path d="M269.1,242.8 L279.6,234.4 L299.6,272.4 Z" fill="var(--bad)" opacity="0.45" stroke="var(--bad)"></path><text x="292" y="254" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--bad)">cocked hat — you are in or near it</text><text x="20" y="372" font-size="11" text-anchor="start" class="muted-fill">Best: features 60–120° apart. A big triangle = a bearing or identification error — re-check.</text></svg>
