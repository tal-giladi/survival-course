<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="210" class="diagram" viewBox="0 0 640 210" role="img" aria-label="Fuel budget for 25 litres: continuous idling at about 1 litre per hour lasts about 25 hours; running 10 minutes each hour at about 0.2 litres per hour lasts about 125 hours"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700" fill="var(--text)">How long does 25 L (half a tank) keep you warm?</text><g><text x="20" y="72" font-size="12" font-weight="700" fill="var(--text)">Continuous idling ≈ 1 L/h</text><rect x="200" y="54" width="76" height="28" rx="5" fill="var(--bad)" opacity="0.8"></rect><text x="282" y="73" font-size="12" font-weight="700" fill="var(--text)">25 h</text></g><g><text x="20" y="132" font-size="12" font-weight="700" fill="var(--text)">10 min per hour ≈ 0.2 L/h</text><rect x="200" y="114" width="380" height="28" rx="5" fill="var(--ok)" opacity="0.8"></rect><text x="586" y="133" font-size="12" font-weight="700" fill="var(--text)">125 h</text></g><text x="20" y="180" font-size="11" class="muted-fill">Idle consumption varies widely with engine size and heater use — measure your own car (fuel gauge over an hour of idling).</text><text x="20" y="198" font-size="11" class="muted-fill">Short runs also keep the battery charged for lights and restarting.</text></svg>
