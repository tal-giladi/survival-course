<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Fraction of dry insulation retained by cotton, wool, synthetic and down when damp and soaked"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="230" y="24" font-size="12" font-weight="700" text-anchor="middle">Dry</text><text x="370" y="24" font-size="12" font-weight="700" text-anchor="middle">Damp</text><text x="510" y="24" font-size="12" font-weight="700" text-anchor="middle">Soaked</text><g><text x="120" y="62" text-anchor="end" font-size="13" font-weight="600">Cotton</text><g><rect x="170" y="44" width="120" height="26" rx="5" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="170" y="44" width="120" height="26" rx="5" fill="var(--ok)" opacity="0.85"></rect><text x="230" y="62" text-anchor="middle" font-size="11" font-weight="700">100 %</text></g><g><rect x="310" y="44" width="120" height="26" rx="5" fill="var(--panel-2)" stroke="var(--line)"></rect><rect x="310" y="44" width="66" height="26" rx="5" fill="var(--warn)" opacity="0.85"></rect><text x="370" y="62" text-anchor="middle" font-size="11" font-weight="700">55 %</text></g><g><rect x="450" y="44" wid