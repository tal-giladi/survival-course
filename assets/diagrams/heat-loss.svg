<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" class="diagram" viewBox="0 0 640 360" role="img" aria-label="Four heat-loss mechanisms from a person: radiation, convection, conduction, evaporation, plus respiration"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><rect x="0" y="300" width="640" height="60" fill="var(--ground)" opacity="0.5"></rect><circle cx="320" cy="120" r="26" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></circle><path d="M290,150 Q320,140 350,150 L360,250 L280,250 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></path><path d="M280,250 L250,300 M360,250 L390,300" stroke="var(--text)" stroke-width="6" stroke-linecap="round"></path><text x="320" y="210" text-anchor="middle" font-size="12" font-weight="700">37 °C core</text><path d="M370,145 q15,-8 30,0 t30,0" fill="none" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#hl)"></path><path d="M370,170 q15,-8 30,0 t30,0" fill="none" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#hl)"></path><path d="M370,195 q15,-8 30,0 t30,0" fill="none" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#hl)"></path><text x="470" y="160" font-size="14" font-weight="700">Radiation</text><text x="470" y="177" font-size="11" class="muted-fill">infrared to cold sky/surroundings</text><path d="M60,110 L250,110" stroke="var(--info)" stroke-width="2.5" marker-end="url(#hl)" stroke-dasharray="10 6"></path><path d="M60,140 L250,140" stroke="var(--info)" stroke-width="2.5" marker-end="url(#hl)" stroke-dasharray="10 6"></path><path d="M60,170 L250,170" stroke="var(--info)" stroke-width="2.5" marker-end="url(#hl)" stroke-dasharray="10 6"></path><text x="40" y="95" font-size="14" font-weight="700">Convection (wind)</text><text x="40" y="215" font-size="11" class="muted-fill">moving air strips the warm boundary layer</text><path d="M320,262 L320,320" stroke="var(--accent-2)" stroke-width="3" marker-end="url(#hl)"></path><text x="335" y="330" font-size="14" font-weight="700">Conduction</text><text x="335" y="347" font-size="11">into cold ground, snow, water, metal</text><path d="M300,95 q-6,-15 0,-30 q6,-15 0,-30" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#hl)"></path><path d="M320,95 q-6,-15 0,-30 q6,-15 0,-30" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#hl)"></path><path d="M340,95 q-6,-15 0,-30 q6,-15 0,-30" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#hl)"></path><text x="360" y="45" font-size="14" font-weight="700">Evaporation + respiration</text><text x="360" y="62" font-size="11" class="muted-fill">sweat, wet clothing, breathing cold dry air</text></svg>
