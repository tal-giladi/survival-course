<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" class="diagram" viewBox="0 0 700 260" role="img" aria-label="Signal toolbox by conditions. Sunny day: mirror, bright shapes and movement, smoke where legal. Overcast: bright panels, movement, smoke. Night: strobe or torch in threes, fire where legal, chemlight on a cord. Ground team near: whistle in threes, torch or mirror, answer every call. Anywhere: PLB or satellite SOS, phone call or SMS, radio."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="18" y="22" font-size="12" font-weight="700">Condition</text><text x="168" y="22" font-size="12" font-weight="700">Best</text><text x="338" y="22" font-size="12" font-weight="700">Next</text><text x="508" y="22" font-size="12" font-weight="700">Also</text><g><g><rect x="10" y="32" width="144" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="18" y="56" font-size="11.5" font-weight="700">Sunny day</text></g><g><rect x="160" y="32" width="164" height="38" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--line)"></rect><text x="168" y="56" font-size="11.5" font-weight="700">Mirror flash</text></g><g><rect x="330" y="32" width="164" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="338" y="56" font-size="11.5" font-weight="400">Bright shapes, movement</text></g><g><rect x="500" y="32" width="184" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="508" y="56" font-size="11.5" font-weight="400">Smoke (legal &amp; safe)</text></g></g><g><g><rect x="10" y="76" width="144" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="18" y="100" font-size="11.5" font-weight="700">Overcast day</text></g><g><rect x="160" y="76" width="164" height="38" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--line)"></rect><text x="168" y="100" font-size="11.5" font-weight="700">Bright panels, movement</text></g><g><rect x="330" y="76" width="164" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="338" y="100" font-size="11.5" font-weight="400">Smoke (legal &amp; safe)</text></g><g><rect x="500" y="76" width="184" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="508" y="100" font-size="11.5" font-weight="400">Strobe (weak by day)</text></g></g><g><g><rect x="10" y="120" width="144" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="18" y="144" font-size="11.5" font-weight="700">Night</text></g><g><rect x="160" y="120" width="164" height="38" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--line)"></rect><text x="168" y="144" font-size="11.5" font-weight="700">Strobe / torch in threes</text></g><g><rect x="330" y="120" width="164" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="338" y="144" font-size="11.5" font-weight="400">Fire (legal &amp; safe)</text></g><g><rect x="500" y="120" width="184" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="508" y="144" font-size="11.5" font-weight="400">Chemlight swung on a cord</text></g></g><g><g><rect x="10" y="164" width="144" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="18" y="188" font-size="11.5" font-weight="700">Ground team near</text></g><g><rect x="160" y="164" width="164" height="38" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--line)"></rect><text x="168" y="188" font-size="11.5" font-weight="700">Whistle in threes</text></g><g><rect x="330" y="164" width="164" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="338" y="188" font-size="11.5" font-weight="400">Torch / mirror</text></g><g><rect x="500" y="164" width="184" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="508" y="188" font-size="11.5" font-weight="400">Answer every call</text></g></g><g><g><rect x="10" y="208" width="144" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="18" y="232" font-size="11.5" font-weight="700">Anywhere, anytime</text></g><g><rect x="160" y="208" width="164" height="38" rx="6" fill="var(--accent)" opacity="0.25" stroke="var(--line)"></rect><text x="168" y="232" font-size="11.5" font-weight="700">PLB / satellite SOS</text></g><g><rect x="330" y="208" width="164" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="338" y="232" font-size="11.5" font-weight="400">Phone call / SMS</text></g><g><rect x="500" y="208" width="184" height="38" rx="6" fill="var(--panel-2)" opacity="1" stroke="var(--line)"></rect><text x="508" y="232" font-size="11.5" font-weight="400">Radio (licensed or distress)</text></g></g></svg>
