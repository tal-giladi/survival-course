<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Timeline from 18:00 yesterday to 12:00 today. The main snowfall ended at 22:00 and the prints are cut into it, so they were made after 22:00. A snow shower from 01:00 to 02:00 left a dusting inside the prints, so they were made before 02:00. At 10:00 the prints are therefore 8 to 12 hours old."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="60" y1="120" x2="600" y2="120" stroke="var(--line)" stroke-width="2"></line><g><line x1="60" y1="114" x2="60" y2="126" stroke="var(--line)"></line><text x="60" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">18:00</text></g><g><line x1="120" y1="114" x2="120" y2="126" stroke="var(--line)"></line><text x="120" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">20:00</text></g><g><line x1="180" y1="114" x2="180" y2="126" stroke="var(--line)"></line><text x="180" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">22:00</text></g><g><line x1="240" y1="114" x2="240" y2="126" stroke="var(--line)"></line><text x="240" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">00:00</text></g><g><line x1="300" y1="114" x2="300" y2="126" stroke="var(--line)"></line><text x="300" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">02:00</text></g><g><line x1="360" y1="114" x2="360" y2="126" stroke="var(--line)"></line><text x="360" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">04:00</text></g><g><line x1="420" y1="114" x2="420" y2="126" stroke="var(--line)"></line><text x="420" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">06:00</text></g><g><line x1="480" y1="114" x2="480" y2="126" stroke="var(--line)"></line><text x="480" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">08:00</text></g><g><line x1="540" y1="114" x2="540" y2="126" stroke="var(--line)"></line><text x="540" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">10:00</text></g><g><line x1="600" y1="114" x2="600" y2="126" stroke="var(--line)"></line><text x="600" y="142" text-anchor="middle" font-size="10" font-weight="400" class="muted-fill">12:00</text></g><rect x="60" y="70" width="120" height="22" fill="var(--sky)" stroke="var(--line)"></rect><text x="120" y="85" text-anchor="middle" font-size="11" font-weight="400">snowfall</text><rect x="270" y="70" width="30" height="22" fill="var(--sky)" stroke="var(--line)"></rect><text x="285" y="62" text-anchor="middle" font-size="11" font-weight="400">shower</text><rect x="180" y="160" width="120" height="26" rx="4" fill="var(--accent)" opacity="0.85"></rect><text x="240" y="178" text-anchor="middle" font-size="11" font-weight="700" style="fill:#fff">prints made here</text><line x1="540" y1="40" x2="540" y2="200" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"></line><text x="540" y="34" text-anchor="middle" font-size="11" font-weight="700">now 10:00</text><text x="180" y="210" text-anchor="middle" font-size="10" font-weight="400">AFTER 22:00 — prints cut into the snowfall</text><text x="340" y="228" text-anchor="middle" font-size="10" font-weight="400">BEFORE 02:00 — shower dusting lies inside them</text><text x="320" y="252" text-anchor="middle" font-size="12" font-weight="700">Age = now − event:  10:00 − 02:00 = 8 h (minimum) … 10:00 − 22:00 = 12 h (maximum)</text></svg>
