<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="Clothing layers from skin outward: base, mid, insulation, shell"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="30" y="20" width="260" height="220" rx="18" fill="var(--info)" opacity="0.18" stroke="var(--info)"></rect><text x="340" y="50" font-size="14" font-weight="700">Shell</text><text x="340" y="66" font-size="11.5" class="muted-fill">blocks wind &amp; rain</text><line x1="290" y1="45" x2="335" y2="45" stroke="var(--line)"></line></g><g><rect x="52" y="42" width="216" height="176" rx="18" fill="var(--accent-2)" opacity="0.28" stroke="var(--accent-2)"></rect><text x="340" y="94" font-size="14" font-weight="700">Insulation</text><text x="340" y="110" font-size="11.5" class="muted-fill">traps still air (fleece, down, synthetic, wool)</text><line x1="268" y1="89" x2="335" y2="89" stroke="var(--line)"></line></g><g><rect x="74" y="64" width="172" height="132" rx="18" fill="var(--warn)" opacity="0.38" stroke="var(--warn)"></rect><text x="340" y="138" font-size="14" font-weight="700">Mid layer</text><text x="340" y="154" font-size="11.5" class="muted-fill">adjustable warmth while moving</text><line x1="246" y1="133" x2="335" y2="133" stroke="var(--line)"></line></g><g><rect x="96" y="86" width="128" height="88" rx="18" fill="var(--accent)" opacity="0.48000000000000004" stroke="var(--accent)"></rect><text x="340" y="182" font-size="14" font-weight="700">Base layer</text><text x="340" y="198" font-size="11.5" class="muted-fill">moves moisture off skin (wool, synthetic — not cotton)</text><line x1="224" y1="177" x2="335" y2="177" stroke="var(--line)"></line></g><g><rect x="118" y="108" width="84" height="44" rx="18" fill="var(--muted)" opacity="0.5800000000000001" stroke="var(--muted)"></rect><text x="340" y="226" font-size="14" font-weight="700">Skin</text><text x="340" y="242" font-size="11.5" class="muted-fill">keep it dry</text><line x1="202" y1="221" x2="335" y2="221" stroke="var(--line)"></line></g></svg>
