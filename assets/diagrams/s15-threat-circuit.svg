<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Threat processing: senses feed a fast route through the amygdala that triggers body responses within a fraction of a second, and a slower route through the cortex and prefrontal cortex that appraises and plans. High stress chemistry weakens the prefrontal cortex and strengthens habits and reflexes."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="tc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="tc-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="tc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="20" y="130" width="110" height="54" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="75" y="154" text-anchor="middle" font-size="12" font-weight="700">Senses</text><text x="75" y="170" text-anchor="middle" font-size="10" class="muted-fill">sight, sound, pain</text></g><g><rect x="180" y="40" width="150" height="54" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="1.5"></rect><text x="255" y="64" text-anchor="middle" font-size="12" font-weight="700">Amygdala</text><text x="255" y="80" text-anchor="middle" font-size="10" class="muted-fill">fast threat detector</text></g><g><rect x="180" y="226" width="150" height="54" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="1.5"></rect><text x="255" y="250" text-anchor="middle" font-size="12" font-weight="700">Sensory cortex</text><text x="255" y="266" text-anchor="middle" font-size="10" class="muted-fill">detailed picture</text></g><g><rect x="400" y="40" width="220" height="54" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="1.5"></rect><text x="510" y="64" text-anchor="middle" font-size="12" font-weight="700">Hypothalamus + brainstem</text><text x="510" y="80" text-anchor="middle" font-size="10" class="muted-fill">adrenaline, heart rate, freeze circuits</text></g><g><rect x="400" y="226" width="220" height="54" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="1.5"></rect><text x="510" y="250" text-anchor="middle" font-size="12" font-weight="700">Prefrontal cortex</text><text x="510" y="266" text-anchor="middle" font-size="10" class="muted-fill">appraise, plan, inhibit, remember</text></g><line x1="130" y1="148" x2="180" y2="80" stroke="var(--bad)" stroke-width="2" marker-end="url(#tc-a)"></line><line x1="330" y1="67" x2="400" y2="67" stroke="var(--bad)" stroke-width="2" marker-end="url(#tc-a)"></line><line x1="130" y1="168" x2="180" y2="240" stroke="var(--info)" stroke-width="2" marker-end="url(#tc-b)"></line><line x1="330" y1="253" x2="400" y2="253" stroke="var(--info)" stroke-width="2" marker-end="url(#tc-b)"></line><line x1="480" y1="226" x2="480" y2="98" stroke="var(--info)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#tc-b)"></line><text x="474" y="170" font-size="10" text-anchor="end" fill="var(--info)">calms / overrides</text><line x1="560" y1="98" x2="560" y2="222" stroke="var(--bad)" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#tc-a)"></line><text x="566" y="150" font-size="10" fill="var(--bad)">high stress</text><text x="566" y="163" font-size="10" fill="var(--bad)">chemistry</text><text x="566" y="176" font-size="10" fill="var(--bad)">weakens PFC</text><text x="255" y="120" text-anchor="middle" font-size="11" fill="var(--bad)" font-weight="700">fast route · before you know it</text><text x="255" y="210" text-anchor="middle" font-size="11" fill="var(--info)" font-weight="700">slow route · deliberate, slower</text><text x="320" y="318" text-anchor="middle" font-size="11" class="muted-fill">Simplified: real circuits overlap. The body reacts before you think; strong stress favours habits.</text></svg>
