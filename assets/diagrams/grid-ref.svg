" y1="200" y2="206" stroke="var(--muted)"></line><line x1="200" x2="206" y1="83" y2="83" stroke="var(--muted)"></line></g><rect x="200" y="70" width="130" height="130" fill="var(--accent)" opacity="0.08"></rect><line x1="200" y1="200" x2="252" y2="200" stroke="var(--accent-2)" stroke-width="3"></line><line x1="252" y1="200" x2="252" y2="109" stroke="var(--accent-2)" stroke-width="3" stroke-dasharray="6 4"></line><circle cx="252" cy="109" r="6" fill="var(--bad)"></circle><text x="262" y="103" font-size="12" text-anchor="start" font-weight="700">Spring</text><text x="476" y="70" font-size="12" text-anchor="start" font-weight="700">1. Along the corridor (eastings)</text><text x="476" y="88" font-size="11" text-anchor="start">line 34, then 4 tenths east → 344</text><text x="476" y="122" font-size="12" text-anchor="start" font-weight="700">2. Up the stairs (northings)</text><text x="476" y="140" font-size="11" text-anchor="start">line 57, then 7 tenths north → 577</text><text x="476" y="180" font-size="15" text-anchor="start" font-weight="800" style="fill:var(--accent)">GR 344 577</text><text x="476" y="200" font-size="11" text-anchor="start" class="muted-fill">= a 100 m square</text><text x="476" y="228" font-size="11" text-anchor="start" class="muted-fill">4 figures (34 57): 1 km square</text><text x="476" y="246" font-size="11" text-anchor="start" class="muted-fill">8 figures: 10 m square</text></svg>
