<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" class="diagram" viewBox="0 0 640 230" role="img" aria-label="Leach&#x27;s commonly quoted split of disaster behaviour: about 10 to 15 percent calm and effective, about 75 percent stunned but able to follow instructions, about 10 to 15 percent counter-productive. A caveat notes that these figures are illustrative, come from case reports rather than systematic counts, and that disaster research finds most people act cooperatively."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="320" y="24" text-anchor="middle" font-size="13" font-weight="700">The “10–80–10” pattern (Leach) — a teaching heuristic, not a measurement</text><g><rect x="40" y="50" width="70" height="46" fill="var(--ok)" opacity="0.75" stroke="var(--line)"></rect><text x="75" y="78" text-anchor="middle" font-size="12" font-weight="700">~10–15 %</text><text x="75" y="116" text-anchor="middle" font-size="10" class="muted-fill">calm</text></g><g><rect x="110" y="50" width="420" height="46" fill="var(--info)" opacity="0.75" stroke="var(--line)"></rect><text x="320" y="78" text-anchor="middle" font-size="12" font-weight="700">~75 %</text><text x="320" y="116" text-anchor="middle" font-size="10" class="muted-fill">stunned, slowed, but able to follow instructions</text></g><g><rect x="530" y="50" width="70" height="46" fill="var(--bad)" opacity="0.75" stroke="var(--line)"></rect><text x="565" y="78" text-anchor="middle" font-size="12" font-weight="700">~10–15 %</text><text x="565" y="116" text-anchor="middle" font-size="10" class="muted-fill">counter-productive</text></g><rect x="40" y="140" width="560" height="72" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-dasharray="5 3"></rect><text x="56" y="160" font-size="11" font-weight="700" fill="var(--accent)">Evidence caveat</text><text x="56" y="178" font-size="10">The figures come from case descriptions, not systematic counts; other authors quote other splits.</text><text x="56" y="194" font-size="10">Disaster sociology finds mass panic rare and cooperation common. The robust lesson is the middle group:</text><text x="56" y="208" font-size="10">most people slow down and wait for a lead — so a calm, simple instruction is powerful.</text></svg>
