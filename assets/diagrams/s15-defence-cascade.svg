<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" class="diagram" viewBox="0 0 640 260" role="img" aria-label="The defence cascade: as a threat comes closer and escape seems less possible, responses move from arousal and orienting, to attentive freezing, to flight or fight, to tonic immobility and finally collapse. Rehearsed plans keep people at the useful, action end."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="dc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><line x1="30" y1="40" x2="610" y2="40" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#dc-a)"></line><text x="30" y="28" font-size="11" class="muted-fill">threat far · escape possible</text><text x="610" y="28" font-size="11" text-anchor="end" class="muted-fill">threat close · escape seems impossible</text><g><rect x="20" y="60" width="112" height="58" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="2"></rect><text x="76" y="84" text-anchor="middle" font-size="12" font-weight="700">Arousal</text><text x="76" y="102" text-anchor="middle" font-size="9" class="muted-fill">orient, “what was that?”</text></g><g><rect x="142" y="82" width="112" height="58" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></rect><text x="198" y="106" text-anchor="middle" font-size="12" font-weight="700">Attentive freeze</text><text x="198" y="124" text-anchor="middle" font-size="9" class="muted-fill">still, watching, heart slows</text></g><g><rect x="264" y="104" width="112" height="58" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="320" y="128" text-anchor="middle" font-size="12" font-weight="700">Flight / fight</text><text x="320" y="146" text-anchor="middle" font-size="9" class="muted-fill">adrenaline, heart races</text></g><g><rect x="386" y="126" width="112" height="58" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="442" y="150" text-anchor="middle" font-size="12" font-weight="700">Tonic immobility</text><text x="442" y="168" text-anchor="middle" font-size="9" class="muted-fill">frozen stiff, cannot move</text></g><g><rect x="508" y="148" width="112" height="58" rx="8" fill="var(--panel-2)" stroke="var(--muted)" stroke-width="2"></rect><text x="564" y="172" text-anchor="middle" font-size="12" font-weight="700">Collapse</text><text x="564" y="190" text-anchor="middle" font-size="9" class="muted-fill">faint, shut down</text></g><text x="320" y="232" text-anchor="middle" font-size="11">A rehearsed response lets you move straight from freeze to purposeful action.</text><text x="320" y="250" text-anchor="middle" font-size="10" class="muted-fill">After Roelofs (2017) and Kozlowska et al. (2015); stages overlap and are not strictly sequential.</text></svg>
