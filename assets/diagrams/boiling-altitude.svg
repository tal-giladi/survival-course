<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" class="diagram" viewBox="0 0 700 310" role="img" aria-label="Boiling point of water falls from 100 degrees at sea level to about 83 degrees at 4,900 metres, still well above the 60 to 70 degree range where pathogens are rapidly killed"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="80" y="180" width="540" height="40" fill="var(--ok)" opacity="0.18"></rect><text x="359" y="208" font-size="12" style="fill:var(--ok)" font-weight="700">Pasteurisation zone: 60 °C for 30 min, or ~70 °C in minutes</text><line x1="80" y1="260" x2="620" y2="260" stroke="var(--line)" stroke-width="2"></line><line x1="80" y1="30" x2="80" y2="260" stroke="var(--line)" stroke-width="2"></line><text x="80" y="278" text-anchor="middle" font-size="11">0 m</text><text x="170" y="278" text-anchor="middle" font-size="11">1000 m</text><text x="260" y="278" text-anchor="middle" font-size="11">2000 m</text><text x="350" y="278" text-anchor="middle" font-size="11">3000 m</text><text x="440" y="278" text-anchor="middle" font-size="11">4000 m</text><text x="530" y="278" text-anchor="middle" font-size="11">5000 m</text><text x="620" y="278" text-anchor="middle" font-size="11">6000 m</text><text x="72" y="224" text-anchor="end" font-size="11">60 °C</text><text x="72" y="184" text-anchor="end" font-size="11">70 °C</text><text x="72" y="144" text-anchor="end" font-size="11">80 °C</text><text x="72" y="104" text-anchor="end" font-size="11">90 °C</text><text x="72" y="64" text-anchor="end" font-size="11">100 °C</text><line x1="80" y1="60" x2="620" y2="140" stroke="var(--accent-2)" stroke-width="3.5"></line><circle cx="521" cy="125.19999999999999" r="5" fill="var(--accent-2)"></circle><text x="511" y="113.19999999999999" text-anchor="end" font-size="12">≈ 83 °C at 4,900 m</text><line x1="260" y1="30" x2="260" y2="260" stroke="var(--info)" stroke-dasharray="5 4" stroke-width="2"></line><text x="266" y="46" font-size="12" font-weight="700" style="fill:var(--info)">Above ~2,000 m: CDC says boil 3 min</text><text x="266" y="62" font-size="12" style="fill:var(--info)">(below: 1 min rolling boil)</text><text x="350" y="302" text-anchor="middle" font-size="10.5" class="muted-fill">Boiling point falls ~1 °C per ~300 m. Heating up to the boil already does most of the killing; the extra minutes are a safety margin.</text></svg>
