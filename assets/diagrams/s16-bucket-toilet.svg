<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" class="diagram" viewBox="0 0 640 270" role="img" aria-label="Emergency bucket toilet: a sturdy bucket lined with two heavy bags, a handful of absorbent such as sawdust or cat litter after each use, a tight lid; separate urine where possible; tie off bags and store in a lidded bin outside living space; wash hands with soap every time"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M80,90 L100,220 L200,220 L220,90 Z" fill="var(--panel-2)" stroke="var(--text)" stroke-width="2"></path><rect x="70" y="78" width="160" height="14" rx="4" fill="var(--ground)"></rect><path d="M86,92 Q150,140 214,92" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="4 3"></path><rect x="100" y="180" width="100" height="30" fill="var(--ground)" opacity="0.6"></rect><text x="150" y="70" text-anchor="middle" font-size="11" font-weight="700">tight lid</text><text x="150" y="200" text-anchor="middle" font-size="10">absorbent layer</text><text x="150" y="245" text-anchor="middle" font-size="12" font-weight="700">1. Bucket + 2 heavy bags</text><g><text x="270" y="70" font-size="13" font-weight="700">2. After each use</text><text x="270" y="88" font-size="11" class="muted-fill">a cup of sawdust, cat litter, soil or shredded paper; lid back on</text></g><g><text x="270" y="116" font-size="13" font-weight="700">3. Separate urine if you can</text><text x="270" y="134" font-size="11" class="muted-fill">a second container: lighter, less smelly bags</text></g><g><text x="270" y="162" font-size="13" font-weight="700">4. Bag full → tie, double-bag</text><text x="270" y="180" font-size="11" class="muted-fill">lidded bin outside living space until collection</text></g><g><text x="270" y="208" font-size="13" font-weight="700">5. Hands, every time</text><text x="270" y="226" font-size="11" class="muted-fill">soap + a little water, or sanitiser; a separate “wash station”</text></g></svg>
