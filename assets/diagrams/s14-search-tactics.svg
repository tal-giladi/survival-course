<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" class="diagram" viewBox="0 0 700 270" role="img" aria-label="Three search tactics. Hasty (Type I): a few fast, trained searchers check trails, the point last seen and likely spots, calling and listening. Efficient (Type II): widely spaced searchers sweep a segment, high POD per hour. Thorough (Type III): closely spaced searchers in a line, high POD but slow and destroys clues. Confinement and attraction run alongside."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="10" y="40" width="200" height="150" rx="8" fill="var(--ground)" opacity="0.35" stroke="var(--line)"></rect><g><line x1="30" y1="180" x2="30" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="0"></line><circle cx="30" cy="180" r="5" fill="var(--accent-2)"></circle></g><text x="110" y="212" text-anchor="middle" font-size="12.5" font-weight="700">Hasty (Type I)</text><text x="110" y="230" text-anchor="middle" font-size="10.5" class="muted-fill">fast; trails, LKP, hazards, likely spots</text></g><g><rect x="250" y="40" width="200" height="150" rx="8" fill="var(--ground)" opacity="0.35" stroke="var(--line)"></rect><g><line x1="270" y1="180" x2="270" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="270" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="322" y1="180" x2="322" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="322" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="374" y1="180" x2="374" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="374" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="426" y1="180" x2="426" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="426" cy="180" r="5" fill="var(--accent-2)"></circle></g><text x="350" y="212" text-anchor="middle" font-size="12.5" font-weight="700">Efficient (Type II)</text><text x="350" y="230" text-anchor="middle" font-size="10.5" class="muted-fill">wide spacing; best POD per hour</text></g><g><rect x="490" y="40" width="200" height="150" rx="8" fill="var(--ground)" opacity="0.35" stroke="var(--line)"></rect><g><line x1="510" y1="180" x2="510" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="510" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="530" y1="180" x2="530" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="530" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="550" y1="180" x2="550" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="550" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="570" y1="180" x2="570" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="570" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="590" y1="180" x2="590" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="590" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="610" y1="180" x2="610" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="610" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="630" y1="180" x2="630" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="630" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="650" y1="180" x2="650" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="650" cy="180" r="5" fill="var(--accent-2)"></circle></g><g><line x1="670" y1="180" x2="670" y2="55" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3"></line><circle cx="670" cy="180" r="5" fill="var(--accent-2)"></circle></g><text x="590" y="212" text-anchor="middle" font-size="12.5" font-weight="700">Thorough (Type III)</text><text x="590" y="230" text-anchor="middle" font-size="10.5" class="muted-fill">close spacing; slow, disturbs clues</text></g><text x="350" y="24" text-anchor="middle" font-size="12" font-weight="700">Alongside: confinement (trail blocks, track traps) · attraction (sirens, lights, calling — then silence to listen)</text><text x="350" y="258" text-anchor="middle" font-size="10.5" class="muted-fill">Sweep width falls in dense vegetation and for a small, silent or hidden subject — which is why a visible, responsive subject is found faster.</text></svg>
