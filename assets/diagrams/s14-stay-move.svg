<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" class="diagram" viewBox="0 0 700 340" role="img" aria-label="Stay or move decision. First: is where you are immediately dangerous? If yes, move the shortest distance to safety. If no: does someone know your route and when to raise the alarm, or have you sent an alert? If yes, stay, improve shelter and signals. If no: can you reach a known, certain safe point within your daylight and energy budget without major hazards? If yes, move deliberately and leave signs. If not, stay, signal and conserve."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="220" y="10" width="260" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="350" y="30" text-anchor="middle" font-size="12" font-weight="700">Immediate danger here?</text><text x="350" y="46" text-anchor="middle" font-size="10" class="muted-fill">rockfall, flood, fire, avalanche, tide, exposure</text></g><line x1="480" y1="33" x2="540" y2="33" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="510" y="26" text-anchor="middle" font-size="11" font-weight="700">yes</text><g><rect x="545" y="10" width="150" height="46" rx="8" fill="var(--bad)" stroke="var(--line)"></rect><text x="620" y="30" text-anchor="middle" font-size="12" font-weight="700">Move — shortest</text><text x="620" y="46" text-anchor="middle" font-size="10" class="muted-fill">distance to safety</text></g><line x1="350" y1="56" x2="350" y2="88" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="360" y="76" font-size="11" font-weight="700">no</text><g><rect x="200" y="90" width="300" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="350" y="112" text-anchor="middle" font-size="12" font-weight="700">Will someone raise the alarm and look here?</text><text x="350" y="128" text-anchor="middle" font-size="10" class="muted-fill">trip plan, overdue time, or alert already sent (PLB, call)</text></g><line x1="500" y1="115" x2="540" y2="115" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="520" y="108" text-anchor="middle" font-size="11" font-weight="700">yes</text><g><rect x="545" y="90" width="150" height="50" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="620" y="112" text-anchor="middle" font-size="12" font-weight="700">STAY</text><text x="620" y="128" text-anchor="middle" font-size="10" class="muted-fill">shelter, signals, water</text></g><line x1="350" y1="140" x2="350" y2="172" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="360" y="160" font-size="11" font-weight="700">no / unsure</text><g><rect x="170" y="174" width="360" height="56" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="350" y="199" text-anchor="middle" font-size="12" font-weight="700">Known, certain safe point within budget?</text><text x="350" y="215" text-anchor="middle" font-size="10" class="muted-fill">daylight, water, energy, injuries — and no major hazards on the way</text></g><line x1="530" y1="202" x2="540" y2="202" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="535" y="190" text-anchor="middle" font-size="11" font-weight="700">yes</text><g><rect x="545" y="176" width="150" height="52" rx="8" fill="var(--info)" stroke="var(--line)"></rect><text x="620" y="199" text-anchor="middle" font-size="12" font-weight="700">MOVE deliberately</text><text x="620" y="215" text-anchor="middle" font-size="10" class="muted-fill">leave signs; set a turn-back time</text></g><line x1="350" y1="230" x2="350" y2="262" stroke="var(--muted)" marker-end="url(#sm-a)"></line><text x="360" y="250" font-size="11" font-weight="700">no</text><g><rect x="200" y="264" width="300" height="50" rx="8" fill="var(--ok)" stroke="var(--line)"></rect><text x="350" y="286" text-anchor="middle" font-size="12" font-weight="700">STAY and make yourself findable</text><text x="350" y="302" text-anchor="middle" font-size="10" class="muted-fill">short moves only (to open ground), then signal</text></g><text x="10" y="334" font-size="10.5" class="muted-fill">Re-run the decision when conditions change: new injury, weather, water running out, days passing with no sign of search.</text></svg>
