<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" class="diagram" viewBox="0 0 660 250" role="img" aria-label="Flintknapping safety: eyes, lungs, hands, legs, bystanders and waste, with the hazard and control for each"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="10" y="22" font-size="13" font-weight="700">Hazard → control (supervised practice only)</text><g><rect x="10" y="34" width="90" height="28" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="55" y="53" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Eyes</text><text x="110" y="46" font-size="11">Impact-rated safety glasses (Z87.1 / EN 166)</text><text x="110" y="60" font-size="10" class="muted-fill">flakes leave the core at speed</text></g><g><rect x="10" y="69" width="90" height="28" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="55" y="88" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Lungs</text><text x="110" y="81" font-size="11">Work outdoors, upwind; wet-sweep; P2/N95 or better for long sessions</text><text x="110" y="95" font-size="10" class="muted-fill">fine crystalline silica dust → silicosis</text></g><g><rect x="10" y="104" width="90" height="28" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="55" y="123" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Hands</text><text x="110" y="116" font-size="11">Thick leather pad on the leg and palm; leather gloves</text><text x="110" y="130" font-size="10" class="muted-fill">lacerations to fingers, palm, thigh</text></g><g><rect x="10" y="139" width="90" height="28" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="55" y="158" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Legs / feet</text><text x="110" y="151" font-size="11">Heavy trousers, closed shoes, tarp to catch debris</text><text x="110" y="165" font-size="10" class="muted-fill">flakes on the ground cut feet and pets</text></g><g><rect x="10" y="174" width="90" height="28" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="55" y="193" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Others</text><text x="110" y="186" font-size="11">Onlookers outside a 2–3 m circle with glasses</text><text x="110" y="200" font-size="10" class="muted-fill">flying spalls</text></g><g><rect x="10" y="209" width="90" height="28" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="55" y="228" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Waste</text><text x="110" y="221" font-size="11">Collect and bury debitage away from paths</text><text x="110" y="235" font-size="10" class="muted-fill">razor shards stay sharp for millennia</text></g></svg>
