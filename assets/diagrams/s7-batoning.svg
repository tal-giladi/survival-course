<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" class="diagram" viewBox="0 0 680 250" role="img" aria-label="Batoning: the knife acts as a wedge driven by a wooden baton; the tip must protrude beyond the log so the baton strikes it, and the wedge force splits along the grain"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7bt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="s7bt2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect x="120" y="120" width="200" height="100" rx="8" fill="var(--ground)" opacity="0.5" stroke="var(--line)"></rect><ellipse cx="220" cy="120" rx="100" ry="18" fill="var(--accent-2)" opacity="0.4" stroke="var(--line)"></ellipse><rect x="60" y="220" width="520" height="16" fill="var(--ground)" opacity="0.35"></rect><text x="330" y="232" font-size="10" class="muted-fill">solid chopping block — never your leg or bare ground with rocks</text><rect x="80" y="108" width="300" height="10" fill="var(--muted)" stroke="var(--line)"></rect><rect x="30" y="104" width="52" height="18" rx="4" fill="var(--text)"></rect><text x="400" y="116" font-size="11">tip protrudes ≥ 5 cm</text><rect x="330" y="46" width="90" height="22" rx="10" fill="var(--ground)" transform="rotate(-10 375 57)"></rect><line x1="355" y1="80" x2="355" y2="104" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#s7bt)"></line><text x="430" y="60" font-size="11">baton strikes the spine over the log, then the tip</text><line x1="200" y1="160" x2="160" y2="160" stroke="var(--info)" stroke-width="2" marker-end="url(#s7bt2)"></line><line x1="240" y1="160" x2="280" y2="160" stroke="var(--info)" stroke-width="2" marker-end="url(#s7bt2)"></line><text x="220" y="190" text-anchor="middle" font-size="11" style="fill:var(--info)">wedge: small down-force → large sideways force</text><text x="20" y="24" font-size="12" font-weight="700">Wedge advantage ≈ blade height ÷ blade thickness: a 25 mm blade, 4 mm thick ≈ 6×</text><text x="20" y="42" font-size="11" class="muted-fill">Only full-tang fixed blades. Wrist-thick, knot-free rounds. Kneel or stand to the side, other hand clear.</text></svg>
