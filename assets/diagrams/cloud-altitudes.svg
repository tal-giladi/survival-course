<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" class="diagram" viewBox="0 0 760 390" role="img" aria-label="The ten WMO cloud genera arranged by typical altitude in mid-latitudes"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="60" y="25" width="690" height="325" fill="var(--sky)"></rect><g><rect x="60" y="25" width="8" height="200" fill="var(--info)" opacity="0.7"></rect><text x="78" y="39" font-size="11" font-weight="700">High (cirro-)</text></g><g><rect x="64" y="175" width="8" height="125" fill="var(--accent)" opacity="0.7"></rect><text x="82" y="189" font-size="11" font-weight="700">Middle (alto-)</text></g><g><rect x="68" y="300" width="8" height="50" fill="var(--ground)" opacity="0.7"></rect><text x="86" y="314" font-size="11" font-weight="700">Low</text></g><g><line x1="52" x2="60" y1="350" y2="350" stroke="var(--muted)"></line><text x="48" y="354" text-anchor="end" font-size="11" class="muted-fill">0 km</text></g><g><line x1="52" x2="60" y1="300" y2="300" stroke="var(--muted)"></line><text x="48" y="304" text-anchor="end" font-size="11" class="muted-fill">2 km</text></g><g><line x1="52" x2="60" y1="250" y2="250" stroke="var(--muted)"></line><text x="48" y="254" text-anchor="end" font-size="11" class="muted-fill">4 km</text></g><g><line x1="52" x2="60" y1="200" y2="200" stroke="var(--muted)"></line><text x="48" y="204" text-anchor="end" font-size="11" class="muted-fill">6 km</text></g><g><line x1="52" x2="60" y1="150" y2="150" stroke="var(--muted)"></line><text x="48" y="154" text-anchor="end" font-size="11" class="muted-fill">8 km</text></g><g><line x1="52" x2="60" y1="100" y2="100" stroke="var(--muted)"></line><text x="48" y="104" text-anchor="end" font-size="11" class="muted-fill">10 km</text></g><g><line x1="52" x2="60" y1="50" y2="50" stroke="var(--muted)"></line><text x="48" y="54" text-anchor="end" font-size="11" class="muted-fill">12 km</text></g><path d="M190,100 q30,-6 55,-18 q8,-4 14,-2 M200,115 q30,-4 50,-14" stroke="var(--muted)" stroke-width="2" fill="none"></path><text x="225" y="140" text-anchor="middle" font-size="12" font-weight="600">Cirrus (Ci)</text><circle cx="320" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="329" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="338" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="347" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="356" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="365" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="374" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="383" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="392" cy="105" r="2.5" fill="var(--muted)"></circle><circle cx="324" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="333" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="342" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="351" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="360" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="369" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="378" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="387" cy="113" r="2.5" fill="var(--muted)"></circle><circle cx="396" cy="113" r="2.5" fill="var(--muted)"></circle><text x="360" y="140" text-anchor="middle" font-size="12" font-weight="600">Cirrocumulus (Cc)</text><rect x="440" y="92.5" width="140" height="22" rx="10" fill="var(--muted)" opacity="0.35"></rect><circle cx="560" cy="102.5" r="18" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"></circle><text x="510" y="140" text-anchor="middle" font-size="12" font-weight="600">Cirrostratus (Cs) — halo</text><ellipse cx="130" cy="235" rx="11" ry="6" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="156" cy="241" rx="11" ry="6" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="182" cy="235" rx="11" ry="6" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="208" cy="241" rx="11" ry="6" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="234" cy="235" rx="11" ry="6" fill="var(--panel)" stroke="var(--muted)"></ellipse><text x="182" y="257.5" text-anchor="middle" font-size="12" font-weight="600">Altocumulus (Ac)</text><rect x="260" y="225" width="120" height="24" fill="var(--muted)" opacity="0.55"></rect><text x="320" y="257.5" text-anchor="middle" font-size="12" font-weight="600">Altostratus (As)</text><text x="320" y="270.5" text-anchor="middle" font-size="10.5" class="muted-fill">“frosted-glass” sun</text><rect x="110" y="310" width="120" height="18" fill="var(--muted)" opacity="0.7"></rect><text x="170" y="341.25" text-anchor="middle" font-size="12" font-weight="600">Stratus (St)</text><ellipse cx="265" cy="317.5" rx="15" ry="8" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="295" cy="317.5" rx="15" ry="8" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="325" cy="317.5" rx="15" ry="8" fill="var(--panel)" stroke="var(--muted)"></ellipse><ellipse cx="355" cy="317.5" rx="15" ry="8" fill="var(--panel)" stroke="var(--muted)"></ellipse><text x="310" y="341.25" text-anchor="middle" font-size="12" font-weight="600">Stratocumulus (Sc)</text><rect x="380" y="250" width="110" height="85" fill="var(--muted)" opacity="0.75"></rect><line x1="388" y1="335" x2="383" y2="350" stroke="var(--info)"></line><line x1="406" y1="335" x2="401" y2="350" stroke="var(--info)"></line><line x1="424" y1="335" x2="419" y2="350" stroke="var(--info)"></line><line x1="442" y1="335" x2="437" y2="350" stroke="var(--info)"></line><line x1="460" y1="335" x2="455" y2="350" stroke="var(--info)"></line><line x1="478" y1="335" x2="473" y2="350" stroke="var(--info)"></line><text x="435" y="292.5" text-anchor="middle" font-size="12" font-weight="600" style="fill:#fff">Nimbostratus</text><text x="435" y="306.5" text-anchor="middle" font-size="11" style="fill:#fff">(Ns) steady rain</text><path d="M520,330 q3,-26 18,-20.8 q9,-13 24,-2.6 q15,-5.2 18,23.4 z" fill="var(--panel)" stroke="var(--muted)"></path><text x="550" y="341.25" text-anchor="middle" font-size="12" font-weight="600">Cumulus (Cu)</text><path d="M620,330 Q612,225 630,125 Q640,67.5 600,55 L740,55 Q690,67.5 700,125 Q716,225 708,330 Z" fill="var(--panel)" stroke="var(--muted)"></path><line x1="630" y1="330" x2="624" y2="350" stroke="var(--info)" stroke-width="2"></line><line x1="650" y1="330" x2="644" y2="350" stroke="var(--info)" stroke-width="2"></line><line x1="670" y1="330" x2="664" y2="350" stroke="var(--info)" stroke-width="2"></line><line x1="690" y1="330" x2="684" y2="350" stroke="var(--info)" stroke-width="2"></line><path d="M668,275 l-8,14 h8 l-10,18" stroke="var(--warn)" stroke-width="2.5" fill="none"></path><text x="664" y="40" text-anchor="middle" font-size="12" font-weight="600">Cumulonimbus (Cb)</text><rect x="60" y="350" width="690" height="8" fill="var(--ground)"></rect><text x="405" y="385" text-anchor="middle" font-size="10.5" class="muted-fill">Heights are typical for mid-latitudes; cloud levels are lower near the poles and higher in the tropics.</text></svg>
