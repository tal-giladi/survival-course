<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" class="diagram" viewBox="0 0 740 330" role="img" aria-label="Selective spinal motion restriction: after a significant mechanism, check reliability, spine pain or tenderness and neurological signs; if any is present, restrict motion"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="210" y="10" width="320" height="50" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></rect><text x="370" y="30" text-anchor="middle" font-size="13" font-weight="700">Mechanism that could hurt the spine?</text></g><g><rect x="20" y="100" width="200" height="60" rx="8" fill="var(--ok-soft)" stroke="var(--line)" stroke-width="1"></rect><text x="120" y="120" text-anchor="middle" font-size="13" font-weight="700">No</text><text x="120" y="138" text-anchor="middle" font-size="11" class="muted-fill">Treat other injuries normally</text></g><g><rect x="270" y="90" width="200" height="130" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="370" y="110" text-anchor="middle" font-size="13" font-weight="700">Yes → check (trained)</text><text x="370" y="128" text-anchor="middle" font-size="11" class="muted-fill">Reliable? (alert, sober,</text><text x="370" y="143" text-anchor="middle" font-size="11" class="muted-fill">no distracting injury)</text><text x="370" y="158" text-anchor="middle" font-size="11" class="muted-fill">Spine pain / tenderness?</text><text x="370" y="173" text-anchor="middle" font-size="11" class="muted-fill">Numbness, tingling,</text><text x="370" y="188" text-anchor="middle" font-size="11" class="muted-fill">weakness?</text></g><g><rect x="520" y="100" width="200" height="100" rx="8" fill="var(--bad-soft)" stroke="var(--line)" stroke-width="1"></rect><text x="620" y="120" text-anchor="middle" font-size="13" font-weight="700">Any problem</text><text x="620" y="138" text-anchor="middle" font-size="11" class="muted-fill">Spinal motion restriction:</text><text x="620" y="153" text-anchor="middle" font-size="11" class="muted-fill">still, supported, neutral,</text><text x="620" y="168" text-anchor="middle" font-size="11" class="muted-fill">padded — evacuate</text></g><g><rect x="250" y="250" width="240" height="60" rx="8" fill="var(--ok-soft)" stroke="var(--line)" stroke-width="1"></rect><text x="370" y="270" text-anchor="middle" font-size="13" font-weight="700">All normal</text><text x="370" y="288" text-anchor="middle" font-size="11" class="muted-fill">Spine cleared (by trained responder)</text></g><line x1="330" y1="60" x2="160" y2="98" stroke="var(--accent)" stroke-width="2" marker-end="url(#sp)"></line><line x1="370" y1="60" x2="370" y2="88" stroke="var(--accent)" stroke-width="2" marker-end="url(#sp)"></line><line x1="470" y1="150" x2="518" y2="150" stroke="var(--accent)" stroke-width="2" marker-end="url(#sp)"></line><line x1="370" y1="220" x2="370" y2="248" stroke="var(--accent)" stroke-width="2" marker-end="url(#sp)"></line><text x="20" y="200" font-size="11" class="muted-fill">Lay first aiders: ask the person</text><text x="20" y="214" font-size="11" class="muted-fill">to keep still; don’t apply collars.</text><text x="20" y="228" font-size="11" class="muted-fill">Airway always wins over the spine.</text><text x="520" y="230" font-size="11" class="muted-fill">Rigid boards: not for long carries —</text><text x="520" y="244" font-size="11" class="muted-fill">padded litter / vacuum mattress instead.</text></svg>
