<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" class="diagram" viewBox="0 0 680 270" role="img" aria-label="The blood circle: anyone within arm&#x27;s length plus blade length of a knife user is in danger; the femoral artery zone on the inner thigh must never be in the blade&#x27;s path"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><circle cx="170" cy="140" r="115" fill="var(--bad)" opacity="0.08" stroke="var(--bad)" stroke-width="2" stroke-dasharray="8 5"></circle><circle cx="170" cy="140" r="26" fill="var(--panel-2)" stroke="var(--line)"></circle><text x="170" y="145" text-anchor="middle" font-size="11">you</text><line x1="196" y1="140" x2="285" y2="140" stroke="var(--text)" stroke-width="2"></line><text x="240" y="132" text-anchor="middle" font-size="10">arm + blade</text><circle cx="330" cy="60" r="12" fill="var(--ok)"></circle><text x="348" y="64" font-size="11">outside: safe to talk</text><circle cx="235" cy="220" r="12" fill="var(--bad)"></circle><text x="253" y="224" font-size="11">inside: stop cutting</text><text x="170" y="22" text-anchor="middle" font-size="13" font-weight="700">The blood circle</text><text x="490" y="22" text-anchor="middle" font-size="13" font-weight="700">Seated carving</text><circle cx="470" cy="60" r="16" fill="var(--panel-2)" stroke="var(--line)"></circle><line x1="470" y1="76" x2="470" y2="150" stroke="var(--text)" stroke-width="4"></line><path d="M470,150 L540,150 L540,220" fill="none" stroke="var(--text)" stroke-width="4"></path><path d="M470,150 L520,160 L520,220" fill="none" stroke="var(--text)" stroke-width="4" opacity="0.5"></path><rect x="490" y="142" width="44" height="14" fill="var(--bad)" opacity="0.45"></rect><text x="585" y="140" font-size="10" style="fill:var(--bad)">inner thigh:</text><text x="585" y="153" font-size="10" style="fill:var(--bad)">femoral artery</text><line x1="560" y1="118" x2="610" y2="100" stroke="var(--accent)" stroke-width="3"></line><text x="560" y="92" font-size="10">work outside the knee,</text><text x="560" y="104" font-size="10">cut away from the body</text><text x="480" y="250" text-anchor="middle" font-size="11" class="muted-fill">elbows on knees · blade stroke ends in air, never at a body part</text></svg>
