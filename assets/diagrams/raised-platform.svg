<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" class="diagram" viewBox="0 0 720 280" role="img" aria-label="Tropical raised platform bed with a steep tarp roof, mosquito net, run-off channels and a site above flood level"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="720" height="230" fill="var(--ok)" opacity="0.12"></rect><rect y="230" width="720" height="50" fill="var(--ground)" opacity="0.55"></rect><path d="M225,165 L360,38 L495,165" fill="none" stroke="var(--accent)" stroke-width="5"></path><text x="712" y="56" font-size="12" text-anchor="end">steep roof (≈ 45°) sheds downpours</text><path d="M255,175 L255,120 Q360,80 465,120 L465,175 Z" fill="none" stroke="var(--info)" stroke-dasharray="3 3" stroke-width="2"></path><text x="505" y="130" font-size="12" style="fill:var(--info)">mosquito net tucked under the bed</text><rect x="250" y="175" width="220" height="10" fill="var(--ground)" stroke="var(--text)"></rect><line x1="260" y1="185" x2="260" y2="232" stroke="var(--text)" stroke-width="6"></line><line x1="460" y1="185" x2="460" y2="232" stroke="var(--text)" stroke-width="6"></line><g><rect x="278" y="158" width="140" height="18" rx="9" fill="var(--accent-2)" opacity="0.85"></rect><circle cx="428" cy="165" r="10" fill="var(--accent-2)" opacity="0.85"></circle></g><text x="40" y="200" font-size="12">bed 45–60 cm up:</text><text x="40" y="216" font-size="12">air flows under,</text><text x="40" y="232" font-size="12">run-off passes under</text><path d="M560,240 q10,6 20,0" fill="none" stroke="var(--info)" stroke-width="2"></path><path d="M590,240 q10,6 20,0" fill="none" stroke="var(--info)" stroke-width="2"></path><path d="M620,240 q10,6 20,0" fill="none" stroke="var(--info)" stroke-width="2"></path><text x="560" y="268" font-size="12">run-off, ants, leeches</text><text x="20" y="22" font-size="12" font-weight="700">Off the ground, under a steep roof, inside a net — well above the river.</text></svg>
