<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="The F-diagram: pathogens in faeces reach a new host&#x27;s mouth through fluids, fingers, flies, fields and food. Safe toilets block the routes at the source; hand-washing, water treatment and food hygiene block them later."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="fd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="20" y="120" width="100" height="50" rx="8" fill="var(--ground)" stroke="var(--line)"></rect><text x="70" y="149" text-anchor="middle" font-size="12" font-weight="700">Faeces</text></g><g><rect x="520" y="120" width="100" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="570" y="142" text-anchor="middle" font-size="12" font-weight="700">Mouth</text><text x="570" y="158" text-anchor="middle" font-size="10" class="muted-fill">new host</text></g><g><line x1="120" y1="145" x2="250" y2="55" stroke="var(--muted)" marker-end="url(#fd-a)"></line><g><rect x="250" y="40" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="59" text-anchor="middle" font-size="12" font-weight="700">Fluids (water)</text></g><line x1="380" y1="55" x2="520" y2="145" stroke="var(--muted)" marker-end="url(#fd-a)"></line></g><g><line x1="120" y1="145" x2="250" y2="105" stroke="var(--muted)" marker-end="url(#fd-a)"></line><g><rect x="250" y="90" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="109" text-anchor="middle" font-size="12" font-weight="700">Fingers</text></g><line x1="380" y1="105" x2="520" y2="145" stroke="var(--muted)" marker-end="url(#fd-a)"></line></g><g><line x1="120" y1="145" x2="250" y2="155" stroke="var(--muted)" marker-end="url(#fd-a)"></line><g><rect x="250" y="140" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="159" text-anchor="middle" font-size="12" font-weight="700">Flies</text></g><line x1="380" y1="155" x2="520" y2="145" stroke="var(--muted)" marker-end="url(#fd-a)"></line></g><g><line x1="120" y1="145" x2="250" y2="205" stroke="var(--muted)" marker-end="url(#fd-a)"></line><g><rect x="250" y="190" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="209" text-anchor="middle" font-size="12" font-weight="700">Fields (soil)</text></g><line x1="380" y1="205" x2="520" y2="145" stroke="var(--muted)" marker-end="url(#fd-a)"></line></g><g><line x1="120" y1="145" x2="250" y2="255" stroke="var(--muted)" marker-end="url(#fd-a)"></line><g><rect x="250" y="240" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="315" y="259" text-anchor="middle" font-size="12" font-weight="700">Food</text></g><line x1="380" y1="255" x2="520" y2="145" stroke="var(--muted)" marker-end="url(#fd-a)"></line></g><rect x="180" y="30" width="14" height="240" fill="var(--ok)" opacity="0.8"></rect><text x="187" y="290" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ok)">1 · Safe toilet / cathole</text><rect x="440" y="30" width="14" height="240" fill="var(--accent)" opacity="0.8"></rect><text x="447" y="20" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--accent)">2 · Hand-washing · water treatment · food hygiene</text></svg>
