<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" class="diagram" viewBox="0 0 560 380" role="img" aria-label="Polaris altitude above the horizon equals the observer&#x27;s latitude"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="pl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"></path></marker></defs><circle cx="180" cy="190" r="110" fill="var(--sky)" stroke="var(--info)" stroke-width="2"></circle><line x1="50" x2="310" y1="190" y2="190" stroke="var(--info)" stroke-dasharray="5 4"></line><text x="52" y="184" font-size="10" text-anchor="start" style="fill:var(--info)">equator</text><line x1="180" y1="320" x2="180" y2="20" stroke="var(--text)" stroke-width="1.5"></line><text x="186" y="32" font-size="10" text-anchor="start">Earth’s axis</text><line x1="180" y1="190" x2="264.26488874308757" y2="119.29336293448068" stroke="var(--muted)"></line><path d="M220,190 A40,40 0 0 0 210.64177772475912,164.28849561253844" fill="none" stroke="var(--accent-2)" stroke-width="2"></path><text x="226" y="180" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent-2)">φ</text><line x1="341.39940190547225" y1="211.21869610875802" x2="174.27462338697205" y2="12.047140897823766" stroke="var(--ground)" stroke-width="3"></line><text x="170.27462338697205" y="6.047140897823766" font-size="10" text-anchor="end" style="fill:var(--ground)">horizon (to the north)</text><circle cx="264.26488874308757" cy="119.29336293448068" r="5" fill="var(--text)"></circle><text x="272.26488874308757" y="135.29336293448068" font-size="12" text-anchor="start" font-weight="700">you, latitude φ</text><line x1="264.26488874308757" y1="119.29336293448068" x2="264.26488874308757" y2="-30.706637065519317" stroke="var(--warn)" stroke-width="2.5" marker-end="url(#pl)"></line><text x="272.26488874308757" y="-30.706637065519317" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--warn)">to Polaris (parallel to the axis)</text><path d="M264.26488874308757,69.29336293448068 A50,50 0 0 0 232.1255082587606,80.99114077853179" fill="none" stroke="var(--accent-2)" stroke-width="2"></path><text x="220.26488874308757" y="79.29336293448068" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent-2)">φ</text><text x="20" y="370" font-size="11" text-anchor="start" class="muted-fill">Polaris’s light arrives parallel to Earth’s axis: its altitude above your horizon ≈ your latitude.</text></svg>
