<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" class="diagram" viewBox="0 0 480 330" role="img" aria-label="True north, grid north and magnetic north with declination and convergence angles"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="220" y1="300" x2="220" y2="70" stroke="var(--text)" stroke-width="2.5"></line><text x="220" y="62" font-size="12" text-anchor="middle" font-weight="700">★ True N</text><line x1="220" y1="300" x2="244.04" y2="71.26" stroke="var(--info)" stroke-width="2.5"></line><text x="250.04" y="87.26" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--info)">GN (grid lines)</text><line x1="220" y1="300" x2="164.36" y2="76.83" stroke="var(--bad)" stroke-width="2.5"></line><path d="M164.36,76.83 l-6,14 l12,0 z" fill="var(--bad)"></path><text x="156.36" y="80.83" font-size="12" text-anchor="end" font-weight="700" style="fill:var(--bad)">MN</text><path d="M183.71,154.46 A150,150 0 0 1 220,150" fill="none" stroke="var(--bad)"></path><text x="110" y="150" font-size="11" text-anchor="start" style="fill:var(--bad)">declination (true → magnetic)</text><path d="M220,180 A120,120 0 0 1 232.54,180.66" fill="none" stroke="var(--info)"></path><text x="250" y="190" font-size="11" text-anchor="start" style="fill:var(--info)">convergence (true → grid)</text><path d="M200.65,222.38 A80,80 0 0 1 228.36,220.44" fill="none" stroke="var(--accent-2)" stroke-width="2"></path><text x="238" y="242" font-size="11" text-anchor="start" style="fill:var(--accent-2)">grid–magnetic angle</text><text x="10" y="322" font-size="10" text-anchor="start" class="muted-fill">Angles exaggerated. Declination varies with place and year (WMM).</text></svg>
