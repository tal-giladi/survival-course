<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Search support. Around the last known point (LKP), the area a person could have reached grows with the square of time. Searchers cut for sign along natural track traps — trails, stream banks, roads and soft ground — around the LKP. One confirmed print with a direction of travel narrows the search to a sector."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><rect x="0" y="0" width="640" height="330" fill="var(--ground)" opacity="0.12"></rect><circle cx="250" cy="170" r="70" fill="none" stroke="var(--line)" stroke-dasharray="4 4"></circle><circle cx="250" cy="170" r="140" fill="none" stroke="var(--line)" stroke-dasharray="4 4"></circle><text x="302" y="114" text-anchor="start" font-size="10" font-weight="400" class="muted-fill">1 h</text><text x="352" y="66" text-anchor="start" font-size="10" font-weight="400" class="muted-fill">2 h</text><path d="M250,170 L319.6599467048418,48.560748416837626 A140,140 0 0 1 381.51217979863304,121.99430695623681 Z" fill="var(--accent)" opacity="0.18"></path><path d="M40,300 C120,240 180,200 240,176 C300,150 380,120 460,40" fill="none" stroke="var(--accent-2)" stroke-width="4" opacity="0.7"></path><text x="60" y="290" text-anchor="start" font-size="11" font-weight="400">trail</text><path d="M30,80 C120,100 200,70 300,90 C380,105 440,150 470,320" fill="none" stroke="var(--info)" stroke-width="4" opacity="0.7"></path><text x="40" y="72" text-anchor="start" font-size="11" font-weight="400">stream</text><rect x="124" y="84" width="32" height="12" rx="3" fill="none" stroke="var(--bad)" stroke-width="2"></rect><rect x="284" y="86" width="32" height="12" rx="3" fill="none" stroke="var(--bad)" stroke-width="2"></rect><rect x="132" y="219" width="32" height="12" rx="3" fill="none" stroke="var(--bad)" stroke-width="2"></rect><rect x="344" y="112" width="32" height="12" rx="3" fill="none" stroke="var(--bad)" stroke-width="2"></rect><rect x="430" y="186" width="32" height="12" rx="3" fill="none" stroke="var(--bad)" stroke-width="2"></rect><text x="468" y="196" text-anchor="start" font-size="10" font-weight="700">= sign-cut segment</text><text x="468" y="209" text-anchor="start" font-size="10" font-weight="400" class="muted-fill">(along track traps)</text><circle cx="250" cy="170" r="7" fill="var(--bad)"></circle><text x="240" y="194" text-anchor="end" font-size="11" font-weight="700">LKP</text><circle cx="344" cy="130" r="5" fill="var(--ok)"></circle><line x1="344" y1="130" x2="372" y2="108" stroke="var(--ok)" stroke-width="2" marker-end="url(#sc-a)"></line><text x="380" y="148" text-anchor="start" font-size="10" font-weight="700">confirmed print + direction</text><rect x="478" y="230" width="152" height="90" rx="6" fill="var(--panel)" stroke="var(--line)"></rect><text x="486" y="248" text-anchor="start" font-size="11" font-weight="700">Area ≈ π r², r = v·t</text><text x="486" y="264" text-anchor="start" font-size="10" font-weight="400">2 km/h × 2 h → r = 4 km</text><text x="486" y="278" text-anchor="start" font-size="10" font-weight="400">area ≈ 50 km²</text><text x="486" y="294" text-anchor="start" font-size="10" font-weight="400">a 60° sector: ≈ 8 km²</text><text x="486" y="310" text-anchor="start" font-size="9" font-weight="400" class="muted-fill">(illustrative numbers)</text></svg>
