<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" class="diagram" viewBox="0 0 640 360" role="img" aria-label="Core and shell: in warm conditions the warm core extends to the limbs; in the cold the shell cools and the core shrinks to the trunk and head"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><circle cx="170" cy="60" r="24" fill="var(--warn-soft)" stroke="var(--text)" stroke-width="1.5"></circle><path d="M130,95 Q170,80 210,95 L218,200 L200,200 L196,300 L144,300 L140,200 L122,200 Z" fill="var(--warn-soft)" stroke="var(--text)" stroke-width="1.5"></path><path d="M130,100 L100,200 M210,100 L240,200" stroke="var(--warn-soft)" stroke-width="16" stroke-linecap="round"></path><path d="M130,100 L100,200 M210,100 L240,200" stroke="var(--text)" stroke-width="1" fill="none"></path><ellipse cx="170" cy="150" rx="30" ry="55" fill="var(--bad)" opacity="0.85"></ellipse><circle cx="170" cy="60" r="14" fill="var(--bad)" opacity="0.85"></circle></g><g><circle cx="470" cy="60" r="24" fill="var(--info-soft)" stroke="var(--text)" stroke-width="1.5"></circle><path d="M430,95 Q470,80 510,95 L518,200 L500,200 L496,300 L444,300 L440,200 L422,200 Z" fill="var(--info-soft)" stroke="var(--text)" stroke-width="1.5"></path><path d="M430,100 L400,200 M510,100 L540,200" stroke="var(--info-soft)" stroke-width="16" stroke-linecap="round"></path><path d="M430,100 L400,200 M510,100 L540,200" stroke="var(--text)" stroke-width="1" fill="none"></path><ellipse cx="470" cy="150" rx="19.5" ry="35.75" fill="var(--bad)" opacity="0.85"></ellipse><circle cx="470" cy="60" r="11.2" fill="var(--bad)" opacity="0.85"></circle></g><text x="170" y="330" text-anchor="middle" font-size="14" font-weight="700">Warm environment</text><text x="170" y="348" text-anchor="middle" font-size="11" class="muted-fill">skin blood flow high · shell thin · hands warm</text><text x="470" y="330" text-anchor="middle" font-size="14" font-weight="700">Cold environment</text><text x="470" y="348" text-anchor="middle" font-size="11" class="muted-fill">vasoconstriction · thick cool shell · core defended</text><rect x="265" y="20" width="110" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><circle cx="282" cy="40" r="7" fill="var(--bad)" opacity="0.85"></circle><text x="295" y="44" font-size="11">core ≈ 37 °C</text><circle cx="282" cy="66" r="7" fill="var(--info-soft)" stroke="var(--text)"></circle><text x="295" y="70" font-size="11">shell 20–35 °C</text></svg>
