<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" class="diagram" viewBox="0 0 660 300" role="img" aria-label="Rope constructions: kernmantle with a load-bearing core inside a protective sheath, three-strand laid rope, and braided rope; and a comparison of stretch: dynamic rope stretches a lot to absorb a fall, low-stretch rope very little"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="13" font-weight="700">Construction (cross-sections)</text><circle cx="80" cy="90" r="44" fill="var(--accent)" opacity="0.85"></circle><circle cx="80" cy="90" r="32" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="68" cy="78" r="6" fill="var(--info)"></circle><circle cx="92" cy="78" r="6" fill="var(--info)"></circle><circle cx="68" cy="102" r="6" fill="var(--info)"></circle><circle cx="92" cy="102" r="6" fill="var(--info)"></circle><circle cx="80" cy="90" r="6" fill="var(--info)"></circle><circle cx="80" cy="70" r="6" fill="var(--info)"></circle><circle cx="80" cy="110" r="6" fill="var(--info)"></circle><circle cx="60" cy="90" r="6" fill="var(--info)"></circle><circle cx="100" cy="90" r="6" fill="var(--info)"></circle><text x="80" y="155" text-anchor="middle" font-size="12" font-weight="700">Kernmantle</text><text x="80" y="170" text-anchor="middle" font-size="10" class="muted-fill">core carries most load;</text><text x="80" y="183" text-anchor="middle" font-size="10" class="muted-fill">sheath protects it</text><circle cx="225" cy="70" r="22" fill="var(--ground)" stroke="var(--line)"></circle><circle cx="242.32050807568876" cy="100" r="22" fill="var(--ground)" stroke="var(--line)"></circle><circle cx="207.67949192431124" cy="100" r="22" fill="var(--ground)" stroke="var(--line)"></circle><text x="225" y="155" text-anchor="middle" font-size="12" font-weight="700">Three-strand laid</text><text x="225" y="170" text-anchor="middle" font-size="10" class="muted-fill">easy to inspect and splice;</text><text x="225" y="183" text-anchor="middle" font-size="10" class="muted-fill">no protective sheath</text><circle cx="370" cy="90" r="44" fill="var(--accent-2)" opacity="0.8"></circle><circle cx="406" cy="90" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="403.2596631704063" cy="103.77660356514323" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="395.4558441227157" cy="115.45584412271572" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="383.7766035651432" cy="123.25966317040633" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="370" cy="126" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="356.2233964348568" cy="123.25966317040633" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="344.5441558772843" cy="115.45584412271572" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="336.7403368295937" cy="103.77660356514323" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="334" cy="90" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="336.7403368295937" cy="76.22339643485677" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="344.5441558772843" cy="64.54415587728428" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="356.22339643485674" cy="56.74033682959369" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="370" cy="54" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="383.77660356514326" cy="56.74033682959368" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="395.4558441227157" cy="64.54415587728428" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="403.2596631704063" cy="76.22339643485674" r="6" fill="var(--panel-2)" stroke="var(--line)"></circle><circle cx="370" cy="90" r="22" fill="var(--panel-2)" stroke="var(--line)" stroke-dasharray="3 3"></circle><text x="370" y="155" text-anchor="middle" font-size="12" font-weight="700">Braided (e.g., paracord)</text><text x="370" y="170" text-anchor="middle" font-size="10" class="muted-fill">utility cord — not rated</text><text x="370" y="183" text-anchor="middle" font-size="10" class="muted-fill">for life-safety use</text><text x="470" y="22" font-size="13" font-weight="700">Stretch under load</text><line x1="470" y1="40" x2="640" y2="40" stroke="var(--line)" stroke-width="3"></line><line x1="510" y1="40" x2="510" y2="170" stroke="var(--accent)" stroke-width="5"></line><rect x="496" y="170" width="28" height="24" rx="4" fill="var(--accent)"></rect><line x1="600" y1="40" x2="600" y2="128" stroke="var(--info)" stroke-width="5"></line><rect x="586" y="128" width="28" height="24" rx="4" fill="var(--info)"></rect><line x1="490" y1="128" x2="625" y2="128" stroke="var(--muted)" stroke-dasharray="4 4"></line><text x="510" y="212" text-anchor="middle" font-size="11" font-weight="700">Dynamic</text><text x="510" y="226" text-anchor="middle" font-size="10" class="muted-fill">stretches to absorb</text><text x="510" y="239" text-anchor="middle" font-size="10" class="muted-fill">fall energy</text><text x="600" y="172" text-anchor="middle" font-size="11" font-weight="700">Low-stretch</text><text x="600" y="186" text-anchor="middle" font-size="10" class="muted-fill">(“static”)</text><text x="20" y="258" font-size="11">Dynamic ropes are for catching falls. Low-stretch ropes are for lowering, hauling and fixed lines —</text><text x="20" y="274" font-size="11">a fall onto low-stretch rope sends a far higher force through the person and the anchor.</text><text x="20" y="292" font-size="10" class="muted-fill">Schematic; real proportions vary by maker and standard.</text></svg>
