<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" class="diagram" viewBox="0 0 640 320" role="img" aria-label="A leader at the centre coordinates six roles: navigator, medic, shelter and fire, water and food, signals and communications, and a devil&#x27;s advocate. Every role reports back at fixed check-ins; roles rotate so everyone rests."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><line x1="320" y1="160" x2="320" y2="40" stroke="var(--line)" stroke-width="1.5"></line><rect x="250" y="18" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="320" y="37" text-anchor="middle" font-size="12" font-weight="700">Navigator</text><text x="320" y="52" text-anchor="middle" font-size="9" class="muted-fill">map, position, route</text></g><g><line x1="320" y1="160" x2="517.453792062852" y2="100" stroke="var(--line)" stroke-width="1.5"></line><rect x="447.453792062852" y="78" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="517.453792062852" y="97" text-anchor="middle" font-size="12" font-weight="700">Medic</text><text x="517.453792062852" y="112" text-anchor="middle" font-size="9" class="muted-fill">injuries, warmth checks</text></g><g><line x1="320" y1="160" x2="517.453792062852" y2="220" stroke="var(--line)" stroke-width="1.5"></line><rect x="447.453792062852" y="198" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="517.453792062852" y="217" text-anchor="middle" font-size="12" font-weight="700">Shelter / fire</text><text x="517.453792062852" y="232" text-anchor="middle" font-size="9" class="muted-fill">build, maintain</text></g><g><line x1="320" y1="160" x2="320" y2="280" stroke="var(--line)" stroke-width="1.5"></line><rect x="250" y="258" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="320" y="277" text-anchor="middle" font-size="12" font-weight="700">Water / food</text><text x="320" y="292" text-anchor="middle" font-size="9" class="muted-fill">collect, treat, ration</text></g><g><line x1="320" y1="160" x2="122.54620793714798" y2="220" stroke="var(--line)" stroke-width="1.5"></line><rect x="52.54620793714798" y="198" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1.5"></rect><text x="122.54620793714798" y="217" text-anchor="middle" font-size="12" font-weight="700">Signals / comms</text><text x="122.54620793714798" y="232" text-anchor="middle" font-size="9" class="muted-fill">phone, beacon, signal fire</text></g><g><line x1="320" y1="160" x2="122.54620793714801" y2="99.99999999999999" stroke="var(--line)" stroke-width="1.5"></line><rect x="52.54620793714801" y="77.99999999999999" width="140" height="44" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="1.5"></rect><text x="122.54620793714801" y="96.99999999999999" text-anchor="middle" font-size="12" font-weight="700">Devil’s advocate</text><text x="122.54620793714801" y="111.99999999999999" text-anchor="middle" font-size="9" class="muted-fill">asks “what if we’re wrong?”</text></g><circle cx="320" cy="160" r="46" fill="var(--accent)" opacity="0.9"></circle><text x="320" y="156" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">Leader</text><text x="320" y="172" text-anchor="middle" font-size="9" style="fill:#fff">plan · check-ins · morale</text><text x="320" y="314" text-anchor="middle" font-size="10" class="muted-fill">Small groups combine roles. Fixed check-ins; rotate hard jobs; the devil’s advocate role protects against groupthink.</text></svg>
