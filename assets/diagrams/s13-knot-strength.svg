<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" class="diagram" viewBox="0 0 660 300" role="img" aria-label="Approximate strength kept by common knots in a rope rated 22 kilonewtons: figure-eight about 75 percent or 16.5 kilonewtons, bowline about 65 percent, clove hitch about 60 percent"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="13" font-weight="700">Illustrative: a rope rated 22 kN, and what typical knots leave</text><g><text x="20" y="57" font-size="12">No knot (rope rating)</text><rect x="220" y="43" width="300" height="20" rx="4" fill="var(--info)"></rect><text x="526" y="58" font-size="11" font-weight="700">≈ 100 % · 22.0 kN</text></g><g><text x="20" y="91" font-size="12">Figure-eight loop</text><rect x="220" y="77" width="225" height="20" rx="4" fill="var(--ok)"></rect><text x="451" y="92" font-size="11" font-weight="700">≈ 75 % · 16.5 kN</text></g><g><text x="20" y="125" font-size="12">Double fisherman’s bend</text><rect x="220" y="111" width="210" height="20" rx="4" fill="var(--ok)"></rect><text x="436" y="126" font-size="11" font-weight="700">≈ 70 % · 15.4 kN</text></g><g><text x="20" y="159" font-size="12">Bowline</text><rect x="220" y="145" width="195" height="20" rx="4" fill="var(--accent-2)"></rect><text x="421" y="160" font-size="11" font-weight="700">≈ 65 % · 14.3 kN</text></g><g><text x="20" y="193" font-size="12">Clove hitch</text><rect x="220" y="179" width="180" height="20" rx="4" fill="var(--accent-2)"></rect><text x="406" y="194" font-size="11" font-weight="700">≈ 60 % · 13.2 kN</text></g><g><text x="20" y="227" font-size="12">Overhand loop</text><rect x="220" y="213" width="165" height="20" rx="4" fill="var(--accent-2)"></rect><text x="391" y="228" font-size="11" font-weight="700">≈ 55 % · 12.1 kN</text></g><text x="20" y="252" font-size="11">Typical values from pull tests; they vary with rope, knot dressing and test method.</text><text x="20" y="268" font-size="11">The knot, not the rope, is usually the weak point.</text><text x="20" y="290" font-size="11" class="muted-fill">Ratings are breaking strengths, not working loads: systems for people keep forces far below them.</text></svg>
