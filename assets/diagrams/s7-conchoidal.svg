<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="282" class="diagram" viewBox="0 0 640 282" role="img" aria-label="Conchoidal fracture: a blow near the edge of a platform at less than 90 degrees starts a Hertzian cone; the crack turns and runs parallel to the face, detaching a flake with a bulb of percussion and ripples"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="s7cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker></defs><path d="M60,200 L60,70 L300,70 L340,200 Z" fill="var(--muted)" opacity="0.4" stroke="var(--line)" stroke-width="2"></path><text x="70" y="62" font-size="11">striking platform</text><path d="M72,70 A12,12 0 0,1 60,82" fill="none" stroke="var(--accent)"></path><text x="78" y="92" font-size="11" style="fill:var(--accent)">edge angle &lt; 90°</text><line x1="30" y1="30" x2="72" y2="68" stroke="var(--bad)" stroke-width="3" marker-end="url(#s7cf)"></line><text x="20" y="22" font-size="11" style="fill:var(--bad)">blow a few mm in from the edge</text><path d="M74,72 Q70,110 62,120" fill="none" stroke="var(--accent-2)" stroke-width="2.5"></path><path d="M74,72 Q100,100 90,140 Q80,175 64,200" fill="none" stroke="var(--accent-2)" stroke-width="3"></path><text x="110" y="130" font-size="11">Hertzian cone starts,</text><text x="110" y="144" font-size="11">then the crack turns and runs</text><text x="110" y="158" font-size="11">down the face → a flake</text><path d="M420,70 Q480,60 520,120 Q540,170 500,210 Q450,215 430,170 Q410,120 420,70 Z" fill="var(--muted)" opacity="0.45" stroke="var(--line)" stroke-width="2"></path><ellipse cx="455" cy="92" rx="18" ry="12" fill="var(--accent-2)" opacity="0.6"></ellipse><text x="540" y="92" font-size="11">bulb of percussion</text><path d="M430,120 Q470,112 515,128" fill="none" stroke="var(--text)" stroke-width="1" opacity="0.6"></path><path d="M434,142 Q470,134 511,150" fill="none" stroke="var(--text)" stroke-width="1" opacity="0.6"></path><path d="M438,164 Q470,156 507,172" fill="none" stroke="var(--text)" stroke-width="1" opacity="0.6"></path><path d="M442,186 Q470,178 503,194" fill="none" stroke="var(--text)" stroke-width="1" opacity="0.6"></path><text x="540" y="160" font-size="11">ripples (like glass)</text><text x="320" y="274" text-anchor="middle" font-size="11" class="muted-fill">edges thinner than a razor — and the same physics throws sharp spalls</text><text x="320" y="256" text-anchor="middle" font-size="11" class="muted-fill">works only in fine, uniform, glassy stone (flint, chert, obsidian)</text></svg>
