<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Radiant heat from a fire falls roughly with the square of distance; a reflector returns heat that would escape"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><rect x="0" y="0" width="640" height="200" fill="var(--sky)" opacity="0.15"></rect><rect x="0" y="200" width="640" height="16" fill="var(--ground)" opacity="0.4"></rect><rect x="40" y="110" width="18" height="90" fill="var(--ground)"></rect><rect x="58" y="110" width="18" height="90" fill="var(--ground)" opacity="0.8"></rect><text x="58" y="100" text-anchor="middle" font-size="11">reflector</text><path d="M140,200 Q150,150 170,120 Q190,150 200,200 Z" fill="var(--accent-2)" opacity="0.8"></path><line x1="200" y1="165" x2="284.26488874308757" y2="94.29336293448068" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#rg-a)"></line><line x1="200" y1="165" x2="303.3661882864499" y2="127.37778423417643" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#rg-a)"></line><line x1="200" y1="165" x2="310" y2="165" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#rg-a)"></line><line x1="200" y1="165" x2="303.3661882864499" y2="202.62221576582357" stroke="var(--accent-2)" stroke-width="2" marker-end="url(#rg-a)"></line><line x1="140" y1="165" x2="88.31690585677504" y2="146.18889211708822" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#rg-a)"></line><line x1="140" y1="165" x2="85" y2="165" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#rg-a)"></line><line x1="140" y1="165" x2="88.31690585677504" y2="183.81110788291178" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#rg-a)"></line><path d="M80,150 Q200,110 330,150" fill="none" stroke="var(--accent-2)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#rg-a)"></path><text x="205" y="122" text-anchor="middle" font-size="10.5" class="muted-fill">heat returned by the reflector</text><circle cx="400" cy="140" r="12" fill="var(--text)" opacity="0.6"></circle><rect x="390" y="152" width="20" height="46" rx="6" fill="var(--text)" opacity="0.6"></rect><circle cx="560" cy="140" r="8" fill="var(--text)" opacity="0.4"></circle><rect x="553" y="148" width="14" height="30" rx="4" fill="var(--text)" opacity="0.4"></rect><text x="560" y="212" text-anchor="middle" font-size="10" class="muted-fill">2× the distance</text><text x="400" y="212" text-anchor="middle" font-size="10" class="muted-fill">≈ 1.2 m from fire</text><text x="20" y="240" font-size="12" font-weight="700">Relative radiant heat (point-source approximation, 1 m = 100 %)</text><g transform="translate(20,250)"><rect x="0" y="0" width="110" height="14" rx="4" fill="var(--accent)"></rect><text x="0" y="32" font-size="10.5">0.5 m: 400 %</text></g><g transform="translate(142,250)"><rect x="0" y="0" width="27.5" height="14" rx="4" fill="var(--accent)"></rect><text x="0" y="32" font-size="10.5">1 m: 100 %</text></g><g transform="translate(264,250)"><rect x="0" y="0" width="12.222222222222221" height="14" rx="4" fill="var(--accent)"></rect><text x="0" y="32" font-size="10.5">1.5 m: 44 %</text></g><g transform="translate(386,250)"><rect x="0" y="0" width="6.875" height="14" rx="4" fill="var(--accent)"></rect><text x="0" y="32" font-size="10.5">2 m: 25 %</text></g><g transform="translate(508,250)"><rect x="0" y="0" width="3.0555555555555554" height="14" rx="4" fill="var(--accent)"></rect><text x="0" y="32" font-size="10.5">3 m: 11 %</text></g></svg>
