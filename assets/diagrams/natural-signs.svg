<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" class="diagram" viewBox="0 0 720 250" role="img" aria-label="Wind-flagged tree, cornice with snow drift, and barchan dune, each with the prevailing wind direction"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ns1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="ns2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker><marker id="ns3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--info)"></path></marker></defs><rect x="6" y="6" width="228" height="238" rx="8" fill="var(--panel-2)"></rect><text x="20" y="26" font-size="12" text-anchor="start" font-weight="700">Flagged tree</text><g><line x1="20" y1="50" x2="80" y2="50" stroke="var(--info)" stroke-width="2.5" marker-end="url(#ns1)"></line><text x="20" y="44" font-size="10" text-anchor="start" style="fill:var(--info)">wind</text></g><line x1="110" y1="220" x2="110" y2="80" stroke="var(--ground)" stroke-width="6"></line><path d="M110,100 q40,-6 80,4" stroke="var(--ok)" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M110,122 q40,-6 74,5" stroke="var(--ok)" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M110,144 q40,-6 68,6" stroke="var(--ok)" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M110,166 q40,-6 62,7" stroke="var(--ok)" stroke-width="7" fill="none" stroke-linecap="round"></path><path d="M110,188 q40,-6 56,8" stroke="var(--ok)" stroke-width="7" fill="none" stroke-linecap="round"></path><line x1="30" y1="220" x2="210" y2="220" stroke="var(--ground)" stroke-width="2"></line><text x="20" y="238" font-size="10" text-anchor="start" class="muted-fill">branches stream downwind</text><rect x="246" y="6" width="228" height="238" rx="8" fill="var(--panel-2)"></rect><text x="260" y="26" font-size="12" text-anchor="start" font-weight="700">Cornice and drift</text><g><line x1="260" y1="50" x2="320" y2="50" stroke="var(--info)" stroke-width="2.5" marker-end="url(#ns2)"></line><text x="260" y="44" font-size="10" text-anchor="start" style="fill:var(--info)">wind</text></g><path d="M256,220 L360,110 C380,98 410,96 425,104 C410,112 396,114 386,120 L470,220 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"></path><path d="M360,110 C380,98 410,96 425,104 C410,112 396,114 386,120" fill="none" stroke="var(--bad)" stroke-width="2"></path><text x="400" y="140" font-size="10" text-anchor="start" style="fill:var(--bad)">overhang on</text><text x="400" y="152" font-size="10" text-anchor="start" style="fill:var(--bad)">the LEE side:</text><text x="400" y="164" font-size="10" text-anchor="start" style="fill:var(--bad)">keep well back</text><text x="260" y="238" font-size="10" text-anchor="start" class="muted-fill">snow drifts and tails form downwind</text><rect x="486" y="6" width="228" height="238" rx="8" fill="var(--panel-2)"></rect><text x="500" y="26" font-size="12" text-anchor="start" font-weight="700">Barchan dune (from above)</text><g><line x1="500" y1="50" x2="560" y2="50" stroke="var(--info)" stroke-width="2.5" marker-end="url(#ns3)"></line><text x="500" y="44" font-size="10" text-anchor="start" style="fill:var(--info)">wind</text></g><path d="M660,80 C580,90 560,130 570,145 C560,160 580,200 660,210 C615,180 605,160 615,145 C605,130 615,110 660,80 Z" fill="var(--warn)" opacity="0.35" stroke="var(--warn)"></path><path d="M615,145 C605,130 615,110 660,80 M615,145 C605,160 615,180 660,210" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4 3"></path><text x="500" y="226" font-size="10" text-anchor="start">horns point downwind →</text><text x="500" y="238" font-size="10" text-anchor="start" class="muted-fill">dashed = steep slip face (lee side)</text></svg>
