<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" class="diagram" viewBox="0 0 640 280" role="img" aria-label="Plan continuation: the feeling of commitment to a plan rises quickly with time and effort invested, while evidence that the plan no longer fits rises later. People tend to switch only when evidence overwhelms commitment, far too late. A pre-set trigger such as a turnaround time forces the switch earlier."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="pc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><line x1="60" y1="230" x2="610" y2="230" stroke="var(--line)" marker-end="url(#pc-a)"></line><line x1="60" y1="230" x2="60" y2="20" stroke="var(--line)" marker-end="url(#pc-a)"></line><text x="610" y="258" text-anchor="end" font-size="11" class="muted-fill">time and effort invested →</text><text x="52" y="16" font-size="11" class="muted-fill">strength</text><polyline points="60,180 87.5,150.93111629250274 115,138.8903904178111 142.5,129.6512164993036 170,121.86223258500546 197.5,115.00000000000001 225,108.7960675243284 252.5,103.090962819705 280,97.78078083562214 307.5,92.79334887750818 335,88.07611844574882 362.5,83.58941966775639 390,79.30243299860715 417.5,75.19064927211885 445,71.23419655057018 472.5,67.41669750802299 500,63.72446517001093 527.5,60.145922055192464 555,56.671171253433215 582.5,53.29167351748347 610,50" fill="none" stroke="var(--accent)" stroke-width="2.5"></polyline><polyline points="60,220 87.5,219.6 115,218.39999999999998 142.5,216.39999999999998 170,213.6 197.5,210 225,205.6 252.5,200.4 280,194.39999999999998 307.5,187.6 335,180 362.5,171.6 390,162.4 417.5,152.39999999999998 445,141.60000000000002 472.5,129.99999999999997 500,117.59999999999997 527.5,104.39999999999998 555,90.39999999999996 582.5,75.6 610,59.999999999999986" fill="none" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="6 3"></polyline><text x="126" y="119.99999999999999" font-size="11" fill="var(--accent)" font-weight="700">commitment to the plan</text><text x="214.00000000000003" y="218" font-size="11" fill="var(--bad)" font-weight="700">evidence against it</text><line x1="362.5" y1="230" x2="362.5" y2="30" stroke="var(--ok)" stroke-width="2"></line><text x="368.5" y="36.00000000000001" font-size="11" fill="var(--ok)" font-weight="700">pre-set trigger (turnaround time)</text><text x="368.5" y="50" font-size="10" class="muted-fill">decided in advance, when calm</text><line x1="571.5" y1="230" x2="571.5" y2="30" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3 3"></line><text x="565.5" y="202" font-size="11" fill="var(--bad)" text-anchor="end">typical switch</text><text x="565.5" y="216" font-size="11" fill="var(--bad)" text-anchor="end">without a trigger</text><text x="320" y="274" text-anchor="middle" font-size="10" class="muted-fill">Illustrative shapes, not measured data.</text></svg>
