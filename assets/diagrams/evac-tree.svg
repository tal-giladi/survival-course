<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" class="diagram" viewBox="0 0 760 360" role="img" aria-label="Evacuation decision tree: from the patient&#x27;s condition and trend choose none, non-urgent, urgent or emergent; then choose a plan from resources, terrain, weather and daylight"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="et" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="260" y="10" width="240" height="48" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></rect><text x="380" y="30" text-anchor="middle" font-size="13" font-weight="700">Patient + TREND (SOAP)</text></g><g><rect x="10" y="100" width="170" height="60" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2.5"></rect><text x="95" y="124" text-anchor="middle" font-size="13" font-weight="700">None</text><text x="95" y="144" text-anchor="middle" font-size="11" class="muted-fill">minor, field-treatable</text><line x1="380" y1="58" x2="95" y2="98" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><line x1="95" y1="160" x2="95" y2="196" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><rect x="10" y="198" width="170" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="95" y="224" text-anchor="middle" font-size="11">Treat, continue</text><text x="95" y="240" text-anchor="middle" font-size="11">or modify the trip</text></g><g><rect x="200" y="100" width="170" height="60" rx="8" fill="var(--panel-2)" stroke="var(--warn)" stroke-width="2.5"></rect><text x="285" y="124" text-anchor="middle" font-size="13" font-weight="700">Non-urgent</text><text x="285" y="144" text-anchor="middle" font-size="11" class="muted-fill">stable; can walk out</text><line x1="380" y1="58" x2="285" y2="98" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><line x1="285" y1="160" x2="285" y2="196" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><rect x="200" y="198" width="170" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="285" y="224" text-anchor="middle" font-size="11">Walk out, assisted</text><text x="285" y="240" text-anchor="middle" font-size="11">lighten pack, go by day</text></g><g><rect x="390" y="100" width="170" height="60" rx="8" fill="var(--panel-2)" stroke="var(--accent-2)" stroke-width="2.5"></rect><text x="475" y="124" text-anchor="middle" font-size="13" font-weight="700">Urgent</text><text x="475" y="144" text-anchor="middle" font-size="11" class="muted-fill">needs hospital within hours</text><line x1="380" y1="58" x2="475" y2="98" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><line x1="475" y1="160" x2="475" y2="196" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><rect x="390" y="198" width="170" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="475" y="224" text-anchor="middle" font-size="11">Call early; walk if able,</text><text x="475" y="240" text-anchor="middle" font-size="11">else rescue team / air</text></g><g><rect x="580" y="100" width="170" height="60" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2.5"></rect><text x="665" y="124" text-anchor="middle" font-size="13" font-weight="700">Emergent</text><text x="665" y="144" text-anchor="middle" font-size="11" class="muted-fill">life/limb threat now</text><line x1="380" y1="58" x2="665" y2="98" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><line x1="665" y1="160" x2="665" y2="196" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#et)"></line><rect x="580" y="198" width="170" height="70" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="665" y="224" text-anchor="middle" font-size="11">Call now; fastest</text><text x="665" y="240" text-anchor="middle" font-size="11">safe asset; move toward it</text></g><text x="10" y="300" font-size="12" font-weight="700">Plan filters:</text><text x="10" y="318" font-size="11" class="muted-fill">Walks? · distance + terrain · daylight · weather (can aircraft fly?) · people (litter 6+) · comms · risk</text><text x="10" y="336" font-size="11" class="muted-fill">Re-decide whenever the trend changes. A patient who was “non-urgent” can become emergent.</text></svg>
