<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Chance that an item fails at least once over 14 days, for daily failure chances of 2, 5 and 10 percent. At 5 percent a day it reaches about 30 percent after one week and about 51 percent after two weeks; at 10 percent a day, about 52 percent after one week and 77 percent after two."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="14" font-weight="700">P(at least one failure) = 1 − (1 − p)ⁿ</text><line x1="60" y1="260" x2="490" y2="260" stroke="var(--line)"></line><line x1="60" y1="40" x2="60" y2="260" stroke="var(--line)"></line><text x="60" y="276" font-size="10" text-anchor="middle" class="muted-fill">0 days</text><text x="275" y="276" font-size="10" text-anchor="middle" class="muted-fill">7 days</text><text x="490" y="276" font-size="10" text-anchor="middle" class="muted-fill">14 days</text><text x="54" y="264" font-size="10" text-anchor="end" class="muted-fill">0 %</text><text x="54" y="154" font-size="10" text-anchor="end" class="muted-fill">50 %</text><text x="54" y="44" font-size="10" text-anchor="end" class="muted-fill">100 %</text><li