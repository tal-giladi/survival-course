"94.32894340091423" font-size="11" style="fill:var(--bad)">10 % a day: 77 %</text></g><text x="20" y="292" font-size="10" class="muted-fill">Small daily risks add up over many days — which is why multi-day kits carry redundancy and a repair kit.</text></svg>
