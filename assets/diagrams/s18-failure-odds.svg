<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Chance that an item fails at least once over 14 days, for daily failure chances of 2, 5 and 10 percent. At 5 percent a day it reaches about 30 percent after one week and about 51 percent after two weeks; at 10 percent a day, about 52 percent after one week and 77 percent after two."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="14" font-weight="700">P(at least one failure) = 1 − (1 − p)ⁿ</text><line x1="60" y1="260" x2="490" y2="260" stroke="var(--line)"></line><line x1="60" y1="40" x2="60" y2="260" stroke="var(--line)"></line><text x="60" y="276" font-size="10" text-anchor="middle" class="muted-fill">0 days</text><text x="275" y="276" font-size="10" text-anchor="middle" class="muted-fill">7 days</text><text x="490" y="276" font-size="10" text-anchor="middle" class="muted-fill">14 days</text><text x="54" y="264" font-size="10" text-anchor="end" class="muted-fill">0 %</text><text x="54" y="154" font-size="10" text-anchor="end" class="muted-fill">50 %</text><text x="54" y="44" font-size="10" text-anchor="end" class="muted-fill">100 %</text><line x1="275" y1="40" x2="275" y2="260" stroke="var(--line)" stroke-dasharray="3 3"></line><g><polyline points="60,260 90.71,255.6 121.43,251.29 152.14,247.06 182.86,242.92 213.57,238.86 244.29,234.89 275,230.99 305.71,227.17 336.43,223.42 367.14,219.76 397.86,216.16 428.57,212.64 459.29,209.18 490,205.8" fill="none" stroke="var(--ok)" stroke-width="2.5"></polyline><text x="496" y="209.8" font-size="11" style="fill:var(--ok)">2 % a day: 25 %</text></g><g><polyline points="60,260 90.71,249 121.43,238.55 152.14,228.62 182.86,219.19 213.57,210.23 244.29,201.72 275,193.63 305.71,185.95 336.43,178.65 367.14,171.72 397.86,165.14 428.57,158.88 459.29,152.94 490,147.29" fill="none" stroke="var(--accent)" stroke-width="2.5"></polyline><text x="496" y="151.29" font-size="11" style="fill:var(--accent)">5 % a day: 51 %</text></g><g><polyline points="60,260 90.71,238 121.43,218.2 152.14,200.38 182.86,184.34 213.57,169.91 244.29,156.92 275,145.23 305.71,134.7 336.43,125.23 367.14,116.71 397.86,109.04 428.57,102.13 459.29,95.92 490,90.33" fill="none" stroke="var(--bad)" stroke-width="2.5"></polyline><text x="496" y="94.33" font-size="11" style="fill:var(--bad)">10 % a day: 77 %</text></g><text x="20" y="292" font-size="10" class="muted-fill">Small daily risks add up over many days — which is why multi-day kits carry redundancy and a repair kit.</text></svg>
