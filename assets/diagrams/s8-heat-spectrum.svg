<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" class="diagram" viewBox="0 0 680 250" role="img" aria-label="Heat illness spectrum from minor illness to heat exhaustion to heat stroke; the dividing line is central nervous system dysfunction"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><linearGradient id="s8hs" x1="0" x2="1"><stop offset="0" stop-color="var(--ok)"></stop><stop offset="0.55" stop-color="var(--warn)"></stop><stop offset="1" stop-color="var(--bad)"></stop></linearGradient></defs><rect x="20" y="40" width="640" height="24" rx="12" fill="url(#s8hs)" opacity="0.85"></rect><text x="20" y="30" font-size="11" class="muted-fill">heat strain rising →</text><g><rect x="20" y="90" width="205" height="90" rx="10" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="122" y="115" font-size="12.5" font-weight="700" text-anchor="middle">Minor heat illness</text><foreignObject x="28" y="122" width="190" height="56"><div style="font-size:11px;color:var(--muted);text-align:center">Heat cramps / heat oedema / heat syncope — minor; rest, shade, fluids + salt</div></foreignObject></g><g><rect x="235" y="90" width="205" height="90" rx="10" fill="var(--panel-2)" stroke="var(--warn)" stroke-width="2"></rect><text x="337" y="115" font-size="12.5" font-weight="700" text-anchor="middle">Heat exhaustion</text><foreignObject x="243" y="122" width="190" height="56"><div style="font-size:11px;color:var(--muted);text-align:center">fatigue, headache, nausea, dizziness; mental status normal</div></foreignObject></g><g><rect x="450" y="90" width="205" height="90" rx="10" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="552" y="115" font-size="12.5" font-weight="700" text-anchor="middle">Heat stroke</text><foreignObject x="458" y="122" width="190" height="56"><div style="font-size:11px;color:var(--muted);text-align:center">CNS dysfunction (confusion, collapse, seizure) + usually &gt; 40 °C</div></foreignObject></g><line x1="450" x2="450" y1="30" y2="200" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="6 4"></line><text x="664" y="214" font-size="12" font-weight="700" text-anchor="end" style="fill:var(--bad)">Confusion = heat stroke until proven otherwise</text><text x="664" y="232" font-size="11" text-anchor="end" class="muted-fill">cool first (cold-water immersion), transport second</text></svg>
