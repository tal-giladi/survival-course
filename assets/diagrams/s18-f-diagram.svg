<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" class="diagram" viewBox="0 0 640 340" role="img" aria-label="The F-diagram: faeces reach a new host&#x27;s mouth through fluids, fingers, flies, fields and surfaces, usually via food. Barriers: a latrine far from water blocks the routes at the source; water treatment blocks fluids; hand washing blocks fingers; covering food and waste blocks flies; clean food handling blocks the final step."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="fd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="20" y="140" width="110" height="60" rx="8" fill="var(--ground)" stroke="var(--line)"></rect><text x="75" y="167" text-anchor="middle" font-size="12" font-weight="700">Faeces</text><text x="75" y="183" text-anchor="middle" font-size="10" class="muted-fill">the source</text></g><g><line x1="130" y1="170" x2="250" y2="74" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="252" y="60" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="317" y="79" text-anchor="middle" font-size="12" font-weight="700">Fluids (water)</text></g><line x1="382" y1="75" x2="455" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line></g><g><line x1="130" y1="170" x2="250" y2="129" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="252" y="115" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="317" y="134" text-anchor="middle" font-size="12" font-weight="700">Fingers</text></g><line x1="382" y1="130" x2="455" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line></g><g><line x1="130" y1="170" x2="250" y2="184" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="252" y="170" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="317" y="189" text-anchor="middle" font-size="12" font-weight="700">Flies</text></g><line x1="382" y1="185" x2="455" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line></g><g><line x1="130" y1="170" x2="250" y2="239" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="252" y="225" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="317" y="244" text-anchor="middle" font-size="12" font-weight="700">Fields (soil)</text></g><line x1="382" y1="240" x2="455" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line></g><g><line x1="130" y1="170" x2="250" y2="294" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="252" y="280" width="130" height="30" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="317" y="299" text-anchor="middle" font-size="12" font-weight="700">Floors / surfaces</text></g><line x1="382" y1="295" x2="455" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line></g><g><rect x="458" y="145" width="70" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="493" y="174" text-anchor="middle" font-size="12" font-weight="700">Food</text></g><line x1="528" y1="170" x2="548" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#fd-a)"></line><g><rect x="550" y="140" width="80" height="60" rx="8" fill="var(--bad)" stroke="var(--line)"></rect><text x="590" y="167" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">New host</text><text x="590" y="183" text-anchor="middle" font-size="10" class="muted-fill">mouth</text></g><rect x="180" y="40" width="10" height="280" rx="4" fill="var(--ok)"></rect><text x="185" y="32" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--ok)">Sanitation</text><rect x="410" y="40" width="10" height="280" rx="4" fill="var(--info)"></rect><text x="415" y="32" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--info)">Treatment · hand washing · cover</text><rect x="535" y="210" width="10" height="100" rx="4" fill="var(--accent)"></rect><text x="540" y="326" font-size="11" font-weight="700" text-anchor="middle" style="fill:var(--accent)">Food hygiene</text><text x="20" y="330" font-size="10" class="muted-fill">After Wagner &amp; Lanoix (WHO, 1958).</text></svg>
