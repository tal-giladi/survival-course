<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Water for a family of four at 4 litres per person per day: 48 litres for 3 days, 112 litres for 7 days, 224 litres for 14 days; food at about 7,000 kcal per day"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700">Family of 4 · 4 L per person per day (≈ 1 US gal)</text><g><text x="20" y="75" font-size="13" font-weight="700">3 days</text><rect x="90" y="50" width="72.86" height="36" rx="6" fill="var(--info)" opacity="0.8"></rect><text x="168.86" y="73" font-size="12" font-weight="700">48 L</text><text x="242.86" y="73" font-size="11" class="muted-fill">≈ 2 × 20 L containers</text></g><g><text x="20" y="135" font-size="13" font-weight="700">7 days</text><rect x="90" y="110" width="170" height="36" rx="6" fill="var(--info)" opacity="0.8"></rect><text x="266" y="133" font-size="12" font-weight="700">112 L</text><text x="340" y="133" font-size="11" class="muted-fill">≈ 6 × 20 L containers</text></g><g><text x="20" y="195" font-size="13" font-weight="700">14 days</text><rect x="90" y="170" width="340" height="36" rx="6" fill="var(--info)" opacity="0.8"></rect><text x="436" y="193" font-size="12" font-weight="700">224 L</text><text x="510" y="193" font-size="11" class="muted-fill">≈ 11 × 20 L containers</text></g><line x1="20" y1="235" x2="620" y2="235" stroke="var(--line)"></line><text x="20" y="258" font-size="12">Per person per day: <tspan font-weight="700">~2–3 L drinking</tspan> + ~1 L food preparation and hygiene. Heat, illness, pregnancy, infants: more.</text><text x="20" y="280" font-size="12">Food: 2 adults × 2,000 + 2 children × 1,500 ≈ <tspan font-weight="700">7,000 kcal/day</tspan> → 49,000 kcal for a week.</text></svg>
