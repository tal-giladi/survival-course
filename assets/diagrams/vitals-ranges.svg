<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" class="diagram" viewBox="0 0 760 290" role="img" aria-label="Adult resting vital signs: normal, concerning and critical ranges"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="10" y="24" font-size="13" font-weight="700">Vital sign</text><text x="200" y="24" font-size="13" font-weight="700">Normal (adult, rest)</text><text x="390" y="24" font-size="13" font-weight="700">Concerning</text><text x="580" y="24" font-size="13" font-weight="700">Critical</text><g><rect x="4" y="36" width="752" height="34" rx="6" fill="var(--panel-2)"></rect><text x="10" y="58" font-size="12" font-weight="600">LOR (AVPU)</text><rect x="196" y="42" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="58" font-size="12">A+Ox4</text><rect x="386" y="42" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="58" font-size="12">confused, V, P</text><rect x="576" y="42" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="58" font-size="12">U</text></g><g><rect x="4" y="76" width="752" height="34" rx="6" fill="transparent"></rect><text x="10" y="98" font-size="12" font-weight="600">Heart rate</text><rect x="196" y="82" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="98" font-size="12">60–100 /min</text><rect x="386" y="82" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="98" font-size="12">&gt; 100 or &lt; 60</text><rect x="576" y="82" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="98" font-size="12">&gt; 130, or slow + altered</text></g><g><rect x="4" y="116" width="752" height="34" rx="6" fill="var(--panel-2)"></rect><text x="10" y="138" font-size="12" font-weight="600">Resp. rate</text><rect x="196" y="122" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="138" font-size="12">12–20 /min</text><rect x="386" y="122" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="138" font-size="12">&gt; 20 or &lt; 12</text><rect x="576" y="122" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="138" font-size="12">&gt; 30 or &lt; 8</text></g><g><rect x="4" y="156" width="752" height="34" rx="6" fill="transparent"></rect><text x="10" y="178" font-size="12" font-weight="600">Radial pulse</text><rect x="196" y="162" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="178" font-size="12">strong, regular</text><rect x="386" y="162" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="178" font-size="12">weak, rapid</text><rect x="576" y="162" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="178" font-size="12">absent</text></g><g><rect x="4" y="196" width="752" height="34" rx="6" fill="var(--panel-2)"></rect><text x="10" y="218" font-size="12" font-weight="600">Skin (SCTM)</text><rect x="196" y="202" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="218" font-size="12">pink, warm, dry</text><rect x="386" y="202" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="218" font-size="12">pale, cool, moist</text><rect x="576" y="202" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="218" font-size="12">grey, cold, clammy</text></g><g><rect x="4" y="236" width="752" height="34" rx="6" fill="transparent"></rect><text x="10" y="258" font-size="12" font-weight="600">Core temp</text><rect x="196" y="242" width="176" height="22" rx="11" fill="var(--ok)" opacity="0.2"></rect><text x="204" y="258" font-size="12">36.5–37.5 °C</text><rect x="386" y="242" width="176" height="22" rx="11" fill="var(--warn)" opacity="0.2"></rect><text x="394" y="258" font-size="12">&lt; 35 or &gt; 38.5</text><rect x="576" y="242" width="176" height="22" rx="11" fill="var(--bad)" opacity="0.2"></rect><text x="584" y="258" font-size="12">&lt; 32 or &gt; 40 + altered</text></g><text x="10" y="282" font-size="10.5" class="muted-fill">Teaching ranges for adults; age, fitness and medication shift them — the patient’s own trend matters most.</text></svg>
