<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="710" height="210" class="diagram" viewBox="0 0 710 210" role="img" aria-label="Contour patterns of a summit, spur, re-entrant, saddle and cliff"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g transform="translate(0,0)"><rect x="4" y="4" width="132" height="200" rx="6" fill="var(--panel-2)"></rect><text x="70" y="24" font-size="12" text-anchor="middle" font-weight="700">Summit</text><g><ellipse cx="70" cy="105" rx="50" ry="40" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><ellipse cx="70" cy="105" rx="36" ry="28.8" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><ellipse cx="70" cy="105" rx="22" ry="17.6" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><ellipse cx="70" cy="105" rx="9" ry="7.2" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><text x="70" y="109" font-size="10" text-anchor="middle">▲</text></g><text x="70" y="196" font-size="10" text-anchor="middle" class="muted-fill">closed rings, highest inside</text></g><g transform="translate(140,0)"><rect x="4" y="4" width="132" height="200" rx="6" fill="var(--panel-2)"></rect><text x="70" y="24" font-size="12" text-anchor="middle" font-weight="700">Spur</text><g><path d="M20,50 Q70,95 120,50" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,78 Q70,123 120,78" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,106 Q70,151 120,106" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,134 Q70,179 120,134" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M70,70 L70,170" stroke="var(--accent-2)" stroke-width="1.5" marker-end="url(#lf)"></path><text x="76" y="165" font-size="9" text-anchor="start" style="fill:var(--accent-2)">downhill</text></g><text x="70" y="196" font-size="10" text-anchor="middle" class="muted-fill">V/U points DOWNHILL</text></g><g transform="translate(280,0)"><rect x="4" y="4" width="132" height="200" rx="6" fill="var(--panel-2)"></rect><text x="70" y="24" font-size="12" text-anchor="middle" font-weight="700">Re-entrant</text><g><path d="M20,95 L70,50 L120,95" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,123 L70,78 L120,123" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,151 L70,106 L120,151" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M20,179 L70,134 L120,179" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M70,40 L70,175" stroke="var(--info)" stroke-width="2"></path><text x="76" y="170" font-size="9" text-anchor="start" style="fill:var(--info)">stream</text></g><text x="70" y="196" font-size="10" text-anchor="middle" class="muted-fill">V points UPHILL (upstream)</text></g><g transform="translate(420,0)"><rect x="4" y="4" width="132" height="200" rx="6" fill="var(--panel-2)"></rect><text x="70" y="24" font-size="12" text-anchor="middle" font-weight="700">Saddle</text><g><ellipse cx="38" cy="105" rx="22" ry="30" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><ellipse cx="102" cy="105" rx="22" ry="30" fill="none" stroke="var(--ground)" stroke-width="1.6"></ellipse><path d="M70,58 C20,40 5,80 10,105 C5,130 20,170 70,152 C120,170 135,130 130,105 C135,80 120,40 70,58 Z" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><text x="70" y="109" font-size="9" text-anchor="middle">✕</text></g><text x="70" y="196" font-size="10" text-anchor="middle" class="muted-fill">low point between two tops</text></g><g transform="translate(560,0)"><rect x="4" y="4" width="132" height="200" rx="6" fill="var(--panel-2)"></rect><text x="70" y="24" font-size="12" text-anchor="middle" font-weight="700">Cliff</text><g><path d="M15,60 C50,60 60,100 70,100 C80,100 90,140 125,140" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M15,70 C50,70 60,100 70,100 C80,100 90,130 125,130" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M15,80 C50,80 60,100 70,100 C80,100 90,120 125,120" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><path d="M15,90 C50,90 60,100 70,100 C80,100 90,110 125,110" fill="none" stroke="var(--ground)" stroke-width="1.6"></path><line x1="58" y1="92" x2="82" y2="108" stroke="var(--text)" stroke-width="4"></line><line x1="60" y1="94" x2="66" y2="86" stroke="var(--text)" stroke-width="1.5"></line><line x1="67" y1="98.5" x2="73" y2="90.5" stroke="var(--text)" stroke-width="1.5"></line><line x1="74" y1="103" x2="80" y2="95" stroke="var(--text)" stroke-width="1.5"></line><line x1="81" y1="107.5" x2="87" y2="99.5" stroke="var(--text)" stroke-width="1.5"></line></g><text x="70" y="196" font-size="10" text-anchor="middle" class="muted-fill">contours merge: vertical</text></g><defs><marker id="lf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs></svg>
