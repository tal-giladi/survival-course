<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" class="diagram" viewBox="0 0 850 300" role="img" aria-label="Two feedback loops. Vicious loop: poor sleep leads to irritability and slow thinking, which causes mistakes and extra work, which leaves you cold, hungry and late to bed, which means poor sleep again. Virtuous loop: routine and small goals give visible progress, which lifts morale and energy to work, which gets you a warm bed and an early night, which supports the routine."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ml-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"></path></marker><marker id="ml-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)"></path></marker></defs><g transform="translate(60,0)"><g><g><line x1="150" y1="88" x2="270" y2="158" stroke="var(--bad)" stroke-width="2" marker-end="url(#ml-bad)" opacity="0.8"></line></g><g><line x1="270" y1="158" x2="150" y2="228" stroke="var(--bad)" stroke-width="2" marker-end="url(#ml-bad)" opacity="0.8"></line></g><g><line x1="150" y1="228" x2="30" y2="158" stroke="var(--bad)" stroke-width="2" marker-end="url(#ml-bad)" opacity="0.8"></line></g><g><line x1="30" y1="158" x2="150" y2="88" stroke="var(--bad)" stroke-width="2" marker-end="url(#ml-bad)" opacity="0.8"></line></g><g><rect x="65" y="70" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="150" y="92" text-anchor="middle" font-size="12" font-weight="700">Poor sleep</text></g><g><rect x="185" y="140" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="270" y="162" text-anchor="middle" font-size="12" font-weight="700">Irritable, slow</text></g><g><rect x="65" y="210" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="150" y="232" text-anchor="middle" font-size="12" font-weight="700">Mistakes, extra work</text></g><g><rect x="-55" y="140" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="30" y="162" text-anchor="middle" font-size="12" font-weight="700">Cold, hungry, late to bed</text></g></g><g><g><line x1="580" y1="88" x2="700" y2="158" stroke="var(--ok)" stroke-width="2" marker-end="url(#ml-ok)" opacity="0.8"></line></g><g><line x1="700" y1="158" x2="580" y2="228" stroke="var(--ok)" stroke-width="2" marker-end="url(#ml-ok)" opacity="0.8"></line></g><g><line x1="580" y1="228" x2="460" y2="158" stroke="var(--ok)" stroke-width="2" marker-end="url(#ml-ok)" opacity="0.8"></line></g><g><line x1="460" y1="158" x2="580" y2="88" stroke="var(--ok)" stroke-width="2" marker-end="url(#ml-ok)" opacity="0.8"></line></g><g><rect x="495" y="70" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="580" y="92" text-anchor="middle" font-size="12" font-weight="700">Routine + small goals</text></g><g><rect x="615" y="140" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="700" y="162" text-anchor="middle" font-size="12" font-weight="700">Visible progress</text></g><g><rect x="495" y="210" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="580" y="232" text-anchor="middle" font-size="12" font-weight="700">Morale, energy to work</text></g><g><rect x="375" y="140" width="170" height="36" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="460" y="162" text-anchor="middle" font-size="12" font-weight="700">Warm bed, early night</text></g></g></g><text x="210" y="40" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--bad)">Downward spiral</text><text x="640" y="40" font-size="13" font-weight="700" text-anchor="middle" style="fill:var(--ok)">Upward spiral</text><text x="20" y="285" font-size="11" class="muted-fill">Both loops feed themselves. The cheapest place to break the bad one is usually the evening: eat, prepare the bed, plan tomorrow, sleep.</text></svg>
