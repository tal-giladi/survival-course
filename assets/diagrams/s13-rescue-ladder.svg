<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" class="diagram" viewBox="0 0 660 300" role="img" aria-label="Rescue response ladder: first do not become a second casualty, call for help early, talk reach or throw from a safe place, care for the person without rope, and leave rope rescue, raising and lowering to trained teams"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="22" font-size="13" font-weight="700">Work down the ladder — most lives are saved in the top four rungs</text><g><rect x="20" y="36" width="600" height="42" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="32" y="54" font-size="12" font-weight="700">1 · Don’t become the second casualty</text><text x="32" y="70" font-size="10" class="muted-fill">scene safety; stay back from edges and water</text></g><g><rect x="40" y="86" width="580" height="42" rx="8" fill="var(--panel-2)" stroke="var(--ok)" stroke-width="2"></rect><text x="52" y="104" font-size="12" font-weight="700">2 · Call for help early</text><text x="52" y="120" font-size="10" class="muted-fill">emergency number, PLB / satellite messenger, precise location</text></g><g><rect x="60" y="136" width="560" height="42" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="2"></rect><text x="72" y="154" font-size="12" font-weight="700">3 · Talk, reach, throw — from a safe place</text><text x="72" y="170" font-size="10" class="muted-fill">voice, pole, rope thrown to someone who can hold it</text></g><g><rect x="80" y="186" width="540" height="42" rx="8" fill="var(--panel-2)" stroke="var(--info)" stroke-width="2"></rect><text x="92" y="204" font-size="12" font-weight="700">4 · Care without rope</text><text x="92" y="220" font-size="10" class="muted-fill">shelter, warmth, first aid, signalling — keep them safe where they are</text></g><g><rect x="100" y="236" width="520" height="42" rx="8" fill="var(--panel-2)" stroke="var(--bad)" stroke-width="2"></rect><text x="112" y="254" font-size="12" font-weight="700">5 · Rope rescue, raising, lowering</text><text x="112" y="270" font-size="10" class="muted-fill">trained &amp; equipped teams only (mountain / fire / SAR)</text></g><text x="20" y="296" font-size="11" style="fill:var(--bad)" font-weight="700">Untrained improvised rope rescue kills rescuers. Learn it on a course, not in an emergency.</text></svg>
