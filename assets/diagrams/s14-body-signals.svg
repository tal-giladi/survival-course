<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" class="diagram" viewBox="0 0 700 250" role="img" aria-label="Body signals: both arms raised in a Y means we need help, pick us up. One arm raised and one arm down in an N-like shape means we do not need help. An aircraft that has understood a ground signal rocks its wings by day or flashes its landing or navigation lights twice at night."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="110" cy="70" r="11" fill="var(--accent-2)" stroke="none"></circle><line x1="110" y1="82" x2="110" y2="135"></line><line x1="110" y1="135" x2="94" y2="180"></line><line x1="110" y1="135" x2="126" y2="180"></line><line x1="110" y1="92" x2="80" y2="50"></line><line x1="110" y1="92" x2="140" y2="50"></line></g><text x="110" y="210" text-anchor="middle" font-size="13" font-weight="700">Y — “Need help”</text><text x="110" y="228" text-anchor="middle" font-size="11" class="muted-fill">both arms up, still or slowly moved</text><g stroke="var(--text)" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="310" cy="70" r="11" fill="var(--accent-2)" stroke="none"></circle><line x1="310" y1="82" x2="310" y2="135"></line><line x1="310" y1="135" x2="294" y2="180"></line><line x1="310" y1="135" x2="326" y2="180"></line><line x1="310" y1="92" x2="336" y2="48"></line><line x1="310" y1="92" x2="286" y2="132"></line></g><text x="310" y="210" text-anchor="middle" font-size="13" font-weight="700">N — “No help needed”</text><text x="310" y="228" text-anchor="middle" font-size="11" class="muted-fill">one arm up, one down</text><rect x="440" y="30" width="250" height="170" rx="10" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="565" y="55" text-anchor="middle" font-size="13" font-weight="700">Aircraft reply</text><path d="M520 100 l90 0 M565 88 l0 30 M545 118 l40 0" stroke="var(--text)" stroke-width="5" stroke-linecap="round" transform="rotate(-12 565 100)"></path><text x="565" y="150" text-anchor="middle" font-size="11.5">Day: rocking the wings</text><text x="565" y="167" text-anchor="middle" font-size="11.5">Night: landing/nav lights flashed twice</text><text x="565" y="184" text-anchor="middle" font-size="11" class="muted-fill">= message received and understood</text><text x="350" y="246" text-anchor="middle" font-size="10" class="muted-fill">A cheerful one-armed wave can look like “all is well”. If you need help, use the Y.</text></svg>
