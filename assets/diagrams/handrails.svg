<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" class="diagram" viewBox="0 0 640 360" role="img" aria-label="Handrail stream leading to an attack point, a short compass leg to the target, and a road beyond as a catching feature"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs><rect x="10" y="10" width="620" height="340" rx="8" fill="var(--panel-2)"></rect><path d="M200,60 C250,110 300,120 340,160 C380,200 400,240 470,262 C520,275 560,300 620,330" fill="none" stroke="var(--ok)" stroke-width="60" opacity="0.18"></path><line x1="10" y1="70" x2="630" y2="50" stroke="var(--text)" stroke-width="6" opacity="0.6"></line><text x="20" y="46" font-size="12" text-anchor="start" font-weight="700">Road = catching feature (backstop)</text><path d="M40,340 C80,300 120,260 170,230 C220,200 260,190 300,170" fill="none" stroke="var(--info)" stroke-width="4"></path><path d="M300,170 C330,150 360,120 380,70" fill="none" stroke="var(--info)" stroke-width="3"></path><path d="M300,170 C340,180 380,170 440,190" fill="none" stroke="var(--info)" stroke-width="3"></path><text x="120" y="300" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--info)">Stream = handrail</text><circle cx="300" cy="170" r="9" fill="none" stroke="var(--accent)" stroke-width="3"></circle><text x="240" y="215" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent)">Attack point (junction)</text><line x1="308" y1="163" x2="420" y2="110" stroke="var(--accent-2)" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#hr)"></line><text x="345" y="128" font-size="11" text-anchor="start" style="fill:var(--accent-2)">short compass leg</text><circle cx="430" cy="104" r="14" fill="none" stroke="var(--accent-2)" stroke-width="3"></circle><text x="450" y="108" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--accent-2)">Target (small pond)</text><text x="30" y="336" font-size="11" text-anchor="start" class="muted-fill">Start</text><text x="330" y="335" font-size="11" text-anchor="start" class="muted-fill">Collecting features on the way: forest edge, path crossing</text></svg>
