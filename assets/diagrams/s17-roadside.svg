<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="260" class="diagram" viewBox="0 0 660 260" role="img" aria-label="Roadside breakdown: pull off as far as possible, hazards on, hi-vis vest on before getting out, exit on the side away from traffic, place the warning triangle well behind the car where legal and safe, and wait behind the barrier or away from the road, upstream of the car"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="rb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="0" y="60" width="660" height="120" fill="var(--ground)" opacity="0.35"></rect><line x1="0" y1="120" x2="660" y2="120" stroke="var(--text)" stroke-dasharray="20 14"></line><line x1="0" y1="180" x2="660" y2="180" stroke="var(--text)" stroke-width="2"></line><text x="20" y="100" font-size="11" class="muted-fill">traffic →</text><text x="20" y="160" font-size="11" class="muted-fill">traffic →</text><rect x="0" y="180" width="660" height="34" fill="var(--ground)" opacity="0.2"></rect><text x="600" y="200" font-size="10" class="muted-fill">shoulder</text><line x1="0" y1="222" x2="660" y2="222" stroke="var(--muted)" stroke-width="4"></line><text x="20" y="240" font-size="10" class="muted-fill">barrier / verge</text><rect x="470" y="184" width="80" height="26" rx="6" fill="var(--panel-2)" stroke="var(--text)"></rect><text x="510" y="201" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">your car</text><circle cx="476" cy="186" r="4" fill="var(--accent-2)"></circle><circle cx="476" cy="208" r="4" fill="var(--accent-2)"></circle><path d="M300,208 l10,-18 l10,18 z" fill="none" stroke="var(--bad)" stroke-width="2.5"></path><text x="310" y="176" text-anchor="middle" font-size="10" fill="var(--bad)">warning triangle</text><line x1="330" y1="200" x2="466" y2="200" stroke="var(--muted)" marker-end="url(#rb-a)" marker-start="url(#rb-a)"></line><text x="400" y="216" text-anchor="middle" font-size="9.5" class="muted-fill">distance set by local law; farther on fast roads</text><circle cx="330" cy="244" r="7" fill="var(--ok)"></circle><text x="344" y="248" font-size="10.5" font-weight="700" fill="var(--ok)">wait here: behind the barrier, upstream of the car</text><text x="20" y="24" font-size="11" font-weight="700" fill="var(--text)">Hazards on · hi-vis on before you get out · exit away from traffic · never stand between cars or in front of your car</text><text x="20" y="42" font-size="11" class="muted-fill">If you cannot get off a fast road safely: stay belted in with hazards on and call for help.</text></svg>
