<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" class="diagram" viewBox="0 0 700 200" role="img" aria-label="Ground-to-air emergency code symbols"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="700" height="140" rx="10" fill="var(--ground)" opacity="0.35"></rect><g><text x="70" y="100" text-anchor="middle" font-size="72" font-weight="900" style="fill:var(--accent-2)">V</text><text x="70" y="165" text-anchor="middle" font-size="11.5" font-weight="600">Require assistance</text></g><g><text x="210" y="100" text-anchor="middle" font-size="72" font-weight="900" style="fill:var(--accent-2)">X</text><text x="210" y="165" text-anchor="middle" font-size="11.5" font-weight="600">Require medical assistance</text></g><g><text x="350" y="100" text-anchor="middle" font-size="72" font-weight="900" style="fill:var(--accent-2)">N</text><text x="350" y="165" text-anchor="middle" font-size="11.5" font-weight="600">No / negative</text></g><g><text x="490" y="100" text-anchor="middle" font-size="72" font-weight="900" style="fill:var(--accent-2)">Y</text><text x="490" y="165" text-anchor="middle" font-size="11.5" font-weight="600">Yes / affirmative</text></g><g><text x="630" y="100" text-anchor="middle" font-size="72" font-weight="900" style="fill:var(--accent-2)">→</text><text x="630" y="165" text-anchor="middle" font-size="11.5" font-weight="600">Proceeding this way</text></g><text x="350" y="192" text-anchor="middle" font-size="10.5" class="muted-fill">Make symbols ≥3 m tall, high-contrast with the ground, with straight lines (nature rarely makes them).</text></svg>
