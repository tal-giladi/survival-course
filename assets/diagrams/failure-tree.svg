ed)" stroke-width="1.5"></line></g><g><line x1="556" y1="134" x2="556" y2="272" stroke="var(--muted)" stroke-width="1.5"></line><line x1="556" y1="172" x2="564" y2="172" stroke="var(--muted)" stroke-width="1.5"></line><line x1="556" y1="220" x2="564" y2="220" stroke="var(--muted)" stroke-width="1.5"></line><line x1="556" y1="268" x2="564" y2="268" stroke="var(--muted)" stroke-width="1.5"></line></g><g><g><rect x="34" y="150" width="150" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="109" y="170" text-anchor="middle" font-size="12" font-weight="700">No / thin bed</text><text x="109" y="186" text-anchor="middle" font-size="10" class="muted-fill">conduction</text></g></g><g><g><rect x="34" y="198" width="150" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="109" y="218" text-anchor="middle" font-size="12" font-weight="700">Open to wind</text><text x="109" y="234" text-anchor="middle" font-size="10" class="muted-fill">orientation</text></g></g><g><g><rect x="34" y="246" width="150" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="109" y="266" text-anchor="middle" font-size="12" font-weight="700">Cold hollow</text><text x="109" y="282" text-anchor="middle" font-size="10" class="muted-fill">site</text></g></g><g><g><rect x="214" y="150" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="287" y="170" text-anchor="middle" font-size="12" font-weight="700">Pooling roof</text><text x="287" y="186" text-anchor="middle" font-size="10" class="muted-fill">slack pitch</text></g></g><g><g><rect x="214" y="198" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="287" y="218" text-anchor="middle" font-size="12" font-weight="700">Ground run-off</text><text x="287" y="234" text-anchor="middle" font-size="10" class="muted-fill">drainage</text></g></g><g><g><rect x="214" y="246" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="287" y="266" text-anchor="middle" font-size="12" font-weight="700">Sweat</text><text x="287" y="282" text-anchor="middle" font-size="10" class="muted-fill">pace</text></g></g><g><g><rect x="394" y="150" width="136" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="462" y="170" text-anchor="middle" font-size="12" font-weight="700">Late start</text><text x="462" y="186" text-anchor="middle" font-size="10" class="muted-fill">no decision time</text></g></g><g><g><rect x="394" y="198" width="136" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="462" y="218" text-anchor="middle" font-size="12" font-weight="700">Scarce material</text><text x="462" y="234" text-anchor="middle" font-size="10" class="muted-fill">wrong site</text></g></g><g><g><rect x="394" y="246" width="136" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="462" y="266" text-anchor="middle" font-size="12" font-weight="700">Too ambitious</text><text x="462" y="282" text-anchor="middle" font-size="10" class="muted-fill">design</text></g></g><g><g><rect x="564" y="150" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="637" y="170" text-anchor="middle" font-size="12" font-weight="700">Dead tree over</text><text x="637" y="186" text-anchor="middle" font-size="10" class="muted-fill">didn’t look up</text></g></g><g><g><rect x="564" y="198" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="637" y="218" text-anchor="middle" font-size="12" font-weight="700">Flood path</text><text x="637" y="234" text-anchor="middle" font-size="10" class="muted-fill">didn’t look upstream</text></g></g><g><g><rect x="564" y="246" width="146" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="637" y="266" text-anchor="middle" font-size="12" font-weight="700">CO / collapse</text><text x="637" y="282" text-anchor="middle" font-size="10" class="muted-fill">no vent / thin wall</text></g></g></svg>
