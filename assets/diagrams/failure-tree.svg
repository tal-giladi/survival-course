<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" class="diagram" viewBox="0 0 720 300" role="img" aria-label="Fault tree for a failed shelter night: cold and wet broken down into ground, wind, water, time and hazard causes"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="250" y="10" width="220" height="44" rx="6" fill="var(--bad-soft)" stroke="var(--line)"></rect><text x="360" y="30" text-anchor="middle" font-size="12" font-weight="700">A dangerous night</text><text x="360" y="46" text-anchor="middle" font-size="10" class="muted-fill">shivering, wet, or hurt</text></g><line x1="360" y1="54" x2="100" y2="90" stroke="var(--muted)" stroke-width="1.5"></line><line x1="360" y1="54" x2="280" y2="90" stroke="var(--muted)" stroke-width="1.5"></line><line x1="360" y1="54" x2="450" y2="90" stroke="var(--muted)" stroke-width="1.5"></line><line x1="360" y1="54" x2="620" y2="90" stroke="var(--muted)" stroke-width="1.5"></line><g><rect x="20" y="90" width="160" height="44" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="100" y="110" text-anchor="middle" font-size="12" font-weight="700">Heat drained</text><text x="100" y="126" text-anchor="middle" font-size="10" clas