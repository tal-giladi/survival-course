<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Lateral error from a heading error of 1, 5 and 10 degrees over 1 to 3 kilometres"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="60" y1="250" x2="590" y2="250" stroke="var(--text)" stroke-width="2"></line><text x="594" y="254" font-size="11" text-anchor="start">intended</text><g><line x1="230" x2="230" y1="255" y2="30" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="230" y="270" font-size="11" text-anchor="middle">1 km</text></g><g><line x1="400" x2="400" y1="255" y2="30" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="400" y="270" font-size="11" text-anchor="middle">2 km</text></g><g><line x1="570" x2="570" y1="255" y2="30" stroke="var(--line)" stroke-dasharray="3 4"></line><text x="570" y="270" font-size="11" text-anchor="middle">3 km</text></g><g><line x1="60" y1="250" x2="570" y2="229.0539220861389" stroke="var(--ok)" stroke-width="2.5"></line><text x="226" y="238.2" font-size="10" text-anchor="end" style="fill:var(--ok)">17 m</text><text x="396" y="231" font-size="10" text-anchor="end" style="fill:var(--ok)">35 m</text><text x="566" y="224.2" font-size="10" text-anchor="end" style="fill:var(--ok)">52 m</text><text x="578" y="233.0539220861389" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--ok)">1°</text></g><g><line x1="60" y1="250" x2="570" y2="145.0136037688912" stroke="var(--warn)" stroke-width="2.5"></line><text x="226" y="210.2" font-size="10" text-anchor="end" style="fill:var(--warn)">87 m</text><text x="396" y="175" font-size="10" text-anchor="end" style="fill:var(--warn)">175 m</text><text x="566" y="140.2" font-size="10" text-anchor="end" style="fill:var(--warn)">262 m</text><text x="578" y="149.0136037688912" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--warn)">5°</text></g><g><line x1="60" y1="250" x2="570" y2="38.40762314984204" stroke="var(--bad)" stroke-width="2.5"></line><text x="226" y="174.6" font-size="10" text-anchor="end" style="fill:var(--bad)">176 m</text><text x="396" y="103.79999999999998" font-size="10" text-anchor="end" style="fill:var(--bad)">353 m</text><text x="566" y="33.39999999999998" font-size="10" text-anchor="end" style="fill:var(--bad)">529 m</text><text x="578" y="42.40762314984204" font-size="12" text-anchor="start" font-weight="700" style="fill:var(--bad)">10°</text></g><text x="20" y="290" font-size="11" text-anchor="start" class="muted-fill">Lateral error ≈ distance × degrees ÷ 60 (exact: distance × tan θ). Sideways scale exaggerated.</text></svg>
