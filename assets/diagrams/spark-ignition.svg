<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Spark temperatures of ferrocerium and flint and steel, and the pull-back ferro technique"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="10" y="20" font-size="13" font-weight="700">Temperature is not the whole story — spark energy and tinder fineness decide</text><g transform="translate(10,40)"><text x="0" y="12" font-size="11">Ferro-rod sparks (burning metal particles)</text><rect x="0" y="16" width="330" height="12" rx="6" fill="var(--bad)" opacity="0.85"></rect><text x="336" y="27" font-size="10" class="muted-fill">~3,000 °C, but tiny and short-lived</text></g><g transform="translate(10,80)"><text x="0" y="12" font-size="11">Flint-and-steel sparks (burning iron)</text><rect x="0" y="16" width="110" height="12" rx="6" fill="var(--accent-2)" opacity="0.85"></rect><text x="116" y="27" font-size="10" class="muted-fill">~800–1,100 °C, much less energy</text></g><g transform="translate(10,120)"><text x="0" y="12" font-size="11">Char cloth catches a spark</text><rect x="0" y="16" width="38.5" height="12" rx="6" fill="var(--accent)" opacity="0.85"></rect><text x="44.5" y="27" font-size="10" class="muted-fill">char ignites at a few hundred °C</text></g><g transform="translate(10,160)"><text x="0" y="12" font-size="11">Wood / tinder ignition from a small source</text><rect x="0" y="16" width="33" height="12" rx="6" fill="var(--ground)" opacity="0.85"></rect><text x="39" y="27" font-size="10" class="muted-fill">piloted ignition roughly 250–350 °C</text></g><g transform="translate(40,210)"><ellipse cx="80" cy="60" rx="70" ry="16" fill="var(--accent-2)" opacity="0.4"></ellipse><text x="80" y="88" text-anchor="middle" font-size="10.5" class="muted-fill">tinder</text><line x1="75" y1="52" x2="250" y2="-10" stroke="var(--muted)" stroke-width="8" stroke-linecap="round"></line><rect x="140" y="10" width="40" height="10" fill="var(--ground)" transform="rotate(-20 160 15)"></rect><text x="260" y="0" font-size="11">rod tip IN the tinder; hold the striker still</text><text x="260" y="16" font-size="11">and pull the ROD back — sparks land where the tinder is</text></g></svg>
