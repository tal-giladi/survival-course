<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="270" class="diagram" viewBox="0 0 660 270" role="img" aria-label="Battery budget: a 20,000 mAh power bank at 3.7 volts holds about 74 watt-hours, about 55 usable, enough for about three phone charges or three nights of a 3-watt lantern"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="24" font-size="14" font-weight="700">Energy (Wh) = capacity (Ah) × voltage (V)</text><g><text x="20" y="61" font-size="12">Power bank 20,000 mAh × 3.7 V</text><rect x="250" y="46" width="74" height="22" rx="5" fill="var(--accent)" opacity="0.85"></rect><text x="330" y="62" font-size="12" font-weight="700">74 Wh</text><text x="250" y="80" font-size="10" class="muted-fill">nominal energy</text></g><g><text x="20" y="103" font-size="12">… after ~75 % conversion</text><rect x="250" y="88" width="54.99999999999999" height="22" rx="5" fill="var(--ok)" opacity="0.85"></rect><text x="311" y="104" font-size="12" font-weight="700">55 Wh</text><text x="250" y="122" font-size="10" class="muted-fill">usable at the USB port</text></g><g><text x="20" y="145" font-size="12">Phone battery (≈ 4,500 mAh)</text><rect x="250" y="130" width="17" height="22" rx="5" fill="var(--accent)" opacity="0.85"></rect><text x="273" y="146" font-size="12" font-weight="700">17 Wh</text><text x="250" y="164" font-size="10" class="muted-fill">→ about 3 full charges</text></g><g><text x="20" y="187" font-size="12">3 W LED lantern, 1 night (6 h)</text><rect x="250" y="172" width="18" height="22" rx="5" fill="var(--accent)" opacity="0.85"></rect><text x="274" y="188" font-size="12" font-weight="700">18 Wh</text><text x="250" y="206" font-size="10" class="muted-fill">→ about 3 nights</text></g><g><text x="20" y="229" font-size="12">12 V × 50 Ah car battery, ≤ 50 %</text><rect x="250" y="214" width="300" height="22" rx="5" fill="var(--ground)" opacity="0.85"></rect><text x="556" y="230" font-size="12" font-weight="700">300 Wh</text><text x="250" y="248" font-size="10" class="muted-fill">only if it can still start the car</text></g></svg>
