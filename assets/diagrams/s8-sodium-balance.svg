<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" class="diagram" viewBox="0 0 640 330" role="img" aria-label="Water and sodium balance: losing water faster than sodium concentrates the blood; replacing sweat with plain water in large excess dilutes it to hyponatremia"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="sb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><rect x="250" y="120" width="140" height="90" rx="12" fill="var(--ok)" opacity="0.2" stroke="var(--ok)"></rect><text x="320" y="158" text-anchor="middle" font-size="13" font-weight="700">Normal</text><text x="320" y="176" text-anchor="middle" font-size="11">Na⁺ 135–145 mmol/L</text><rect x="20" y="20" width="200" height="80" rx="12" fill="var(--accent-2)" opacity="0.18" stroke="var(--accent-2)"></rect><text x="120" y="50" text-anchor="middle" font-size="12.5" font-weight="700">Dehydration</text><text x="120" y="68" text-anchor="middle" font-size="11">sweat not replaced</text><text x="120" y="84" text-anchor="middle" font-size="11">blood concentrated, Na⁺ ↑</text><rect x="420" y="20" width="200" height="80" rx="12" fill="var(--bad)" opacity="0.18" stroke="var(--bad)"></rect><text x="520" y="50" text-anchor="middle" font-size="12.5" font-weight="700">Hyponatremia</text><text x="520" y="68" text-anchor="middle" font-size="11">drinking far beyond losses</text><text x="520" y="84" text-anchor="middle" font-size="11">blood diluted, Na⁺ &lt; 135</text><line x1="260" y1="125" x2="210" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#sb)"></line><line x1="380" y1="125" x2="430" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#sb)"></line><rect x="20" y="240" width="600" height="70" rx="12" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="320" y="264" text-anchor="middle" font-size="12.5" font-weight="700">Aim: replace most of what you lose, not more — drink to thirst, eat salty food</text><text x="320" y="284" text-anchor="middle" font-size="11" class="muted-fill">Sweat carries roughly 0.5–2 g sodium per litre (varies widely). ORS: glucose + sodium are absorbed together.</text><text x="320" y="300" text-anchor="middle" font-size="11" class="muted-fill">Headache, nausea and confusion can come from either — weight change and drinking history tell them apart.</text></svg>
