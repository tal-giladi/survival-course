<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" class="diagram" viewBox="0 0 740 280" role="img" aria-label="Splinting principles: immobilise the joint above and below a fracture, pad well, check circulation sensation and movement before and after"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="20" y="26" font-size="13" font-weight="700">Forearm fracture: the splint spans the joint below (wrist) and the joint above (elbow)</text><path d="M80,130 L640,130 L640,170 L80,170 Z" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"></path><circle cx="200" cy="150" r="22" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"></circle><text x="200" y="206" text-anchor="middle" font-size="11" class="muted-fill">elbow (joint above)</text><circle cx="560" cy="150" r="22" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"></circle><text x="560" y="206" text-anchor="middle" font-size="11" class="muted-fill">wrist (joint below)</text><path d="M370,126 L385,150 L372,174" fill="none" stroke="var(--bad)" stroke-width="3"></path><text x="378" y="120" text-anchor="middle" font-size="11" fill="var(--bad)">fracture</text><rect x="140" y="112" width="480" height="12" rx="4" fill="var(--sky)" opacity="0.6"></rect><rect x="140" y="96" width="480" height="14" rx="3" fill="var(--ground)"></rect><text x="132" y="104" text-anchor="end" font-size="11">rigid support</text><text x="132" y="122" text-anchor="end" font-size="11">padding</text><rect x="180" y="92" width="10" height="82" rx="3" fill="var(--accent)" opacity="0.8"></rect><rect x="280" y="92" width="10" height="82" rx="3" fill="var(--accent)" opacity="0.8"></rect><rect x="470" y="92" width="10" height="82" rx="3" fill="var(--accent)" opacity="0.8"></rect><rect x="590" y="92" width="10" height="82" rx="3" fill="var(--accent)" opacity="0.8"></rect><text x="380" y="82" text-anchor="middle" font-size="11">ties/tape away from the fracture site</text><g transform="translate(20,222)"><rect width="700" height="48" rx="8" fill="var(--ok-soft)"></rect><text x="12" y="20" font-size="12" font-weight="700">CSM before and after: Circulation, Sensation, Movement beyond the injury.</text><text x="12" y="38" font-size="11" class="muted-fill">Position of function (hand around a roll, ankle at 90°). Worse CSM → loosen and re-check.</text></g></svg>
