<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" class="diagram" viewBox="0 0 640 290" role="img" aria-label="Effects of dehydration by percentage of body mass lost"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><linearGradient id="s8dh" x1="0" x2="1"><stop offset="0" stop-color="var(--ok)"></stop><stop offset="0.4" stop-color="var(--warn)"></stop><stop offset="1" stop-color="var(--bad)"></stop></linearGradient></defs><rect x="60" y="210" width="540" height="26" rx="8" fill="url(#s8dh)" opacity="0.85"></rect><text x="60" y="254" font-size="10" text-anchor="middle" class="muted-fill">0%</text><text x="114" y="254" font-size="10" text-anchor="middle" class="muted-fill">1%</text><text x="168" y="254" font-size="10" text-anchor="middle" class="muted-fill">2%</text><text x="222" y="254" font-size="10" text-anchor="middle" class="muted-fill">3%</text><text x="276" y="254" font-size="10" text-anchor="middle" class="muted-fill">4%</text><text x="330" y="254" font-size="10" text-anchor="middle" class="muted-fill">5%</text><text x="384" y="254" font-size="10" text-anchor="middle" class="muted-fill">6%</text><text x="438" y="254" font-size="10" text-anchor="middle" class="muted-fill">7%</text><text x="492" y="254" font-size="10" text-anchor="middle" class="muted-fill">8%</text><text x="546" y="254" font-size="10" text-anchor="middle" class="muted-fill">9%</text><text x="600" y="254" font-size="10" text-anchor="middle" class="muted-fill">10%</text><g><line x1="114" x2="114" y1="206" y2="190" stroke="var(--text)"></line><text x="118" y="188" font-size="11" text-anchor="start">thirst</text></g><g><line x1="168" x2="168" y1="206" y2="160" stroke="var(--text)"></line><text x="172" y="158" font-size="11" text-anchor="start">endurance &amp; thinking measurably worse</text></g><g><line x1="276" x2="276" y1="206" y2="130" stroke="var(--text)"></line><text x="280" y="128" font-size="11" text-anchor="start">heat tolerance falls; core runs ~0.1–0.2 °C higher per %</text></g><g><line x1="384" x2="384" y1="206" y2="100" stroke="var(--text)"></line><text x="388" y="98" font-size="11" text-anchor="start">tingling, headache, collapse risk</text></g><g><line x1="600" x2="600" y1="206" y2="70" stroke="var(--text)"></line><text x="596" y="68" font-size="11" text-anchor="end">life-threatening</text></g><text x="320" y="282" text-anchor="middle" font-size="10" class="muted-fill">Water lost as % of body mass (70 kg: 1 % = 0.7 L). Approximate; heat and exertion make each step worse.</text></svg>
