<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" class="diagram" viewBox="0 0 700 310" role="img" aria-label="Chart: chlorine CT needed for 3-log Giardia falls from about 200 at near freezing to about 35 at 25 degrees; viruses need far less"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><line x1="90" y1="250" x2="610" y2="250" stroke="var(--line)" stroke-width="2"></line><line x1="90" y1="40" x2="90" y2="250" stroke="var(--line)" stroke-width="2"></line><text x="82" y="254" text-anchor="end" font-size="11">0</text><text x="82" y="209" text-anchor="end" font-size="11">50</text><text x="82" y="164" text-anchor="end" font-size="11">100</text><text x="82" y="119" text-anchor="end" font-size="11">150</text><text x="82" y="74" text-anchor="end" font-size="11">200</text><text x="100" y="268" text-anchor="middle" font-size="11">0.5 °C</text><text x="190" y="268" text-anchor="middle" font-size="11">5 °C</text><text x="290" y="268" text-anchor="middle" font-size="11">10 °C</text><text x="390" y="268" text-anchor="middle" font-size="11">15 °C</text><text x="490" y="268" text-anchor="middle" font-size="11">20 °C</text><text x="590" y="268" text-anchor="middle" font-size="11">25 °C</text><polyline points="100,70 190,124.89999999999999 290,156.39999999999998 390,187 490,203.2 590,218.5" fill="none" stroke="var(--accent-2)" stroke-width="3.5"></polyline><polyline points="100,239.2 190,242.8 290,244.6 390,246.4 490,247.3 590,248.2" fill="none" stroke="var(--info)" stroke-width="3.5"></polyline><circle cx="100" cy="70" r="4" fill="var(--accent-2)"></circle><circle cx="190" cy="124.89999999999999" r="4" fill="var(--accent-2)"></circle><circle cx="290" cy="156.39999999999998" r="4" fill="var(--accent-2)"></circle><circle cx="390" cy="187" r="4" fill="var(--accent-2)"></circle><circle cx="490" cy="203.2" r="4" fill="var(--accent-2)"></circle><circle cx="590" cy="218.5" r="4" fill="var(--accent-2)"></circle><text x="230" y="115" font-size="12" font-weight="700" style="fill:var(--accent-2)">Giardia, 3-log</text><text x="370" y="230.2" font-size="12" font-weight="700" style="fill:var(--info)">Viruses, 4-log</text><text x="20" y="28" font-size="12" font-weight="700">CT needed (mg·min/L), free chlorine, pH ≈ 7</text><g transform="translate(470,60)"><rect width="215" height="110" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="10" y="22" font-size="12" font-weight="700">Worked example</text><text x="10" y="42" font-size="11.5">2 mg/L residual at 5 °C:</text><text x="10" y="60" font-size="11.5">Giardia: 139 ÷ 2 ≈ 70 min</text><text x="10" y="78" font-size="11.5">Viruses: 8 ÷ 2 = 4 min</text><text x="10" y="98" font-size="11.5" font-weight="700" style="fill:var(--bad)">Crypto: thousands → forget it</text></g><text x="350" y="300" text-anchor="middle" font-size="10.5" class="muted-fill">Rounded from US EPA Surface Water Treatment Rule CT tables (~1 mg/L, pH 7). Colder water or higher pH → longer.</text></svg>
