<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" class="diagram" viewBox="0 0 680 340" role="img" aria-label="Decision flow: if an official evacuation order applies, go. If the hazard comes to you and outside air is dangerous (chemical plume, tornado, smoke), shelter in place. If your location will be overrun (flood, wildfire, tsunami zone, damaged building), leave early by a planned route."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ed-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="230" y="10" width="220" height="46" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="340" y="30" text-anchor="middle" font-size="12" font-weight="700">Official order for your zone?</text><text x="340" y="46" text-anchor="middle" font-size="10" class="muted-fill">alerts, radio, local authority</text></g><g><rect x="500" y="10" width="160" height="46" rx="8" fill="var(--accent-2)" stroke="var(--line)"></rect><text x="580" y="30" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">EVACUATE</text><text x="580" y="46" text-anchor="middle" font-size="10" class="muted-fill">now, by the planned route</text></g><line x1="450" y1="33" x2="498" y2="33" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="474" y="27" font-size="10" text-anchor="middle">yes</text><line x1="340" y1="56" x2="340" y2="96" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="352" y="80" font-size="10">no / not yet</text><g><rect x="200" y="98" width="280" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="340" y="120" text-anchor="middle" font-size="12" font-weight="700">Will this place be overrun or unsafe?</text><text x="340" y="136" text-anchor="middle" font-size="10" class="muted-fill">rising water, fire front, tsunami zone, damage, gas</text></g><line x1="480" y1="123" x2="570" y2="123" stroke="var(--muted)" stroke-width="1.5"></line><line x1="570" y1="123" x2="570" y2="58" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="522" y="116" font-size="10" text-anchor="middle">yes → leave early</text><line x1="340" y1="148" x2="340" y2="188" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="352" y="172" font-size="10">no</text><g><rect x="200" y="190" width="280" height="50" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="340" y="212" text-anchor="middle" font-size="12" font-weight="700">Is the outside air or sky the danger?</text><text x="340" y="228" text-anchor="middle" font-size="10" class="muted-fill">chemical plume, heavy smoke, tornado, blizzard</text></g><line x1="200" y1="215" x2="120" y2="215" stroke="var(--muted)" stroke-width="1.5"></line><line x1="120" y1="215" x2="120" y2="268" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="160" y="208" font-size="10" text-anchor="middle">yes</text><g><rect x="20" y="270" width="200" height="56" rx="8" fill="var(--info)" stroke="var(--line)"></rect><text x="120" y="295" text-anchor="middle" font-size="12" font-weight="700" style="fill:#fff">SHELTER IN PLACE</text><text x="120" y="311" text-anchor="middle" font-size="10" class="muted-fill">interior room, close up, listen</text></g><line x1="340" y1="240" x2="340" y2="268" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ed-a)"></line><text x="352" y="258" font-size="10">no</text><g><rect x="240" y="270" width="200" height="56" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="340" y="295" text-anchor="middle" font-size="12" font-weight="700">STAY, PREPARE</text><text x="340" y="311" text-anchor="middle" font-size="10" class="muted-fill">go-bag by the door, set triggers</text></g><text x="460" y="290" font-size="11" class="muted-fill">Reassess on every new alert.</text><text x="460" y="306" font-size="11" class="muted-fill">Leaving early is almost never wrong;</text><text x="460" y="322" font-size="11" class="muted-fill">leaving late often is.</text></svg>
