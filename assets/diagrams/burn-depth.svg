<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="300" class="diagram" viewBox="0 0 740 300" role="img" aria-label="Burn depth: superficial, partial thickness and full thickness burns shown on skin layers"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><text x="125" y="28" text-anchor="middle" font-size="13" font-weight="700">Superficial</text><text x="125" y="46" text-anchor="middle" font-size="11" class="muted-fill">epidermis only</text><rect x="20" y="60" width="210" height="20" fill="var(--warn)" opacity="0.5" stroke="var(--line)"></rect><rect x="20" y="80" width="210" height="60" fill="var(--accent-2)" opacity="0.5" stroke="var(--line)"></rect><rect x="20" y="140" width="210" height="50" fill="var(--warn-soft)" opacity="0.5" stroke="var(--line)"></rect><rect x="80" y="60" width="90" height="20" fill="var(--bad)" opacity="0.55"></rect><text x="125" y="220" text-anchor="middle" font-size="11">red, dry, painful, no blisters</text></g><g><text x="365" y="28" text-anchor="middle" font-size="13" font-weight="700">Partial thickness</text><text x="365" y="46" text-anchor="middle" font-size="11" class="muted-fill">into dermis</text><rect x="260" y="60" width="210" height="20" fill="var(--warn)" opacity="0.5" stroke="var(--line)"></rect><rect x="260" y="80" width="210" height="60" fill="var(--accent-2)" opacity="0.5" stroke="var(--line)"></rect><rect x="260" y="140" width="210" height="50" fill="var(--warn-soft)" opacity="0.5" stroke="var(--line)"></rect><rect x="320" y="60" width="90" height="70" fill="var(--bad)" opacity="0.55"></rect><text x="365" y="220" text-anchor="middle" font-size="11">blisters, wet, very painful</text></g><g><text x="605" y="28" text-anchor="middle" font-size="13" font-weight="700">Full thickness</text><text x="605" y="46" text-anchor="middle" font-size="11" class="muted-fill">through dermis</text><rect x="500" y="60" width="210" height="20" fill="var(--warn)" opacity="0.5" stroke="var(--line)"></rect><rect x="500" y="80" width="210" height="60" fill="var(--accent-2)" opacity="0.5" stroke="var(--line)"></rect><rect x="500" y="140" width="210" height="50" fill="var(--warn-soft)" opacity="0.5" stroke="var(--line)"></rect><rect x="560" y="60" width="90" height="130" fill="var(--bad)" opacity="0.55"></rect><text x="605" y="220" text-anchor="middle" font-size="11">white/leathery/charred, less pain</text></g><g transform="translate(20,240)"><rect width="700" height="50" rx="8" fill="var(--info-soft)"></rect><text x="12" y="20" font-size="12" font-weight="700">Cool with clean, cool running water ~20 min — never ice, butter or toothpaste.</text><text x="12" y="38" font-size="11" class="muted-fill">Keep the patient warm. Cover loosely with cling film; don’t pop blisters.</text></g></svg>
