<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" class="diagram" viewBox="0 0 760 360" role="img" aria-label="A storm over the upper catchment sends a flash flood down a canyon where the sky is clear; inset hydrograph shows the delayed sharp rise"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><path d="M40,60 Q200,10 380,40 Q520,70 480,190 Q440,300 330,330 Q260,300 200,240 Q60,190 40,60 Z" fill="var(--ok)" opacity="0.15" stroke="var(--ok)" stroke-dasharray="6 4" stroke-width="2"></path><text x="60" y="235" font-size="12" font-weight="700">catchment: bounded by ridgelines</text><path d="M90,90 Q180,140 250,180" stroke="var(--info)" stroke-width="2" fill="none"></path><path d="M200,50 Q240,120 260,180" stroke="var(--info)" stroke-width="2" fill="none"></path><path d="M360,60 Q320,120 270,185" stroke="var(--info)" stroke-width="2" fill="none"></path><path d="M440,120 Q360,170 280,200" stroke="var(--info)" stroke-width="2" fill="none"></path><path d="M265,190 Q300,250 330,330 L352,350" stroke="var(--info)" stroke-width="5" fill="none"></path><path d="M344,352 L362,358 L356,340 Z" fill="var(--info)"></path><path d="M130,30 q20,-30 60,-15 q30,-25 60,0 q30,5 15,30 z" fill="var(--muted)"></path><line x1="150" y1="48" x2="144" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="162" y1="48" x2="156" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="174" y1="48" x2="168" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="186" y1="48" x2="180" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="198" y1="48" x2="192" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="210" y1="48" x2="204" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="222" y1="48" x2="216" y2="80" stroke="var(--info)" stroke-width="2"></line><line x1="234" y1="48" x2="228" y2="80" stroke="var(--info)" stroke-width="2"></line><text x="190" y="100" text-anchor="middle" font-size="11" font-weight="600">storm 15 km away</text><circle cx="560" cy="60" r="16" fill="var(--warn)" opacity="0.8"></circle><text x="560" y="96" text-anchor="middle" font-size="11">sunny here</text><circle cx="322" cy="300" r="5" fill="var(--accent-2)"></circle><circle cx="334" cy="306" r="5" fill="var(--accent-2)"></circle><text x="345" y="290" font-size="11" font-weight="700">hikers in a slot canyon</text><text x="360" y="215" font-size="10.5" class="muted-fill">steep bare rock, thin soil,</text><text x="360" y="229" font-size="10.5" class="muted-fill">burn scars → fast runoff</text><g transform="translate(520,160)"><rect x="0" y="0" width="230" height="170" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="115" y="18" text-anchor="middle" font-size="11" font-weight="700">flow at the canyon</text><line x1="25" y1="140" x2="220" y2="140" stroke="var(--muted)"></line><line x1="25" y1="140" x2="25" y2="30" stroke="var(--muted)"></line><rect x="35" y="30" width="30" height="20" fill="var(--info)" opacity="0.5"></rect><text x="50" y="62" text-anchor="middle" font-size="9">rain</text><path d="M25,135 L110,134 L125,45 Q140,60 160,100 Q190,128 220,132" fill="none" stroke="var(--bad)" stroke-width="2.5"></path><text x="130" y="40" font-size="9">wall of water</text><text x="120" y="158" text-anchor="middle" font-size="9">time → (minutes to hours of lag)</text></g></svg>
