<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" class="diagram" viewBox="0 0 760 300" role="img" aria-label="Terrain cross-section showing good and bad shelter sites"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect width="760" height="300" fill="var(--sky)" opacity="0.5"></rect><path d="M0,70 L120,60 L260,140 L360,230 L420,245 L480,230 L600,150 L760,120 L760,300 L0,300 Z" fill="var(--ground)" opacity="0.75"></path><path d="M360,245 Q420,262 480,245" fill="none" stroke="var(--info)" stroke-width="6"></path><path d="M10,30 L110,36" stroke="var(--info)" stroke-width="2" stroke-dasharray="8 5"></path><path d="M10,44 L110,50" stroke="var(--info)" stroke-width="2" stroke-dasharray="8 5"></path><text x="20" y="20" font-size="11">wind on the exposed ridge</text><path d="M300,190 Q380,230 420,236" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="3 4"></path><text x="330" y="280" font-size="11">cold air pools + flood risk at the bottom</text><line x1="640" y1="145" x2="648" y2="80" stroke="var(--text)" stroke-width="4"></line><line x1="646" y1="95" x2="670" y2="80" stroke="var(--text)" stroke-width="3"></line><text x="600" y="70" font-size="11">dead tree (“widowmaker”)</text><g><circle cx="90" cy="48" r="11" fill="var(--bad)"></circle><text x="90" y="52" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">✗</text><text x="106" y="38" font-size="11" font-weight="600">ridge</text></g><g><circle cx="215" cy="100" r="11" fill="var(--ok)"></circle><text x="215" y="104" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">✓</text><text x="231" y="90" font-size="11" font-weight="600">mid-slope bench, sheltered</text></g><g><circle cx="420" cy="228" r="11" fill="var(--bad)"></circle><text x="420" y="232" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">✗</text><text x="436" y="218" font-size="11" font-weight="600">valley floor</text></g><g><circle cx="650" cy="128" r="11" fill="var(--bad)"></circle><text x="650" y="132" text-anchor="middle" font-size="13" font-weight="700" style="fill:#fff">✗</text></g></svg>
