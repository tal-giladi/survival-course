<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" class="diagram" viewBox="0 0 760 250" role="img" aria-label="Five gates before eating insects: legality, safe kind and clean source, avoid warning colours and hairs, cook thoroughly, check shellfish allergy"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="10" y="40" width="136" height="120" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="78" y="30" font-size="18" font-weight="700" text-anchor="middle" style="fill:var(--accent)">1</text><foreignObject x="16" y="48" width="124" height="108"><div style="font-size:12px;line-height:1.3;color:var(--text)"><b>Legal and allowed here?</b><div style="color:var(--muted);font-size:11px;margin-top:4px">parks, reserves, protected species</div></div></foreignObject><line x1="146" y1="100" x2="158" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#ig)"></line></g><g><rect x="160" y="40" width="136" height="120" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="228" y="30" font-size="18" font-weight="700" text-anchor="middle" style="fill:var(--accent)">2</text><foreignObject x="166" y="48" width="124" height="108"><div style="font-size:12px;line-height:1.3;color:var(--text)"><b>Known-safe kind, from a clean place?</b><div style="color:var(--muted);font-size:11px;margin-top:4px">no pesticide, roadside or polluted sites</div></div></foreignObject><line x1="296" y1="100" x2="308" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#ig)"></line></g><g><rect x="310" y="40" width="136" height="120" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="378" y="30" font-size="18" font-weight="700" text-anchor="middle" style="fill:var(--accent)">3</text><foreignObject x="316" y="48" width="124" height="108"><div style="font-size:12px;line-height:1.3;color:var(--text)"><b>Avoid: bright colours, hairs, stings, bad smell</b><div style="color:var(--muted);font-size:11px;margin-top:4px">many warn predators honestly</div></div></foreignObject><line x1="446" y1="100" x2="458" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#ig)"></line></g><g><rect x="460" y="40" width="136" height="120" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="528" y="30" font-size="18" font-weight="700" text-anchor="middle" style="fill:var(--accent)">4</text><foreignObject x="466" y="48" width="124" height="108"><div style="font-size:12px;line-height:1.3;color:var(--text)"><b>Cook thoroughly</b><div style="color:var(--muted);font-size:11px;margin-top:4px">parasites and bacteria; remove legs/wings</div></div></foreignObject><line x1="596" y1="100" x2="608" y2="100" stroke="var(--accent)" stroke-width="2" marker-end="url(#ig)"></line></g><g><rect x="610" y="40" width="136" height="120" rx="10" fill="var(--panel-2)" stroke="var(--accent)"></rect><text x="678" y="30" font-size="18" font-weight="700" text-anchor="middle" style="fill:var(--accent)">5</text><foreignObject x="616" y="48" width="124" height="108"><div style="font-size:12px;line-height:1.3;color:var(--text)"><b>Shellfish or dust-mite allergy?</b><div style="color:var(--muted);font-size:11px;margin-top:4px">cross-reactive proteins (tropomyosin)</div></div></foreignObject></g><text x="380" y="196" font-size="12" text-anchor="middle">Any “no” → leave it. Insects are small calories: they help a food store, rarely an energy budget.</text><text x="380" y="220" font-size="11" text-anchor="middle" class="muted-fill">For practice, use food-grade insects from a legal commercial source — not wild-caught.</text></svg>
