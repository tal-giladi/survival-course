<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" class="diagram" viewBox="0 0 760 330" role="img" aria-label="Patient assessment system: scene size-up, primary survey, secondary survey, SOAP note and monitoring, looping back to reassess"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path></marker></defs><g><rect x="10" y="20" width="170" height="120" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></rect><text x="95" y="40" text-anchor="middle" font-size="13" font-weight="700">1. Scene size-up</text><text x="95" y="58" text-anchor="middle" font-size="11" class="muted-fill">Hazards to you, bystanders</text><text x="95" y="73" text-anchor="middle" font-size="11" class="muted-fill">and patient</text><text x="95" y="88" text-anchor="middle" font-size="11" class="muted-fill">Mechanism · how many</text><text x="95" y="103" text-anchor="middle" font-size="11" class="muted-fill">Gloves · resources</text></g><g><rect x="200" y="20" width="170" height="120" rx="8" fill="var(--bad-soft)" stroke="var(--line)" stroke-width="1"></rect><text x="285" y="40" text-anchor="middle" font-size="13" font-weight="700">2. Primary survey</text><text x="285" y="58" text-anchor="middle" font-size="11" class="muted-fill">Responsive? (AVPU)</text><text x="285" y="73" text-anchor="middle" font-size="11" class="muted-fill">Massive bleeding</text><text x="285" y="88" text-anchor="middle" font-size="11" class="muted-fill">Airway · Breathing</text><text x="285" y="103" text-anchor="middle" font-size="11" class="muted-fill">Circulation · Disability</text><text x="285" y="118" text-anchor="middle" font-size="11" class="muted-fill">Environment (protect)</text></g><g><rect x="390" y="20" width="170" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="475" y="40" text-anchor="middle" font-size="13" font-weight="700">3. Secondary survey</text><text x="475" y="58" text-anchor="middle" font-size="11" class="muted-fill">Head-to-toe exam</text><text x="475" y="73" text-anchor="middle" font-size="11" class="muted-fill">Vital signs (baseline)</text><text x="475" y="88" text-anchor="middle" font-size="11" class="muted-fill">SAMPLE history</text><text x="475" y="103" text-anchor="middle" font-size="11" class="muted-fill">OPQRST for pain</text></g><g><rect x="580" y="20" width="170" height="120" rx="8" fill="var(--panel-2)" stroke="var(--line)" stroke-width="1"></rect><text x="665" y="40" text-anchor="middle" font-size="13" font-weight="700">4. SOAP + plan</text><text x="665" y="58" text-anchor="middle" font-size="11" class="muted-fill">Problem list</text><text x="665" y="73" text-anchor="middle" font-size="11" class="muted-fill">Treatment</text><text x="665" y="88" text-anchor="middle" font-size="11" class="muted-fill">Evacuation urgency</text><text x="665" y="103" text-anchor="middle" font-size="11" class="muted-fill">Written record</text></g><line x1="182" y1="80" x2="198" y2="80" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pf)"></line><line x1="372" y1="80" x2="388" y2="80" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pf)"></line><line x1="562" y1="80" x2="578" y2="80" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pf)"></line><g><rect x="200" y="190" width="360" height="70" rx="8" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"></rect><text x="380" y="210" text-anchor="middle" font-size="13" font-weight="700">5. Monitor and reassess</text><text x="380" y="228" text-anchor="middle" font-size="11" class="muted-fill">Vitals every 5–15 min if unstable, hourly if stable</text><text x="380" y="243" text-anchor="middle" font-size="11" class="muted-fill">Trends beat single numbers</text></g><path d="M665,140 L665,225 L562,225" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pf)"></path><path d="M198,225 L95,225 L95,142" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pf)" stroke-dasharray="6 4"></path><text x="100" y="290" font-size="11" class="muted-fill">Any change (worse or new hazard) → go back to the start of the loop.</text><text x="100" y="308" font-size="11" class="muted-fill">Fix life threats in the primary survey as you find them — don’t finish the list first.</text></svg>
