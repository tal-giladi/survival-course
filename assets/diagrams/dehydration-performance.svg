<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" class="diagram" viewBox="0 0 700 300" role="img" aria-label="Endurance performance falls as body-mass loss from dehydration rises past about 2 percent"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g><rect x="70" y="40" width="55" height="190" fill="var(--ok)" opacity="0.13"></rect></g><g><rect x="125" y="40" width="55" height="190" fill="var(--ok)" opacity="0.13"></rect></g><g><rect x="180" y="40" width="110" height="190" fill="var(--warn)" opacity="0.13"></rect></g><g><rect x="290" y="40" width="110" height="190" fill="var(--accent-2)" opacity="0.13"></rect></g><g><rect x="400" y="40" width="220" height="190" fill="var(--bad)" opacity="0.13"></rect></g><line x1="70" y1="230" x2="620" y2="230" stroke="var(--line)" stroke-width="2"></line><line x1="70" y1="40" x2="70" y2="230" stroke="var(--line)" stroke-width="2"></line><text x="70" y="250" text-anchor="middle" font-size="12">0 %</text><text x="180" y="250" text-anchor="middle" font-size="12">2 %</text><text x="290" y="250" text-anchor="middle" font-size="12">4 %</text><text x="400" y="250" text-anchor="middle" font-size="12">6 %</text><text x="510" y="250" text-anchor="middle" font-size="12">8 %</text><text x="620" y="250" text-anchor="middle" font-size="12">10 %</text><text x="62" y="191.5" text-anchor="end" font-size="11">25</text><text x="62" y="149" text-anchor="end" font-size="11">50</text><text x="62" y="106.5" text-anchor="end" font-size="11">75</text><text x="62" y="64" text-anchor="end" font-size="11">100</text><polyline points="70,60 125,61.7 180,70.2 235,83.8 290,99.1 345,114.4 400,131.4 510,162 620,187.5" fill="none" stroke="var(--accent)" stroke-width="3.5"></polyline><line x1="180" y1="40" x2="180" y2="230" stroke="var(--accent-2)" stroke-dasharray="5 5" stroke-width="2"></line><text x="186" y="54" font-size="12" font-weight="700" style="fill:var(--accent-2)">~2 %: measurable loss</text><text x="296" y="130" font-size="11">Headache, nausea,</text><text x="296" y="144" font-size="11">big drop in work</text><text x="410" y="176" font-size="11">Dizziness, confusion,</text><text x="410" y="190" font-size="11">collapse risk ↑</text><text x="345" y="272" text-anchor="middle" font-size="12" font-weight="700">Body-mass loss from dehydration</text><text x="20" y="30" font-size="12" font-weight="700">Endurance capacity (% of normal, illustrative)</text><text x="350" y="292" text-anchor="middle" font-size="10.5" class="muted-fill">Shape illustrative; the ~2 % threshold is from ACSM. Heat makes every band worse. For 70 kg, 2 % = 1.4 L.</text></svg>
