<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" class="diagram" viewBox="0 0 720 200" role="img" aria-label="Multi-barrier water treatment chain: choose the source, clarify, filter, disinfect, store safely"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="mb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g><rect x="10" y="40" width="126" height="90" rx="10" fill="var(--accent)" opacity="0.85"></rect><text x="73" y="76" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Choose source</text><text x="73" y="150" text-anchor="middle" font-size="11">above people &amp; stock</text><line x1="138" y1="85" x2="150" y2="85" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#mb-a)"></line></g><g><rect x="152" y="40" width="126" height="90" rx="10" fill="var(--ground)" opacity="0.85"></rect><text x="215" y="76" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Settle</text><text x="215" y="92" text-anchor="middle" font-size="10.5" style="fill:#fff">cloth / alum</text><text x="215" y="150" text-anchor="middle" font-size="11">NTU ↓; 0–1.5 log</text><line x1="280" y1="85" x2="292" y2="85" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#mb-a)"></line></g><g><rect x="294" y="40" width="126" height="90" rx="10" fill="var(--info)" opacity="0.85"></rect><text x="357" y="76" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Microfilter 0.1 µm</text><text x="357" y="150" text-anchor="middle" font-size="11">bacteria &amp; protozoa 6 log</text><line x1="422" y1="85" x2="434" y2="85" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#mb-a)"></line></g><g><rect x="436" y="40" width="126" height="90" rx="10" fill="var(--accent-2)" opacity="0.85"></rect><text x="499" y="76" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Chlorine</text><text x="499" y="92" text-anchor="middle" font-size="10.5" style="fill:#fff">ClO₂ / UV / boil</text><text x="499" y="150" text-anchor="middle" font-size="11">viruses 4+ log</text><line x1="564" y1="85" x2="576" y2="85" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#mb-a)"></line></g><g><rect x="578" y="40" width="126" height="90" rx="10" fill="var(--ok)" opacity="0.85"></rect><text x="641" y="76" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">Safe storage</text><text x="641" y="150" text-anchor="middle" font-size="11">pour; residual; clean hands</text></g><text x="360" y="24" text-anchor="middle" font-size="12.5" font-weight="700">Each barrier covers another’s gap. Log reductions add.</text><text x="360" y="186" text-anchor="middle" font-size="10.5" class="muted-fill">None of these steps removes dissolved chemicals, salt or cyanotoxins (carbon helps partly; distillation removes salts and metals).</text></svg>
