<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="diagram" viewBox="0 0 640 250" role="img" aria-label="Step-by-step tracking with a tracking stick. The stick is marked with the length of the subject&#x27;s step. Place the mark at the heel of the last confirmed print; the next print should lie near the tip, within a small arc. Search that arc slowly, low-angle light behind the sign, before moving on. Never step on the sign — walk beside the trail."><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><rect x="0" y="0" width="640" height="200" fill="var(--ground)" opacity="0.2"></rect><g transform="translate(80 120) rotate(90)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.55"><g><path d="M-2.5,-25 Q-10,-24 -9.5,-12.5 Q-8.5,-1 -5.5,3 L5.5,3 Q8,-7.5 7.000000000000001,-17.5 Q5,-25 -2.5,-25 Z"></path><rect x="-6.5" y="7.000000000000001" width="13" height="17" rx="5"></rect><line x1="-5" y1="-18" x2="7.000000000000001" y2="-18" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-13" x2="7.000000000000001" y2="-13" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-8" x2="7.000000000000001" y2="-8" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-3" x2="7.000000000000001" y2="-3" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line></g></g><g transform="translate(200 90) rotate(90)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.55"><g><path d="M2.5,-25 Q10,-24 9.5,-12.5 Q8.5,-1 5.5,3 L-5.5,3 Q-8,-7.5 -7.000000000000001,-17.5 Q-5,-25 2.5,-25 Z"></path><rect x="-6.5" y="7.000000000000001" width="13" height="17" rx="5"></rect><line x1="-5" y1="-18" x2="7.000000000000001" y2="-18" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-13" x2="7.000000000000001" y2="-13" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-8" x2="7.000000000000001" y2="-8" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-3" x2="7.000000000000001" y2="-3" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line></g></g><g transform="translate(320 120) rotate(90)" fill="var(--text)" stroke="var(--text)" stroke-width="0" opacity="0.25"><g><path d="M-2.5,-25 Q-10,-24 -9.5,-12.5 Q-8.5,-1 -5.5,3 L5.5,3 Q8,-7.5 7.000000000000001,-17.5 Q5,-25 -2.5,-25 Z"></path><rect x="-6.5" y="7.000000000000001" width="13" height="17" rx="5"></rect><line x1="-5" y1="-18" x2="7.000000000000001" y2="-18" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-13" x2="7.000000000000001" y2="-13" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-8" x2="7.000000000000001" y2="-8" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line><line x1="-5" y1="-3" x2="7.000000000000001" y2="-3" stroke-width="1.25" opacity="0.6" style="stroke:var(--panel)"></line></g></g><line x1="58" y1="140" x2="340" y2="140" stroke="var(--accent-2)" stroke-width="6" stroke-linecap="round"></line><line x1="58" y1="132" x2="58" y2="148" stroke="var(--panel)" stroke-width="3"></line><line x1="178" y1="132" x2="178" y2="148" stroke="var(--panel)" stroke-width="3"></line><line x1="298" y1="132" x2="298" y2="148" stroke="var(--panel)" stroke-width="3"></line><ellipse cx="320" cy="120" rx="36" ry="30" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="4 3"></ellipse><text x="60" y="170" text-anchor="start" font-size="11" font-weight="400">stick: heel-to-heel step length marked</text><text x="362" y="100" text-anchor="start" font-size="11" font-weight="700">next print expected here —</text><text x="362" y="114" text-anchor="start" font-size="11" font-weight="700">search this zone</text><path d="M40,40 L620,40" stroke="var(--text)" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"></path><text x="620" y="34" text-anchor="end" font-size="10" font-weight="400" class="muted-fill">trackers walk to the side of the trail, never on it</text><text x="20" y="222" text-anchor="start" font-size="11" font-weight="400">1. Confirm the last print (sole pattern, size). 2. Place the stick. 3. Search the zone with low-angle light.</text><text x="20" y="240" text-anchor="start" font-size="11" font-weight="400">4. Mark each confirmed print. Do not move ahead of the last known print.</text></svg>
