<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" class="diagram" viewBox="0 0 640 290" role="img" aria-label="Cathole: dug 15 to 20 centimetres deep into dark organic topsoil, 10 to 15 centimetres across, at least 60 metres (200 feet, about 70 adult steps) from water, camp and trails; covered and disguised afterwards; toilet paper packed out"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><defs><marker id="ch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><rect x="0" y="120" width="640" height="170" fill="var(--ground)" opacity="0.35"></rect><rect x="0" y="120" width="640" height="40" fill="var(--ground)" opacity="0.55"></rect><text x="12" y="146" font-size="11">organic topsoil: most decomposers</text><text x="12" y="200" font-size="11" class="muted-fill">mineral soil / sand: slow decay</text><path d="M 140 120 L 150 170 Q 170 180 190 170 L 200 120 Z" fill="var(--panel-2)" stroke="var(--text)"></path><line x1="220" y1="120" x2="220" y2="172" stroke="var(--accent)" stroke-width="2" marker-start="url(#ch-a)" marker-end="url(#ch-a)"></line><text x="228" y="150" font-size="12" font-weight="700" style="fill:var(--accent)">15–20 cm deep</text><text x="130" y="110" font-size="11">10–15 cm wide</text><line x1="260" y1="80" x2="560" y2="80" stroke="var(--muted)" stroke-width="1.5" marker-start="url(#ch-a)" marker-end="url(#ch-a)"></line><text x="410" y="70" text-anchor="middle" font-size="13" font-weight="700">≥ 60 m (200 ft) ≈ 70 adult steps</text><path d="M 560 120 Q 590 100 620 120" fill="var(--info)" opacity="0.7"></path><text x="590" y="96" text-anchor="middle" font-size="11">water, camp, trail</text><text x="20" y="240" font-size="12">Dig → use → stir in a little soil with a stick → fill → tamp → disguise with leaves.</text><text x="20" y="260" font-size="12">Pack out toilet paper and hygiene products in a sealed bag. Spread catholes out; don’t reuse sites.</text><text x="20" y="280" font-size="11" class="muted-fill">Where soil is thin, frozen, sandy or heavily used, or where rules say so, pack out waste instead.</text></svg>
