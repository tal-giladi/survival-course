<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" class="diagram" viewBox="0 0 700 320" role="img" aria-label="Log reduction ladder: each log is a tenfold reduction, from one million organisms at zero log to one at six log; EPA purifier standard marked"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><text x="40" y="26" font-size="12" font-weight="700">Log reduction</text><text x="170" y="26" font-size="12" font-weight="700">% removed</text><text x="300" y="26" font-size="12" font-weight="700">Left of 1,000,000</text><g><text x="70" y="56" text-anchor="middle" font-size="15" font-weight="700">0</text><text x="170" y="56" font-size="12">0 %</text><rect x="300" y="40" width="360" height="24" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="306" y="57" font-size="12" font-weight="700" style="fill:#fff">1,000,000</text></g><g><text x="70" y="92" text-anchor="middle" font-size="15" font-weight="700">1</text><text x="170" y="92" font-size="12">90 %</text><rect x="300" y="76" width="308.5714285714286" height="24" rx="4" fill="var(--bad)" opacity="0.7"></rect><text x="306" y="93" font-size="12" font-weight="700" style="fill:#fff">100,000</text></g><g><text x="70" y="128" text-anchor="middle" font-size="15" font-weight="700">2</text><text x="170" y="128" font-size="12">99 %</text><rect x="300" y="112" width="257.14285714285717" height="24" rx="4" fill="var(--warn)" opacity="0.7"></rect><text x="306" y="129" font-size="12" font-weight="700" style="fill:#fff">10,000</text></g><g><text x="70" y="164" text-anchor="middle" font-size="15" font-weight="700">3</text><text x="170" y="164" font-size="12">99.9 %</text><rect x="300" y="148" width="205.7142857142857" height="24" rx="4" fill="var(--warn)" opacity="0.7"></rect><text x="306" y="165" font-size="12" font-weight="700" style="fill:#fff">1,000</text></g><g><text x="70" y="200" text-anchor="middle" font-size="15" font-weight="700">4</text><text x="170" y="200" font-size="12">99.99 %</text><rect x="300" y="184" width="154.2857142857143" height="24" rx="4" fill="var(--ok)" opacity="0.7"></rect><text x="306" y="201" font-size="12" font-weight="700" style="fill:#fff">100</text></g><g><text x="70" y="236" text-anchor="middle" font-size="15" font-weight="700">5</text><text x="170" y="236" font-size="12">99.999 %</text><rect x="300" y="220" width="102.85714285714285" height="24" rx="4" fill="var(--ok)" opacity="0.7"></rect><text x="306" y="237" font-size="12" font-weight="700" style="fill:#fff">10</text></g><g><text x="70" y="272" text-anchor="middle" font-size="15" font-weight="700">6</text><text x="170" y="272" font-size="12">99.9999 %</text><rect x="300" y="256" width="51.428571428571445" height="24" rx="4" fill="var(--ok)" opacity="0.7"></rect><text x="306" y="273" font-size="12" font-weight="700" style="fill:#fff">1</text></g><g transform="translate(470,120)"><rect width="220" height="96" rx="8" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="10" y="22" font-size="12" font-weight="700">US EPA &quot;purifier&quot; standard</text><text x="10" y="44" font-size="12">Bacteria 6 log (99.9999 %)</text><text x="10" y="64" font-size="12">Viruses 4 log (99.99 %)</text><text x="10" y="84" font-size="12">Protozoan cysts 3 log (99.9 %)</text></g><text x="350" y="310" text-anchor="middle" font-size="10.5" class="muted-fill">Bar lengths are not to scale (a log scale would make them vanish). Barriers in series add logs: 3 + 2 = 5 log.</text></svg>
