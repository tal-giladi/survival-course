<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" class="diagram" viewBox="0 0 720 260" role="img" aria-label="Three steps to take a bearing from the map and follow it"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><g transform="translate(0,0)"><rect x="6" y="30" width="220" height="200" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><line x1="26" x2="26" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="86" x2="86" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="146" x2="146" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="206" x2="206" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><text x="116" y="20" font-size="12" text-anchor="middle" font-weight="700">1. Edge on the route</text><g><line x1="60" y1="190" x2="170" y2="70" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="5 4"></line><circle cx="60" cy="190" r="5" fill="var(--accent)"></circle><circle cx="170" cy="70" r="8" fill="none" stroke="var(--accent-2)" stroke-width="2"></circle><g transform="translate(60,190) rotate(42.51)"><rect x="-18" y="-120" width="36" height="140" rx="5" fill="var(--panel)" stroke="var(--text)" opacity="0.9"></rect><path d="M0,-118 l-6,12 l12,0 z" fill="var(--accent-2)"></path><g transform="rotate(-42.51)"><circle r="16" fill="var(--sky)" stroke="var(--text)"></circle></g></g></g><text x="116" y="250" font-size="11" text-anchor="middle" class="muted-fill">arrow points from you to the target</text></g><g transform="translate(240,0)"><rect x="6" y="30" width="220" height="200" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><line x1="26" x2="26" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="86" x2="86" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="146" x2="146" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><line x1="206" x2="206" y1="30" y2="230" stroke="var(--info)" stroke-width="1" opacity="0.6"></line><text x="116" y="20" font-size="12" text-anchor="middle" font-weight="700">2. Turn the housing</text><g><line x1="60" y1="190" x2="170" y2="70" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="5 4"></line><g transform="translate(60,190) rotate(42.51)"><rect x="-18" y="-120" width="36" height="140" rx="5" fill="var(--panel)" stroke="var(--text)" opacity="0.9"></rect><path d="M0,-118 l-6,12 l12,0 z" fill="var(--accent-2)"></path><g transform="rotate(-42.51)"><circle r="16" fill="var(--sky)" stroke="var(--text)"></circle><line x1="-8" x2="-8" y1="-14" y2="14" stroke="var(--bad)" stroke-width="1"></line><line x1="0" x2="0" y1="-14" y2="14" stroke="var(--bad)" stroke-width="1"></line><line x1="8" x2="8" y1="-14" y2="14" stroke="var(--bad)" stroke-width="1"></line></g></g></g><text x="116" y="250" font-size="11" text-anchor="middle" class="muted-fill">orienting lines ∥ grid lines, N to map top</text></g><g transform="translate(480,0)"><rect x="6" y="30" width="220" height="200" rx="6" fill="var(--panel-2)" stroke="var(--line)"></rect><text x="116" y="20" font-size="12" text-anchor="middle" font-weight="700">3. Declination, then turn</text><circle cx="116" cy="190" r="14" fill="var(--muted)"></circle><path d="M116,176 L116,60" stroke="var(--accent-2)" stroke-width="2.5" marker-end="url(#bs)"></path><circle cx="116" cy="150" r="22" fill="var(--sky)" stroke="var(--text)"></circle><path d="M108,142 L116,128 L124,142" fill="none" stroke="var(--bad)" stroke-width="2"></path><path d="M116,130 L120,150 L112,150 Z" fill="var(--bad)"></path><text x="116" y="50" font-size="11" text-anchor="middle">walk toward a landmark on this line</text><text x="140" y="146" font-size="11" text-anchor="start" style="fill:var(--bad)">“red in the shed”</text><text x="116" y="250" font-size="11" text-anchor="middle" class="muted-fill">adjust for declination; turn your body</text><defs><marker id="bs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path></marker></defs></g></svg>
