<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="diagram" viewBox="0 0 640 300" role="img" aria-label="Three kit tiers: on body, pocket kit, pack"><style>svg{--bg:#f6f4ee;--panel:#ffffff;--panel-2:#efece3;--text:#1f2a24;--muted:#5c6a61;--line:#d9d4c7;--accent:#2f6b4f;--accent-2:#c2682b;--accent-soft:#e2efe7;--ok:#2e7d4f;--ok-soft:#e1f2e7;--bad:#b3372b;--bad-soft:#f8e3e0;--warn:#9a6a00;--warn-soft:#fbf0d4;--info-soft:#e5eef8;--info:#2c5d8f;--sky:#cfe3f2;--ground:#8b7d5a;background:var(--panel);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}@media (prefers-color-scheme:dark){svg{--bg:#141a17;--panel:#1c2420;--panel-2:#232d28;--text:#e6ebe7;--muted:#9aa8a0;--line:#34413a;--accent:#6fbf94;--accent-2:#e7925a;--accent-soft:#1f3a2d;--ok:#6fcf97;--ok-soft:#1c3527;--bad:#f08a7e;--bad-soft:#3b211e;--warn:#e8c15a;--warn-soft:#362d14;--info-soft:#1b2a3a;--info:#8cb8e6;--sky:#1f3345;--ground:#5a5140}}text{fill:var(--text)}.muted-fill{fill:var(--muted)}</style><circle cx="170" cy="150" r="135" fill="var(--accent)" opacity="0.12" stroke="var(--accent)"></circle><circle cx="170" cy="150" r="88" fill="var(--accent)" opacity="0.18" stroke="var(--accent)"></circle><circle cx="170" cy="150" r="44" fill="var(--accent)" opacity="0.3" stroke="var(--accent)"></circle><text x="170" y="146" text-anchor="middle" font-size="12" font-weight="700">Tier 1</text><text x="170" y="161" text-anchor="middle" font-size="11">on body</text><text x="170" y="92" text-anchor="middle" font-size="12" font-weight="700">Tier 2 · pocket kit</text><text x="170" y="40" text-anchor="middle" font-size="12" font-weight="700">Tier 3 · pack</text><text x="330" y="60" font-size="13" font-weight="700">Tier 1 — always on you</text><text x="330" y="78" font-size="11.5" class="muted-fill">phone, lighter, knife/multitool, whistle, headlamp, clothing</text><text x="330" y="130" font-size="13" font-weight="700">Tier 2 — survives losing the pack</text><text x="330" y="148" font-size="11.5" class="muted-fill">ferro rod, tinder, emergency bag, purification tabs,</text><text x="330" y="164" font-size="11.5" class="muted-fill">cord, mirror, compass, small first-aid, snack</text><text x="330" y="215" font-size="13" font-weight="700">Tier 3 — the Ten Essentials</text><text x="330" y="233" font-size="11.5" class="muted-fill">navigation, light, sun, first aid, knife, fire,</text><text x="330" y="249" font-size="11.5" class="muted-fill">shelter, extra food, extra water, extra clothes</text></svg>
