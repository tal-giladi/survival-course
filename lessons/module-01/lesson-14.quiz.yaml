- id: s1-l14-q1
  question: |-
    A hiker is lost at 16:00 with no immediate danger. Which sequence of first-hour actions is correct?
  options:
    - |-
      STOP → decide stay or move → inventory and message → shelter and fire prep → reassess
    - |-
      STOP → shelter and fire prep → inventory and message → decide stay or move → reassess
    - |-
      STOP → inventory and message → decide stay or move → shelter and fire prep → reassess
    - |-
      Inventory and message → STOP → decide stay or move → shelter and fire prep → reassess
  correct: 2
  explanation: |-
    Stop → information → decision → protection → reassess. It mirrors the decision loop.

- id: s1-l14-q2
  question: |-
    In the worked example, why was a mid-slope bench chosen over the valley bottom? (Review of lesson 10.)
  options:
    - |-
      Better phone signal for updating the trip-plan contact
    - |-
      Closer to dry fuel and food sources for the night
    - |-
      Easier to light a fire sheltered from the west wind
    - |-
      Cold-air pooling and flood risk in the valley bottom
  correct: 3
  explanation: |-
    Valley bottoms collect cold air on calm nights and carry flood risk.

