- id: s15-l3-q3
  question: |-
    On day 3 of being stranded, your companion has stopped talking, lies in the shelter and will not eat. Which of these should **not** be among your first responses?
  options:
    - |-
      Check for hypothermia: feel their core, look for shivering or its absence
    - |-
      Tell them firmly that they need to snap out of it
    - |-
      Check for injury, especially a hidden head injury
    - |-
      Check that no stove or fire is burning in the closed shelter
  correct: 1
  explanation: |-
    Rule out the physical killers first — cold, injury, carbon monoxide, dehydration and low blood sugar (warm, sweet fluid and food if they can swallow). Only then treat it as psychological, with small tasks, choices and a clear reason for hope.

- id: s15-l3-q6
  question: |-
    Lost overnight with no immediate danger, when should you make the decision whether to stay or to walk out?
  options:
    - |-
      Right away, at 02:00, while you feel the urge to move
    - |-
      Whenever you stop feeling afraid of the situation
    - |-
      After first light, food and warmth, at a set time
    - |-
      By group vote the moment anyone suggests moving
  correct: 2
  explanation: |-
    Unless there is immediate danger, make big, irreversible decisions in daylight after food, water, warmth and rest, at a pre-set decision time (Stage 8 and Stage 14).

- id: s15-l3-q1
  question: |-
    What does the current evidence say about “decision fatigue” as a limited willpower battery (ego depletion)?
  options:
    - |-
      It is firmly established: everyone has a fixed daily quota of good decisions
    - |-
      The number of decisions you make has no effect on your performance at all
    - |-
      Only physical fatigue degrades decisions; lost sleep makes little difference
    - |-
      It is disputed; sleep loss, hunger and stress are what clearly degrade decisions
  correct: 3
  explanation: |-
    The ego-depletion effect is disputed; fatigue, sleep loss, hunger and stress are the well-supported reasons decisions deteriorate. Plan as if they will degrade your decisions and reduce in-the-moment decisions with routines and rules.

- id: s15-l3-q4
  question: |-
    Which statement about suppression and reappraisal of emotions is best supported by research?
  options:
    - |-
      Reappraisal generally works better than suppression
    - |-
      Suppression is the more effective long-term strategy
    - |-
      Both work equally well; it is a matter of personality
    - |-
      Suppression helps relationships by keeping the group calm
  correct: 0
  explanation: |-
    Research generally favours reappraisal — changing how you interpret the situation — over suppression, which tends to cost effort and memory and to strain relationships.

- id: s15-l3-q5
  question: |-
    In Gross’s process model of emotion regulation, which strategy acts **earliest** in the emotional process?
  options:
    - |-
      Reappraisal: “every hour here is an hour closer to the search”
    - |-
      Situation selection: turn back before the storm hits the ridge
    - |-
      Response modulation: slow breathing once the fear is strong
    - |-
      Situation modification: light a fire and tidy the camp
  correct: 1
  explanation: |-
    The order is situation selection, situation modification, attention, reappraisal, response modulation. Earlier strategies act before the emotion builds and usually cost less effort; later ones work once it is already strong.
