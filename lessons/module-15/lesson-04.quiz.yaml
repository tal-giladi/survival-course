- id: s15-l4-q6
  question: |-
    Day 2, stranded after a flood cut the only road. Two group members are arguing loudly about whether to wade out. Tempers are high; nobody has eaten since yesterday. What is the best first step?
  options:
    - |-
      Take a vote right now so the group can settle it and move on
    - |-
      Let them go their separate ways if they really cannot agree
    - |-
      Pause for food and warmth, hear each privately, then set a decision time
    - |-
      Side with the more experienced person to end the argument quickly
  correct: 2
  explanation: |-
    Many conflicts soften after food, water and rest. Talking about interests, not positions, and agreeing a decision time with clear criteria (water level, news on the radio) turns a fight into a plan — and keeps people out of floodwater.

- id: s15-l4-q1
  question: |-
    A member of your group has just fallen 5 m down a slope and is lying still; others are shouting and milling about. Which leadership style fits the next two minutes?
  options:
    - |-
      Consensus — discuss the options until everyone agrees
    - |-
      Vote — let the majority decide what happens next
    - |-
      Wait for someone to emerge naturally as leader
    - |-
      Directive — short, clear instructions to named people
  correct: 3
  explanation: |-
    Directive leadership in the first minutes: “Ana, check the slope is safe to descend. Sam, get the first-aid kit. I’ll go to him.” Consult once the immediate danger is controlled.

- id: s15-l4-q2
  question: |-
    Which of these practices makes groupthink **more** likely rather than less?
  options:
    - |-
      Closing the discussion with “We all agree, right?”
    - |-
      The leader gives their view last, after everyone else
    - |-
      Asking the quietest or least experienced person first
    - |-
      Everyone writes down their view before the discussion
  correct: 0
  explanation: |-
    Groupthink feeds on the leader’s early preference, silence and social pressure. Structure the discussion to bring genuine disagreement out — and thank people publicly for raising doubts.

- id: s15-l4-q3
  question: |-
    Which approach matches WHO psychological first aid for distressed survivors?
  options:
    - |-
      Get them to describe the event in detail as soon as possible
    - |-
      Look, listen, link: safety, practical help, calm listening, connection
    - |-
      Leave them alone until a professional counsellor can be reached
    - |-
      Ask them not to talk about it so they do not upset the others
  correct: 1
  explanation: |-
    WHO psychological first aid is look, listen, link: safety, practical support, calm listening without pressure, and connection. Pressing people to relive the event is not recommended.

- id: s15-l4-q4
  question: |-
    In an after-action review, which question comes right after “What actually happened?”
  options:
    - |-
      What did we plan to happen?
    - |-
      What will we do differently next time?
    - |-
      Why was there a difference?
    - |-
      Who made the mistake that caused it?
  correct: 2
  explanation: |-
    Plan → reality → reasons → changes. Keep it blame-free and include near-misses.
