- id: s5-l1-q3
  question: |-
    Calm, clear, −3 °C night in a pine forest, dry ground. You have a tarp, 20 minutes of light and a carpet of dry needles. Which heat-loss path deserves your first minutes?
  options:
    - |-
      Convection — build walls against the wind
    - |-
      Evaporation — waterproof everything
    - |-
      Conduction — build a thick needle bed
    - |-
      Radiation — pitch the tarp perfectly taut first
  correct: 2
  explanation: |-
    Rank the paths for tonight: calm and dry removes convection and evaporation; conduction and radiation remain, and conduction through a crushed layer is bigger. Bed first, then a low tarp to hide the sky.

- id: s5-l1-q6
  question: |-
    Wet, windy night at 4 °C in a forest; you have a tarp and cord and 60 minutes of light. Which order of jobs saves the most **watts per minute**, highest first?
  options:
    - |-
      Thick dry bed, low tarp roof, plug the windward gap, neaten the guy-lines
    - |-
      Low tarp roof, plug the windward gap, neaten the guy-lines, thick dry bed
    - |-
      Plug the windward gap, low tarp roof, thick dry bed, neaten the guy-lines
    - |-
      Low tarp roof, thick dry bed, plug the windward gap, neaten the guy-lines
  correct: 3
  explanation: |-
    In rain and wind, staying dry comes first because wet clothing multiplies every other loss; then the bed; then fine-tuning the wind protection; cosmetics last. On a dry, calm night the bed would move to the top.

- id: s5-l1-q4
  question: |-
    Which statement about **volume and warmth** is **NOT** correct?
  options:
    - |-
      In a hot desert, pitching as low and closed as possible keeps you coolest.
    - |-
      A pitched tarp in wind raises the air temperature under it only a little.
    - |-
      Doubling the size of an enclosed shelter roughly doubles its wall area and air to heat.
    - |-
      In the cold, pitching low reduces wind load, volume and sky view.
  correct: 0
  explanation: |-
    Small and closed holds warmth; big and open exchanges air. In the cold pitch low and closed; in heat pitch high and open for air flow.

- id: s5-l1-q5
  question: |-
    Which statement about laying a foil emergency blanket directly on frozen ground is correct?
  options:
    - |-
      It insulates well because the foil reflects your body heat back up to you.
    - |-
      It does little against conduction; thick, dry material must go under you.
    - |-
      It works best laid straight on the ground with nothing between it and the soil.
    - |-
      It stops ground conduction about as well as a foam pad, at a fraction of the weight.
  correct: 1
  explanation: |-
    Myth: foil is thin, so it has almost no thermal resistance against conduction, and it reflects radiant heat only when there is an air gap. Put thick, dry material under you; the foil can go on top of it or around you.

- id: s5-l1-q1
  question: |-
    A bed of 20 cm of conifer boughs compresses to **7 cm** under you. With $k = 0.06$ W/(m·K), what is its thermal resistance $R = d/k$?
  options:
    - |-
      3.33 m²·K/W
    - |-
      0.86 m²·K/W
    - |-
      1.17 m²·K/W
    - |-
      116.7 m²·K/W
  correct: 2
  explanation: |-
    $R = 0.07 / 0.06 \approx 1.17$ m²·K/W. Use the *compressed* thickness in metres — the loose 20 cm would suggest 3.3, which is fiction.
