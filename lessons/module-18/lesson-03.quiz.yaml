- id: s18-l3-q2
  question: |-
    It is −15 °C. Your hollow-fibre filter spent the night in the pack’s side pocket. What do you do?
  options:
    - |-
      Treat its output as unsafe; boil or use chemical treatment
    - |-
      Use it as normal, as long as water still flows through it
    - |-
      Warm it by the fire until it is hot right through, then use it
    - |-
      Blow through it first to test whether the fibres are intact
  correct: 0
  explanation: |-
    Many manufacturers warn that freezing damages hollow-fibre filters. Treat a possibly frozen filter as failed, switch to a backup method, and keep filters in your sleeping bag on freezing nights.

- id: s18-l3-q5
  question: |-
    Day 4 of a cold, wet wait. Which is the best way to keep your fire going for the rest of the week?
  options:
    - |-
      Keep a large fire burning day and night so that it never goes out
    - |-
      Daily dry tinder, drying fuel, banked coals and spare ignition
    - |-
      Rely on the lighter, since it has worked without fail every day
    - |-
      Save all the dry wood for emergencies and burn only wet wood
  correct: 1
  explanation: |-
    Repeated fire is about a continuous supply of dry tinder and fuel, banked coals and redundant ignition.

- id: s18-l3-q3
  question: |-
    On a wet, cool multi-day trip, which habit makes immersion (trench) foot MORE likely?
  options:
    - |-
      Taking boots and socks off each evening to dry, air and inspect feet
    - |-
      Sleeping in dry socks and drying the wet pair against your body
    - |-
      Lacing boots very tight all day to keep the water out
    - |-
      Treating hot spots as soon as you notice them, before they blister
  correct: 2
  explanation: |-
    Immersion foot comes from long hours wet and cool. Dry feet every night, loosen laces, and deal with small problems early; keeping boots on overnight is another mistake, because feet need to dry.

- id: s18-l3-q4
  question: |-
    Why does wet insulation lose much of its warmth?
  options:
    - |-
      Water itself is cold, so it chills the fibres until they dry out
    - |-
      Wet fibres become heavier, which squeezes all the air out of the outer layer
    - |-
      Water blocks your skin from breathing, so the body makes less heat
    - |-
      Water conducts heat far better than the still air it replaces
  correct: 3
  explanation: |-
    Water conducts heat roughly 24 times better than still air, fibres collapse when wet, and evaporation carries away more heat.

- id: s18-l3-q1
  question: |-
    A headlamp has a 4 % chance each day of failing (dropped, soaked, broken). Assuming independent days, what is the chance it has failed at least once by the end of a 10-day trip?
  options:
    - |-
      About 33 %
    - |-
      About 40 %
    - |-
      About 67 %
    - |-
      About 4 %
  correct: 0
  explanation: |-
    $1 - 0.96^{10} \approx 1 - 0.665 = 0.335$, about 33 %. A small spare light and daily checks bring the risk down.
