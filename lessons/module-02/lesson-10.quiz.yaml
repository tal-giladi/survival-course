- id: s2-l10-q6
  question: |-
    Your phone is dead and you are in overcast forest. The map (memorised) shows a long east–west road about 3 km to the south. The only clues are moss on trunks and one flagged tree in a clearing. What is the soundest approach?
  options:
    - |-
      Follow the moss on the trunks, which marks north, and keep it at your back.
    - |-
      Walk straight “by feel” — you know roughly which way you came in this morning.
    - |-
      Take the flagged tree’s direction as exact and walk on it for 3 km without checking.
    - |-
      If moving is justified: STOP, combine several clues and the sun, aim for the road, re-check often.
  correct: 3
  explanation: |-
    Natural navigation is a way to hit big targets, and it is used inside the stay-or-move decision — not instead of it. Gather several independent clues, use the road as a catching feature and re-check every few hundred metres.

- id: s2-l10-q3
  question: |-
    Assuming you know the prevailing wind or where the sun is, which of these gives you only a **line**, not a direction arrow?
  options:
    - |-
      The alignment of sastrugi alone
    - |-
      Snow tails behind boulders
    - |-
      The horns of a barchan dune
    - |-
      Earlier snow melt on one valley side
  correct: 0
  explanation: |-
    Distinguish arrows (drift tails, dune horns, cornices, sunny slopes) from lines (sastrugi) and from noise (moss).

- id: s2-l10-q4
  question: |-
    On a snowy ridge the cornices overhang the east side. Where should you walk?

    ![Wind-flagged tree, cornice with snow drift, and barchan dune, each with the prevailing wind direction](../../assets/diagrams/natural-signs.svg)
  options:
    - |-
      Along the crest, where the snow is firmest.
    - |-
      Well back from the edge on the west (windward) side.
    - |-
      On the east side below the cornice, out of the wind.
    - |-
      Near the lip, so you can see down the east face.
  correct: 1
  explanation: |-
    Cornices tell you the wind blew from the west — and that the east edge is dangerous. Formal avalanche training is needed for travel on snowy ridges.

- id: s2-l10-q1
  question: |-
    In a Northern Hemisphere forest, what does moss on a tree trunk tell you?
  options:
    - |-
      North — it grows on the north side, like a compass
    - |-
      South — it grows on the sunnier, equator-facing side
    - |-
      Where it is locally damp and shaded — not a direction
    - |-
      The prevailing wind — it grows on the windward side
  correct: 2
  explanation: |-
    Myth: “moss grows on the north side”. Moss follows moisture and shade, which can be on any side. In a damp forest it is often all around the trunk, so it cannot replace a compass.

- id: s2-l10-q5
  question: |-
    You have four independent, unbiased natural clues, each good to about ±40°. Roughly what error should you expect for their average?
  options:
    - |-
      ±10°
    - |-
      ±40°
    - |-
      ±80°
    - |-
      ±20°
  correct: 3
  explanation: |-
    $\sigma/\sqrt{n} = 40/\sqrt{4} = 40/2 =$ **±20°** — but only if the clues really are independent. Shared causes create a bias that averaging cannot remove.
