- id: s8-l9-q4
  question: |-
    Your fishing boat capsizes 2 km offshore in 11 °C water. The three of you wear PFDs; the hull is floating but you cannot climb onto it. Rescue is on the way. Which plan is best?
  options:
    - |-
      All stay with the boat, each treading water hard to keep warm
    - |-
      All stay with the boat, huddled together and holding onto the hull
    - |-
      Strongest swimmer heads for shore; the other two huddle at the hull
    - |-
      All three swim for shore together, keeping each other in sight
  correct: 1
  explanation: |-
    Stay with the boat, stay still, stay together.

- id: s8-l9-q2
  question: |-
    You fall off a jetty into 9 °C water. What should you do in the first minute?
  options:
    - |-
      Swim hard for the nearest ladder before the cold sets in.
    - |-
      Shout for help continuously until someone hears you.
    - |-
      Float on your back, spread out, and get your breathing under control.
    - |-
      Remove heavy clothing so that you can swim more easily.
  correct: 2
  explanation: |-
    The cold-shock response fades over 1–3 minutes. Then decide: a short swim to the ladder, or float and signal.

- id: s8-l9-q6
  question: |-
    Rescuers have reached a person who has been in 8 °C water for 50 minutes. How should they get them out?
  options:
    - |-
      Have them climb the boarding ladder themselves to prove they are OK
    - |-
      Pull them out by the arms and stand them up to walk to the cabin
    - |-
      Lift them out and put them straight into a hot shower on board
    - |-
      Horizontally if possible, then keep them lying down, insulated, handled gently
  correct: 3
  explanation: |-
    Horizontal lift, lie down, insulate, trunk heat, monitor, medical assessment — especially if they inhaled water.

- id: s8-l9-q5
  question: |-
    Which statement about the 1-10-1 principle for cold water is correct?
  options:
    - |-
      It is a teaching tool; windows vary and many drown in the first minute.
    - |-
      It guarantees at least 10 minutes of useful movement in ice water.
    - |-
      It guarantees about 1 hour of consciousness however cold the water.
    - |-
      It shows that hypothermia is what kills most people in cold water.
  correct: 0
  explanation: |-
    It is an illustrative teaching tool. Individual windows vary, and many people drown in the first minute — hence the counterpoint from the National Center for Cold Water Safety.

- id: s8-l9-q1
  question: |-
    Which sequence gives the stages of cold-water immersion from first to last?
  options:
    - |-
      Cold shock → hypothermia → swim failure → circum-rescue collapse
    - |-
      Cold shock → swim failure → hypothermia → circum-rescue collapse
    - |-
      Swim failure → cold shock → hypothermia → circum-rescue collapse
    - |-
      Cold shock → swim failure → circum-rescue collapse → hypothermia
  correct: 1
  explanation: |-
    Cold shock (gasp) → swim failure (arms and hands fail) → hypothermia → circum-rescue collapse. Most deaths occur in the first two stages — before hypothermia.
