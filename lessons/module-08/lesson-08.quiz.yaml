- id: s8-l8-q2
  question: |-
    A trekker at 4,300 m with a headache becomes unsteady and cannot walk heel-to-toe in a straight line. What does this suggest, and what should happen?
  options:
    - |-
      HACE — descend now with companions.
    - |-
      Mild AMS — rest a day here.
    - |-
      Dehydration — drink 2 L and continue.
    - |-
      Fatigue — sleep and reassess tomorrow.
  correct: 0
  explanation: |-
    Ataxia or altered mental status at altitude = HACE until proven otherwise. Descend now; never alone.

- id: s8-l8-q4
  question: |-
    Which of these is **not** a sign of HAPE?
  options:
    - |-
      Breathlessness while at rest
    - |-
      Ataxia with normal breathing
    - |-
      Much lower exercise tolerance than companions
    - |-
      Cough, later with pink frothy sputum
  correct: 1
  explanation: |-
    HAPE is fluid in the lungs: breathlessness at rest, falling exercise tolerance, cough. Descend, minimise exertion, oxygen if available.

- id: s8-l8-q3
  question: |-
    You sleep at 3,000 m on night 0. Using ≤ 500 m/day sleeping-altitude gain and a rest day after every 3 days of gain, what is the minimum number of further nights to first sleep at 5,000 m?
  options:
    - |-
      4 nights
    - |-
      6 nights
    - |-
      5 nights
    - |-
      7 nights
  correct: 2
  explanation: |-
    3,500 (1), 4,000 (2), 4,500 (3), rest at 4,500 (4), 5,000 (5) → **5** nights.

- id: s8-l8-q5
  question: |-
    Which statement about fitness and acute mountain sickness is correct?
  options:
    - |-
      Very fit athletes are largely protected from acute mountain sickness.
    - |-
      Fitness protects you, provided you also drink plenty of water.
    - |-
      Unfit people always get AMS first, so they are the ones to watch.
    - |-
      Fitness does not protect; ascent rate and sleeping altitude matter.
  correct: 3
  explanation: |-
    Fitness does not protect; ascent rate, sleeping altitude and personal history matter. Fit people may even ascend too fast.

- id: s8-l8-q1
  question: |-
    At 4,000 m the barometric pressure is about 61.6 kPa. What is the inspired oxygen pressure $P_{iO_2} = 0.2095 \times (P_B - 6.3)$?
  options:
    - |-
      ≈ 11.6 kPa
    - |-
      ≈ 12.9 kPa
    - |-
      ≈ 6.6 kPa
    - |-
      ≈ 19.9 kPa
  correct: 0
  explanation: |-
    0.2095 × (61.6 − 6.3) = 0.2095 × 55.3 ≈ **11.6 kPa** — about 58 % of sea level.
