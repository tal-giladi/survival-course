- id: s9-l5-q5
  question: |-
    Day 3 after a coral cut on the ankle: the redness has spread 8 cm, there is a red streak up the shin and the patient feels feverish. What now?
  options:
    - |-
      Re-clean the wound, put on a fresh dressing and carry on with the trip as planned.
    - |-
      Close the wound with tape to keep the infection contained, and watch it for a day.
    - |-
      Clean it, apply warm soaks, mark the redness edge with the time, and evacuate urgently.
    - |-
      Keep it clean and covered, and reassess on day 5 before deciding whether to leave.
  correct: 2
  explanation: |-
    Local care buys time; spreading infection needs a clinician and antibiotics. Marking the redness turns a feeling into a measurable trend.

- id: s9-l5-q3
  question: |-
    Which of these burns can usually be treated in the field **without** evacuation?
  options:
    - |-
      A small burn across the palm and fingers
    - |-
      Singed nostril hairs and a hoarse voice after a tent fire
    - |-
      A narrow burn that goes all the way around the lower leg
    - |-
      A 2 cm superficial (red, no blister) burn on the forearm
  correct: 3
  explanation: |-
    Location, depth, circumference, mechanism and airway involvement matter as much as area. Hands, airway, circumferential and lightning burns warrant evacuation even if small.

- id: s9-l5-q4
  question: |-
    What is the best way to cool a fresh burn?
  options:
    - |-
      Cool running water for about 20 minutes, keeping the patient warm.
    - |-
      Hold ice or snow on the burn until the pain fades, then dress it.
    - |-
      Spread butter or a greasy ointment over it to draw out the heat.
    - |-
      A brief splash of cold water, then a dry dressing straight away.
  correct: 0
  explanation: |-
    Ice can cause cold injury to already damaged tissue. Use cool running water for ~20 minutes and keep the rest of the patient warm.

- id: s9-l5-q1
  question: |-
    What does the most to prevent infection in a dirty cut in the field?
  options:
    - |-
      Pouring hydrogen peroxide into it
    - |-
      High-volume irrigation with drinkable water under pressure
    - |-
      Closing it tightly with tape so dirt can’t get in
    - |-
      Letting it bleed freely for 10 minutes to flush it
  correct: 1
  explanation: |-
    Irrigate early and generously with potable water. No additives needed.

- id: s9-l5-q2
  question: |-
    Using the adult rule of nines, what percentage of body surface is burned if the whole front of the trunk and the whole of one arm are partial-thickness burns?
  options:
    - |-
      36 %
    - |-
      18 %
    - |-
      27 %
    - |-
      45 %
  correct: 2
  explanation: |-
    Front of trunk 18 % + one arm 9 % = **27 %** — a major burn: emergent evacuation, keep warm.
