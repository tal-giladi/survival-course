- id: s2-rev-8
  question: |-
    Late afternoon in subarctic forest, −10 °C. You are unsure of your position but your ski tracks are clear behind you and sunset is in 50 minutes. What should you do?
  options:
    - |-
      Head toward the setting sun, which is roughly west, where the road should be.
    - |-
      Keep going forward, since the loop you are on must reconnect somewhere soon.
    - |-
      STOP, then backtrack on your tracks to your last known point, with a turn-around time.
    - |-
      Take a GPS fix, then keep the screen on and navigate by the phone from here.
  correct: 2
  explanation: |-
    Backtracking to the last known point is the most reliable relocation tool — when your trail is still visible. Combine it with a Stage 1 daylight budget: a turn-around time that leaves light for a shelter.

- id: s2-rev-9
  question: |-
    A lost hiker’s partner reports them overdue. The hiker has water, warm clothes, and a phone at 8 %, but no idea where they are in featureless forest. Which choice best helps the search?
  options:
    - |-
      Keep walking in a straight line to cover as much ground as possible before dark.
    - |-
      Follow the first stream you find downhill, since it should lead to civilisation.
    - |-
      Climb the tallest tree nearby to look around for roads, buildings or clearings.
    - |-
      Send one SMS with GNSS coordinates, then stay put somewhere visible and prepare signals.
  correct: 3
  explanation: |-
    When someone knows you are missing and you cannot relocate reliably, staying put and being findable usually beats moving. Spend the last of the battery on one SMS with your coordinates.

- id: s2-rev-7
  question: |-
    You are heading for a small hut on a footpath that runs north–south through forest, 1.5 km away. What is the best technique?
  options:
    - |-
      Aim off ~5–6° north, hit the path, then turn south along it to the hut.
    - |-
      Aim directly at the hut and count your paces carefully the whole way.
    - |-
      Walk on the bearing until you see the hut, however long that takes.
    - |-
      Follow the phone map continuously with the screen on the whole way.
  correct: 0
  explanation: |-
    Aim off to a linear feature, then use it as a handrail. Set a catching feature beyond the target so you know when you have gone too far.

- id: s2-rev-5
  question: |-
    Which statement about celestial direction clues is **false**?
  options:
    - |-
      Polaris’s altitude above the horizon is approximately your latitude.
    - |-
      The Sun rises due east every day of the year, wherever you are.
    - |-
      Mintaka, in Orion’s belt, rises almost exactly due east everywhere on Earth.
    - |-
      Outside the tropics in the southern hemisphere, the noon Sun is due north.
  correct: 1
  explanation: |-
    Celestial clues are precise when understood; many “natural” clues are local tendencies at best, and some — like moss on the north side of trees — are simply myths.

- id: s2-rev-4
  question: |-
    Fog, 15:40, the expected stream has not appeared. Which relocation sequence is sound?
  options:
    - |-
      Last known point → STOP → test candidates → circle → act with trigger
    - |-
      STOP → test candidates → last known point → circle → act with trigger
    - |-
      STOP → last known point → circle → test candidates → act with trigger
    - |-
      STOP → last known point → act with trigger → circle → test candidates
  correct: 2
  explanation: |-
    STOP first (Stage 1): stop moving, shelter, eat, calm down. Then work from certainty outward — last known point and time, a circle of possible positions, test candidates against the ground — and act with a time trigger bounded by the daylight budget.

- id: s2-rev-6
  question: |-
    Sunset is 17:20 and usable twilight under cloud adds 15 min. You need 70 min to set up a bivouac and want a 15-minute safety margin. It is 15:30. How long do you have before you must start setting up?
  options:
    - |-
      55 min
    - |-
      25 min
    - |-
      10 min
    - |-
      40 min
  correct: 3
  explanation: |-
    Latest start = 17:20 + 0:15 − 1:10 − 0:15 = 16:10, which is **40 min** from 15:30. A 50-minute handrail route to the path does not fit with certainty — try it only with a firm 16:10 trigger to stop wherever you are and switch to survival mode.

- id: s2-rev-11
  question: |-
    A rescuer asks for your position. Your phone shows 45.8326, 6.8652. What should you say?
  options:
    - |-
      “45.8326 north, 6.8652 east — decimal degrees,” digit by digit.
    - |-
      “Forty-five degrees, eighty-three minutes, twenty-six seconds north…”
    - |-
      “I’m near a big rock by a stream, a little way below the ridge.”
    - |-
      Read only the first two digits of each number to save battery.
  correct: 0
  explanation: |-
    Say the format, both numbers, and N/S and E/W. If asked for another format, convert carefully or let the rescuer do it.

- id: s2-rev-2
  question: |-
    You measure a grid bearing of 212° on the map. The map margin says declination 6° E. What do you set on the compass?
  options:
    - |-
      218°
    - |-
      206°
    - |-
      032°
    - |-
      212° — declination only matters over long distances.
  correct: 1
  explanation: |-
    East declination: magnetic = grid − declination. West declination: magnetic = grid + declination. Draw the three norths if you are unsure.

- id: s2-rev-1
  question: |-
    On a 1:25,000 map you measure 5.2 cm from a bridge to a hut along a straight line. Open ground, no climb, Naismith’s 5 km/h. How long will the walk take?
  options:
    - |-
      31.2 min
    - |-
      26 min
    - |-
      15.6 min
    - |-
      1.6 min
  correct: 2
  explanation: |-
    5.2 cm × 250 m/cm = 1.3 km. At 5 km/h: 1.3 / 5 × 60 = **15.6 min**. Add 1 min per 10 m of climb and extra time for rough ground in real life.

- id: s2-rev-3
  question: |-
    You follow a bearing for 2.4 km, but your compass work is 4° off. Using the **1-in-60 rule**, how far to the side of your target do you arrive?

    ![Lateral error from a heading error of 1, 5 and 10 degrees over 1 to 3 kilometres](../assets/diagrams/one-in-sixty.svg)
  options:
    - |-
      40 m
    - |-
      1,600 m
    - |-
      16 m
    - |-
      160 m
  correct: 3
  explanation: |-
    Lateral error ≈ distance × degrees / 60 = 2400 × 4 / 60 = **160 m** (exact: 2400 × tan 4° ≈ 168 m). In forest you might walk past a small target without seeing it — which is why you aim off to a linear feature.
