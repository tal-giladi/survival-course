- id: s7-rev-1
  question: |-
    Damp boreal forest, 4 °C, 16:00, dark at 17:30. You are wet from a fall and alone, with a tarp, 10 m of cord, a knife and a lighter. A patch of dead fireweed promises good cordage fiber. What comes first?
  options:
    - |-
      Process the fireweed into cord while there is still light: cord is always useful.
    - |-
      Keep walking briskly to stay warm until dark, then deal with camp.
    - |-
      Build a charcoal retort so you can have a smokeless fire tonight.
    - |-
      Pitch the tarp with your cord, get into dry layers off the ground, then gather fuel.
  correct: 3
  explanation: |-
    Bushcraft projects never outrank shelter and warmth: pitch the tarp, change into dry layers, insulate from the ground, then prepare fire fuel. Use carried kit first; improvise second.

- id: s7-rev-2
  question: |-
    Which conclusion about Stage 1 kit principles does this stage **not** support?
  options:
    - |-
      Once you can make cordage, you no longer need to carry any
    - |-
      Carry more cord than you expect: making it costs ~15 min per metre
    - |-
      Carry two fire-lighting methods; retort char cloth extends a ferro kit
    - |-
      Carry a fixed-blade knife, since a folder can fail when batoning
  correct: 0
  explanation: |-
    Skills are backup for kit, not a replacement for it.

- id: s7-rev-3
  question: |-
    A food bag weighs 60 N. You haul it over a branch with half a wrap (θ = π), μ = 0.3. What pull is needed to **raise** it slowly?
  options:
    - |-
      ≈ 23 N
    - |-
      ≈ 154 N
    - |-
      ≈ 81 N
    - |-
      ≈ 395 N
  correct: 1
  explanation: |-
    T = 60 × e^(0.3π) = 60 × 2.57 ≈ **154 N**. The hauling side carries 2.6× the load, so size your cord for that, not for the bag.

- id: s7-rev-4
  question: |-
    You need dry kindling from wet, wrist-thick dead-standing wood. Which approach follows both Stage 3 fire structure and Stage 7 knife safety?
  options:
    - |-
      Lay whole wet rounds straight on the tinder and wait for them to dry out and catch
    - |-
      Baton the rounds with a folding knife to save your good fixed blade from wear
    - |-
      Baton knot-free rounds with a full-tang knife, then carve feather sticks from the dry core
    - |-
      Char the wet rounds first in someone else’s fire, then add them to your own
  correct: 2
  explanation: |-
    Splitting exposes the dry core; feather sticks and pencil-lead shavings climb the fuel ladder; safe batoning keeps you uninjured.

- id: s7-rev-5
  question: |-
    Stone boiling: how many **kg** of stones at 500 °C (c = 0.8 kJ/(kg·°C)) bring 3 L of water from 20 °C to 100 °C with η = 0.7? Water c = 4.18 kJ/(kg·°C).
  options:
    - |-
      ≈ 3.1 kg
    - |-
      ≈ 3.6 kg
    - |-
      ≈ 5.6 kg
    - |-
      ≈ 4.5 kg
  correct: 3
  explanation: |-
    Water: 3 × 4.18 × 80 = 1,003 kJ. Stone: 0.8 × 400 × 0.7 = 224 kJ/kg. 1,003/224 ≈ **4.5 kg**. Then hold a rolling boil for 1 minute.

- id: s7-rev-6
  question: |-
    A 4 m ridgeline with 20 cm of sag carries 300 N in a steady wind. Gusts are forecast. Which change **most** reduces the risk of breaking hand-made cord?
  options:
    - |-
      Pitch lower, add guys, allow more sag, take turns round each tree
    - |-
      Tighten it to 10 cm of sag so it flaps less in the gusts
    - |-
      Replace the figure-eight at each tree with a stronger reef knot
    - |-
      Wet the cord, since bast fiber gains a little strength when wet
  correct: 0
  explanation: |-
    Control the load first (area, sag, guys), then the weak point (two turns round the tree before the knot).

- id: s7-rev-7
  question: |-
    Why is a reverse-wrapped two-ply cord stronger than a single twisted strand of the same fiber?
  options:
    - |-
      Plying bonds the fibers chemically so they stop sliding past each other
    - |-
      Its balanced torque keeps the twist, and so the fiber friction, under load
    - |-
      Each ply is twisted tighter, and more twist always means more strength
    - |-
      Plying straightens the fibers so they lie parallel to the cord’s axis
  correct: 1
  explanation: |-
    A single strand unwinds under load and loses the squeeze that makes fibers grip. Plying balances the torque and locks the twist in.

- id: s7-rev-8
  question: |-
    You make charcoal from wood at 35 % moisture instead of dry wood. What happens, and why?
  options:
    - |-
      Higher yield, because the water turns into extra charcoal
    - |-
      No difference, because the sealed tin keeps the water inside
    - |-
      Lower yield: extra wood burns to supply ~2.4 MJ per kg of water
    - |-
      Better charcoal, because the steam activates the carbon inside
  correct: 2
  explanation: |-
    About 2.4 MJ per kg of water must be supplied by burning more of the wood, so yield drops and the burn is slower. Dry fuel matters for every fire process: warmth, cooking and charcoal alike.

- id: s7-rev-9
  question: |-
    Which bushcraft activity does **not** need a legal fire site and a check for fire bans?
  options:
    - |-
      Heating stones for stone boiling
    - |-
      Running a charcoal retort
    - |-
      Warming pitch glue to haft a blade
    - |-
      Making cordage from dead nettle stalks
  correct: 3
  explanation: |-
    Fire law covers every open flame, including craft fires. Harvest law covers the materials.

- id: s7-rev-10
  question: |-
    Which priority order fits an evening camp in cold drizzle?
  options:
    - |-
      Tarp and dry layers → fire → treat water → carve a pot hook
    - |-
      Fire → tarp and dry layers → treat water → carve a pot hook
    - |-
      Tarp and dry layers → treat water → fire → carve a pot hook
    - |-
      Treat water → tarp and dry layers → fire → carve a pot hook
  correct: 0
  explanation: |-
    In cold and wet conditions, heat loss is the fastest threat. Fire adds heat and helps you treat water. Craft projects come last. In hot desert conditions, water would move up.
